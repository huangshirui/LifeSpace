<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'self'">
<title>账户中心</title>
<link rel="stylesheet" href="/site.css"><script type="module" src="/delegations.js"></script>
</head>
<body>
<header class="topbar"><a class="wordmark" href="/" aria-label="账户中心"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/></svg></span><span class="brand-name">账户中心</span></a><span class="top-context">委托管理 · Delegations</span></header>
<main class="main">
<section class="masthead"><span class="eyebrow">LIFESPACE · AUTHORITY</span><h1>Agent 委托授权</h1><p>管理已批准的第三方 Agent 委托。你可以随时撤销，撤销后无法再执行新的委托操作。</p></section>
<div id="error" class="state state-error hidden" role="alert"><strong>授权列表暂不可用</strong><p id="error-message"></p><button type="button" id="retry">重新加载</button></div>
<div id="loading" class="state" role="status">正在核对你的登录身份与委托授权…</div>
<div id="content" class="content hidden">
<p id="feedback" class="delegation-feedback hidden" role="status"></p>
<section class="card"><div class="section-title"><div><h2>当前有效的委托</h2><p>仅显示通过 LifeSpace Account 确认的第三方 OAuth MCP 委托，不含普通 Agent Grant 和可信应用内授权。</p></div></div>
<div id="items" class="delegation-list"></div><p id="empty" class="delegation-empty hidden">当前没有有效的第三方委托授权。</p><button type="button" id="more" class="ghost delegation-more hidden">加载更多</button></section>
</div>
<dialog id="revoke-dialog" class="delegation-dialog" aria-labelledby="revoke-title" aria-describedby="revoke-message">
<h2 id="revoke-title">撤销授权？</h2>
<p id="revoke-message"></p>
<p id="revoke-error" class="delegation-dialog-error hidden" role="alert"></p>
<div class="delegation-dialog-actions"><button type="button" id="revoke-cancel" class="ghost">取消</button><button type="button" id="revoke-confirm" class="delegation-danger">确认撤销</button></div>
</dialog>
</main></body></html>
