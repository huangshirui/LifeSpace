openapi: 3.1.0
info:
  title: LifeSpace Identity API
  version: 0.1.2
paths:
  /health:
    get:
      responses:
        '200': { description: Healthy }
  /api/v1/status:
    get:
      responses:
        '200': { description: Identity status }
  /bootstrap/v1/applications:
    post:
      description: Platform-admin bootstrap endpoint. Registers an application, configures its access-token TTL (300-3600 seconds), and returns a backend credential once when trustedBackend is true.
      responses:
        '201': { description: Application registered }
        '401': { description: Bootstrap authentication required }
        '422': { description: Invalid application or token TTL policy }
  /internal/v1/users:
    post:
      description: Trusted application backend creates a global LifeSpace user after resolving its own external identity mapping.
      responses:
        '201': { description: LifeSpace user created }
        '401': { description: Trusted application authentication required }
  /internal/v1/tokens:
    post:
      description: Trusted application backend exchanges an already-resolved LifeSpace user ID for a Core token. Calling application and token lifetime are derived from its registered application policy; the caller cannot choose either.
      responses:
        '200': { description: App-scoped short-lived Core access token }
        '401': { description: Trusted application authentication required }
        '403': { description: User/application/scope is not allowed }
