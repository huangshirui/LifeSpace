openapi: 3.1.0
info:
  title: LifeSpace Identity API
  version: 0.17.0
  description: Global LifeSpace user identity, profile, trusted application exchange, Cloudflare Access principal resolution/linking, application credential lifecycle, Agent identity/execution-token issuance, service principals and credential issuance API.
paths:
  /health:
    get:
      responses:
        '200': { description: Healthy }
  /api/v1/status:
    get:
      responses:
        '200': { description: Identity status }
  /assets/users/{userId}/avatar:
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string, pattern: ^usr_ }
    get:
      description: Public stable URL for the current avatar of an active LifeSpace user. The underlying R2 object key is private implementation detail.
      security: []
      responses:
        '200':
          description: Current user avatar bytes
          content:
            image/jpeg: { schema: { type: string, contentEncoding: binary } }
            image/png: { schema: { type: string, contentEncoding: binary } }
            image/webp: { schema: { type: string, contentEncoding: binary } }
        '404': { description: User/avatar not found }
  /api/v1/me:
    get:
      description: Return the authenticated global LifeSpace user profile. Requires profile:read.
      security: [{ userBearer: [] }]
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      description: Update the authenticated global LifeSpace user profile. Requires profile:write.
      security: [{ userBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProfileRequest' }
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/me/web-login:
    get:
      description: Read the LifeSpace-global user-owned login email. Access verification marks it linked. The mailbox reservation is independent of Application and Access principal identity.
      security: [{ userBearer: [] }]
      responses:
        '200':
          description: Current Web login settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebLoginResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      description: Declare or replace the global login mailbox. Requires profile:write and the current revision. A mailbox is unique across all LifeSpace users and applications. Only email-derived Access principal bindings are revoked on replacement; the user and unrelated identities stay active.
      security: [{ userBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, version]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                version: { type: integer, minimum: 0 }
      responses:
        '200':
          description: Global login mailbox saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebLoginResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: EMAIL_ALREADY_LINKED or EMAIL_VERSION_CONFLICT; no account merge }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { description: ACCESS_NOT_CONFIGURED }
    delete:
      description: Unlink the globally reserved login mailbox without disabling the LifeSpace User or independently linked Access principals. Requires profile:write and a current version.
      security: [{ userBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version]
              properties:
                version: { type: integer, minimum: 0 }
      responses:
        '200':
          description: Login mailbox unlinked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebLoginResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: EMAIL_VERSION_CONFLICT }
        '422': { $ref: '#/components/responses/ValidationError' }

  /internal/v1/access/session-check:
    post:
      description: Revalidate a cached BFF session against current mailbox authorization and verified Access issuer/signature/subject/audience. No token issuance. BFF compares returned userId with its authenticated cached session subject before reuse.
      security: [{ applicationCredential: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccessLinkChallengeRequest' }
      responses:
        '200':
          description: Current resolved user
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [userId]
                    properties:
                      userId: { type: string, pattern: '^usr_' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Disabled user/principal/application or invalid audience }
        '409': { description: ACCESS_PRINCIPAL_UNLINKED or ACCESS_LINK_CONFLICT }
        '503': { description: Access verifier unavailable }
  /api/v1/me/avatar:
    put:
      description: Replace the authenticated user's avatar. Requires profile:write. Accepts JPEG, PNG or WebP up to 5 MB.
      security: [{ userBearer: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, contentEncoding: binary }
      responses:
        '200':
          description: Avatar replaced
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvatarResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { description: Avatar is larger than 5 MB }
        '415': { description: Avatar content type is not JPEG, PNG or WebP }
  /api/v1/me/access-link-challenges/{challengeId}/confirm:
    parameters:
      - $ref: '#/components/parameters/AccessLinkChallengeId'
    post:
      description: Confirm a one-time Cloudflare Access link challenge using the authenticated LifeSpace user as proof of control. The user is derived only from the verified LifeSpace bearer token; no userId is accepted in the request.
      security: [{ userBearer: [] }]
      responses:
        '204': { description: Access principal linked to the authenticated LifeSpace user }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: Challenge expired/consumed, audience was revoked, or the Access principal became linked concurrently }
  /internal/v1/applications/self:
    get:
      summary: Inspect the currently authenticated trusted Application
      description: Returns only the active Application bound to the supplied server-only lsa_* credential. No caller-selected applicationId, Bootstrap secret, Platform Admin actor proof, credential material, mutation, or authority elevation.
      security:
        - applicationCredential: []
      responses:
        '200':
          description: Current trusted Application metadata without credential material
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Application' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /internal/v1/users:
    post:
      description: Trusted application backend creates a global LifeSpace user after resolving its own external identity mapping.
      responses:
        '201': { description: LifeSpace user created }
        '401': { description: Trusted application authentication required }
  /internal/v1/tokens:
    post:
      description: Trusted application backend exchanges an already-resolved LifeSpace user ID for a short-lived app-scoped LifeSpace token. The issued user token is valid for both LifeSpace Core and Identity resource audiences; calling application and token lifetime are derived from registered application policy.
      responses:
        '200': { description: App-scoped short-lived LifeSpace user access token }
        '401': { description: Trusted application authentication required }
        '403': { description: User/application/scope is not allowed }
  /internal/v1/access/tokens:
    post:
      description: Trusted application backend/BFF exchanges a raw Cloudflare Access JWT for an app-scoped LifeSpace user token. Identity independently verifies RS256 signature, configured issuer, expiry and subject, then requires one JWT audience to be actively registered to the calling lsa_* application. User identity resolves by (iss, sub) or an explicit user-authorized application-scoped mailbox grant after Access verification. Email equality alone never merges accounts.
      security: [{ applicationCredential: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AccessTokenExchangeRequest' } } }
      responses:
        '200': { description: App-scoped short-lived LifeSpace user token, content: { application/json: { schema: { $ref: '#/components/schemas/UserTokenResponse' } } } }
        '401': { description: Trusted application authentication failed or Access assertion is invalid }
        '403': { description: Access audience/app, user/principal state, or requested scopes are not allowed }
        '409': { description: ACCESS_PRINCIPAL_UNLINKED; caller must explicitly link an existing account or create a new one }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { description: Cloudflare Access signing keys are temporarily unavailable }
  /internal/v1/access/registrations:
    post:
      description: Explicitly create a new LifeSpace user for a verified, currently unlinked Cloudflare Access principal. User creation and (iss, sub) mapping are atomic; email equality is never used for account reconciliation.
      security: [{ applicationCredential: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AccessRegistrationRequest' } } }
      responses:
        '201': { description: New LifeSpace user and Access mapping created atomically, content: { application/json: { schema: { $ref: '#/components/schemas/AccessRegistrationResponse' } } } }
        '401': { description: Trusted application authentication failed or Access assertion is invalid }
        '403': { description: Access audience/app or requested scopes are not allowed }
        '409': { description: Access principal is already linked or became linked concurrently }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { description: Cloudflare Access signing keys are temporarily unavailable }
  /internal/v1/access/link-challenges:
    post:
      description: Create a high-entropy, short-lived, one-time challenge bound to the independently verified Access (iss, sub), the calling LifeSpace application and the matched registered audience. This does not accept a LifeSpace userId.
      security: [{ applicationCredential: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AccessLinkChallengeRequest' } } }
      responses:
        '201': { description: Link challenge created, content: { application/json: { schema: { $ref: '#/components/schemas/AccessLinkChallengeResponse' } } } }
        '401': { description: Trusted application authentication failed or Access assertion is invalid }
        '403': { description: Access audience does not belong to the calling application }
        '409': { description: Access principal is already linked }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { description: Cloudflare Access signing keys are temporarily unavailable }
  /internal/v1/agents:
    get:
      description: List active Agent identities bound to the authenticated trusted application. Agent identity is distinct from user Principal authority.
      security: [{ applicationCredential: [] }]
      responses:
        '200': { description: Application Agent identities, content: { application/json: { schema: { $ref: '#/components/schemas/AgentListResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      description: Create an Agent identity and bind it to the authenticated trusted application. This creates identity only and grants no Space/model authority.
      security: [{ applicationCredential: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateAgentRequest' } } }
      responses:
        '201': { description: Agent identity created, content: { application/json: { schema: { $ref: '#/components/schemas/AgentResponse' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /internal/v1/agents/{agentId}/api-credentials:
    parameters:
      - name: agentId
        in: path
        required: true
        schema: { type: string, pattern: ^agt_ }
    get:
      description: List opaque Agent API credential metadata for an Agent bound to the authenticated trusted Application. Plaintext and hashes are never returned.
      security: [{ applicationCredential: [] }]
      responses:
        '200': { description: Agent API credential metadata list }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Agent binding not found }
    post:
      description: Create a revocable opaque lsp_agt_* Agent API credential. The credential binds Application + Agent Actor but grants no Space/model/User Authority. Plaintext is returned exactly once.
      security: [{ applicationCredential: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [label, scopes]
              properties:
                label: { type: string, minLength: 1, maxLength: 100 }
                scopes: { type: array, uniqueItems: true, items: { type: string } }
                expiresAt: { type: [string, 'null'], format: date-time }
      responses:
        '201': { description: Agent API credential created; response data includes one-time write-only token matching ^lsp_agt_ }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Agent binding not found }
        '409': { description: Agent/Application binding is not active }
        '422': { $ref: '#/components/responses/ValidationError' }
  /internal/v1/agents/{agentId}/api-credentials/{credentialId}:
    parameters:
      - name: agentId
        in: path
        required: true
        schema: { type: string, pattern: ^agt_ }
      - name: credentialId
        in: path
        required: true
        schema: { type: string, pattern: ^agc_ }
    patch:
      description: Update Agent API credential metadata. scopes and expiry may only be narrowed; authority cannot be expanded in place.
      security: [{ applicationCredential: [] }]
      responses:
        '200': { description: Updated Agent API credential metadata }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Active Agent API credential not found }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      description: Immediately revoke one Agent API credential.
      security: [{ applicationCredential: [] }]
      responses:
        '204': { description: Agent API credential revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Active Agent API credential not found }
  /introspection/v1/recurrence-roots:
    post:
      description: Internal Core-to-Identity set-wise current identity/application status and scope ceilings for already-enrolled recurring intents. This authenticates no end user and grants no Space/model Authority. No credentials or Delegations are stored or returned.
      security: [{ internalServiceSecret: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roots]
              properties:
                roots:
                  type: array
                  minItems: 1
                  maxItems: 40
                  items:
                    type: object
                    additionalProperties: false
                    required: [type, id, applicationId]
                    properties:
                      type: { type: string, enum: [user, service, agent] }
                      id: { type: string, maxLength: 100 }
                      applicationId: { type: string, maxLength: 100 }
      responses:
        '200':
          description: Ordered current root identity results, without data Authority
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [roots]
                    properties:
                      roots:
                        type: array
                        maxItems: 40
                        items:
                          type: object
                          required: [type, id, applicationId, active, scopes]
                          properties:
                            type: { type: string, enum: [user, service, agent] }
                            id: { type: string }
                            applicationId: { type: string }
                            active: { type: boolean }
                            scopes: { type: array, items: { type: string } }
        '400': { description: Invalid bounded roots }
        '401': { description: Internal service authentication required }
  /introspection/v1/agent-credentials:
    post:
      description: Internal Core-to-Identity lsp_agt_* introspection through the Cloudflare Service Binding. Returns the authenticated Application + Agent Actor and credential scope ceiling only; it never resolves User Authority.
      security: [{ internalServiceSecret: [], agentCredential: [] }]
      responses:
        '200': { description: Active Agent credential execution identity or active=false }
        '401': { description: Internal service authentication failed }
  /internal/v1/agent-execution-tokens:
    post:
      description: Issue one short-lived Core-only Agent Execution Token. sub authenticates the actual Agent Actor; Principal is an independent signed claim. Omitting principalType/principalId means direct Agent execution. Current executable Principal types are user and agent; Core remains authoritative for Delegation and business Authority.
      security: [{ applicationCredential: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AgentTokenRequest' } } }
      responses:
        '200': { description: Core-only Agent execution token, content: { application/json: { schema: { $ref: '#/components/schemas/AgentTokenResponse' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/service-principals:
    get:
      description: Trusted application backend lists service principals in its own application context. Optional createdByUserId narrows the operator view.
      security: [{ applicationCredential: [] }]
      parameters:
        - name: createdByUserId
          in: query
          schema: { type: string, pattern: ^usr_ }
      responses:
        '200': { description: Service principal list, content: { application/json: { schema: { $ref: '#/components/schemas/ServicePrincipalListResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      description: Trusted application backend creates a service principal. maxScopes must remain inside the registered application's scope ceiling.
      security: [{ applicationCredential: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateServicePrincipalRequest' } } }
      responses:
        '201': { description: Service principal created, content: { application/json: { schema: { $ref: '#/components/schemas/ServicePrincipalResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/service-principals/{principalId}:
    parameters:
      - $ref: '#/components/parameters/PrincipalId'
    patch:
      description: Update, disable/re-enable, or change the service principal scope ceiling inside the bound application's allowed scopes. Existing opaque tokens do not gain newly added scopes automatically.
      security: [{ applicationCredential: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateServicePrincipalRequest' } } }
      responses:
        '200': { description: Service principal updated, content: { application/json: { schema: { $ref: '#/components/schemas/ServicePrincipalResponse' } } } }
        '404': { description: Service principal not found }
  /api/v1/service-principals/{principalId}/tokens:
    parameters:
      - $ref: '#/components/parameters/PrincipalId'
    get:
      description: List opaque Service API Token metadata. Plaintext and hashes are never returned.
      security: [{ applicationCredential: [] }]
      responses:
        '200': { description: Token metadata list, content: { application/json: { schema: { $ref: '#/components/schemas/ServiceTokenListResponse' } } } }
    post:
      description: Create a canonical opaque lsp_svc_* Service API Token. Legacy lsp_pat_* tokens remain accepted only as migration input. Plaintext is returned exactly once. expiresAt may be null for owner-controlled trusted workloads.
      security: [{ applicationCredential: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateServiceTokenRequest' } } }
      responses:
        '201': { description: Service API Token created, content: { application/json: { schema: { $ref: '#/components/schemas/CreateServiceTokenResponse' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/service-principals/{principalId}/tokens/{tokenId}:
    parameters:
      - $ref: '#/components/parameters/PrincipalId'
      - $ref: '#/components/parameters/ServiceTokenId'
    patch:
      description: Update label/expiry or reduce the current token scopes. Increasing scopes requires token rotation.
      security: [{ applicationCredential: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateServiceTokenRequest' } } }
      responses:
        '200': { description: Token metadata updated, content: { application/json: { schema: { $ref: '#/components/schemas/ServiceTokenResponse' } } } }
    delete:
      description: Immediately revoke an opaque Service API Token.
      security: [{ applicationCredential: [] }]
      responses:
        '204': { description: Token revoked }
        '404': { description: Active token not found }
  /api/v1/service-principals/{principalId}/oauth-credentials:
    parameters:
      - $ref: '#/components/parameters/PrincipalId'
    get:
      description: List OAuth client credential metadata without plaintext or hashes.
      security: [{ applicationCredential: [] }]
      responses:
        '200': { description: OAuth credential list, content: { application/json: { schema: { $ref: '#/components/schemas/OAuthCredentialListResponse' } } } }
    post:
      description: Create a client secret for optional OAuth 2.0 client_credentials use. Plaintext is returned exactly once.
      security: [{ applicationCredential: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateOAuthCredentialRequest' } } }
      responses:
        '201': { description: OAuth client credential created, content: { application/json: { schema: { $ref: '#/components/schemas/CreateOAuthCredentialResponse' } } } }
  /api/v1/service-principals/{principalId}/oauth-credentials/{credentialId}:
    parameters:
      - $ref: '#/components/parameters/PrincipalId'
      - $ref: '#/components/parameters/OAuthCredentialId'
    delete:
      description: Revoke an OAuth client credential.
      security: [{ applicationCredential: [] }]
      responses:
        '204': { description: OAuth credential revoked }
  /oauth/token:
    post:
      description: OAuth 2.0 client_credentials endpoint for service principals. The service principal ID is the OAuth client_id; client authentication may use HTTP Basic or form fields.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/OAuthTokenRequest' }
      responses:
        '200': { description: Short-lived service access token, content: { application/json: { schema: { $ref: '#/components/schemas/OAuthTokenResponse' } } } }
        '400': { description: OAuth invalid_request / unsupported_grant_type / invalid_scope }
        '401': { description: OAuth invalid_client }
  /introspection/v1/service-tokens:
    post:
      description: Internal Core-to-Identity opaque Service API Token introspection. Requires the Core/Identity internal service secret and is called through the Cloudflare Service Binding.
      security: [{ internalServiceSecret: [], serviceToken: [] }]
      responses:
        '200': { description: Current token/principal state, content: { application/json: { schema: { $ref: '#/components/schemas/ServiceTokenIntrospectionResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
components:
  securitySchemes:
    userBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    applicationCredential:
      type: http
      scheme: bearer
      bearerFormat: lsa_ trusted application credential
    serviceToken:
      type: http
      scheme: bearer
      bearerFormat: lsp_svc_ opaque token
    agentCredential:
      type: http
      scheme: bearer
      bearerFormat: lsp_agt_ opaque credential
      description: Opaque lsp_agt_* Agent API credential; accepted only on the internal introspection route.
    internalServiceSecret:
      type: apiKey
      in: header
      name: x-lifespace-internal-secret
  parameters:
    ApplicationId: { name: applicationId, in: path, required: true, schema: { type: string, minLength: 1 } }
    ApplicationCredentialId: { name: credentialId, in: path, required: true, schema: { type: string, pattern: ^apc_ } }
    AccessAudienceId: { name: audienceId, in: path, required: true, schema: { type: string, pattern: ^aud_ } }
    AccessLinkChallengeId: { name: challengeId, in: path, required: true, schema: { type: string, pattern: ^alc_ } }
    PrincipalId: { name: principalId, in: path, required: true, schema: { type: string, pattern: ^svc_ } }
    ServiceTokenId: { name: tokenId, in: path, required: true, schema: { type: string, pattern: ^sat_ } }
    OAuthCredentialId: { name: credentialId, in: path, required: true, schema: { type: string, pattern: ^soc_ } }
  schemas:
    Agent:
      type: object
      additionalProperties: false
      required: [id, displayName, status, createdAt, updatedAt]
      properties:
        id: { type: string, pattern: ^agt_ }
        displayName: { type: string, minLength: 1, maxLength: 100 }
        status: { type: string, enum: [active, disabled] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateAgentRequest:
      type: object
      additionalProperties: false
      required: [displayName]
      properties:
