  "x-lifespace-delivery-semantics": {
    "delivery": "at-least-once",
    "singleEventIdempotencyHeaders": [
      "X-LifeSpace-Event-Id",
      "X-LifeSpace-Delivery-Id"
    ],
    "changeSetIdempotencyHeaders": [
      "X-LifeSpace-Change-Set-Id",
      "X-LifeSpace-Delivery-Id"
    ],
    "signatureAlgorithm": "HMAC-SHA256",
    "signatureInput": "<X-LifeSpace-Timestamp>.<exact raw body>",
    "signatureHeader": "X-LifeSpace-Signature: v1=<lowercase hex digest>",
    "payloadMode": "reference-only",
    "explicitBatchAggregation": "one explicit ChangeSet or Bulk -> one callback envelope per eligible Webhook Endpoint; unrelated changes are never time-window coalesced",
    "bulkIdempotencyHeaders": [
      "X-LifeSpace-Bulk-Id",
      "X-LifeSpace-Delivery-Id"
    ]
  }
