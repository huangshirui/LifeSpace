{
  "openapi": "3.1.0",
  "info": {
    "title": "LifeSpace Integration / Eventing API",
    "version": "0.4.0",
    "description": "Independently versioned LifeSpace Integration/Eventing contract for Webhook endpoint configuration, model/event subscriptions, delivery diagnostics, test sends, reference-only signed ordinary-record Webhooks, explicit ChangeSet batch Webhook envelopes, and explicit non-atomic Bulk Webhook envelopes. Eventing remains implemented by LifeSpace Core and derives from authoritative ordinary-model Change/event facts; this contract does not create a second mutation or authorization source."
  },
  "security": [
    {
      "bearerAuth": []
    }
  ],
  "tags": [
    {
      "name": "Webhook Endpoints"
    },
    {
      "name": "Event Subscriptions"
    }
  ],
  "paths": {
    "/api/v1/webhook-endpoints": {
      "get": {
        "tags": [
          "Webhook Endpoints"
        ],
        "operationId": "listWebhookEndpoints",
        "description": "Lists Webhook endpoints owned by the authenticated application context for one Space, optionally filtered to one subscriber service principal. Requires a user principal with spaces:manage and current Space manage permission.",
        "parameters": [
          {
            "name": "spaceId",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "subscriberServicePrincipalId",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Webhook endpoints",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/WebhookEndpointListResponse"
                }
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "403": {
            "$ref": "#/components/responses/Forbidden"
          }
        }
      },
      "post": {
        "tags": [
          "Webhook Endpoints"
        ],
        "operationId": "createWebhookEndpoint",
        "description": "Creates a reusable signed Webhook destination for one Space and subscriber Service Principal. Subscriptions attach model/event filters to this endpoint; the endpoint itself grants no model data access.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/CreateWebhookEndpointRequest"
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Webhook endpoint created; signing secret is returned only in this response.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/CreateWebhookEndpointResponse"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/InvalidRequest"
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "403": {
            "$ref": "#/components/responses/Forbidden"
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          }
        }
      }
    },
    "/api/v1/webhook-endpoints/{endpointId}": {
      "parameters": [
        {
          "$ref": "#/components/parameters/WebhookEndpointId"
        }
      ],
      "patch": {
        "tags": [
          "Webhook Endpoints"
        ],
        "operationId": "updateWebhookEndpoint",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/UpdateWebhookEndpointRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Webhook endpoint updated; a rotated signing secret is returned only when explicitly requested.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/UpdateWebhookEndpointResponse"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/InvalidRequest"
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "403": {
            "$ref": "#/components/responses/Forbidden"
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          }
        }
      },
      "delete": {
        "tags": [
          "Webhook Endpoints"
        ],
        "operationId": "deleteWebhookEndpoint",
        "description": "Soft-deletes the endpoint and disables/deletes its active subscription filters.",
        "responses": {
          "204": {
            "description": "Webhook endpoint deleted"
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "403": {
            "$ref": "#/components/responses/Forbidden"
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          }
        }
      }
    },
    "/api/v1/webhook-endpoints/{endpointId}/deliveries": {
      "parameters": [
        {
          "$ref": "#/components/parameters/WebhookEndpointId"
        }
      ],
      "get": {
        "tags": [
          "Webhook Endpoints"
        ],
        "operationId": "listWebhookEndpointDeliveries",
        "description": "Returns up to the 50 most recent deliveries across all subscription filters attached to the endpoint.",
        "responses": {
          "200": {
            "description": "Recent deliveries",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/WebhookDeliveryListResponse"
                }
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "403": {
            "$ref": "#/components/responses/Forbidden"
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          }
        }
      }
    },
    "/api/v1/webhook-endpoints/{endpointId}/test": {
      "parameters": [
        {
          "$ref": "#/components/parameters/WebhookEndpointId"
        }
      ],
      "post": {
        "tags": [
          "Webhook Endpoints"
        ],
        "operationId": "testWebhookEndpoint",
        "description": "Sends a signed endpoint.test payload directly to the configured Webhook without creating a domain event or reading model data.",
        "responses": {
          "200": {
            "description": "Webhook test result",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/WebhookTestResponse"
                }
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "403": {
            "$ref": "#/components/responses/Forbidden"
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          },
          "502": {
            "description": "Webhook transport failed"
          }
        }
      }
    },
    "/api/v1/event-subscriptions": {
      "get": {
        "tags": [
          "Event Subscriptions"
        ],
        "operationId": "listEventSubscriptions",
        "description": "Lists model/event filters attached to one owned Webhook endpoint.",
        "parameters": [
          {
            "name": "endpointId",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^whk_"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Event subscriptions",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/EventSubscriptionListResponse"
                }
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "403": {
            "$ref": "#/components/responses/Forbidden"
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          }
        }
      },
      "post": {
        "tags": [
          "Event Subscriptions"
        ],
        "operationId": "createEventSubscription",
        "description": "Adds one Space/model event filter to an existing Webhook endpoint. Requires current model read access for the managing application and a current Data Grant that lets the endpoint subscriber Service Principal read the selected model.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/CreateEventSubscriptionRequest"
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Event subscription created",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/EventSubscriptionResponse"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/InvalidRequest"
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "403": {
            "$ref": "#/components/responses/Forbidden"
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          },
          "409": {
            "$ref": "#/components/responses/Conflict"
          }
        }
      }
    },
    "/api/v1/event-subscriptions/{subscriptionId}": {
      "parameters": [
        {
          "$ref": "#/components/parameters/EventSubscriptionId"
        }
      ],
      "patch": {
        "tags": [
          "Event Subscriptions"
        ],
        "operationId": "updateEventSubscription",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/UpdateEventSubscriptionRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Event subscription updated",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/EventSubscriptionResponse"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/InvalidRequest"
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "403": {
            "$ref": "#/components/responses/Forbidden"
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          }
        }
      },
      "delete": {
        "tags": [
          "Event Subscriptions"
        ],
        "operationId": "deleteEventSubscription",
        "responses": {
          "204": {
            "description": "Event subscription deleted"
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "403": {
            "$ref": "#/components/responses/Forbidden"
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          }
        }
      }
    }
  },
  "webhooks": {
    "recordChange": {
      "post": {
        "summary": "Reference-only ordinary-record change delivery",
        "description": "At-least-once outbound Webhook delivery. The body intentionally contains record references only; consumers that need record data must read through the normal Runtime/Model Contract under current authorization. LifeSpace rechecks endpoint/subscription state, managing Application × Model Access, subscriber Data Grant, and subscriber Service Principal/application eligibility before the outbound attempt.",
        "parameters": [
          {
            "name": "X-LifeSpace-Event-Id",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^evt_[A-Za-z0-9_-]+$"
            }
          },
          {
            "name": "X-LifeSpace-Delivery-Id",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^dlv_[A-Za-z0-9_-]+$"
            }
          },
          {
            "name": "X-LifeSpace-Webhook-Endpoint-Id",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^whk_[A-Za-z0-9_-]+$"
            }
          },
          {
            "name": "X-LifeSpace-Subscription-Id",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^sub_[A-Za-z0-9_-]+$"
            }
          },
          {
            "name": "X-LifeSpace-Timestamp",
            "in": "header",
            "required": true,
            "description": "Unix timestamp in seconds used in the HMAC input.",
            "schema": {
              "type": "string",
              "pattern": "^[0-9]+$"
            }
          },
          {
            "name": "X-LifeSpace-Signature",
            "in": "header",
            "required": true,
            "description": "v1=<lowercase hex HMAC-SHA256> over timestamp + '.' + the exact raw UTF-8 request body, using the Webhook Endpoint signing secret.",
            "schema": {
              "type": "string",
              "pattern": "^v1=[a-f0-9]{64}$"
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/DomainEventReferencePayload"
              }
            }
          }
        },
        "responses": {
          "2XX": {
            "description": "Receiver accepted the delivery. Non-2xx responses are retryable according to LifeSpace Queue delivery policy."
          }
        }
      }
    },
    "endpointTest": {
      "post": {
        "summary": "Signed endpoint.test transport probe",
        "description": "Outbound transport/signature test only. It does not prove model Data Grant eligibility and is not the ordinary domain-event delivery authority path.",
        "parameters": [
          {
            "name": "X-LifeSpace-Test",
            "in": "header",
            "required": true,
            "schema": {
              "const": "true"
            }
          },
          {
            "name": "X-LifeSpace-Webhook-Endpoint-Id",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^whk_[A-Za-z0-9_-]+$"
            }
          },
          {
            "name": "X-LifeSpace-Timestamp",
            "in": "header",
            "required": true,
            "description": "Unix timestamp in seconds used in the HMAC input.",
            "schema": {
              "type": "string",
              "pattern": "^[0-9]+$"
            }
          },
          {
            "name": "X-LifeSpace-Signature",
            "in": "header",
            "required": true,
            "description": "v1=<lowercase hex HMAC-SHA256> over timestamp + '.' + the exact raw UTF-8 request body, using the Webhook Endpoint signing secret.",
            "schema": {
              "type": "string",
              "pattern": "^v1=[a-f0-9]{64}$"
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/WebhookEndpointTestPayload"
              }
            }
          }
        },
        "responses": {
          "2XX": {
            "description": "Receiver accepted the signed test payload."
          }
        }
      }
    },
    "changeSetCommitted": {
      "post": {
        "summary": "Reference-only explicit ChangeSet batch delivery",
        "description": "At-least-once outbound Webhook delivery for one explicit atomic Runtime Batch. The envelope contains only ChangeSet identity plus the same reference-only Domain Event items used by recordChange. LifeSpace does not time-window coalesce unrelated changes. Delivery rechecks endpoint/subscription state, managing Application × Model Access, subscriber Data Grant, and subscriber Service Principal/application eligibility immediately before the outbound attempt.",
        "parameters": [
          {
            "name": "X-LifeSpace-Change-Set-Id",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^cgs_[A-Za-z0-9_-]+$"
            }
          },
          {
            "name": "X-LifeSpace-Delivery-Id",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^(?:dlv|bdl)_[A-Za-z0-9_-]+$"
            }
          },
          {
            "name": "X-LifeSpace-Webhook-Endpoint-Id",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^(?:whk|wep)_[A-Za-z0-9_-]+$"
            }
          },
          {
            "name": "X-LifeSpace-Timestamp",
            "in": "header",
            "required": true,
            "description": "Unix timestamp in seconds used in the HMAC input.",
            "schema": {
              "type": "string",
              "pattern": "^[0-9]+$"
            }
          },
          {
            "name": "X-LifeSpace-Signature",
            "in": "header",
            "required": true,
            "description": "v1=<lowercase hex HMAC-SHA256> over timestamp + '.' + the exact raw UTF-8 request body, using the Webhook Endpoint signing secret.",
            "schema": {
              "type": "string",
              "pattern": "^v1=[a-f0-9]{64}$"
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ChangeSetReferencePayload"
              }
            }
          }
        },
        "responses": {
          "2XX": {
            "description": "Receiver accepted the ChangeSet delivery. Non-2xx responses are retryable according to LifeSpace Queue delivery policy."
          }
        }
      }
    },
    "bulkCompleted": {
      "post": {
        "summary": "Reference-only explicit non-atomic Bulk delivery",
        "description": "At-least-once outbound Webhook delivery for one explicit non-atomic Runtime Bulk. The envelope contains only Bulk identity plus the same reference-only committed Domain Event items used by recordChange; failed Bulk items produce no Domain Event and are therefore absent. LifeSpace does not time-window coalesce unrelated changes. Delivery rechecks endpoint/subscription state, managing Application × Model Access, subscriber Data Grant, and subscriber Service Principal/application eligibility immediately before the outbound attempt.",
        "parameters": [
          {
            "name": "X-LifeSpace-Bulk-Id",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^blk_[A-Za-z0-9_-]+$"
            },
            "description": "Stable explicit non-atomic Bulk correlation identity."
          },
          {
            "name": "X-LifeSpace-Delivery-Id",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^(?:dlv|bdl)_[A-Za-z0-9_-]+$"
            }
          },
          {
            "name": "X-LifeSpace-Webhook-Endpoint-Id",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^(?:whk|wep)_[A-Za-z0-9_-]+$"
            }
          },
          {
            "name": "X-LifeSpace-Timestamp",
            "in": "header",
            "required": true,
            "description": "Unix timestamp in seconds used in the HMAC input.",
            "schema": {
              "type": "string",
              "pattern": "^[0-9]+$"
            }
          },
          {
            "name": "X-LifeSpace-Signature",
            "in": "header",
            "required": true,
            "description": "v1=<lowercase hex HMAC-SHA256> over timestamp + '.' + the exact raw UTF-8 request body, using the Webhook Endpoint signing secret.",
            "schema": {
              "type": "string",
              "pattern": "^v1=[a-f0-9]{64}$"
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/BulkReferencePayload"
              }
            }
          }
        },
        "responses": {
          "2XX": {
            "description": "Receiver accepted the Bulk delivery. Non-2xx responses are retryable according to LifeSpace Queue delivery policy."
          }
        }
      }
    }
  },
  "components": {
    "securitySchemes": {
      "bearerAuth": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "JWT or lsp_svc_* Service API Token (legacy lsp_pat_* accepted)"
      }
    },
    "parameters": {
      "WebhookEndpointId": {
        "name": "endpointId",
        "in": "path",
        "required": true,
        "schema": {
          "type": "string",
          "pattern": "^whk_[A-Za-z0-9_-]+$"
        }
      },
      "EventSubscriptionId": {
        "name": "subscriptionId",
        "in": "path",
        "required": true,
        "schema": {
          "type": "string",
          "pattern": "^sub_[A-Za-z0-9_-]+$"
        }
      }
    },
    "responses": {
      "Unauthorized": {
        "description": "Authentication failed",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorResponse"
            }
          }
        }
      },
      "Forbidden": {
        "description": "Scope, Space permission, principal type or model-admin boundary denied access",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorResponse"
            }
          }
        }
      },
      "InvalidRequest": {
        "description": "Invalid request shape",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorResponse"
            }
          }
        }
      },
      "NotFound": {
        "description": "Resource not found",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorResponse"
            }
          }
        }
      },
      "Conflict": {
        "description": "Optimistic concurrency, state or Registry mutation conflict",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorResponse"
            }
          }
        }
      }
    },
    "schemas": {
      "DomainEventType": {
        "type": "string",
        "enum": [
          "record.created",
          "record.updated",
          "record.deleted"
        ]
      },
      "WebhookDelivery": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "eventId",
          "eventType",
          "modelKey",
          "recordId",
          "recordVersion",
          "changeId",
          "occurredAt",
          "status",
          "attemptCount",
          "createdAt"
        ],
        "properties": {
          "id": {
            "type": "string"
          },
          "eventId": {
            "type": "string",
            "pattern": "^evt_[A-Za-z0-9_-]+$"
          },
          "eventType": {
            "$ref": "#/components/schemas/DomainEventType"
          },
          "recordId": {
            "type": "string"
          },
          "recordVersion": {
            "type": "integer",
            "minimum": 1
          },
          "occurredAt": {
            "type": "string",
            "format": "date-time"
          },
          "status": {
            "type": "string",
            "enum": [
              "pending",
              "queued",
              "succeeded",
              "failed",
              "cancelled"
            ]
          },
          "attemptCount": {
            "type": "integer",
            "minimum": 0
          },
          "queuedAt": {
            "type": [
              "string",
              "null"
            ],
            "format": "date-time"
          },
          "deliveredAt": {
            "type": [
              "string",
              "null"
            ],
            "format": "date-time"
          },
          "lastStatusCode": {
            "type": [
              "integer",
              "null"
            ]
          },
          "lastError": {
            "type": [
              "string",
              "null"
            ]
          },
          "createdAt": {
            "type": "string",
            "format": "date-time"
          },
          "modelKey": {
            "type": "string"
          },
          "changeId": {
            "anyOf": [
              {
                "type": "string",
                "pattern": "^chg_[A-Za-z0-9_-]+$"
              },
              {
                "type": "null"
              }
            ],
            "description": "Opaque governed Change reference. New Generic Runtime events carry chg_*; null is reserved for legacy pre-linkage event evidence."
          }
        }
      },
      "WebhookDeliveryListResponse": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "data"
        ],
        "properties": {
          "data": {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "items"
            ],
            "properties": {
              "items": {
                "type": "array",
                "items": {
                  "$ref": "#/components/schemas/WebhookDelivery"
                }
              }
            }
          }
        }
      },
      "WebhookTestResponse": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "data"
        ],
        "properties": {
          "data": {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "ok",
              "statusCode"
            ],
            "properties": {
              "ok": {
                "type": "boolean"
              },
              "statusCode": {
                "type": "integer",
                "minimum": 100,
                "maximum": 599
              }
            }
          }
        }
      },
