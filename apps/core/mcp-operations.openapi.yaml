openapi: 3.1.0
info:
  title: LifeSpace Core Generic Operations (Candidate)
  version: 0.7.0
  description: |
    Protocol-neutral, authenticated operation projection for the current OAuth
    MCP Agent execution context or opaque Agent credential with configured MCP
    Server context and an optional explicitly selected current Delegation. This contract is Core-owned. Internal Native,
    Space Person and External Provider resolution is never a consumer contract.
    An operationRef is not an authority grant or bearer credential.
servers:
  - url: https://core.example.com
security:
  - oauthAgentExecution: []
  - trustedAgentCredential: []
paths:
  /api/v1/spaces/{spaceId}/_discovery/operations:
    get:
      operationId: discoverCurrentSpaceOperations
      summary: Current discoverable Model operations / 当前可发现模型操作目录
      description: |
        Projects only the current selected Space, Core MCP Server operation
        configuration, the OAuth credential's read Scope, current Application
        Model Access, Space/Data Grants, Kernel Person authority, Provider
        capability and model policy. When the current Agent already has
        independent write authority, a read-only OAuth token may discover a
        write operation with requiredScopes including resources:write. This
        allows a standards-compliant OAuth client to request explicit step-up
        authorization without receiving execution authority or an implied
        User Delegation. The result is a preview, never an authority lease.
        Optional exact modelKey and operation filters narrow this current projection
        before authority/schema hydration. operation requires modelKey; no match
        returns an empty operations array, including hidden or revoked operations.
        mode=delegation_request opts into a separate non-authorizing eligibility
        preview of the Identity-bound intended User's current authority with
        the actual OAuth scopes. It returns only model/operation/scope metadata,
        never executable descriptors, operationRef, input schemas or records.
        Independent Account approval and exact represented execution remain required.
        Represented OAuth may preview only its exact approved modelKey and operation,
        with both query filters and its matching signed Delegation header. Current
        authority, scopes and the Delegation chain are rechecked. Preview does not
        consume a single use, return business records, or authorize generic invoke.
        Opaque Agent credentials require the exact X-LifeSpace-MCP-Resource header.
        Without X-LifeSpace-Delegation-Id, executable descriptors reflect only direct
        Agent authority; no Grant means an empty catalog, not failed authentication.
        An explicit selector must be current and never falls back to direct authority.
        mode=configuration returns only configuredOperations metadata bounded by the
        enabled Server, Application Model Access, published capabilities and actual
        credential Scope; it is not User eligibility or executable authority.
        Configuration mode is available only to an opaque Agent without a selector.
      parameters:
        - $ref: '#/components/parameters/spaceId'
        - $ref: '#/components/parameters/trustedMcpResource'
        - $ref: '#/components/parameters/trustedDelegationId'
        - name: modelKey
          in: query
          required: false
          schema: { type: string, pattern: '^[a-z][a-z0-9_]{1,62}$' }
        - name: operation
          in: query
          required: false
          description: Requires modelKey; exact operation, not an authority claim.
          schema: { type: string, pattern: '^(query|get|create|update|delete|file_read|file_upload|action:[a-z][a-z0-9_-]{0,62})$' }
        - name: mode
          in: query
          required: false
          description: OAuth delegation eligibility or opaque Agent configuration-only operation metadata.
          schema: { type: string, enum: [delegation_request, configuration] }
      responses:
        '200':
          description: Current direct operation catalog or non-authorizing eligibility preview; no Provider, storage origin or Kernel type
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    oneOf:
                      - type: object
                        required: [operations]
                        additionalProperties: false
                        properties:
                          operations:
                            type: array
                            maxItems: 128
                            items: { $ref: '#/components/schemas/OperationDescriptor' }
                      - type: object
                        required: [eligibleOperations]
                        additionalProperties: false
                        properties:
                          eligibleOperations:
                            type: array
                            maxItems: 128
                            items: { $ref: '#/components/schemas/DelegationEligibility' }
                      - type: object
                        required: [configuredOperations]
                        additionalProperties: false
                        properties:
                          configuredOperations:
                            type: array
                            maxItems: 128
                            items: { $ref: '#/components/schemas/DelegationEligibility' }
        '400': { description: Malformed or duplicate projection filter }
        '401': { description: Invalid, expired or revoked signed OAuth execution proof }
        '403': { description: Selected Space, Scope or current MCP Server is unavailable }
        '404': { description: No visible matching operation }
        '503': { description: Current Identity or Core authority evidence unavailable }
  /api/v1/spaces/{spaceId}/_operations/{operationRef}/invoke:
    post:
      operationId: invokeCurrentSpaceOperation
      summary: Execute a selected current Model operation / 执行当前模型操作
      description: |
        The operationRef is a non-authorizing selector. Core re-resolves and
        revalidates the exact Server/Space/Model operation and current actor,
        OAuth, Application, Data Grant, Policy and model-specific capabilities
        before dispatching through the existing canonical Kernel/Model APIs.
        Any missing descriptor requiredScopes produces HTTP 403 even when the
        operation was visible with a narrower OAuth token.
        The explicit file_read operation requires resources:read. Current Core-owned
        Native fields use data.fieldKey + data.fileId; eligible Provider-backed
        file_ref_list fields use data.fieldKey + zero-based data.fileIndex.
        Core always rechecks live record authority. Native returns a short-lived
        signed R2 URL; External returns a freshly retrieved Provider HTTPS URL
        with its real expiry when available (none for public links). The client
        fetches directly; Provider bytes are never proxied or copied by Core.
        URLs must not be persisted as durable file identity.
        The explicit file_upload operation requires resources:read and resources:write.
        Data selects phase begin (fieldKey, recordId required for External,
        name, contentType, size) or complete (uploadId). Native may omit
        recordId. External file_ref_list fields may be readOnly for ordinary
        record mutation while still supporting upload.supported (Notion).
        Begin returns the existing signed PUT session; complete verifies
        the staged object and returns Native File or Provider record metadata.
        Clients transfer bytes directly; Native record attachment is separate.
        Multi-step upload does not support once-only Delegation.
        OAuth Agent Direct retains its current contract. OAuth represented execution
        uses the separate exact approved canonical operation. Trusted Agent credentials
        may execute via this generic route with direct Agent authority or an explicitly
        selected, current trusted-channel Delegation and exact configured Server context. Canonical
        handlers independently recheck authority and consume single-use when required.
      parameters:
        - $ref: '#/components/parameters/spaceId'
        - $ref: '#/components/parameters/trustedMcpResource'
        - $ref: '#/components/parameters/trustedDelegationId'
        - name: operationRef
          in: path
          required: true
          schema: { type: string, pattern: '^op_[a-f0-9]{64}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [arguments]
              additionalProperties: false
              properties:
                arguments:
                  type: object
                  description: Values must match the current OperationDescriptor.inputSchema
      responses:
        '200': { description: Current authorized read or updated record response }
        '201': { description: Current authorized created record }
        '204': { description: Successful delete, no response body }
        '400': { description: Invalid model operation input }
        '401': { description: Revoked, invalid or expired token }
        '403': { description: Insufficient current scope, Data Grant or Model authority }
        '404': { description: Unknown, stale, cross-Space or unauthorized operation selector }
        '409': { description: Record version or state conflict }
        '503': { description: Current authorization/Provider dependency unavailable }
  /api/v1/spaces/{spaceId}/models/{modelKey}/records/{recordId}/file-downloads:
    post:
      operationId: downloadRecordFileForMcp
      description: |
        OAuth execution or opaque Agent credential with configured Server context
        and optional explicit Delegation; selected Space, explicit file_read Server operation
        and (for represented execution) exact current User Delegation are checked.
        Reuses current record read authority. Native files require exact
        fileId/field link and return a signed R2 URL; Provider files use
        a bounded fileIndex in a freshly fetched file_ref_list and return the
        Provider HTTPS reference and expiry if supplied. No file bytes are
        transferred by Core; returned URLs must be kept confidential.
      parameters:
        - $ref: '#/components/parameters/spaceId'
        - name: modelKey
          in: path
          required: true
          schema: { type: string, pattern: '^[a-z][a-z0-9_]{1,62}$' }
        - name: recordId
          in: path
          required: true
          schema: { type: string, pattern: '^rec_[A-Za-z0-9_-]+$' }
        - $ref: '#/components/parameters/trustedMcpResource'
        - name: X-LifeSpace-Delegation-Id
          in: header
          required: false
          schema: { type: string }
          description: Required for represented OAuth execution; must match signed selector.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [fieldKey]
              oneOf:
                - required: [fileId]
                  not: { required: [fileIndex] }
                - required: [fileIndex]
                  not: { required: [fileId] }
              properties:
                fieldKey: { type: string, maxLength: 63 }
                fileId: { type: string, pattern: '^fil_[a-f0-9]{32}$' }
                fileIndex: { type: integer, minimum: 0, maximum: 99 }
      responses:
        '200':
          description: Native signed File URL or current Provider HTTPS file reference; treat URL as confidential
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: './openapi.yaml#/components/schemas/FileDownloadResponse' }
                  - { $ref: './openapi.yaml#/components/schemas/ProviderFileDownloadResponse' }
        '400': { description: Invalid request }
        '401': { description: Invalid or expired authentication }
        '403': { description: Missing current authority or configured operation }
        '404': { description: File, model or exact link unavailable }
        '422': { description: Invalid input }
        '503': { description: Transfer signing unavailable }
  /api/v1/spaces/{spaceId}/models/{modelKey}/file-uploads:
    post:
      operationId: beginModelFileUploadForMcp
      description: |
        Exact model-scoped native upload session for authorized OAuth execution
        or opaque Agent credential with configured Server context and optional explicit Delegation.
        Both phases require current write Scope, Server operation, model authority
        and (when represented) exact timed or until-revoked Delegation.
        The authorized client PUTs bytes directly using the returned URL and headers.
      parameters:
        - $ref: '#/components/parameters/spaceId'
        - name: modelKey
          in: path
          required: true
          schema: { type: string, pattern: '^[a-z][a-z0-9_]{1,62}$' }
        - $ref: '#/components/parameters/trustedMcpResource'
        - name: X-LifeSpace-Delegation-Id
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [fieldKey, name, contentType, size]
              properties:
                fieldKey: { type: string, maxLength: 63 }
                recordId: { type: string, maxLength: 256, pattern: '^rec_[A-Za-z0-9_-]+$' }
                name: { type: string, minLength: 1, maxLength: 512 }
                contentType: { type: string, minLength: 1, maxLength: 255 }
                size: { type: integer, minimum: 1 }
      responses:
        '201':
          description: Existing native File upload session; treat signed URL as secret
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema: { $ref: './openapi.yaml#/components/schemas/FileUploadSessionResponse' }
        '403': { description: Insufficient current authority or configuration }
        '405': { description: Unsupported native writable file field }
        '413': { description: Canonical upload size limit }
        '422': { description: Invalid request or unsupported once-only Delegation }
  /api/v1/spaces/{spaceId}/models/{modelKey}/file-uploads/{uploadId}/complete:
    post:
      operationId: completeModelFileUploadForMcp
      description: |
        Rechecks current authority and exact model/Space/session binding before
        reusing the canonical upload completion. No record mutation or binary
        transfer is performed by the protocol adapter.
      parameters:
        - $ref: '#/components/parameters/spaceId'
        - name: modelKey
          in: path
          required: true
          schema: { type: string, pattern: '^[a-z][a-z0-9_]{1,62}$' }
        - name: uploadId
          in: path
          required: true
          schema: { type: string, pattern: '^upl_[a-f0-9]{32}$' }
        - $ref: '#/components/parameters/trustedMcpResource'
        - name: X-LifeSpace-Delegation-Id
          in: header
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Existing native File metadata after verification; use the returned File ID in a separately authorized record mutation
          content:
            application/json:
              schema: { type: object }
        '403': { description: Insufficient current authority or mismatched execution }
        '404': { description: Session not available for the selected model and Space }
        '409': { description: Incomplete, expired, mismatched or non-pending upload }
        '422': { description: Unsupported once-only Delegation }
components:
  securitySchemes:
    oauthAgentExecution:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Private, Identity-signed <=60s OAuth MCP Core execution JWT.
        The third-party OAuth access token must never be forwarded to Core.
    trustedAgentCredential:
      type: http
      scheme: bearer
      bearerFormat: lsp_agt_ opaque Agent API credential
      description: Current Identity-introspected Agent credential; exact configured context is mandatory; selected User Delegation is optional.
  parameters:
    trustedMcpResource:
      name: X-LifeSpace-MCP-Resource
      in: header
      required: false
      schema: { type: string, format: uri }
      description: Required for trusted Agent transport; exact canonical enabled MCP Server Resource.
    trustedDelegationId:
      name: X-LifeSpace-Delegation-Id
      in: header
      required: false
      schema: { type: string, pattern: '^dlg_[A-Za-z0-9_-]{1,128}$' }
      description: Optional for opaque Agent transport; explicit selected trusted-channel User Delegation. Omission selects direct Agent authority.
    spaceId:
      name: spaceId
      in: path
      required: true
      schema: { type: string, pattern: '^spc_[A-Za-z0-9_-]+$' }
  schemas:
    DelegationEligibility:
      type: object
      additionalProperties: false
      required: [modelKey, operation, requiredScopes]
      properties:
        modelKey: { type: string, pattern: '^[a-z][a-z0-9_]{1,62}$' }
        operation: { type: string, pattern: '^(query|get|create|update|delete|file_read|file_upload|action:[a-z][a-z0-9_-]{0,62})$' }
        requiredScopes:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items: { type: string, enum: ['resources:read', 'resources:write'] }
      description: Non-authorizing eligibility to request independent User approval; not an executable operation or authority proof.
    OperationDescriptor:
      type: object
      additionalProperties: false
      required: [modelKey, display, operation, operationRef, inputSchema, title, description, requiredScopes]
      properties:
        modelKey: { type: string, pattern: '^[a-z][a-z0-9_]{1,62}$' }
        display: { type: string, minLength: 1 }
        operation:
          type: string
          pattern: '^(query|get|create|update|delete|file_read|file_upload|action:[a-z][a-z0-9_-]{0,62})$'
        operationRef: { type: string, pattern: '^op_[a-f0-9]{64}$' }
        requiredScopes:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items: { type: string, enum: ['resources:read', 'resources:write'] }
          description: Credential scopes required to execute; not proof of any Grant
        inputSchema:
          type: object
          description: Core-owned JSON Schema; no provider or origin fields
        title: { type: string, minLength: 1 }
        description: { type: string }
