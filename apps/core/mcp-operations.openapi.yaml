openapi: 3.1.0
info:
  title: LifeSpace Core Generic Operations (Candidate)
  version: 0.5.0
  description: |
    Protocol-neutral, authenticated operation projection for the current OAuth
    MCP Agent execution context. This contract is Core-owned. Internal Native,
    Space Person and External Provider resolution is never a consumer contract.
    An operationRef is not an authority grant or bearer credential.
servers:
  - url: https://core.example.com
security:
  - oauthAgentExecution: []
paths:
  /api/v1/spaces/{spaceId}/_discovery/operations:
    get:
      operationId: discoverCurrentSpaceOperations
      summary: Current discoverable Model operations / 当前可发现模型操作目录
      description: |
        Projects only the current selected Space, Core MCP Server operation
        configuration, the OAuth credential's read Scope, current Application
        Model Access, Space/Data Grants, Kernel Person authority, Provider
        capability and model policy. When the current Agent already has
        independent write authority, a read-only OAuth token may discover a
        write operation with requiredScopes including resources:write. This
        allows a standards-compliant OAuth client to request explicit step-up
        authorization without receiving execution authority or an implied
        User Delegation. The result is a preview, never an authority lease.
        Optional exact modelKey and operation filters narrow this current projection
        before authority/schema hydration. operation requires modelKey; no match
        returns an empty operations array, including hidden or revoked operations.
      parameters:
        - $ref: '#/components/parameters/spaceId'
        - name: modelKey
          in: query
          required: false
          schema: { type: string, pattern: '^[a-z][a-z0-9_]{1,62}$' }
        - name: operation
          in: query
          required: false
          description: Requires modelKey; exact operation, not an authority claim.
          schema: { type: string, pattern: '^(query|get|create|update|delete|file_read|file_upload|action:[a-z][a-z0-9_-]{0,62})$' }
      responses:
        '200':
          description: Current operation catalog; no Provider, storage origin or Kernel type
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [operations]
                    properties:
                      operations:
                        type: array
                        maxItems: 128
                        items: { $ref: '#/components/schemas/OperationDescriptor' }
        '400': { description: Malformed or duplicate projection filter }
        '401': { description: Invalid, expired or revoked signed OAuth execution proof }
        '403': { description: Selected Space, Scope or current MCP Server is unavailable }
        '404': { description: No visible matching operation }
        '503': { description: Current Identity or Core authority evidence unavailable }
  /api/v1/spaces/{spaceId}/_operations/{operationRef}/invoke:
    post:
      operationId: invokeCurrentSpaceOperation
      summary: Execute a selected current Model operation / 执行当前模型操作
      description: |
        The operationRef is a non-authorizing selector. Core re-resolves and
        revalidates the exact Server/Space/Model operation and current actor,
        OAuth, Application, Data Grant, Policy and model-specific capabilities
        before dispatching through the existing canonical Kernel/Model APIs.
        Any missing descriptor requiredScopes produces HTTP 403 even when the
        operation was visible with a narrower OAuth token.
        The explicit file_read operation requires resources:read and is available only for
        a configured native model with file or file_list fields. Input data contains
        fieldKey and fileId; recordId is required. A successful response contains the
        existing short-lived FileDownloadResponse. The authorized client fetches the
        file directly; the URL is a bearer credential, not a durable File identity.
        The explicit file_upload operation requires resources:read and resources:write.
        Data selects phase begin (fieldKey, optional recordId, name, contentType, size)
        or complete (uploadId). Begin returns the existing signed PUT session;
        complete verifies the staged object and returns File metadata. Clients
        transfer bytes directly; record attachment is a separate operation.
        Multi-step upload does not support once-only Delegation.
        Current candidate accepts Agent Direct; exact User-delegated operation
        equivalence requires a separate hardened authorization gate.
      parameters:
        - $ref: '#/components/parameters/spaceId'
        - name: operationRef
          in: path
          required: true
          schema: { type: string, pattern: '^op_[a-f0-9]{64}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [arguments]
              additionalProperties: false
              properties:
                arguments:
                  type: object
                  description: Values must match the current OperationDescriptor.inputSchema
      responses:
        '200': { description: Current authorized read or updated record response }
        '201': { description: Current authorized created record }
        '204': { description: Successful delete, no response body }
        '400': { description: Invalid model operation input }
        '401': { description: Revoked, invalid or expired token }
        '403': { description: Insufficient current scope, Data Grant or Model authority }
        '404': { description: Unknown, stale, cross-Space or unauthorized operation selector }
        '409': { description: Record version or state conflict }
        '503': { description: Current authorization/Provider dependency unavailable }
  /api/v1/spaces/{spaceId}/models/{modelKey}/records/{recordId}/file-downloads:
    post:
      operationId: downloadRecordFileForMcp
      description: |
        OAuth execution only; selected Space, explicit file_read Server operation
        and (for represented execution) exact current User Delegation are checked.
        Reuses the existing native File authority, record link and read policy.
        The result is private and contains a short-lived bearer URL for direct
        client transfer; no file bytes are returned by this operation.
      parameters:
        - $ref: '#/components/parameters/spaceId'
        - name: modelKey
          in: path
          required: true
          schema: { type: string, pattern: '^[a-z][a-z0-9_]{1,62}$' }
        - name: recordId
          in: path
          required: true
          schema: { type: string, pattern: '^rec_[A-Za-z0-9_-]+$' }
        - name: X-LifeSpace-Delegation-Id
          in: header
          required: false
          schema: { type: string }
          description: Required for represented OAuth execution; must match signed selector.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [fieldKey, fileId]
              properties:
                fieldKey: { type: string, maxLength: 63 }
                fileId: { type: string, pattern: '^fil_[a-f0-9]{32}$' }
      responses:
        '200':
          description: Existing native File download descriptor for direct authorized client transfer; treat URL as secret
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema: { $ref: './openapi.yaml#/components/schemas/FileDownloadResponse' }
        '400': { description: Invalid request }
        '401': { description: Invalid or expired authentication }
        '403': { description: Missing current authority or configured operation }
        '404': { description: File, model or exact link unavailable }
        '422': { description: Invalid input }
        '503': { description: Transfer signing unavailable }
  /api/v1/spaces/{spaceId}/models/{modelKey}/file-uploads:
    post:
      operationId: beginModelFileUploadForMcp
      description: |
        Exact model-scoped native upload session for authorized OAuth execution.
        Both phases require current write Scope, Server operation, model authority
        and (when represented) exact timed or until-revoked Delegation.
        The authorized client PUTs bytes directly using the returned URL and headers.
      parameters:
        - $ref: '#/components/parameters/spaceId'
        - name: modelKey
          in: path
          required: true
          schema: { type: string, pattern: '^[a-z][a-z0-9_]{1,62}$' }
        - name: X-LifeSpace-Delegation-Id
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [fieldKey, name, contentType, size]
              properties:
                fieldKey: { type: string, maxLength: 63 }
                recordId: { type: string, maxLength: 256, pattern: '^rec_[A-Za-z0-9_-]+$' }
                name: { type: string, minLength: 1, maxLength: 512 }
                contentType: { type: string, minLength: 1, maxLength: 255 }
                size: { type: integer, minimum: 1 }
      responses:
        '201':
          description: Existing native File upload session; treat signed URL as secret
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema: { $ref: './openapi.yaml#/components/schemas/FileUploadSessionResponse' }
        '403': { description: Insufficient current authority or configuration }
        '405': { description: Unsupported native writable file field }
        '413': { description: Canonical upload size limit }
        '422': { description: Invalid request or unsupported once-only Delegation }
  /api/v1/spaces/{spaceId}/models/{modelKey}/file-uploads/{uploadId}/complete:
    post:
      operationId: completeModelFileUploadForMcp
      description: |
        Rechecks current authority and exact model/Space/session binding before
        reusing the canonical upload completion. No record mutation or binary
        transfer is performed by the protocol adapter.
      parameters:
        - $ref: '#/components/parameters/spaceId'
        - name: modelKey
          in: path
          required: true
          schema: { type: string, pattern: '^[a-z][a-z0-9_]{1,62}$' }
        - name: uploadId
          in: path
          required: true
          schema: { type: string, pattern: '^upl_[a-f0-9]{32}$' }
        - name: X-LifeSpace-Delegation-Id
          in: header
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Existing native File metadata after verification; use the returned File ID in a separately authorized record mutation
          content:
            application/json:
              schema: { type: object }
        '403': { description: Insufficient current authority or mismatched execution }
        '404': { description: Session not available for the selected model and Space }
        '409': { description: Incomplete, expired, mismatched or non-pending upload }
        '422': { description: Unsupported once-only Delegation }
components:
  securitySchemes:
    oauthAgentExecution:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Private, Identity-signed <=60s OAuth MCP Core execution JWT.
        The third-party OAuth access token must never be forwarded to Core.
  parameters:
    spaceId:
      name: spaceId
      in: path
      required: true
      schema: { type: string, pattern: '^spc_[A-Za-z0-9_-]+$' }
  schemas:
    OperationDescriptor:
      type: object
      additionalProperties: false
      required: [modelKey, display, operation, operationRef, inputSchema, title, description, requiredScopes]
      properties:
        modelKey: { type: string, pattern: '^[a-z][a-z0-9_]{1,62}$' }
        display: { type: string, minLength: 1 }
        operation:
          type: string
          pattern: '^(query|get|create|update|delete|file_read|file_upload|action:[a-z][a-z0-9_-]{0,62})$'
        operationRef: { type: string, pattern: '^op_[a-f0-9]{64}$' }
        requiredScopes:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items: { type: string, enum: ['resources:read', 'resources:write'] }
          description: Credential scopes required to execute; not proof of any Grant
        inputSchema:
          type: object
          description: Core-owned JSON Schema; no provider or origin fields
        title: { type: string, minLength: 1 }
        description: { type: string }
