openapi: 3.1.0
info:
  title: LifeSpace Core OAuth Consent and Delegation Approval
  version: 0.5.0
  description: >
    Candidate Account-only OAuth consent and application-governed Delegation approval.
    Core verifies current Space manage authority, then calls Identity through a
    trusted Service Binding; this never creates a Data Grant or Delegation.
paths:
  /api/v1/spaces/{spaceId}/oauth-delegation-requests:
    post:
      operationId: requestOAuthMcpUserDelegation
      description: >
        Third-party OAuth Agent only; requests one exact currently enabled
        Server Native Model operation from the OAuth consenting User.
        Creates non-authorizing arq_* bound to the current Application approval policy.
        Account channel returns an approval URL; opted-in trusted Application
        returns structured pending status without an Account URL. Neither
        OAuth Client nor Agent chooses the channel. Trusted Agent/WeCom
        confirmation remains isolated from this OAuth request family.
      security: [{ oauthAgentCoreBearer: [] }]
      parameters:
        - { in: path, name: spaceId, required: true, schema: { type: string, pattern: '^spc_' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [modelKey, operation, reason]
              properties:
                modelKey: { type: string, pattern: '^[a-z][a-z0-9_]{1,62}$' }
                operation: { type: string, pattern: '^(get|query|create|update|delete|file_read|file_upload|action:[a-z][a-z0-9_-]{0,62})$' }
                reason: { type: string, minLength: 4, maxLength: 250 }
      responses:
        '201': { description: Pending arq with approvalChannel and Account URL only for account; no Delegation issued }
        '400': { description: Invalid operation, model, or reason }
        '403': { description: OAuth opt-in, active Scope or current Server operation missing }
        '429': { description: Too many pending requests }
  /api/v1/spaces/{spaceId}/oauth-delegation-requests/{requestId}:
    get:
      operationId: currentOAuthMcpDelegationStatus
      description: >
        OAuth Agent only; exact grant, selected Resource, Space and Agent
        bound status of its own pending or decided arq_*.
      security: [{ oauthAgentCoreBearer: [] }]
      parameters:
        - { in: path, name: spaceId, required: true, schema: { type: string, pattern: '^spc_' } }
        - { in: path, name: requestId, required: true, schema: { type: string, pattern: '^arq_' } }
      responses:
        '200': { description: Current status with dlg_* only after independent User approval }
        '404': { description: Cross-Client, User, Server or Agent request }
  /api/v1/me/oauth/delegation-requests/{requestId}:
    get:
      operationId: getAccountUserOAuthMcpDelegationRequest
      description: >
        Verifies exact Account Application User, Account approval policy and live OAuth Consent
        before displaying bounded request details; URL grants no authority.
      security: [{ accountUserBearer: [] }]
      parameters:
        - { in: path, name: requestId, required: true, schema: { type: string, pattern: '^arq_' } }
      responses:
        '200': { description: Exact User-bound request and operation preview }
        '403': { description: Current OAuth authorization or Server operation revoked }
        '404': { description: Wrong User or non-Account request }
  /api/v1/me/oauth/delegation-requests/{requestId}/{decision}:
    post:
      operationId: accountDecideOAuthMcpDelegation
      description: >
        Identity-confirmed Account User, same-origin and CSRF checked by
        Account BFF. Approve atomically issues a User-selected single-use,
        time-limited repeated-use (1h/24h/7d), or until-revoked dlg_*.
        Only the authenticated Account User may choose the lifetime while the configured channel is Account;
        omission retains the legacy single-use default. Deny grants no authority. Does not modify trusted in-app
        or WeCom confirmation contracts.
      security: [{ accountUserBearer: [] }]
      parameters:
        - { in: path, name: requestId, required: true, schema: { type: string, pattern: '^arq_' } }
        - { in: path, name: decision, required: true, schema: { type: string, enum: [approve, deny] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                mode: { type: string, enum: [once, timed, until_revoked] }
                durationMinutes: { type: integer, enum: [60, 1440, 10080] }
              description: >
                mode timed requires one of the listed durationMinutes values.
                Other modes prohibit durationMinutes. Empty object means once.
      responses:
        '200': { description: User-confirmed decision with chosen Delegation lifetime }
        '403': { description: OAuth, Account User or requested authority denied }
        '404': { description: Wrong User or cross-Client request }
        '409': { description: Expired or previously finalized request }
  /api/v1/me/oauth/application-delegation-requests:
    get:
      operationId: listApplicationOAuthMcpDelegationRequests
      description: >
        Bounded currently pending OAuth arq_* belonging to the direct authenticated
        User in the exact registered Application. Requires a fresh trustedBackend
        plus explicit application approval policy and active User; no Agent,
        OAuth Client or Agent Credential can read this route. Optional exact
        OAuth Authorization filter and bounded offset prevent cross-run conflation.
        Listing is Context Projection, never approval or Delegation.
      security: [{ applicationUserBearer: [] }]
      parameters:
        - { in: query, name: authorizationId, required: false, schema: { type: string, pattern: '^oaz_' } }
        - { in: query, name: offset, required: false, schema: { type: integer, minimum: 0, maximum: 9999 } }
      responses:
        '200': { description: Pending requests with nextOffset, no-store }
        '400': { description: Unsupported or duplicate filters }
        '403': { description: Current Application policy or direct User missing }
  /api/v1/me/oauth/application-delegation-requests/{requestId}:
    get:
      operationId: getApplicationOAuthMcpDelegationRequest
      description: >
        Exact User/Application-scoped OAuth request with matching current
        Authorization and application-owned approval policy. Opaque not-found
        for cross-Application or cross-User request.
      security: [{ applicationUserBearer: [] }]
      parameters:
        - { in: path, name: requestId, required: true, schema: { type: string, pattern: '^arq_' } }
      responses:
        '200': { description: Canonical request preview and current status }
        '403': { description: Live OAuth authorization or policy revoked }
        '404': { description: Wrong User/Application/channel }
  /api/v1/me/oauth/application-delegation-requests/{requestId}/{decision}:
    post:
      operationId: applicationDecideOAuthMcpDelegation
      description: >
        The trusted Application's backend obtains an Identity-signed direct
        User JWT only after independently verified human interaction. Core
        matches the exact current User, Application, immutable OAuth request,
        live Authorization, configured approval channel, model/Space authority,
        and atomic Delegation issuance. OAuth Agent or generic trusted Agent
        credentials never approve. Same Account lifetime restrictions apply.
      security: [{ applicationUserBearer: [] }]
      parameters:
        - { in: path, name: requestId, required: true, schema: { type: string, pattern: '^arq_' } }
        - { in: path, name: decision, required: true, schema: { type: string, enum: [approve, deny] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                mode: { type: string, enum: [once, timed, until_revoked] }
                durationMinutes: { type: integer, enum: [60, 1440, 10080] }
              description: Deny requires empty object. Approve selects one allowed lifetime.
      responses:
        '200': { description: User-confirmed atomic decision and bounded Delegation response }
        '403': { description: User, current Application policy or OAuth authority denied }
        '404': { description: Wrong User/Application/channel }
        '409': { description: Expired, final or concurrently decided request }
  /api/v1/me/oauth/delegations:
    get:
      operationId: listAccountOAuthMcpDelegations
      description: >
        Lists only currently usable Account-approved OAuth MCP Delegations
        belonging to the signed-in User. Does not depend on live OAuth Consent,
        so a disconnected client cannot prevent revocation.
      security: [{ accountUserBearer: [] }]
      parameters:
        - { in: query, name: offset, required: false, schema: { type: integer, minimum: 0, maximum: 9999 } }
      responses:
        '200': { description: Bounded page of own active delegations with nextOffset }
        '403': { description: Non-Account User }
  /api/v1/me/oauth/delegations/{delegationId}/revoke:
    post:
      operationId: revokeAccountOAuthMcpDelegation
      description: >
        Owner-only Account session revocation independent of OAuth state;
        never revokes another User's or a trusted in-app delegation.
      security: [{ accountUserBearer: [] }]
      parameters:
        - { in: path, name: delegationId, required: true, schema: { type: string, pattern: '^dlg_' } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, maxProperties: 0 }
      responses:
        '200': { description: Delegation revoked }
        '404': { description: Not found or not owned by Account User }
  /api/v1/me/oauth/choices:
    get:
      description: >-
        Account Application's authenticated manager User sees current membership
        and Agent Data Grant candidates, plus explicitly configured delegation
        enrollment contexts when the exact enabled MCP Resource is selected.
        Zero-Grant candidates require explicit User authorization mode; this
        selection never creates a Grant or Delegation.
      security: [{ accountUserBearer: [] }]
      parameters:
        - { in: query, name: resource, required: false, schema: { type: string, format: uri }, description: Exact enabled MCP Resource for additional delegation enrollment candidates }
      responses:
        '200': { description: Bounded current candidate choices (at most 100 pairs) }
        '403': { description: Non-Account or insufficient scope }
        '503': { description: Identity binding unavailable }
  /api/v1/me/oauth/capabilities:
    get:
      description: >
        Account-only, current-manager, selected active Agent direct operation access
        upper-bound preview from published Native Model Definition, current
        Application Model Access, Agent Data Grants, and the exact enabled
        Core MCP Server operation allowlist. Kernel Person operations use the
        same independent Person Directory authority as live MCP discovery;
        ordinary model grants do not grant Person access. The Account BFF applies the
        pending OAuth Client's immutable requested Scopes; record-specific
        Policy and execution-time state must still narrow results. Preview
        is not runtime authorization proof.
      security: [{ accountUserBearer: [] }]
      parameters:
        - { in: query, name: applicationId, required: true, schema: { type: string, pattern: '^app_' } }
        - { in: query, name: spaceId, required: true, schema: { type: string, pattern: '^spc_' } }
        - { in: query, name: agentId, required: true, schema: { type: string, pattern: '^agt_' } }
        - { in: query, name: resource, required: true, description: Exact current Core MCP Server HTTPS Resource URI from pending Identity OAuth request, schema: { type: string, format: uri } }
      responses:
        '200': { description: Read-only, up to 50 currently eligible Native and Kernel Person projections, allowed operations (get/query/create/update/delete/file_read/file_upload), and resourceCapabilityApplied=true; Account must narrow to requested OAuth Scopes }
        '400': { description: Invalid or duplicate context selector }
        '403': { description: Account User or current Agent/Space eligibility missing }
        '503': { description: Identity Agent binding unavailable }
  /api/v1/me/oauth/spaces/{spaceId}/options:
    get:
      description: Account-only authenticated Space manager reads currently eligible Agent/Application candidates for one Space; selection is revalidated on confirm.
      security: [{ accountUserBearer: [] }]
      parameters:
        - { in: path, name: spaceId, required: true, schema: { type: string, pattern: '^spc_' } }
      responses:
        '200': { description: Bounded Agent/Application candidates }
        '403': { description: Missing current Space manage authority }
  /api/v1/me/oauth/requests/{requestId}/confirm:
    post:
      operationId: confirmOAuthConsent
      description: >
        A dedicated Account backend submits a verified Identity-signed
        Account Application user token. Core requires spaces:manage scope and
        current manage authority for the selected Space. It alone contacts
        Identity's internal approval boundary. The Agent remains Direct-only
        unless a separate User Delegation is explicitly approved.
      security: [{ accountUserBearer: [] }]
      parameters:
        - in: path
          name: requestId
          required: true
          schema: { type: string, pattern: '^oar_' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [applicationId, spaceId, agentId, allowUserAuthorization]
              properties:
                applicationId: { type: string }
                spaceId: { type: string, pattern: '^spc_' }
                agentId: { type: string, pattern: '^agt_' }
                allowUserAuthorization: { type: boolean }
      responses:
        '200':
          description: User-confirmed Authorization Code redirect to return to the Account BFF; no-store.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [authorizationId, redirectUrl]
                    properties:
                      authorizationId: { type: string, pattern: '^oaz_' }
                      redirectUrl: { type: string, format: uri }
        '400': { description: Invalid request payload }
        '401': { description: User JWT not authenticated }
        '403': { description: Not Account user, lacking scope or current Space manage authority }
        '409': { description: OAuth request expired, replaced or no longer pending }
        '502': { description: Identity confirmation unavailable or invalid }
        '503': { description: Trusted Core-to-Identity binding not configured }
components:
  securitySchemes:
    oauthAgentCoreBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Identity-signed <=60s exact OAuth MCP Agent token, not public OAuth bearer.
    applicationUserBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Identity-signed direct User JWT bound to the opted-in trusted owning Application. The Application BFF must independently verify same-origin/CSRF and real user confirmation; never an OAuth Agent token.
    accountUserBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Identity-issued user JWT for configured Account Application only; never an OAuth Client credential.
