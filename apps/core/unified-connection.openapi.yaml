{
  "openapi": "3.1.0",
  "info": {
    "title": "LifeSpace Unified Connection Read API (Application-scoped)",
    "version": "0.2.0",
    "description": "Application-scoped Connection read and unprovisioned draft management candidate. GET, POST pending draft, PATCH display metadata, DELETE only unprovisioned pending draft. No identity creation, credential issuance, activation, live revocation or cross-Application Account administration. Requires User Principal, spaces:manage and current Space manage. Authenticated Application derives strictly from verified token azp."
  },
  "servers": [
    {
      "url": "https://core.example.com",
      "description": "Documentation example only"
    }
  ],
  "security": [
    {
      "bearerAuth": []
    }
  ],
  "paths": {
    "/api/v1/spaces/{spaceId}/connections": {
      "get": {
        "operationId": "listApplicationConnections",
        "summary": "List connections for the verified current Application and current Space manager",
        "parameters": [
          {
            "$ref": "#/components/parameters/SpaceId"
          },
          {
            "name": "limit",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 50,
              "default": 20
            }
          },
          {
            "name": "offset",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 0,
              "maximum": 10000,
              "default": 0
            }
          }
        ],
        "responses": {
          "200": {
            "description": "App-scoped non-secret connection metadata",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "data"
                  ],
                  "properties": {
                    "data": {
                      "$ref": "#/components/schemas/ConnectionList"
                    }
                  }
                }
              }
            }
          },
          "400": {
            "description": "Invalid pagination"
          },
          "401": {
            "description": "Authentication required"
          },
          "403": {
            "description": "Current Space management/credential scope denied"
          }
        }
      },
      "post": {
        "operationId": "createPendingApplicationConnection",
        "summary": "Create an unprovisioned, non-executable pending Connection",
        "description": "Derives Application from signed identity; assigns owner only to current Space or authenticated User. Does not create Identity/credentials, Grants, Webhook subscriptions or External Adapter records. Cannot set active status.",
        "parameters": [
          {
            "$ref": "#/components/parameters/SpaceId"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/CreateConnectionDraft"
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Connection nonsecret metadata",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "data"
                  ],
                  "properties": {
                    "data": {
                      "$ref": "#/components/schemas/Connection"
                    }
                  }
                }
              }
            }
          },
          "400": {
            "description": "Invalid field or forbidden attempted override"
          },
          "401": {
            "description": "Unauthenticated"
          },
          "403": {
            "description": "Scope or Space manage denied"
          },
          "415": {
            "description": "JSON content type required"
          }
        }
      }
    },
    "/api/v1/spaces/{spaceId}/connections/{connectionId}": {
      "get": {
        "operationId": "getApplicationConnection",
        "summary": "Get a Connection visible to the verified current Application and Space manager",
        "parameters": [
          {
            "$ref": "#/components/parameters/SpaceId"
          },
          {
            "$ref": "#/components/parameters/ConnectionId"
          }
        ],
        "responses": {
          "200": {
            "description": "Non-secret Connection metadata",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "data"
                  ],
                  "properties": {
                    "data": {
                      "$ref": "#/components/schemas/Connection"
                    }
                  }
                }
              }
            }
          },
          "401": {
            "description": "Authentication required"
          },
          "403": {
            "description": "Space management denied"
          },
          "404": {
            "description": "Connection not found within authorized Application and Space"
          }
        }
      },
      "patch": {
        "operationId": "updateApplicationConnectionMetadata",
        "summary": "Update only display name/note of a visible non-revoked Connection",
        "description": "Requires exact expectedUpdatedAt optimistic precondition. Cannot change status, owner, Application, Space, kind, credentials, identity or backing resources.",
        "parameters": [
          {
            "$ref": "#/components/parameters/SpaceId"
          },
          {
            "$ref": "#/components/parameters/ConnectionId"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/EditConnectionMetadata"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Connection nonsecret metadata",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "data"
                  ],
                  "properties": {
                    "data": {
                      "$ref": "#/components/schemas/Connection"
                    }
                  }
                }
              }
            }
          },
          "400": {
            "description": "Invalid or unsupported field"
          },
          "401": {
            "description": "Unauthenticated"
          },
          "403": {
            "description": "Scope or Space manage denied"
          },
          "404": {
            "description": "Connection not found or not visible"
          },
          "409": {
            "description": "Stale modification or revoked Connection"
          }
        }
      },
      "delete": {
        "operationId": "cancelUnprovisionedApplicationConnectionDraft",
        "summary": "Cancel a pending draft only if it has no Identity or backing resource",
        "description": "Marks an unprovisioned draft revoked. Never invalidates live credentials or pretends to revoke an active Agent/Service/Webhook/Provider. Live revocation needs a separate orchestrated Identity/Core lifecycle.",
        "parameters": [
          {
            "$ref": "#/components/parameters/SpaceId"
          },
          {
            "$ref": "#/components/parameters/ConnectionId"
          }
        ],
        "responses": {
          "204": {
            "description": "Unprovisioned pending draft cancelled"
          },
          "401": {
            "description": "Unauthenticated"
          },
          "403": {
            "description": "Scope or Space manage denied"
          },
          "404": {
            "description": "Connection not found or not visible"
          },
          "409": {
            "description": "Provisioned or active Connection cannot be cancelled here"
          }
        }
      }
    }
  },
  "components": {
    "securitySchemes": {
      "bearerAuth": {
        "type": "http",
        "scheme": "bearer"
      }
    },
    "parameters": {
      "SpaceId": {
        "name": "spaceId",
        "in": "path",
        "required": true,
        "schema": {
          "type": "string",
          "pattern": "^spc_[A-Za-z0-9_-]+$"
        }
      },
      "ConnectionId": {
        "name": "connectionId",
        "in": "path",
        "required": true,
        "schema": {
          "type": "string",
          "pattern": "^conn_[A-Za-z0-9_-]+$"
        }
      }
    },
    "schemas": {
      "Connection": {
        "title": "LifeSpace Unified Connection — planned nonsecret read metadata",
        "description": "Design candidate only: no active API route. Agent/Service Connection identity is exclusive. Credentials and grants are stored by canonical owning services, not here.",
        "type": "object",
        "additionalProperties": false,
        "required": [
          "connectionId",
          "applicationId",
          "spaceId",
          "kind",
          "name",
          "status",
          "owner",
          "createdAt",
          "updatedAt"
        ],
        "properties": {
          "connectionId": {
            "type": "string",
            "pattern": "^conn_[A-Za-z0-9_-]+$",
            "description": "Opaque platform-wide Connection identifier; never a credential"
          },
          "applicationId": {
            "type": "string",
            "minLength": 1,
            "maxLength": 128
          },
          "spaceId": {
            "type": "string",
            "pattern": "^spc_[A-Za-z0-9_-]+$"
          },
          "kind": {
            "type": "string",
            "enum": [
              "agent",
              "service",
              "event_push",
              "external_data"
            ]
          },
          "name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 120
          },
          "note": {
            "type": "string",
            "maxLength": 1000,
            "description": "Optional editable user note, not an authorization field"
          },
          "status": {
            "type": "string",
            "enum": [
              "pending",
              "active",
              "disabled",
              "revoked"
            ]
          },
          "owner": {
            "$ref": "#/components/schemas/Owner",
            "description": "Management owner; cross-boundary transfer is not ordinary PATCH"
          },
          "identity": {
            "$ref": "#/components/schemas/Identity",
            "description": "Present only for dedicated Agent/Service identities"
          },
          "createdAt": {
            "type": "string",
            "format": "date-time"
          },
          "updatedAt": {
            "type": "string",
            "format": "date-time"
          }
        },
        "allOf": [
          {
            "if": {
              "properties": {
                "kind": {
                  "const": "agent"
                }
              }
            },
            "then": {
              "properties": {
                "identity": {
                  "properties": {
                    "type": {
                      "const": "agent"
                    },
                    "id": {
                      "pattern": "^agt_[A-Za-z0-9_-]+$"
                    }
                  }
                }
              }
            }
          },
          {
            "if": {
              "properties": {
                "kind": {
                  "const": "service"
                }
              }
            },
            "then": {
              "properties": {
                "identity": {
                  "properties": {
                    "type": {
                      "const": "service"
                    },
                    "id": {
                      "pattern": "^svc_[A-Za-z0-9_-]+$"
                    }
                  }
                }
              }
            }
          },
          {
            "if": {
              "properties": {
                "kind": {
                  "enum": [
                    "event_push",
                    "external_data"
                  ]
                }
              }
            },
            "then": {
              "not": {
                "required": [
                  "identity"
                ]
              }
            }
          },
          {
            "if": {
              "properties": {
                "status": {
                  "const": "active"
                },
                "kind": {
                  "enum": [
                    "agent",
                    "service"
                  ]
                }
              },
              "required": [
                "status",
                "kind"
              ]
            },
            "then": {
              "required": [
                "identity"
              ]
            }
          }
        ]
      },
      "ConnectionList": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "items",
          "nextOffset"
        ],
        "properties": {
          "items": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Connection"
            }
          },
          "nextOffset": {
            "anyOf": [
              {
                "type": "integer",
                "minimum": 0
              },
              {
                "type": "null"
              }
            ]
          }
        }
      },
      "Owner": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "type",
          "id"
        ],
        "properties": {
          "type": {
            "enum": [
              "user",
              "space"
            ]
          },
          "id": {
            "type": "string",
            "minLength": 1,
            "maxLength": 128
          }
        }
      },
      "Identity": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "type",
          "id"
        ],
        "properties": {
          "type": {
            "enum": [
              "agent",
              "service"
            ]
          },
          "id": {
            "type": "string",
            "minLength": 1,
            "maxLength": 128
          }
        }
      },
      "CreateConnectionDraft": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "kind",
          "name"
        ],
        "properties": {
          "kind": {
            "type": "string",
            "enum": [
              "agent",
              "service",
              "event_push",
              "external_data"
            ]
          },
          "name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 120
          },
          "note": {
            "type": [
              "string",
              "null"
            ],
            "maxLength": 1000,
            "description": "Optional note; not used for authorization"
          },
          "ownerType": {
            "type": "string",
            "enum": [
              "space",
              "user"
            ],
            "default": "space",
            "description": "Own current Space or authenticated User only; not an arbitrary Owner ID"
          }
        }
      },
      "EditConnectionMetadata": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "expectedUpdatedAt"
        ],
        "anyOf": [
          {
            "required": [
              "name"
            ]
          },
          {
            "required": [
              "note"
            ]
          }
        ],
        "properties": {
          "expectedUpdatedAt": {
            "type": "string",
            "format": "date-time",
            "description": "Optimistic modification precondition from last GET"
          },
          "name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 120
          },
          "note": {
            "type": [
              "string",
              "null"
            ],
            "maxLength": 1000
          }
        }
      }
    }
  }
}
