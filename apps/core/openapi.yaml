openapi: 3.1.0
info:
  title: LifeSpace Core Kernel API
  version: 0.12.0
  description: >-
    Stable LifeSpace Core Kernel contract for Space, membership, invitations, Data Grants,
    model administration, assets and Registry-driven Creation Draft orchestration.
    Ordinary business-model routes are intentionally not declared here; each published
    Model Registry state produces an immutable Model Contract Revision (mct_<sha256>)
    containing its concrete CRUD/query/action/Capability OpenAPI and JSON Schema.
security:
  - bearerAuth: []
tags:
  - name: System
  - name: Me
  - name: Spaces
  - name: Members
  - name: Invitations
  - name: Data Grants
  - name: Creation Drafts
  - name: Model Admin
paths:
  /health:
    get:
      tags: [System]
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }
  /api/v1/status:
    get:
      tags: [System]
      operationId: getCoreStatus
      security: []
      responses:
        "200":
          description: Core Kernel runtime and schema status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusResponse" }
  /assets/spaces/{spaceId}/avatar:
    parameters:
      - $ref: "#/components/parameters/SpaceId"
    get:
      tags: [Spaces]
      operationId: getPublicSpaceAvatar
      security: []
      responses:
        "200":
          description: Current Space avatar bytes
          content:
            image/jpeg: { schema: { type: string, contentEncoding: binary } }
            image/png: { schema: { type: string, contentEncoding: binary } }
            image/webp: { schema: { type: string, contentEncoding: binary } }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/me:
    get:
      tags: [Me]
      operationId: getCurrentPrincipal
      responses:
        "200":
          description: Current verified Core principal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrincipalResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/me/spaces:
    get:
      tags: [Me, Spaces]
      operationId: listMySpaces
      responses:
        "200":
          description: Active membership Spaces for a user principal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpaceSummaryListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/spaces:
    post:
      tags: [Spaces]
      operationId: createSpace
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSpaceRequest" }
      responses:
        "201":
          description: Space created with owner membership and linked Space Person
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateSpaceResponse" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/spaces/{spaceId}:
    parameters:
      - $ref: "#/components/parameters/SpaceId"
    get:
      tags: [Spaces]
      operationId: getSpace
      responses:
        "200":
          description: Space detail and the current membership/grant access source
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpaceResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Spaces]
      operationId: updateSpace
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateSpaceRequest" }
      responses:
        "200":
          description: Updated Space
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpaceResponse" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/spaces/{spaceId}/avatar:
    parameters:
      - $ref: "#/components/parameters/SpaceId"
    put:
      tags: [Spaces]
      operationId: replaceSpaceAvatar
      description: Replace the Space avatar under Space optimistic concurrency. Requires spaces:manage.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file, version]
              properties:
                file: { type: string, contentEncoding: binary }
                version: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Space avatar replaced
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpaceAvatarResponse" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { description: Avatar is larger than the configured maximum }
        "415": { description: Unsupported avatar content type }
  /api/v1/spaces/{spaceId}/members:
    parameters:
      - $ref: "#/components/parameters/SpaceId"
    get:
      tags: [Members]
      operationId: listSpaceMembers
      responses:
        "200":
          description: Active memberships and linked Space People
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Members]
      operationId: addSpaceMember
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddMemberRequest" }
      responses:
        "201":
          description: Membership and linked Space Person created or reactivated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberResponse" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/spaces/{spaceId}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/SpaceId"
      - $ref: "#/components/parameters/UserId"
    patch:
      tags: [Members]
      operationId: updateSpaceMemberRole
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateMemberRequest" }
      responses:
        "200":
          description: Membership role updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberResponse" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Members]
      operationId: removeSpaceMember
      responses:
        "204": { description: Membership and linked Space Person deactivated }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/spaces/{spaceId}/leave:
    parameters:
      - $ref: "#/components/parameters/SpaceId"
    post:
      tags: [Members]
      operationId: leaveSpace
      responses:
        "204": { description: Current membership and linked Space Person deactivated }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/spaces/{spaceId}/invites:
    parameters:
      - $ref: "#/components/parameters/SpaceId"
    get:
      tags: [Invitations]
      operationId: listSpaceInvites
      responses:
        "200":
          description: Space invitations without plaintext tokens
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InviteListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Invitations]
      operationId: createSpaceInvite
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateInviteRequest" }
      responses:
        "201":
          description: Invitation created; plaintext token is returned once only
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateInviteResponse" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/spaces/{spaceId}/invites/{inviteId}/revoke:
    parameters:
      - $ref: "#/components/parameters/SpaceId"
      - $ref: "#/components/parameters/InviteId"
    post:
      tags: [Invitations]
      operationId: revokeSpaceInvite
      responses:
        "204": { description: Invitation revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/space-invites/{token}:
    parameters:
      - $ref: "#/components/parameters/InviteToken"
    get:
      tags: [Invitations]
      operationId: previewSpaceInvite
      responses:
        "200":
          description: Limited authenticated invitation preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitePreviewResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/space-invites/{token}/join:
    parameters:
      - $ref: "#/components/parameters/InviteToken"
    post:
      tags: [Invitations]
      operationId: joinSpaceByInvite
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JoinInviteRequest" }
      responses:
        "201":
          description: Membership and linked Space Person atomically activated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JoinInviteResponse" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/spaces/{spaceId}/grants:
    parameters:
      - $ref: "#/components/parameters/SpaceId"
    get:
      tags: [Data Grants]
      operationId: listDataGrants
      parameters:
        - name: includeRevoked
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Space-level Data Grants
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataGrantListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Data Grants]
      operationId: createDataGrant
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateDataGrantRequest" }
      responses:
        "201":
          description: Space-level Data Grant created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataGrantResponse" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/spaces/{spaceId}/grants/{grantId}:
    parameters:
      - $ref: "#/components/parameters/SpaceId"
      - $ref: "#/components/parameters/GrantId"
    patch:
      tags: [Data Grants]
      operationId: updateDataGrant
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateDataGrantRequest" }
      responses:
        "200":
          description: Data Grant updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataGrantResponse" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Data Grants]
      operationId: revokeDataGrant
      responses:
        "204": { description: Data Grant revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/spaces/{spaceId}/creation-drafts:
    parameters:
      - $ref: "#/components/parameters/SpaceId"
    post:
      tags: [Creation Drafts]
      operationId: createCreationDraft
      description: >-
        Queue Registry-driven AI interpretation for an active user Space member.
        The job binds the requesting application and active immutable Model Contract Revision;
        only currently writable Application x Model catalog entries are offered to the model.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCreationDraftRequest" }
      responses:
        "202":
          description: Creation Draft queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreationDraftProcessingResponse" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { description: AI creation rate limit reached }
  /api/v1/spaces/{spaceId}/creation-drafts/{draftId}:
    parameters:
      - $ref: "#/components/parameters/SpaceId"
      - $ref: "#/components/parameters/DraftId"
    get:
      tags: [Creation Drafts]
      operationId: getCreationDraft
      responses:
        "200":
          description: Current Creation Draft state/result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreationDraftResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/spaces/{spaceId}/creation-drafts/{draftId}/choose-model:
    parameters:
      - $ref: "#/components/parameters/SpaceId"
      - $ref: "#/components/parameters/DraftId"
    post:
      tags: [Creation Drafts]
      operationId: chooseCreationDraftModel
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChooseCreationDraftModelRequest" }
      responses:
        "202":
          description: Chosen model requeued for interpretation against the pinned Model Contract Revision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreationDraftProcessingResponse" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/model-admin/models:
    get:
      tags: [Model Admin]
      operationId: listPublishedModels
      description: Service-principal-only model administration. Requires models:manage.
      responses:
        "200":
          description: Published Model Registry entries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublishedModelListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Model Admin]
      operationId: publishModelDefinition
      description: Service-principal-only validated publication. Successful mutation atomically activates a new Model Contract Revision.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublishModelRequest" }
      responses:
        "201":
          description: Model version published
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublishedModelResponse" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/model-admin/models/validate:
    post:
      tags: [Model Admin]
      operationId: validateModelDefinition
      description: Service-principal-only validation without publication.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ValidateModelRequest" }
      responses:
        "200":
          description: Validation result and deterministic schema hash when valid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelValidationResponse" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/model-admin/models/{modelKey}:
    parameters:
      - $ref: "#/components/parameters/ModelKey"
    get:
      tags: [Model Admin]
      operationId: getPublishedModel
      description: Service-principal-only model administration. Requires models:manage.
      responses:
        "200":
          description: Current published model version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublishedModelResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/model-admin/models/{modelKey}/retire:
    parameters:
      - $ref: "#/components/parameters/ModelKey"
    post:
      tags: [Model Admin]
      operationId: retirePublishedModel
      description: Service-principal-only explicit retirement; version history and immutable contract evidence are retained.
      responses:
        "204": { description: Model retired and active Model Contract Revision changed atomically }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/model-admin/contracts/active:
    get:
      tags: [Model Admin]
      operationId: getActiveModelContract
      description: Service-principal-only current immutable Model Contract Revision.
      responses:
        "200":
          description: Active Model Contract Revision and Registry revision pointer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActiveModelContractResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/model-admin/contracts/{contractId}:
    parameters:
      - $ref: "#/components/parameters/ContractId"
    get:
      tags: [Model Admin]
      operationId: getModelContractRevision
      description: Service-principal-only read of an immutable historical Model Contract Revision.
      responses:
        "200":
          description: Immutable Model Contract Revision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelContractResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT or lsp_pat_
  parameters:
    SpaceId:
      name: spaceId
      in: path
      required: true
      schema: { type: string, pattern: "^spc_" }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, pattern: "^usr_" }
    InviteId:
      name: inviteId
      in: path
      required: true
      schema: { type: string, pattern: "^inv_" }
    InviteToken:
      name: token
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    GrantId:
      name: grantId
      in: path
      required: true
      schema: { type: string, pattern: "^grt_" }
    DraftId:
      name: draftId
      in: path
      required: true
      schema: { type: string, pattern: "^drf_" }
    ModelKey:
      name: modelKey
      in: path
      required: true
      schema: { type: string, pattern: "^[a-z][a-z0-9_]{1,62}$" }
    ContractId:
      name: contractId
      in: path
      required: true
      schema: { type: string, pattern: "^mct_[a-f0-9]{64}$" }
  responses:
    InvalidRequest:
      description: Invalid request shape
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Unauthorized:
      description: Authentication failed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Forbidden:
      description: Scope, Space permission, principal type or model-admin boundary denied access
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Conflict:
      description: Optimistic concurrency, state or Registry mutation conflict
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
  schemas:
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, requestId]
          properties:
            code: { type: string }
            message: { type: string }
            requestId: { type: string }
    HealthResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [status]
          properties:
            status: { const: ok }
    StatusResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [status, service, environment, database, schemaVersion, contractVersion]
          properties:
            status: { const: ok }
            service: { const: core }
            environment: { type: string }
            database: { const: available }
            schemaVersion: { type: string }
            contractVersion: { const: 0.12.0 }
    PrincipalType:
      type: string
      enum: [user, service, device]
    Principal:
      type: object
      additionalProperties: false
      required: [type, id, clientId, scopes, tokenId]
      properties:
        type: { $ref: "#/components/schemas/PrincipalType" }
        id: { type: string }
        clientId: { type: string }
        scopes:
          type: array
          items: { type: string }
          uniqueItems: true
        tokenId: { type: string }
    PrincipalResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [principal]
          properties:
            principal: { $ref: "#/components/schemas/Principal" }
    SpaceKind:
      type: string
      enum: [personal, family, team]
    SpaceRole:
      type: string
      enum: [owner, admin, editor, viewer]
    SpacePermissionSource:
      type: string
      enum: [owner, admin, editor, viewer, grant]
    IanaTimezone:
      type: string
      x-lifespace-format: iana-timezone
    Space:
      type: object
      additionalProperties: false
      required: [id, kind, name, timezone, avatarUrl, version]
      properties:
        id: { type: string, pattern: "^spc_" }
        kind: { $ref: "#/components/schemas/SpaceKind" }
        name: { type: string, minLength: 1, maxLength: 100 }
        timezone: { $ref: "#/components/schemas/IanaTimezone" }
        avatarUrl: { anyOf: [{ type: string, format: uri }, { type: "null" }] }
        version: { type: integer, minimum: 1 }
    SpaceSummary:
      allOf:
        - $ref: "#/components/schemas/Space"
        - type: object
          required: [role]
          properties:
            role: { $ref: "#/components/schemas/SpaceRole" }
    SpaceSummaryListResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/SpaceSummary" }
    CreateSpaceRequest:
      type: object
      additionalProperties: false
      required: [kind, name, ownerDisplayName]
      properties:
        kind: { $ref: "#/components/schemas/SpaceKind" }
        name: { type: string, minLength: 1, maxLength: 100 }
        ownerDisplayName: { type: string, minLength: 1, maxLength: 100 }
        timezone:
          allOf: [{ $ref: "#/components/schemas/IanaTimezone" }]
          default: UTC
    CreateSpaceResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          allOf:
            - $ref: "#/components/schemas/Space"
            - type: object
              required: [role, ownerPersonId]
              properties:
                role: { const: owner }
                ownerPersonId: { type: string, pattern: "^per_" }
    SpaceResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          allOf:
            - $ref: "#/components/schemas/Space"
            - type: object
              properties:
                access: { $ref: "#/components/schemas/SpacePermissionSource" }
    UpdateSpaceRequest:
      type: object
      additionalProperties: false
      minProperties: 2
      required: [version]
      properties:
        version: { type: integer, minimum: 1 }
        name: { type: string, minLength: 1, maxLength: 100 }
        timezone: { $ref: "#/components/schemas/IanaTimezone" }
    SpaceAvatarResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [avatarUrl, version]
          properties:
            avatarUrl: { type: string, format: uri }
            version: { type: integer, minimum: 2 }
    Member:
      type: object
      additionalProperties: false
      required: [id, userId, role, version]
      properties:
        id: { type: string, pattern: "^mem_" }
        userId: { type: string }
        personId: { type: string, pattern: "^per_" }
        displayName: { type: string }
        role: { $ref: "#/components/schemas/SpaceRole" }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
    MemberResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/Member" }
    MemberListResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Member" }
    AddMemberRequest:
      type: object
      additionalProperties: false
      required: [userId, role, displayName]
      properties:
        userId: { type: string, minLength: 1, maxLength: 200 }
        role:
          type: string
          enum: [admin, editor, viewer]
        displayName: { type: string, minLength: 1, maxLength: 100 }
    UpdateMemberRequest:
      type: object
      additionalProperties: false
      required: [role, version]
      properties:
        role:
          type: string
          enum: [admin, editor, viewer]
        version: { type: integer, minimum: 1 }
    InviteStatus:
      type: string
      enum: [active, expired, exhausted, revoked]
    Invite:
      type: object
      additionalProperties: false
      required: [id, role, status, expiresAt, maxUses, usedCount, createdByUserId, createdAt]
      properties:
        id: { type: string, pattern: "^inv_" }
        tokenPrefix: { type: string }
        role:
          type: string
          enum: [admin, editor, viewer]
        status: { $ref: "#/components/schemas/InviteStatus" }
        expiresAt: { type: string, format: date-time }
        maxUses: { type: integer, minimum: 1 }
        usedCount: { type: integer, minimum: 0 }
        createdByUserId: { type: string }
        createdAt: { type: string, format: date-time }
    CreateInviteRequest:
      type: object
      additionalProperties: false
      properties:
        role:
          type: string
          enum: [admin, editor, viewer]
          default: editor
        expiresInMinutes: { type: integer, minimum: 1, maximum: 43200, default: 1440 }
        maxUses: { type: integer, minimum: 1, default: 1 }
    CreateInviteResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          allOf:
            - $ref: "#/components/schemas/Invite"
            - type: object
              required: [token]
              properties:
                token: { type: string, writeOnly: true }
    InviteListResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Invite" }
    InvitePreviewResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [space, role, expiresAt, canJoin]
          properties:
            space:
              type: object
              additionalProperties: false
              required: [id, name, kind, timezone, memberCount]
              properties:
                id: { type: string, pattern: "^spc_" }
                name: { type: string }
                kind: { $ref: "#/components/schemas/SpaceKind" }
                timezone: { $ref: "#/components/schemas/IanaTimezone" }
                memberCount: { type: integer, minimum: 0 }
            role:
              type: string
              enum: [admin, editor, viewer]
            expiresAt: { type: string, format: date-time }
            canJoin: { type: boolean }
    JoinInviteRequest:
      type: object
      additionalProperties: false
      required: [displayName]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 100 }
    JoinInviteResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [spaceId, role, personId, joinedAt]
          properties:
            spaceId: { type: string, pattern: "^spc_" }
            role:
              type: string
              enum: [admin, editor, viewer]
            personId: { type: string, pattern: "^per_" }
            joinedAt: { type: string, format: date-time }
    GrantPermission:
      type: string
      enum: [free_busy, read, write, manage]
    GranteeType:
      type: string
      enum: [user, space, service, device]
    DataGrant:
      type: object
      additionalProperties: false
      required: [id, sourceSpaceId, granteeType, granteeId, permission]
      properties:
        id: { type: string, pattern: "^grt_" }
        sourceSpaceId: { type: string, pattern: "^spc_" }
        granteeType: { $ref: "#/components/schemas/GranteeType" }
        granteeId: { type: string }
        resourceType: { const: space }
        resourceId: { type: "null" }
        permission: { $ref: "#/components/schemas/GrantPermission" }
        createdByUserId: { type: string }
        createdAt: { type: string, format: date-time }
        expiresAt: { anyOf: [{ type: string, format: date-time }, { type: "null" }] }
        revokedAt: { anyOf: [{ type: string, format: date-time }, { type: "null" }] }
    CreateDataGrantRequest:
      type: object
      additionalProperties: false
      required: [granteeType, granteeId, permission]
      properties:
        granteeType: { $ref: "#/components/schemas/GranteeType" }
        granteeId: { type: string, minLength: 1 }
        permission: { $ref: "#/components/schemas/GrantPermission" }
        expiresAt: { anyOf: [{ type: string, format: date-time }, { type: "null" }] }
    UpdateDataGrantRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        permission: { $ref: "#/components/schemas/GrantPermission" }
        expiresAt: { anyOf: [{ type: string, format: date-time }, { type: "null" }] }
    DataGrantResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/DataGrant" }
    DataGrantListResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/DataGrant" }
    CreateCreationDraftRequest:
      type: object
      additionalProperties: false
      required: [text, viewingTimezone]
      properties:
        text: { type: string, minLength: 1, maxLength: 5000 }
        viewingTimezone: { $ref: "#/components/schemas/IanaTimezone" }
    ChooseCreationDraftModelRequest:
      type: object
      additionalProperties: false
      required: [targetModelKey]
      properties:
        targetModelKey: { type: string, pattern: "^[a-z][a-z0-9_]{1,62}$" }
    CreationDraftProcessing:
      type: object
      additionalProperties: false
      required: [draftId, status, expiresAt, modelContractRevision]
      properties:
        draftId: { type: string, pattern: "^drf_" }
        status: { const: processing }
        expiresAt: { type: string, format: date-time }
        modelContractRevision: { type: string, pattern: "^mct_[a-f0-9]{64}$" }
    CreationDraftProcessingResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/CreationDraftProcessing" }
    DraftWarning:
      type: object
      additionalProperties: false
      required: [code, field, message]
      properties:
        code:
          type: string
          enum: [AMBIGUOUS_PERSON, UNRESOLVED_PERSON, INVALID_INFERRED_VALUE, UNSUPPORTED_DETAIL]
        field: { anyOf: [{ type: string }, { type: "null" }] }
        message: { type: string }
    CreationDraftResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          oneOf:
            - $ref: "#/components/schemas/CreationDraftProcessing"
            - type: object
              additionalProperties: false
              required: [draftId, status, expiresAt, modelContractRevision, candidateModels]
              properties:
                draftId: { type: string, pattern: "^drf_" }
                status: { const: choose_model }
                expiresAt: { type: string, format: date-time }
                modelContractRevision: { type: string, pattern: "^mct_[a-f0-9]{64}$" }
                candidateModels:
                  type: array
                  minItems: 2
                  uniqueItems: true
                  items: { type: string }
            - type: object
              additionalProperties: false
              required: [draftId, status, expiresAt, modelContractRevision, modelKey, modelVersion, draft, missingFields, warnings]
              properties:
                draftId: { type: string, pattern: "^drf_" }
                status: { const: ready }
                expiresAt: { type: string, format: date-time }
                modelContractRevision: { type: string, pattern: "^mct_[a-f0-9]{64}$" }
                modelKey: { type: string }
                modelVersion: { type: integer, minimum: 1 }
                draft: { type: object, additionalProperties: true }
                missingFields:
                  type: array
                  uniqueItems: true
                  items: { type: string }
                warnings:
                  type: array
                  items: { $ref: "#/components/schemas/DraftWarning" }
            - type: object
              additionalProperties: false
              required: [draftId, status, expiresAt, modelContractRevision, error]
              properties:
                draftId: { type: string, pattern: "^drf_" }
                status: { const: failed }
                expiresAt: { type: string, format: date-time }
                modelContractRevision: { type: string, pattern: "^mct_[a-f0-9]{64}$" }
                error:
                  type: object
                  additionalProperties: false
                  required: [code]
                  properties:
                    code: { type: string }
    ModelCompatibility:
      type: string
      enum: [initial, compatible, breaking]
    ModelDefinition:
      type: object
      description: >-
        Closed declarative Model Definition v1 validated by Core. The full shape is governed
        by the Model Definition validator and generated model-contract schemas; arbitrary
        executable code, SQL or shell fragments are not supported.
      additionalProperties: true
    PublishedModel:
      type: object
      additionalProperties: false
      required: [id, key, route, version, state, schemaHash, compatibility, definition, publishedAt]
      properties:
        id: { type: string, pattern: "^mdl_" }
        key: { type: string }
        route: { type: string }
        version: { type: integer, minimum: 1 }
        state: { const: published }
        schemaHash: { type: string, pattern: "^[a-f0-9]{64}$" }
        compatibility: { $ref: "#/components/schemas/ModelCompatibility" }
        definition: { $ref: "#/components/schemas/ModelDefinition" }
        publishedAt: { type: string, format: date-time }
    PublishedModelResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/PublishedModel" }
    PublishedModelListResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/PublishedModel" }
    ValidateModelRequest:
      type: object
      additionalProperties: false
      required: [definition]
      properties:
        definition: { $ref: "#/components/schemas/ModelDefinition" }
    PublishModelRequest:
      type: object
      additionalProperties: false
      required: [definition, compatibility]
      properties:
        definition: { $ref: "#/components/schemas/ModelDefinition" }
        compatibility: { $ref: "#/components/schemas/ModelCompatibility" }
    ModelValidationIssue:
      type: object
      additionalProperties: false
      required: [path, code, message]
      properties:
        path: { type: string }
        code: { type: string }
        message: { type: string }
    ModelValidationResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          oneOf:
            - type: object
              additionalProperties: false
              required: [valid, definition, schemaHash]
              properties:
                valid: { const: true }
                definition: { $ref: "#/components/schemas/ModelDefinition" }
                schemaHash: { type: string, pattern: "^[a-f0-9]{64}$" }
            - type: object
              additionalProperties: false
              required: [valid, issues]
              properties:
                valid: { const: false }
                issues:
                  type: array
                  items: { $ref: "#/components/schemas/ModelValidationIssue" }
    ModelContractManifestEntry:
      type: object
      additionalProperties: false
      required: [key, route, version, schemaHash]
      properties:
        key: { type: string }
        route: { type: string }
        version: { type: integer, minimum: 1 }
        schemaHash: { type: string, pattern: "^[a-f0-9]{64}$" }
    ModelContract:
      type: object
      additionalProperties: false
      required: [id, hash, manifest, openapi, jsonSchema, createdBy, createdAt]
      properties:
        id: { type: string, pattern: "^mct_[a-f0-9]{64}$" }
        hash: { type: string, pattern: "^[a-f0-9]{64}$" }
        manifest:
          type: object
          additionalProperties: false
          required: [kind, models]
          properties:
            kind: { const: lifespace-model-contract }
            models:
              type: array
              items: { $ref: "#/components/schemas/ModelContractManifestEntry" }
        openapi: { type: object, additionalProperties: true }
        jsonSchema: { type: object, additionalProperties: true }
        createdBy:
          type: object
          additionalProperties: false
          required: [type, id, displayName]
          properties:
            type: { $ref: "#/components/schemas/PrincipalType" }
            id: { type: string }
            displayName: { type: string }
        createdAt: { type: string, format: date-time }
    ModelContractResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/ModelContract" }
    ActiveModelContractResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          allOf:
            - $ref: "#/components/schemas/ModelContract"
            - type: object
              required: [registryRevision]
              properties:
                registryRevision: { type: integer, minimum: 0 }
