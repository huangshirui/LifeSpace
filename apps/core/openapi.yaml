openapi: 3.1.0
info:
  title: LifeSpace Core API
  version: 0.4.0
  description: Space ownership, membership, invitations, Data Grants, Space-owned events and attendees, and temporary HomeMew compatibility facades.
security:
  - bearerAuth: []
tags:
  - name: System
  - name: Me
  - name: Spaces
  - name: Members
  - name: Invitations
  - name: Events
  - name: Data Grants
  - name: HomeMew compatibility
paths:
  /health:
    get:
      tags: [System]
      operationId: getHealth
      security: []
      responses:
        '200': { description: Healthy, content: { application/json: { schema: { $ref: '#/components/schemas/HealthResponse' } } } }
  /api/v1/status:
    get:
      tags: [System]
      operationId: getStatus
      security: []
      responses:
        '200': { description: Core and D1 status, content: { application/json: { schema: { $ref: '#/components/schemas/StatusResponse' } } } }
  /api/v1/me:
    get:
      tags: [Me]
      operationId: getCurrentPrincipal
      responses:
        '200': { description: Current verified principal, content: { application/json: { schema: { $ref: '#/components/schemas/PrincipalResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/me/spaces:
    get:
      tags: [Me, Spaces]
      operationId: listMySpaces
      responses:
        '200': { description: Active membership Spaces, content: { application/json: { schema: { $ref: '#/components/schemas/SpaceSummaryListResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/spaces:
    post:
      tags: [Spaces]
      operationId: createSpace
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateSpaceRequest' } } }
      responses:
        '201': { description: Space created with owner membership and linked Space Person, content: { application/json: { schema: { $ref: '#/components/schemas/CreateSpaceResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/spaces/{spaceId}:
    parameters: [{ $ref: '#/components/parameters/SpaceId' }]
    get:
      tags: [Spaces]
      operationId: getSpace
      responses:
        '200': { description: Space and caller access, content: { application/json: { schema: { $ref: '#/components/schemas/SpaceResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Spaces]
      operationId: updateSpace
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateSpaceRequest' } } }
      responses:
        '200': { description: Updated Space, content: { application/json: { schema: { $ref: '#/components/schemas/SpaceResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/spaces/{spaceId}/members:
    parameters: [{ $ref: '#/components/parameters/SpaceId' }]
    get:
      tags: [Members]
      operationId: listSpaceMembers
      responses:
        '200': { description: Active memberships and linked Space People, content: { application/json: { schema: { $ref: '#/components/schemas/MemberListResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Members]
      operationId: addSpaceMember
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AddMemberRequest' } } }
      responses:
        '201': { description: Membership and linked Space Person created or reactivated, content: { application/json: { schema: { $ref: '#/components/schemas/MemberResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/spaces/{spaceId}/members/{userId}:
    parameters:
      - { $ref: '#/components/parameters/SpaceId' }
      - { $ref: '#/components/parameters/UserId' }
    patch:
      tags: [Members]
      operationId: updateSpaceMemberRole
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateMemberRequest' } } }
      responses:
        '200': { description: Membership role updated, content: { application/json: { schema: { $ref: '#/components/schemas/MemberResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Members]
      operationId: removeSpaceMember
      responses:
        '204': { description: Membership and linked Space Person deactivated }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/spaces/{spaceId}/leave:
    parameters: [{ $ref: '#/components/parameters/SpaceId' }]
    post:
      tags: [Members]
      operationId: leaveSpace
      responses:
        '204': { description: Current user membership and linked Space Person deactivated }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/spaces/{spaceId}/invites:
    parameters: [{ $ref: '#/components/parameters/SpaceId' }]
    get:
      tags: [Invitations]
      operationId: listSpaceInvites
      responses:
        '200': { description: Space invitations without plaintext tokens, content: { application/json: { schema: { $ref: '#/components/schemas/InviteListResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Invitations]
      operationId: createSpaceInvite
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateInviteRequest' } } }
      responses:
        '201': { description: Invitation created; plaintext token is returned once, content: { application/json: { schema: { $ref: '#/components/schemas/CreateInviteResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/spaces/{spaceId}/invites/{inviteId}/revoke:
    parameters:
      - { $ref: '#/components/parameters/SpaceId' }
      - { $ref: '#/components/parameters/InviteId' }
    post:
      tags: [Invitations]
      operationId: revokeSpaceInvite
      responses:
        '204': { description: Invitation revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/space-invites/{token}:
    parameters: [{ $ref: '#/components/parameters/InviteToken' }]
    get:
      tags: [Invitations]
      operationId: previewSpaceInvite
      responses:
        '200': { description: Limited authenticated invitation preview, content: { application/json: { schema: { $ref: '#/components/schemas/InvitePreviewResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/space-invites/{token}/join:
    parameters: [{ $ref: '#/components/parameters/InviteToken' }]
    post:
      tags: [Invitations]
      operationId: joinSpaceByInvite
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/JoinInviteRequest' } } }
      responses:
        '201': { description: Membership and linked Space Person atomically activated, content: { application/json: { schema: { $ref: '#/components/schemas/JoinInviteResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/me/families:
    get:
      tags: [HomeMew compatibility]
      operationId: listMyFamiliesCompat
      description: Temporary HomeMew-app-only response over mapped family Spaces. Avatar values remain null until the R2 slice.
      responses:
        '200': { description: Legacy family list, content: { application/json: { schema: { $ref: '#/components/schemas/LegacyFamilyListResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/families:
    post:
      tags: [HomeMew compatibility]
      operationId: createFamilyCompat
      description: Creates one family Space and its legacy fam_* mapping atomically. The HomeMew three-created-family limit applies only here.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LegacyCreateFamilyRequest' } } } }
      responses:
        '201': { description: Legacy family response, content: { application/json: { schema: { $ref: '#/components/schemas/LegacyCreateFamilyResponse' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/families/{familyId}:
    parameters: [{ $ref: '#/components/parameters/LegacyFamilyId' }]
    get:
      tags: [HomeMew compatibility]
      operationId: getFamilyCompat
      responses:
        '200': { description: Legacy family detail, content: { application/json: { schema: { $ref: '#/components/schemas/LegacyFamilyDetailResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [HomeMew compatibility]
      operationId: updateFamilyCompat
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LegacyUpdateFamilyRequest' } } } }
      responses:
        '200': { description: Legacy family summary, content: { application/json: { schema: { $ref: '#/components/schemas/LegacyFamilySummaryResponse' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/families/{familyId}/members:
    parameters: [{ $ref: '#/components/parameters/LegacyFamilyId' }]
    get:
      tags: [HomeMew compatibility]
      operationId: listFamilyMembersCompat
      responses:
        '200': { description: Legacy member list, content: { application/json: { schema: { $ref: '#/components/schemas/LegacyMemberListResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/families/{familyId}/members/{userId}:
    parameters: [{ $ref: '#/components/parameters/LegacyFamilyId' }, { $ref: '#/components/parameters/LegacyUserId' }]
    patch:
      tags: [HomeMew compatibility]
      operationId: updateFamilyMemberRoleCompat
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LegacyUpdateMemberRoleRequest' } } } }
      responses:
        '200': { description: Legacy role response, content: { application/json: { schema: { $ref: '#/components/schemas/LegacyUpdateMemberRoleResponse' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [HomeMew compatibility]
      operationId: removeFamilyMemberCompat
      responses:
        '204': { description: Member and linked Space Person deactivated }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/families/{familyId}/leave:
    parameters: [{ $ref: '#/components/parameters/LegacyFamilyId' }]
    post:
      tags: [HomeMew compatibility]
      operationId: leaveFamilyCompat
      responses:
        '204': { description: Current member and linked Space Person deactivated }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/families/{familyId}/invites:
    parameters: [{ $ref: '#/components/parameters/LegacyFamilyId' }]
    get:
      tags: [HomeMew compatibility]
      operationId: listFamilyInvitesCompat
      responses:
        '200': { description: Legacy invite list without plaintext codes, content: { application/json: { schema: { $ref: '#/components/schemas/LegacyInviteListResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [HomeMew compatibility]
      operationId: createFamilyInviteCompat
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LegacyCreateInviteRequest' } } } }
      responses:
        '201': { description: Plaintext code returned once, content: { application/json: { schema: { $ref: '#/components/schemas/LegacyCreateInviteResponse' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/families/{familyId}/invites/{inviteId}/revoke:
    parameters: [{ $ref: '#/components/parameters/LegacyFamilyId' }, { $ref: '#/components/parameters/InviteId' }]
    post:
      tags: [HomeMew compatibility]
      operationId: revokeFamilyInviteCompat
      responses:
        '204': { description: Invitation revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/family-invites/{code}:
    parameters: [{ $ref: '#/components/parameters/LegacyInviteCode' }]
    get:
      tags: [HomeMew compatibility]
      operationId: previewFamilyInviteCompat
      responses:
        '200': { description: Legacy invite preview, content: { application/json: { schema: { $ref: '#/components/schemas/LegacyInvitePreviewResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/family-invites/{code}/join:
    parameters: [{ $ref: '#/components/parameters/LegacyInviteCode' }]
    post:
      tags: [HomeMew compatibility]
      operationId: joinFamilyByInviteCompat
      responses:
        '200': { description: Membership and linked Space Person created or reactivated, content: { application/json: { schema: { $ref: '#/components/schemas/LegacyJoinFamilyResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/spaces/{spaceId}/events:
    parameters: [{ $ref: '#/components/parameters/SpaceId' }]
    get:
      tags: [Events]
      operationId: listSpaceEvents
      summary: List Space events overlapping a date window
      parameters:
        - { name: startDate, in: query, required: true, schema: { type: string, format: date } }
        - { name: endDateExclusive, in: query, required: true, schema: { type: string, format: date } }
        - { name: timezone, in: query, schema: { $ref: '#/components/schemas/IanaTimezone' } }
        - { name: attendeePersonId, in: query, schema: { type: string, description: Space Person ID or me } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/EventStatus', default: active } }
        - { name: q, in: query, schema: { type: string, minLength: 1, maxLength: 100 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200': { description: Event page, content: { application/json: { schema: { $ref: '#/components/schemas/EventListResponse' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Events]
      operationId: createSpaceEvent
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateEventRequest' } } } }
      responses:
        '201': { description: Event created, content: { application/json: { schema: { $ref: '#/components/schemas/EventResponse' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/spaces/{spaceId}/events/{eventId}:
    parameters: [{ $ref: '#/components/parameters/SpaceId' }, { $ref: '#/components/parameters/EventId' }]
    get:
      tags: [Events]
      operationId: getSpaceEvent
      responses:
        '200': { description: Event detail, content: { application/json: { schema: { $ref: '#/components/schemas/EventResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Events]
      operationId: updateSpaceEvent
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateEventRequest' } } } }
      responses:
        '200': { description: Event updated, content: { application/json: { schema: { $ref: '#/components/schemas/EventResponse' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Events]
      operationId: deleteSpaceEvent
      parameters: [{ name: version, in: query, required: true, schema: { type: integer, minimum: 1 } }]
      responses:
        '204': { description: Event soft-deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/families/{familyId}/events:
    parameters: [{ $ref: '#/components/parameters/LegacyFamilyId' }]
    get:
      tags: [Events, HomeMew compatibility]
      operationId: listFamilyEventsCompat
      description: Temporary HomeMew response over native Space events and attendee Space People.
      parameters:
        - { name: startDate, in: query, required: true, schema: { type: string, format: date } }
        - { name: endDateExclusive, in: query, required: true, schema: { type: string, format: date } }
        - { name: timezone, in: query, schema: { $ref: '#/components/schemas/IanaTimezone' } }
        - { name: attendeeId, in: query, schema: { type: string, description: Legacy HomeMew user ID or me } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/EventStatus', default: active } }
        - { name: q, in: query, schema: { type: string, minLength: 1, maxLength: 100 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200': { description: Legacy event page, content: { application/json: { schema: { $ref: '#/components/schemas/LegacyEventListResponse' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Events, HomeMew compatibility]
      operationId: createFamilyEventCompat
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LegacyCreateEventRequest' } } } }
      responses:
        '201': { description: Legacy event created, content: { application/json: { schema: { $ref: '#/components/schemas/LegacyEventResponse' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/families/{familyId}/events/{eventId}:
    parameters: [{ $ref: '#/components/parameters/LegacyFamilyId' }, { $ref: '#/components/parameters/EventId' }]
    get:
      tags: [Events, HomeMew compatibility]
      operationId: getFamilyEventCompat
      responses:
        '200': { description: Legacy event detail, content: { application/json: { schema: { $ref: '#/components/schemas/LegacyEventResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Events, HomeMew compatibility]
      operationId: updateFamilyEventCompat
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LegacyUpdateEventRequest' } } } }
      responses:
        '200': { description: Legacy event updated, content: { application/json: { schema: { $ref: '#/components/schemas/LegacyEventResponse' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Events, HomeMew compatibility]
      operationId: deleteFamilyEventCompat
      parameters: [{ name: version, in: query, required: true, schema: { type: integer, minimum: 1 } }]
      responses:
        '204': { description: Event soft-deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/spaces/{spaceId}/grants:
    parameters: [{ $ref: '#/components/parameters/SpaceId' }]
    post:
      tags: [Data Grants]
      operationId: createDataGrant
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateGrantRequest' } } }
      responses:
        '201': { description: Data Grant created }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    SpaceId: { name: spaceId, in: path, required: true, schema: { type: string, pattern: '^spc_' } }
    UserId: { name: userId, in: path, required: true, schema: { type: string, pattern: '^usr_' } }
    InviteId: { name: inviteId, in: path, required: true, schema: { type: string, pattern: '^inv_' } }
    InviteToken: { name: token, in: path, required: true, schema: { type: string, minLength: 10, maxLength: 100 } }
    EventId: { name: eventId, in: path, required: true, schema: { type: string, pattern: '^evt_' } }
    LegacyFamilyId: { name: familyId, in: path, required: true, schema: { type: string, pattern: '^fam_' } }
    LegacyUserId: { name: userId, in: path, required: true, schema: { type: string, pattern: '^usr_' } }
