{"openapi":"3.1.0","info":{"title":"LifeSpace Core Kernel API","version":"0.54.0","description":"Stable LifeSpace Core Kernel contract for Space, membership, invitations, Data Grants, single-scope Principal/Actor Delegations with bounded parent chains, governed Change History with ChangeSet correlation and exact version-bound detail, authorized Runtime Discovery with bounded Capability field-role bindings, canonical structural time-range, explicit Generic Query comparison semantics, grouped Calendar viewing-window semantics plus Person/ordinary-record Reference Projection and assets. Ordinary business-model routes, including first-class Generic Runtime Batch mutation, are intentionally not declared here; each published Model Registry state produces an immutable Model Contract Revision (mct_<sha256>) containing its concrete CRUD/query/action/Batch/Capability OpenAPI and JSON Schema. Model Registry governance is owned by the separately versioned LifeSpace Core Model Control Plane contract. Integration/Eventing management and signed outbound Webhook representation are owned by the independently versioned Integration/Eventing contract. Kernel 0.43.0 adds bounded atomic multi-Delegation issuance while preserving one immutable scope per Delegation. Kernel 0.45.0 adds durable arq_* Authorization Requests for transport-independent Agent-mediated user confirmation; request creation grants no Authority and Confirm rechecks current User/Application/credential Authority before atomically approving and issuing independent Delegations. Kernel 0.47.0 adds the first-class Space Person Directory with canonical display names, bounded alternate-name lookup and incremental mutation, optimistic concurrency, governed Person changes and explicit current Space-target Delegation support for represented execution. Kernel 0.48.0 removes the experimental natural-language creation orchestration surface from Core; interpretation and product conversation orchestration belong to replaceable adapters or product agents rather than the Kernel. Kernel 0.49.0 adds application/credential-scoped configuration model discovery so generic consumers can configure model semantics without requiring current Space Membership, Data Grant or Delegation; concrete data execution remains fully runtime-authorized. Kernel 0.51.0 adds structured recurrence_rule and Person/Record entity_ref field semantics plus discoverable Recurrence field-role bindings. Ordinary Plan-to-Task execution remains defined by immutable Model Contracts. Kernel 0.54.0 adds an independently grantable Person Directory resource (`resourceType=person_directory`, `resourceId=null`), limited to read/write, without granting ordinary model or Space management Authority."},"security":[{"bearerAuth":[]}],"tags":[{"name":"System"},{"name":"Me"},{"name":"Spaces"},{"name":"Members"},{"name":"Invitations"},{"name":"Data Grants"},{"name":"Runtime Discovery"},{"name":"Authorization Requests"},{"name":"Delegations"},{"name":"Change History"},{"name":"Person Directory"},{"name":"Files","description":"LifeSpace-owned File transfer and context-authorized access."}],"paths":{"/health":{"get":{"tags":["System"],"operationId":"getHealth","security":[],"responses":{"200":{"description":"Healthy","content":{"application/json":{"schema":{"$ref":"#/components/schemas/HealthResponse"}}}}}}},"/api/v1/status":{"get":{"tags":["System"],"operationId":"getCoreStatus","security":[],"responses":{"200":{"description":"Core Kernel runtime and schema status","content":{"application/json":{"schema":{"$ref":"#/components/schemas/StatusResponse"}}}}}}},"/assets/spaces/{spaceId}/avatar":{"parameters":[{"$ref":"#/components/parameters/SpaceId"}],"get":{"tags":["Spaces"],"operationId":"getPublicSpaceAvatar","security":[],"responses":{"200":{"description":"Current Space avatar bytes","content":{"image/jpeg":{"schema":{"type":"string","contentEncoding":"binary"}},"image/png":{"schema":{"type":"string","contentEncoding":"binary"}},"image/webp":{"schema":{"type":"string","contentEncoding":"binary"}}}},"404":{"$ref":"#/components/responses/NotFound"}}}},"/api/v1/me":{"get":{"tags":["Me"],"operationId":"getCurrentPrincipal","responses":{"200":{"description":"Current verified Core principal","content":{"application/json":{"schema":{"$ref":"#/components/schemas/PrincipalResponse"}}}},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"}}}},"/api/v1/me/spaces":{"get":{"tags":["Me","Spaces"],"operationId":"listMySpaces","responses":{"200":{"description":"Active membership Spaces for a user principal","content":{"application/json":{"schema":{"$ref":"#/components/schemas/SpaceSummaryListResponse"}}}},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"}}}},"/api/v1/me/_discovery":{"get":{"tags":["Me","Runtime Discovery"],"operationId":"getCurrentPrincipalRuntimeDiscovery","description":"Returns a cross-Space current capability preview for the authenticated principal by aggregating only Spaces where at least one ordinary model is currently reachable through credential scopes, Application × Model Access, current Space membership/Data Grants, declared model access and current Delegation when applicable. Each Space entry exposes its stable spaceId plus a minimal current spaceName label and effective model metadata. The label is Runtime Context Projection only and does not grant Space-detail, membership or administration authority. Action input fields describe semantic/domain input only; optimistic-concurrency evidence is exposed separately as Action concurrency metadata. This is a capability preview, not an authorization proof; execution rechecks all current authorization, record policies, optimistic concurrency and action input validation. Standard Capability field-role bindings such as Calendar are exposed through capabilityBindings; these bindings are semantic metadata, not UI layout or mutation authority.","responses":{"200":{"description":"Cross-Space authorized runtime discovery metadata","content":{"application/json":{"schema":{"$ref":"#/components/schemas/RuntimeDiscoveryAggregateResponse"}}}},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"}}}},"/api/v1/spaces":{"post":{"tags":["Spaces"],"operationId":"createSpace","requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/CreateSpaceRequest"}}}},"responses":{"201":{"description":"Space created with owner membership and linked Space Person","content":{"application/json":{"schema":{"$ref":"#/components/schemas/CreateSpaceResponse"}}}},"400":{"$ref":"#/components/responses/InvalidRequest"},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"422":{"$ref":"#/components/responses/ValidationError"}}}},"/api/v1/spaces/{spaceId}":{"parameters":[{"$ref":"#/components/parameters/SpaceId"}],"get":{"tags":["Spaces"],"operationId":"getSpace","responses":{"200":{"description":"Space detail and the current membership/grant access source","content":{"application/json":{"schema":{"$ref":"#/components/schemas/SpaceResponse"}}}},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"}}},"patch":{"tags":["Spaces"],"operationId":"updateSpace","requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/UpdateSpaceRequest"}}}},"responses":{"200":{"description":"Updated Space","content":{"application/json":{"schema":{"$ref":"#/components/schemas/SpaceResponse"}}}},"400":{"$ref":"#/components/responses/InvalidRequest"},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"},"409":{"$ref":"#/components/responses/Conflict"},"422":{"$ref":"#/components/responses/ValidationError"}}}},"/api/v1/spaces/{spaceId}/close":{"parameters":[{"$ref":"#/components/parameters/SpaceId"}],"post":{"tags":["Spaces"],"operationId":"closeSpace","description":"Logically closes an active Space. Requires spaces:manage plus the current user membership role owner. Closing deactivates active memberships and linked Space People, revokes active invitations and all Data Grants issued by the Space, disables its Webhook/Event Subscription configuration, and retains Space-owned Shared Reality for history/retention. This is not physical deletion.","requestBody":{"required":true,"content":{"application/json":{"schema":{"type":"object","additionalProperties":false,"required":["version"],"properties":{"version":{"type":"integer","minimum":1}}}}}},"responses":{"204":{"description":"Space logically closed"},"400":{"$ref":"#/components/responses/InvalidRequest"},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"},"409":{"$ref":"#/components/responses/Conflict"},"422":{"$ref":"#/components/responses/ValidationError"}}}},"/api/v1/spaces/{spaceId}/avatar":{"parameters":[{"$ref":"#/components/parameters/SpaceId"}],"put":{"tags":["Spaces"],"operationId":"replaceSpaceAvatar","description":"Replace the Space avatar under Space optimistic concurrency. Requires spaces:manage.","requestBody":{"required":true,"content":{"multipart/form-data":{"schema":{"type":"object","additionalProperties":false,"required":["file","version"],"properties":{"file":{"type":"string","contentEncoding":"binary"},"version":{"type":"integer","minimum":1}}}}}},"responses":{"200":{"description":"Space avatar replaced","content":{"application/json":{"schema":{"$ref":"#/components/schemas/SpaceAvatarResponse"}}}},"400":{"$ref":"#/components/responses/InvalidRequest"},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"},"409":{"$ref":"#/components/responses/Conflict"},"413":{"description":"Avatar is larger than the configured maximum"},"415":{"description":"Unsupported avatar content type"}}}},"/api/v1/spaces/{spaceId}/members":{"parameters":[{"$ref":"#/components/parameters/SpaceId"}],"get":{"tags":["Members"],"operationId":"listSpaceMembers","responses":{"200":{"description":"Active memberships and linked Space People","content":{"application/json":{"schema":{"$ref":"#/components/schemas/MemberListResponse"}}}},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"}}},"post":{"tags":["Members"],"operationId":"addSpaceMember","requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/AddMemberRequest"}}}},"responses":{"201":{"description":"Membership and linked Space Person created or reactivated","content":{"application/json":{"schema":{"$ref":"#/components/schemas/MemberResponse"}}}},"400":{"$ref":"#/components/responses/InvalidRequest"},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"409":{"$ref":"#/components/responses/Conflict"},"422":{"$ref":"#/components/responses/ValidationError"}}}},"/api/v1/spaces/{spaceId}/members/{userId}":{"parameters":[{"$ref":"#/components/parameters/SpaceId"},{"$ref":"#/components/parameters/UserId"}],"patch":{"tags":["Members"],"operationId":"updateSpaceMemberRole","requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/UpdateMemberRequest"}}}},"responses":{"200":{"description":"Membership role updated","content":{"application/json":{"schema":{"$ref":"#/components/schemas/MemberResponse"}}}},"400":{"$ref":"#/components/responses/InvalidRequest"},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"},"409":{"$ref":"#/components/responses/Conflict"},"422":{"$ref":"#/components/responses/ValidationError"}}},"delete":{"tags":["Members"],"operationId":"removeSpaceMember","responses":{"204":{"description":"Membership and linked Space Person deactivated"},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"},"409":{"$ref":"#/components/responses/Conflict"}}}},"/api/v1/spaces/{spaceId}/leave":{"parameters":[{"$ref":"#/components/parameters/SpaceId"}],"post":{"tags":["Members"],"operationId":"leaveSpace","responses":{"204":{"description":"Current membership and linked Space Person deactivated"},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"409":{"$ref":"#/components/responses/Conflict"}}}},"/api/v1/spaces/{spaceId}/invites":{"parameters":[{"$ref":"#/components/parameters/SpaceId"}],"get":{"tags":["Invitations"],"operationId":"listSpaceInvites","responses":{"200":{"description":"Space invitations without plaintext tokens","content":{"application/json":{"schema":{"$ref":"#/components/schemas/InviteListResponse"}}}},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"}}},"post":{"tags":["Invitations"],"operationId":"createSpaceInvite","requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/CreateInviteRequest"}}}},"responses":{"201":{"description":"Invitation created; plaintext token is returned once only","content":{"application/json":{"schema":{"$ref":"#/components/schemas/CreateInviteResponse"}}}},"400":{"$ref":"#/components/responses/InvalidRequest"},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"422":{"$ref":"#/components/responses/ValidationError"}}}},"/api/v1/spaces/{spaceId}/invites/{inviteId}/revoke":{"parameters":[{"$ref":"#/components/parameters/SpaceId"},{"$ref":"#/components/parameters/InviteId"}],"post":{"tags":["Invitations"],"operationId":"revokeSpaceInvite","responses":{"204":{"description":"Invitation revoked"},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"}}}},"/api/v1/spaces/{spaceId}/grants":{"parameters":[{"$ref":"#/components/parameters/SpaceId"}],"get":{"tags":["Data Grants"],"operationId":"listDataGrants","description":"Lists whole-Space and model-collection Data Grants owned by this Space.","parameters":[{"name":"includeRevoked","in":"query","schema":{"type":"boolean","default":false}}],"responses":{"200":{"description":"Whole-Space and model-collection Data Grants","content":{"application/json":{"schema":{"$ref":"#/components/schemas/DataGrantListResponse"}}}},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"}}},"post":{"tags":["Data Grants"],"operationId":"createDataGrant","description":"Creates a whole-Space, model-collection, or Person Directory Data Grant. Omitting resourceType/resourceId preserves whole-Space semantics.","requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/CreateDataGrantRequest"}}}},"responses":{"201":{"description":"Whole-Space or model-collection Data Grant created","content":{"application/json":{"schema":{"$ref":"#/components/schemas/DataGrantResponse"}}}},"400":{"$ref":"#/components/responses/InvalidRequest"},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"},"422":{"$ref":"#/components/responses/ValidationError"}}}},"/api/v1/spaces/{spaceId}/grants/{grantId}":{"parameters":[{"$ref":"#/components/parameters/SpaceId"},{"$ref":"#/components/parameters/GrantId"}],"patch":{"tags":["Data Grants"],"operationId":"updateDataGrant","description":"Updates permission or expiry without changing the immutable resource target.","requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/UpdateDataGrantRequest"}}}},"responses":{"200":{"description":"Data Grant updated","content":{"application/json":{"schema":{"$ref":"#/components/schemas/DataGrantResponse"}}}},"400":{"$ref":"#/components/responses/InvalidRequest"},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"},"422":{"$ref":"#/components/responses/ValidationError"}}},"delete":{"tags":["Data Grants"],"operationId":"revokeDataGrant","responses":{"204":{"description":"Data Grant revoked"},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"}}}},"/api/v1/spaces/{spaceId}/_discovery":{"parameters":[{"$ref":"#/components/parameters/SpaceId"}],"get":{"tags":["Runtime Discovery"],"operationId":"getRuntimeDiscovery","description":"Returns bounded model, query and action metadata filtered by the authenticated principal's current credential scopes, Application × Model Access, Space membership/Data Grants and declared model access. Action input fields describe semantic/domain input only; optimistic-concurrency evidence is exposed separately as Action concurrency metadata. This is a current capability preview for dynamic clients, not an authorization proof; execution rechecks current authorization, record policies, optimistic concurrency and action input validation. When the caller currently has at least one effective model capability in the Space, data.spaceName carries the minimal current human-readable Space label; otherwise it is null so this route does not become a Space-detail side channel. Standard Capability field-role bindings such as Calendar are exposed through capabilityBindings; these bindings are semantic metadata, not UI layout or mutation authority.","responses":{"200":{"description":"Authorized runtime model discovery metadata","content":{"application/json":{"schema":{"$ref":"#/components/schemas/RuntimeDiscoveryResponse"}}}},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"}}}},"/api/v1/spaces/{spaceId}/delegations":{"parameters":[{"$ref":"#/components/parameters/SpaceId"}],"get":{"tags":["Delegations"],"operationId":"listDelegations","description":"Lists Delegations rooted in the direct Principal for this Application and source Space. Represented execution cannot use listing as Delegation discovery.","responses":{"200":{"description":"Success","content":{"application/json":{"schema":{"$ref":"#/components/schemas/DelegationListResponse"}}}},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"}}},"post":{"tags":["Delegations"],"operationId":"createDelegation","description":"Creates one immutable-scope Delegation. A direct eligible Principal creates a Root Delegation from its own current Authority. A represented Actor may create a Child only from an explicit parent that permits re-delegation; Core preserves the Root Principal and enforces strict narrowing. The requested Actor type must currently allow canReceiveDelegation. Child issuance does not consume a single-use parent.","requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/CreateDelegationRequest"}}}},"responses":{"201":{"description":"Success","content":{"application/json":{"schema":{"$ref":"#/components/schemas/DelegationResponse"}}}},"400":{"$ref":"#/components/responses/InvalidRequest"},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"}}}},"/api/v1/spaces/{spaceId}/delegations/{delegationId}":{"parameters":[{"$ref":"#/components/parameters/SpaceId"},{"name":"delegationId","in":"path","required":true,"schema":{"type":"string","pattern":"^dlg_"}}],"delete":{"tags":["Delegations"],"operationId":"revokeDelegation","description":"Revokes one active Delegation. The direct Root Principal may revoke any Delegation in its rooted chain. The immediate issuer may revoke a Child Delegation it created. Descendants are not cascade-updated; current-state chain resolution invalidates them when an ancestor is revoked.","responses":{"204":{"description":"Delegation revoked"},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"}}}},"/api/v1/spaces/{spaceId}/changes/{recordId}":{"parameters":[{"$ref":"#/components/parameters/SpaceId"},{"name":"recordId","in":"path","required":true,"schema":{"type":"string","pattern":"^rec_"}},{"$ref":"#/components/parameters/DelegationId"}],"get":{"tags":["Change History"],"operationId":"getResourceChangeHistory","description":"Deprecated Kernel 0.29 compatibility alias. Returns at most the latest 100 governed Change entries for the path recordId without pagination. New consumers must use GET /api/v1/spaces/{spaceId}/changes?recordId=... with explicit limit/cursor collection semantics. Read authority is still rechecked against the record's current published model.","responses":{"200":{"description":"Success","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ResourceChangeListResponse"}}}},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"}},"deprecated":true}},"/api/v1/space-invites/preview":{"post":{"tags":["Invitations"],"operationId":"previewSpaceInvite","responses":{"200":{"description":"Limited authenticated invitation preview","content":{"application/json":{"schema":{"$ref":"#/components/schemas/InvitePreviewResponse"}}}},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"}},"description":"Returns a limited authenticated invitation preview. The possession bearer token is supplied in the JSON request body so it is not exposed in the API URL.","requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/PreviewInviteRequest"}}}}}},"/api/v1/space-invites/join":{"post":{"tags":["Invitations"],"operationId":"joinSpaceByInvite","requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/JoinInviteRequest"}}}},"responses":{"201":{"description":"Membership and linked Space Person atomically activated","content":{"application/json":{"schema":{"$ref":"#/components/schemas/JoinInviteResponse"}}}},"400":{"$ref":"#/components/responses/InvalidRequest"},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"},"409":{"$ref":"#/components/responses/Conflict"},"422":{"$ref":"#/components/responses/ValidationError"}},"description":"Redeems an invitation and atomically activates membership plus Space Person. The possession bearer token is supplied in the JSON request body so it is not exposed in the API URL."}},"/api/v1/spaces/{spaceId}/_relation-targets/{modelKey}/{fieldKey}":{"parameters":[{"$ref":"#/components/parameters/SpaceId"},{"$ref":"#/components/parameters/ModelKey"},{"name":"fieldKey","in":"path","required":true,"schema":{"type":"string","pattern":"^[a-z][A-Za-z0-9]{0,62}$"}},{"$ref":"#/components/parameters/DelegationId"}],"get":{"tags":["Runtime Discovery"],"operationId":"listRelationTargets","description":"Returns a source-field-aware, current-authority relation target projection for generated clients. The caller must have current read authority to the source model; model-collection Data Grants are sufficient and Space membership-management authority is not required. Person relations return only minimal structurally reference-eligible {id,label} references for active Space People. record/record_list relations use the target Model's canonical referenceLabel semantics (or stable record ID fallback) and additionally require current read authority to that target Model. Search and pagination use the same canonical label. This lookup exposes no membership role/global user identity and is not proof of mutation authority: create/update Policy, relation integrity and all current authorization are rechecked when the mutation executes.","parameters":[{"name":"q","in":"query","required":false,"schema":{"type":"string","maxLength":100}},{"name":"cursor","in":"query","required":false,"schema":{"type":"string"}},{"name":"limit","in":"query","required":false,"schema":{"type":"integer","minimum":1,"maximum":100,"default":50}}],"responses":{"200":{"description":"Minimal authorized relation targets","content":{"application/json":{"schema":{"$ref":"#/components/schemas/RelationTargetLookupResponse"}}}},"400":{"$ref":"#/components/responses/InvalidRequest"},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"},"409":{"$ref":"#/components/responses/Conflict"}}}},"/api/v1/spaces/{spaceId}/_discovery/models/{modelKey}":{"parameters":[{"$ref":"#/components/parameters/SpaceId"},{"$ref":"#/components/parameters/ModelKey"},{"$ref":"#/components/parameters/DelegationId"}],"get":{"tags":["Runtime Discovery"],"operationId":"getRuntimeModelSemanticDetail","description":"Returns one currently discoverable published model as static semantic detail. The Space is used only as a current visibility gate across credential scope, Application × Model Access, Space membership/Data Grant and Delegation. The successful body contains no membership, Grant, Delegation or effective-access state and is stable for the returned (key, version, schemaHash) within one Kernel contract representation. An authorized client may cache that semantic body independently of the Space; caches reused across Kernel deployments must additionally key by the Kernel contractVersion. This response is not authorization proof; every execution still rechecks current authority. Missing and currently non-discoverable models use the same opaque 404 response so this route does not become a model-existence side channel. The static body includes canonical structural timeRanges facts; they describe interval meaning only and do not by themselves grant or imply an overlap query operator. Query comparisons enumerate explicit semantic operators, their concrete transport parameters, platform envelope fields, and DST-safe local-date-window transport so generic adapters do not infer suffix semantics or compute UTC boundaries. Capability semantic queries additionally enumerate preferred grouped high-level operations such as Calendar calendar.window; legacy flat Capability parameters remain compatibility syntax.","responses":{"200":{"description":"Static semantic detail for one currently discoverable model","content":{"application/json":{"schema":{"$ref":"#/components/schemas/RuntimeModelSemanticDetailResponse"}}}},"401":{"$ref":"#/components/responses/Unauthorized"},"404":{"$ref":"#/components/responses/NotFound"}}}},"/api/v1/me/_discovery/inventory":{"get":{"tags":["Me","Runtime Discovery"],"operationId":"getCurrentPrincipalRuntimeCapabilityInventory","description":"Returns a compact cross-Space current capability inventory for the authenticated principal. The response uses the same current visibility intersection as full current-principal Runtime Discovery (credential scopes, Application × Model Access, current Space membership/Data Grants, declared model access and current Delegation when applicable), but de-duplicates coarse static model facts into one top-level models list and keeps per-Space entries as minimal model/access visibility edges. Heavy field/default/query/Action-input/Capability-binding semantics are intentionally omitted and can be loaded progressively through semanticDetailPathTemplate. This is a request-current capability preview, not authorization proof; execution rechecks all current authority and model/Capability rules.","responses":{"200":{"description":"Compact current capability inventory with de-duplicated model facts and Space visibility edges","content":{"application/json":{"schema":{"$ref":"#/components/schemas/RuntimeDiscoveryInventoryResponse"}}}},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"}}}},"/api/v1/spaces/{spaceId}/_reference-resolutions/{modelKey}/{fieldKey}":{"parameters":[{"$ref":"#/components/parameters/SpaceId"},{"$ref":"#/components/parameters/ModelKey"},{"name":"fieldKey","in":"path","required":true,"schema":{"type":"string","pattern":"^[a-z][A-Za-z0-9]{0,62}$"}},{"$ref":"#/components/parameters/DelegationId"}],"post":{"tags":["Runtime Discovery"],"operationId":"resolveRelationReferences","description":"Resolves a bounded set of existing relation IDs for one source model field under the caller's current source-model read authority. Results preserve input order and duplicates. Each valid input ID returns either resolved with the minimal current label or opaque unavailable; unavailable intentionally does not distinguish missing, deleted, hidden, forbidden, wrong-Space or otherwise non-resolvable references. Person/person_list resolve through active same-Space Space Person displayName. record/record_list resolve through the target Model's canonical referenceLabel semantics (or stable record ID fallback) and additionally require current target-model read authority. Resolution is Context Projection and never proves mutation authority: create/update Policy, relation integrity and all current authorization are rechecked when a mutation executes.","requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/ReferenceResolutionRequest"}}}},"responses":{"200":{"description":"Bounded source-field-aware reference resolution results","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ReferenceResolutionResponse"}}}},"400":{"$ref":"#/components/responses/InvalidRequest"},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"},"409":{"$ref":"#/components/responses/Conflict"}}}},"/api/v1/spaces/{spaceId}/changes":{"parameters":[{"$ref":"#/components/parameters/SpaceId"},{"$ref":"#/components/parameters/DelegationId"}],"get":{"tags":["Change History"],"operationId":"listRecordChangeHistory","description":"Canonical record-scoped Change History collection. Returns append-only governed Change evidence for exactly one ordinary record selected by the required recordId query parameter. Results are ordered newest-first by version/time/id and use opaque keyset cursor pagination. Read authority is rechecked against the record's current published model; delegated Agent callers remain bounded by their current Delegation.","parameters":[{"name":"recordId","in":"query","required":true,"schema":{"type":"string","pattern":"^rec_[A-Za-z0-9_-]+$","maxLength":200}},{"name":"cursor","in":"query","required":false,"schema":{"type":"string"}},{"name":"limit","in":"query","required":false,"schema":{"type":"integer","minimum":1,"maximum":100,"default":50}}],"responses":{"200":{"description":"Success","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ResourceChangePageResponse"}}}},"400":{"$ref":"#/components/responses/InvalidRequest"},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"}}}},"/api/v1/spaces/{spaceId}/changes/by-id/{changeId}":{"parameters":[{"$ref":"#/components/parameters/SpaceId"},{"name":"changeId","in":"path","required":true,"schema":{"type":"string","pattern":"^chg_[A-Za-z0-9_-]+$","maxLength":200}},{"$ref":