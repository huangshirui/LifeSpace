openapi: 3.1.0
info:
  title: LifeSpace Core API
  version: 0.10.0
  description: Native LifeSpace Space, authorization, service-authenticated Data Grant, avatar, event, task, day-record and wish APIs. HomeMew runtime compatibility facades were retired after Phase 2.6; applications consume this native contract.
security:
  - bearerAuth: []
tags:
  - name: System
  - name: Me
  - name: Spaces
  - name: Members
  - name: Invitations
  - name: Events
  - name: Tasks
  - name: Day records
  - name: Wishes
  - name: Data Grants
paths:
  /health:
    get:
      tags: [System]
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/v1/status:
    get:
      tags: [System]
      operationId: getStatus
      security: []
      responses:
        "200":
          description: Core runtime and schema status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
  /assets/spaces/{spaceId}/avatar:
    parameters:
      - $ref: "#/components/parameters/SpaceId"
    get:
      tags: [Spaces]
      operationId: getPublicSpaceAvatar
      security: []
      responses:
        "200":
          description: Current Space avatar bytes
          content:
            image/jpeg: { schema: { type: string, contentEncoding: binary } }
            image/png: { schema: { type: string, contentEncoding: binary } }
            image/webp: { schema: { type: string, contentEncoding: binary } }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/me:
    get:
      tags: [Me]
      operationId: getCurrentPrincipal
      responses:
        "200":
          description: Current verified principal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrincipalResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/me/spaces:
    get:
      tags: [Me, Spaces]
      operationId: listMySpaces
      responses:
        "200":
          description: Active membership Spaces
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpaceSummaryListResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/spaces:
    post:
      tags: [Spaces]
      operationId: createSpace
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSpaceRequest" }
      responses:
        "201":
          description: Space created with owner membership and linked Space Person
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateSpaceResponse" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/spaces/{spaceId}:
    parameters:
      - $ref: "#/components/parameters/SpaceId"
    get:
      tags: [Spaces]
      operationId: getSpace
      responses:
        "200":
          description: Space detail and current access
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpaceResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Spaces]
      operationId: updateSpace
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateSpaceRequest" }
      responses:
        "200":
          description: Updated Space
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpaceResponse" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/spaces/{spaceId}/avatar:
    parameters:
      - $ref: "#/components/parameters/SpaceId"
    put:
      tags: [Spaces]
      operationId: replaceSpaceAvatar
      description: Replace the Space avatar under optimistic concurrency. Requires spaces:manage. JPEG, PNG or WebP up to 5 MB.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file, version]
              properties:
                file: { type: string, contentEncoding: binary }
                version: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Space avatar replaced
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpaceAvatarResponse" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { description: Avatar is larger than 5 MB }
        "415": { description: Avatar content type is not JPEG, PNG or WebP }
  /api/v1/spaces/{spaceId}/members:
    parameters:
      - $ref: "#/components/parameters/SpaceId"
    get:
      tags: [Members]
      operationId: listSpaceMembers
      responses:
        "200":
          description: Active memberships and linked Space People
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Members]
      operationId: addSpaceMember
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddMemberRequest" }
      responses:
        "201":
          description: Membership and linked Space Person created or reactivated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberResponse" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/spaces/{spaceId}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/SpaceId"
      - $ref: "#/components/parameters/UserId"
    patch:
      tags: [Members]
      operationId: updateSpaceMemberRole
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateMemberRequest" }
      responses:
        "200":
          description: Membership role updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberResponse" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [Members]
      operationId: removeSpaceMember
      responses:
        "204": { description: Membership and linked Space Person deactivated }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/spaces/{spaceId}/leave:
    parameters:
      - $ref: "#/components/parameters/SpaceId"
    post:
      tags: [Members]
      operationId: leaveSpace
      responses:
        "204": { description: Current membership and linked Space Person deactivated }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/spaces/{spaceId}/invites:
    parameters:
      - $ref: "#/components/parameters/SpaceId"
    get:
      tags: [Invitations]
      operationId: listSpaceInvites
      responses:
        "200":
          description: Invitations without plaintext tokens
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InviteListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Invitations]
      operationId: createSpaceInvite
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateInviteRequest" }
      responses:
        "201":
          description: Invitation created; plaintext token returned once
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateInviteResponse" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/spaces/{spaceId}/invites/{inviteId}/revoke:
    parameters:
      - $ref: "#/components/parameters/SpaceId"
      - $ref: "#/components/parameters/InviteId"
    post:
      tags: [Invitations]
      operationId: revokeSpaceInvite
      responses:
        "204": { description: Invitation revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/space-invites/{token}:
    parameters:
      - $ref: "#/components/parameters/InviteToken"
    get:
      tags: [Invitations]
      operationId: previewSpaceInvite
      responses:
        "200":
          description: Limited authenticated invitation preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitePreviewResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/space-invites/{token}/join:
    parameters:
      - $ref: "#/components/parameters/InviteToken"
    post:
      tags: [Invitations]
      operationId: joinSpaceByInvite
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JoinInviteRequest" }
      responses:
        "201":
          description: Membership and linked Space Person atomically activated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JoinInviteResponse" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/spaces/{spaceId}/events:
    parameters:
      - $ref: "#/components/parameters/SpaceId"
    get:
      tags: [Events]
      operationId: listSpaceEvents
      parameters:
        - { name: startDate, in: query, required: true, schema: { type: string, format: date } }
        - { name: endDateExclusive, in: query, required: true, schema: { type: string, format: date } }
        - name: timezone
          in: query
          schema: { $ref: "#/components/schemas/IanaTimezone" }
        - name: attendeePersonId
          in: query
          schema: { type: string, description: Space Person ID or me }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/EventStatus" }
        - { name: q, in: query, schema: { type: string, minLength: 1, maxLength: 100 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: Event page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventListResponse" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Events]
      operationId: createSpaceEvent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateEventRequest" }
      responses:
        "201":
          description: Event created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventResponse" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/spaces/{spaceId}/events/{eventId}:
    parameters:
      - $ref: "#/components/parameters/SpaceId"
      - $ref: "#/components/parameters/EventId"
    get:
      tags: [Events]
      operationId: getSpaceEvent
      responses:
        "200":
          description: Event detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Events]
      operationId: updateSpaceEvent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateEventRequest" }
      responses:
        "200":
          description: Event updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventResponse" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [Events]
      operationId: deleteSpaceEvent
      parameters:
        - { name: version, in: query, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "204": { description: Event soft-deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/spaces/{spaceId}/tasks:
    parameters:
      - $ref: "#/components/parameters/SpaceId"
    get:
      tags: [Tasks]
      operationId: listSpaceTasks
      description: Lists non-deleted Space tasks. With a due-date range, undated tasks are included only when includeNoDue=true.
      parameters:
        - { name: status, in: query, schema: { type: string, default: pending } }
        - name: assigneePersonId
          in: query
          schema: { type: string, description: Space Person ID or me }
        - { name: dueDateFrom, in: query, schema: { type: string, format: date } }
        - { name: dueDateTo, in: query, schema: { type: string, format: date } }
        - { name: includeNoDue, in: query, schema: { type: boolean, default: false } }
        - name: sort
          in: query
          schema: { type: string, enum: [due_asc, due_desc, created_desc, updated_desc], default: due_asc }
        - { name: q, in: query, schema: { type: string, minLength: 1, maxLength: 100 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: Task page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskListResponse" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Tasks]
      operationId: createSpaceTask
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTaskRequest" }
      responses:
        "201":
          description: Task created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskResponse" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/spaces/{spaceId}/tasks/{taskId}:
    parameters:
      - $ref: "#/components/parameters/SpaceId"
      - $ref: "#/components/parameters/TaskId"
    get:
      tags: [Tasks]
      operationId: getSpaceTask
      responses:
        "200":
          description: Task detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Tasks]
      operationId: updateSpaceTask
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateTaskRequest" }
      responses:
        "200":
          description: Task updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskResponse" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [Tasks]
      operationId: deleteSpaceTask
      parameters:
        - { name: version, in: query, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "204": { description: Task soft-deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/spaces/{spaceId}/tasks/{taskId}/complete:
    parameters:
      - $ref: "#/components/parameters/SpaceId"
      - $ref: "#/components/parameters/TaskId"
    post:
      tags: [Tasks]
      operationId: completeSpaceTask
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskActionRequest" }
      responses:
        "200":
          description: Task completed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskResponse" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/spaces/{spaceId}/tasks/{taskId}/reopen:
    parameters:
      - $ref: "#/components/parameters/SpaceId"
      - $ref: "#/components/parameters/TaskId"
    post:
      tags: [Tasks]
      operationId: reopenSpaceTask
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskActionRequest" }
      responses:
        "200":
          description: Task reopened
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskResponse" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/spaces/{spaceId}/day-records:
    parameters:
      - $ref: "#/components/parameters/SpaceId"
    get:
      tags: [Day records]
      operationId: listSpaceDayRecords
      parameters:
        - { name: kind, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, default: active } }
        - name: subjectPersonId
          in: query
          schema: { type: string, description: Active Space Person ID or me }
        - { name: attentionOnly, in: query, schema: { type: boolean, default: false } }
        - name: sort
          in: query
          schema: { $ref: "#/components/schemas/DayRecordSort" }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: Day-record page computed using Space timezone
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DayRecordListResponse" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Day records]
      operationId: createSpaceDayRecord
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateDayRecordRequest" }
      responses:
        "201":
          description: Day record created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DayRecordResponse" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/spaces/{spaceId}/day-records/{dayRecordId}:
    parameters:
      - $ref: "#/components/parameters/SpaceId"
      - $ref: "#/components/parameters/DayRecordId"
    get:
      tags: [Day records]
      operationId: getSpaceDayRecord
      responses:
        "200":
          description: Day record detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DayRecordResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Day records]
      operationId: updateSpaceDayRecord
      description: Mutable fields depend on persisted kind; kind is immutable.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateDayRecordRequest" }
      responses:
        "200":
          description: Day record updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DayRecordResponse" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [Day records]
      operationId: deleteSpaceDayRecord
      parameters:
        - { name: version, in: query, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "204": { description: Day record soft-deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/spaces/{spaceId}/day-records/{dayRecordId}/archive:
    parameters:
      - $ref: "#/components/parameters/SpaceId"
      - $ref: "#/components/parameters/DayRecordId"
    post:
      tags: [Day records]
      operationId: archiveSpaceDayRecord
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DayRecordActionRequest" }
      responses:
        "200":
          description: Day record archived
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DayRecordResponse" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/spaces/{spaceId}/day-records/{dayRecordId}/restore:
    parameters:
      - $ref: "#/components/parameters/SpaceId"
      - $ref: "#/components/parameters/DayRecordId"
    post:
      tags: [Day records]
      operationId: restoreSpaceDayRecord
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DayRecordActionRequest" }
      responses:
        "200":
          description: Day record restored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DayRecordResponse" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/spaces/{spaceId}/day-records/{dayRecordId}/occurrences:
    parameters:
      - $ref: "#/components/parameters/SpaceId"
      - $ref: "#/components/parameters/DayRecordId"
    get:
      tags: [Day records]
      operationId: listSpaceDayRecordOccurrences
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: Occurrence history newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DayRecordOccurrenceListResponse" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Day records]
      operationId: addSpaceDayRecordOccurrence
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateDayRecordOccurrenceRequest" }
      responses:
        "201":
          description: Occurrence added and anchor advanced atomically
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateDayRecordOccurrenceResponse" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/spaces/{spaceId}/wishes:
    parameters:
      - $ref: "#/components/parameters/SpaceId"
    get:
      tags: [Wishes]
      operationId: listSpaceWishes
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - name: ownerPersonId
          in: query
          schema: { type: string, description: Space Person ID or me }
        - name: claimantPersonId
          in: query
          schema: { type: string, description: Space Person ID or me }
        - { name: desiredFrom, in: query, schema: { type: string, format: date } }
        - { name: desiredTo, in: query, schema: { type: string, format: date } }
        - name: sort
          in: query
          schema: { type: string, enum: [default, desired_asc, created_desc, updated_desc], default: default }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: Wish page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WishListResponse" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Wishes]
      operationId: createSpaceWish
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateWishRequest" }
      responses:
        "201":
          description: Wish created for current Space Person
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WishResponse" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/spaces/{spaceId}/wishes/{wishId}:
    parameters:
      - $ref: "#/components/parameters/SpaceId"
      - $ref: "#/components/parameters/WishId"
    get:
      tags: [Wishes]
      operationId: getSpaceWish
      responses:
        "200":
          description: Wish detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WishResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Wishes]
      operationId: updateSpaceWish
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateWishRequest" }
      responses:
        "200":
          description: Wish updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WishResponse" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [Wishes]
      operationId: deleteSpaceWish
      parameters:
        - { name: version, in: query, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "204": { description: Wish soft-deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/spaces/{spaceId}/wishes/{wishId}/claim:
    $ref: "#/components/pathItems/WishClaim"
  /api/v1/spaces/{spaceId}/wishes/{wishId}/unclaim:
    $ref: "#/components/pathItems/WishUnclaim"
  /api/v1/spaces/{spaceId}/wishes/{wishId}/fulfill:
    $ref: "#/components/pathItems/WishFulfill"
  /api/v1/spaces/{spaceId}/wishes/{wishId}/reopen:
    $ref: "#/components/pathItems/WishReopen"
  /api/v1/spaces/{spaceId}/wishes/{wishId}/archive:
    $ref: "#/components/pathItems/WishArchive"
  /api/v1/spaces/{spaceId}/wishes/{wishId}/restore:
    $ref: "#/components/pathItems/WishRestore"
  /api/v1/spaces/{spaceId}/grants:
    parameters:
      - $ref: "#/components/parameters/SpaceId"
    get:
      tags: [Data Grants]
      operationId: listDataGrants
      description: List Space-level Data Grants. Requires a user principal with grants:manage and current manage permission on the Space.
      parameters:
        - { name: includeRevoked, in: query, schema: { type: boolean, default: false } }
      responses:
        "200": { description: Data Grant list, content: { application/json: { schema: { $ref: "#/components/schemas/DataGrantListResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Data Grants]
      operationId: createDataGrant
      description: Create a Space-level Grant. A service grantee authenticates separately and gains no access without a current Grant.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateGrantRequest" }
      responses:
        "201": { description: Data Grant created }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/spaces/{spaceId}/grants/{grantId}:
    parameters:
      - $ref: "#/components/parameters/SpaceId"
      - $ref: "#/components/parameters/GrantId"
    patch:
      tags: [Data Grants]
      operationId: updateDataGrant
      description: Update the permission or expiry of an active Space-level Grant.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UpdateGrantRequest" } } }
      responses:
        "200": { description: Data Grant updated, content: { application/json: { schema: { $ref: "#/components/schemas/DataGrantResponse" } } } }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Data Grants]
      operationId: revokeDataGrant
      description: Revoke an active Grant; authorization changes take effect on the next Core request.
      responses:
        "204": { description: Data Grant revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT or lsp_pat_
      description: Short-lived LifeSpace JWT or opaque lsp_pat_* Service API Token. Opaque tokens are introspected against current Identity state.
  parameters:
    SpaceId: { name: spaceId, in: path, required: true, schema: { type: string, pattern: ^spc_ } }
    UserId: { name: userId, in: path, required: true, schema: { type: string, pattern: ^usr_ } }
    InviteId: { name: inviteId, in: path, required: true, schema: { type: string, pattern: ^inv_ } }
    InviteToken: { name: token, in: path, required: true, schema: { type: string, minLength: 10, maxLength: 100 } }
    EventId: { name: eventId, in: path, required: true, schema: { type: string, pattern: ^evt_ } }
    TaskId: { name: taskId, in: path, required: true, schema: { type: string, pattern: ^tsk_ } }
    DayRecordId: { name: dayRecordId, in: path, required: true, schema: { type: string, pattern: ^day_ } }
    WishId: { name: wishId, in: path, required: true, schema: { type: string, pattern: ^wsh_ } }
    GrantId: { name: grantId, in: path, required: true, schema: { type: string, pattern: ^grt_ } }
  responses:
    InvalidRequest:
      description: Request validation failed
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    Unauthorized:
      description: Authentication failed
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    Forbidden:
      description: App scope or current data authorization is insufficient
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    NotFound:
      description: Resource not found
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    Conflict:
      description: Optimistic-concurrency, lifecycle or invariant conflict
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
  pathItems:
    WishClaim:
      parameters:
        - $ref: "#/components/parameters/SpaceId"
        - $ref: "#/components/parameters/WishId"
      post:
        tags: [Wishes]
        operationId: claimSpaceWish
        requestBody:
          required: true
          content: { application/json: { schema: { $ref: "#/components/schemas/WishActionRequest" } } }
        responses:
          "200": { description: Wish claimed, content: { application/json: { schema: { $ref: "#/components/schemas/WishResponse" } } } }
          "400": { $ref: "#/components/responses/InvalidRequest" }
          "401": { $ref: "#/components/responses/Unauthorized" }
          "403": { $ref: "#/components/responses/Forbidden" }
          "404": { $ref: "#/components/responses/NotFound" }
          "409": { $ref: "#/components/responses/Conflict" }
    WishUnclaim:
      parameters:
        - $ref: "#/components/parameters/SpaceId"
        - $ref: "#/components/parameters/WishId"
      post:
        tags: [Wishes]
        operationId: unclaimSpaceWish
        requestBody:
          required: true
          content: { application/json: { schema: { $ref: "#/components/schemas/WishActionRequest" } } }
        responses:
          "200": { description: Wish released, content: { application/json: { schema: { $ref: "#/components/schemas/WishResponse" } } } }
          "400": { $ref: "#/components/responses/InvalidRequest" }
          "401": { $ref: "#/components/responses/Unauthorized" }
          "403": { $ref: "#/components/responses/Forbidden" }
          "404": { $ref: "#/components/responses/NotFound" }
          "409": { $ref: "#/components/responses/Conflict" }
    WishFulfill:
      parameters:
        - $ref: "#/components/parameters/SpaceId"
        - $ref: "#/components/parameters/WishId"
      post:
        tags: [Wishes]
        operationId: fulfillSpaceWish
        requestBody:
          required: true
          content: { application/json: { schema: { $ref: "#/components/schemas/WishActionRequest" } } }
        responses:
          "200": { description: Wish fulfilled, content: { application/json: { schema: { $ref: "#/components/schemas/WishResponse" } } } }
          "400": { $ref: "#/components/responses/InvalidRequest" }
          "401": { $ref: "#/components/responses/Unauthorized" }
          "403": { $ref: "#/components/responses/Forbidden" }
          "404": { $ref: "#/components/responses/NotFound" }
          "409": { $ref: "#/components/responses/Conflict" }
    WishReopen:
      parameters:
        - $ref: "#/components/parameters/SpaceId"
        - $ref: "#/components/parameters/WishId"
      post:
        tags: [Wishes]
        operationId: reopenSpaceWish
        requestBody:
          required: true
          content: { application/json: { schema: { $ref: "#/components/schemas/WishActionRequest" } } }
        responses:
          "200": { description: Wish reopened, content: { application/json: { schema: { $ref: "#/components/schemas/WishResponse" } } } }
          "400": { $ref: "#/components/responses/InvalidRequest" }
          "401": { $ref: "#/components/responses/Unauthorized" }
          "403": { $ref: "#/components/responses/Forbidden" }
          "404": { $ref: "#/components/responses/NotFound" }
          "409": { $ref: "#/components/responses/Conflict" }
    WishArchive:
      parameters:
        - $ref: "#/components/parameters/SpaceId"
        - $ref: "#/components/parameters/WishId"
      post:
        tags: [Wishes]
        operationId: archiveSpaceWish
        requestBody:
          required: true
          content: { application/json: { schema: { $ref: "#/components/schemas/WishActionRequest" } } }
        responses:
          "200": { description: Wish archived, content: { application/json: { schema: { $ref: "#/components/schemas/WishResponse" } } } }
          "400": { $ref: "#/components/responses/InvalidRequest" }
          "401": { $ref: "#/components/responses/Unauthorized" }
          "403": { $ref: "#/components/responses/Forbidden" }
          "404": { $ref: "#/components/responses/NotFound" }
          "409": { $ref: "#/components/responses/Conflict" }
    WishRestore:
      parameters:
        - $ref: "#/components/parameters/SpaceId"
        - $ref: "#/components/parameters/WishId"
      post:
        tags: [Wishes]
        operationId: restoreSpaceWish
        requestBody:
          required: true
          content: { application/json: { schema: { $ref: "#/components/schemas/WishActionRequest" } } }
        responses:
          "200": { description: Wish restored, content: { application/json: { schema: { $ref: "#/components/schemas/WishResponse" } } } }
          "400": { $ref: "#/components/responses/InvalidRequest" }
          "401": { $ref: "#/components/responses/Unauthorized" }
          "403": { $ref: "#/components/responses/Forbidden" }
          "404": { $ref: "#/components/responses/NotFound" }
          "409": { $ref: "#/components/responses/Conflict" }
  schemas:
    SpaceKind: { type: string, enum: [personal, family, team] }
    SpaceRole: { type: string, enum: [owner, admin, editor, viewer] }
    AssignableSpaceRole: { type: string, enum: [admin, editor, viewer] }
    Permission: { type: string, enum: [free_busy, read, write, manage] }
    IanaTimezone: { type: string, minLength: 1, maxLength: 100, examples: [Asia/Shanghai] }
    EventStatus: { type: string, enum: [active, cancelled] }
    TaskStatus: { type: string, enum: [pending, completed, cancelled] }
    DayRecordKind: { type: string, enum: [elapsed, countdown, cycle] }
    DayRecordStatus: { type: string, enum: [active, archived] }
    DayRecordSort: { type: string, enum: [attention, date_asc, date_desc, created_desc, updated_desc], default: attention }
    DayRecordAttentionLevel: { type: string, enum: [none, info, warning, critical] }
    DayRecordState: { type: string, enum: [normal, threshold_reached, future, upcoming, today, past, due, overdue] }
    WishStatus: { type: string, enum: [open, claimed, fulfilled, archived] }
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, requestId]
          properties:
            code: { type: string }
            message: { type: string }
            requestId: { type: string }
    Principal:
      type: object
      additionalProperties: false
      required: [type, id, clientId, scopes, tokenId]
      properties:
        type: { type: string, enum: [user, service, device] }
        id: { type: string }
        clientId: { type: string }
        scopes: { type: array, items: { type: string }, uniqueItems: true }
        tokenId: { type: string }
    ActorRef:
      type: object
      additionalProperties: false
      required: [type, id, displayName]
      properties:
        type: { type: string, enum: [user, service, device] }
        id: { type: string }
        displayName: { type: string }
    Space:
      type: object
      required: [id, kind, name, timezone, avatarUrl, version]
      properties:
        id: { type: string, pattern: ^spc_ }
        kind: { $ref: "#/components/schemas/SpaceKind" }
        name: { type: string, minLength: 1, maxLength: 100 }
        timezone: { $ref: "#/components/schemas/IanaTimezone" }
        avatarUrl: { type: [string, "null"], format: uri }
        version: { type: integer, minimum: 1 }
        access:
          oneOf:
            - { $ref: "#/components/schemas/SpaceRole" }
            - { type: string, const: grant }
        ownerPersonId: { type: string, pattern: ^per_ }
    SpaceSummary:
      allOf:
        - { $ref: "#/components/schemas/Space" }
        - type: object
          required: [role]
          properties:
            role: { $ref: "#/components/schemas/SpaceRole" }
    CreateSpaceRequest:
      type: object
      additionalProperties: false
      required: [kind, name, ownerDisplayName]
      properties:
        kind: { $ref: "#/components/schemas/SpaceKind" }
        name: { type: string, minLength: 1, maxLength: 100 }
        ownerDisplayName: { type: string, minLength: 1, maxLength: 100 }
        timezone: { $ref: "#/components/schemas/IanaTimezone", default: UTC }
    UpdateSpaceRequest:
      type: object
      additionalProperties: false
      required: [version]
      minProperties: 2
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        timezone: { $ref: "#/components/schemas/IanaTimezone" }
        version: { type: integer, minimum: 1 }
    Member:
      type: object
      required: [id, userId, role, version, personId, displayName]
      properties:
        id: { type: string, pattern: ^mem_ }
        userId: { type: string, pattern: ^usr_ }
        role: { $ref: "#/components/schemas/SpaceRole" }
        version: { type: integer, minimum: 1 }
        personId: { type: string, pattern: ^per_ }
        displayName: { type: string }
        createdAt: { type: string, format: date-time }
    AddMemberRequest:
      type: object
      additionalProperties: false
      required: [userId, role, displayName]
      properties:
        userId: { type: string, pattern: ^usr_ }
        role: { $ref: "#/components/schemas/AssignableSpaceRole" }
        displayName: { type: string, minLength: 1, maxLength: 100 }
    UpdateMemberRequest:
      type: object
      additionalProperties: false
      required: [role, version]
      properties:
        role: { $ref: "#/components/schemas/AssignableSpaceRole" }
        version: { type: integer, minimum: 1 }
    Invite:
      type: object
      required: [id, role, status, expiresAt, maxUses, usedCount]
      properties:
        id: { type: string, pattern: ^inv_ }
        tokenPrefix: { type: string }
        role: { $ref: "#/components/schemas/AssignableSpaceRole" }
        status: { type: string, enum: [active, expired, exhausted, revoked] }
        expiresAt: { type: string, format: date-time }
        maxUses: { type: integer, minimum: 1, maximum: 100 }
        usedCount: { type: integer, minimum: 0 }
        createdByUserId: { type: string, pattern: ^usr_ }
        createdAt: { type: string, format: date-time }
    CreateInviteRequest:
      type: object
      additionalProperties: false
      properties:
        role: { $ref: "#/components/schemas/AssignableSpaceRole", default: editor }
        expiresInMinutes: { type: integer, minimum: 1, maximum: 43200, default: 1440 }
        maxUses: { type: integer, minimum: 1, maximum: 100, default: 1 }
    JoinInviteRequest:
      type: object
      additionalProperties: false
      required: [displayName]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 100 }
    DataGrant:
      type: object
      additionalProperties: false
      required: [id, sourceSpaceId, granteeType, granteeId, resourceType, resourceId, permission, createdByUserId, createdAt, expiresAt, revokedAt]
      properties:
        id: { type: string, pattern: ^grt_ }
        sourceSpaceId: { type: string, pattern: ^spc_ }
        granteeType: { type: string, enum: [user, space, service, device] }
        granteeId: { type: string }
        resourceType: { type: string, const: space }
        resourceId: { type: "null" }
        permission: { $ref: "#/components/schemas/Permission" }
        createdByUserId: { type: string, pattern: ^usr_ }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: [string, "null"], format: date-time }
        revokedAt: { type: [string, "null"], format: date-time }
    CreateGrantRequest:
      type: object
      additionalProperties: false
      required: [granteeType, granteeId, permission]
      properties:
        granteeType: { type: string, enum: [user, space, service, device] }
        granteeId: { type: string }
        permission: { $ref: "#/components/schemas/Permission" }
        expiresAt: { type: [string, "null"], format: date-time }
    UpdateGrantRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        permission: { $ref: "#/components/schemas/Permission" }
        expiresAt: { type: [string, "null"], format: date-time }
    DataGrantResponse: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/DataGrant" } } }
    DataGrantListResponse: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/DataGrant" } } } }
    EventPersonRef:
      type: object
      additionalProperties: false
      required: [personId, displayName]
      properties:
        personId: { type: string, pattern: ^per_ }
        displayName: { type: string }
    EventCommon:
      type: object
      required: [id, spaceId, summary, description, isAllDay, location, status, attendees, createdBy, updatedBy, version, createdAt, updatedAt]
      properties:
        id: { type: string, pattern: ^evt_ }
        spaceId: { type: string, pattern: ^spc_ }
        summary: { type: string, minLength: 1, maxLength: 100 }
        description: { type: [string, "null"], maxLength: 5000 }
        isAllDay: { type: boolean }
        location: { type: [string, "null"], maxLength: 500 }
        status: { $ref: "#/components/schemas/EventStatus" }
        attendees: { type: array, items: { $ref: "#/components/schemas/EventPersonRef" } }
        createdBy: { $ref: "#/components/schemas/ActorRef" }
        updatedBy: { $ref: "#/components/schemas/ActorRef" }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    TimedEvent:
      allOf:
        - { $ref: "#/components/schemas/EventCommon" }
        - type: object
          required: [startAt, endAt, startTimezone, endTimezone]
          properties:
            isAllDay: { const: false }
            startAt: { type: string, format: date-time, pattern: Z$ }
            endAt: { type: string, format: date-time, pattern: Z$ }
            startTimezone: { oneOf: [{ $ref: "#/components/schemas/IanaTimezone" }, { type: "null" }] }
            endTimezone: { oneOf: [{ $ref: "#/components/schemas/IanaTimezone" }, { type: "null" }] }
    AllDayEvent:
      allOf:
        - { $ref: "#/components/schemas/EventCommon" }
        - type: object
          required: [startDate, endDateExclusive]
          properties:
            isAllDay: { const: true }
            startDate: { type: string, format: date }
            endDateExclusive: { type: string, format: date }
    Event:
      oneOf:
        - { $ref: "#/components/schemas/TimedEvent" }
        - { $ref: "#/components/schemas/AllDayEvent" }
    CreateEventCommon:
      type: object
