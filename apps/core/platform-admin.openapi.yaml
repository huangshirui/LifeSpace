openapi: 3.1.0
info:
  title: LifeSpace Core Platform Admin API
  version: 0.1.0
  description: >-
    Privileged LifeSpace Core control-plane contract for the LifeSpace Console and approved
    platform automation. This contract is separate from the downstream Core Kernel Contract:
    adding or changing Console administration must not silently change an application's pinned
    Kernel contract. Unless explicitly documented otherwise, every operation requires a verified
    service-principal executor plus a dedicated Identity-signed platform-admin actor proof from
    the same LifeSpace application context.
security:
  - bearerAuth: []
    platformAdminActor: []
tags:
  - name: Application Model Access
  - name: Space Inspector
  - name: Platform Audit
  - name: Console Model Mutations
paths:
  /api/v1/platform-admin/applications/{applicationId}/model-access:
    parameters:
      - $ref: '#/components/parameters/ApplicationId'
    get:
      tags: [Application Model Access]
      operationId: getPlatformApplicationModelAccess
      description: >-
        Read the current Application × Model Access catalog for one LifeSpace application.
        Requires service executor scope applications:manage plus the platform-admin actor proof.
      responses:
        '200':
          description: Current Application × Model Access set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplicationModelAccessResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    put:
      tags: [Application Model Access]
      operationId: replacePlatformApplicationModelAccess
      description: >-
        Atomically replace the target application's model catalog. Every requested maxAccess must
        be exposed by the currently published Model Definition. The human actor is persisted as
        createdBy for newly inserted catalog rows and the control-plane mutation is audited.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplaceApplicationModelAccessRequest' }
      responses:
        '200':
          description: Replaced Application × Model Access set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplicationModelAccessResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: A requested published model was not found }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/platform-admin/spaces:
    get:
      tags: [Space Inspector]
      operationId: inspectPlatformSpaces
      description: >-
        Read-only global Space inspector. Requires service executor scope spaces:inspect and does
        not create or imply Space membership, Data Grant authority, or ordinary record-mutation authority.
      parameters:
        - name: q
          in: query
          description: Optional case-insensitive-ish D1 LIKE match against Space id or name.
          schema: { type: string, maxLength: 100 }
        - name: kind
          in: query
          schema: { $ref: '#/components/schemas/SpaceKind' }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Global Space summaries
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformSpaceListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/platform-admin/spaces/{spaceId}:
    parameters:
      - $ref: '#/components/parameters/SpaceId'
    get:
      tags: [Space Inspector]
      operationId: inspectPlatformSpace
      description: >-
        Read one Space with active memberships, linked Space People, Data Grants including revoked
        rows, and active record counts grouped by model. This is diagnostic control-plane access,
        not ordinary Space authorization.
      responses:
        '200':
          description: Global Space diagnostic detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformSpaceDetailResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/platform-admin/audit:
    get:
      tags: [Platform Audit]
      operationId: listCorePlatformAdminAudit
      description: >-
        Read Core control-plane audit evidence. Requires service executor scope audit:read and
        preserves the human LifeSpace user separately from the backend/service executor.
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Recent platform-admin audit entries
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformAuditListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/model-admin/models:
    post:
      tags: [Console Model Mutations]
      operationId: publishModelDefinitionFromConsole
      description: >-
        Console profile of the existing service-principal-only Kernel Model Admin publication.
        Requires models:manage plus the dedicated actor proof. Core persists pending platform-admin
        audit evidence before Registry mutation starts, then records success/failure. The canonical
        Registry publication remains service-executed; the human is additional audit attribution.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './openapi.yaml#/components/schemas/PublishModelRequest' }
      responses:
        '201':
          description: Model version published
          content:
            application/json:
              schema: { $ref: './openapi.yaml#/components/schemas/PublishedModelResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Registry mutation conflict }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/model-admin/models/{modelKey}/retire:
    parameters:
      - $ref: '#/components/parameters/ModelKey'
    post:
      tags: [Console Model Mutations]
      operationId: retirePublishedModelFromConsole
      description: >-
        Console profile of explicit Model Registry retirement. Requires models:manage plus the
        dedicated actor proof and writes pending -> success/failure human-attributed audit evidence.
      responses:
        '204': { description: Model retired and active Model Contract Revision advanced }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Registry mutation conflict }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: service JWT or lsp_pat_ opaque Service API Token
    platformAdminActor:
      type: apiKey
      in: header
      name: X-LifeSpace-Actor-Token
      description: >-
        Dedicated Identity-signed <=5-minute user proof with scope=platform:admin and
        purpose=platform_admin_actor. It must use the same LifeSpace application context as the executor.
  parameters:
    ApplicationId:
      name: applicationId
      in: path
      required: true
      schema: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,119}$' }
    SpaceId:
      name: spaceId
      in: path
      required: true
      schema: { type: string, pattern: '^spc_[A-Za-z0-9_-]+$' }
    ModelKey:
      name: modelKey
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z][a-z0-9_]{1,62}$' }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
  responses:
    InvalidRequest:
      description: Invalid request shape
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    ValidationError:
      description: Validation failed
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    Unauthorized:
      description: Executor authentication or actor-proof authentication failed
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    Forbidden:
      description: Executor scope, actor authority, principal type, or same-application binding denied access
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    NotFound:
      description: Requested control-plane resource was not found
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  schemas:
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, requestId]
          properties:
            code: { type: string }
            message: { type: string }
            requestId: { type: string }
    AccessLevel:
      type: string
      enum: [read, write, manage]
    ApplicationModelAccessEntry:
      type: object
      additionalProperties: false
      required: [applicationId, modelKey, maxAccess, createdBy, createdAt, updatedAt]
      properties:
        applicationId: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,119}$' }
        modelKey: { type: string, pattern: '^[a-z][a-z0-9_]{1,62}$' }
        maxAccess: { $ref: '#/components/schemas/AccessLevel' }
        createdBy:
          type: object
          additionalProperties: false
          required: [type, id]
          properties:
            type: { const: user }
            id: { type: string, pattern: '^usr_' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ReplaceApplicationModelAccessRequest:
      type: object
      additionalProperties: false
      required: [models]
      properties:
        models:
          type: array
          uniqueItems: true
          items:
            type: object
            additionalProperties: false
            required: [modelKey, maxAccess]
            properties:
              modelKey: { type: string, pattern: '^[a-z][a-z0-9_]{1,62}$' }
              maxAccess: { $ref: '#/components/schemas/AccessLevel' }
    ApplicationModelAccessResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [applicationId, models]
          properties:
            applicationId: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,119}$' }
            models:
              type: array
              items: { $ref: '#/components/schemas/ApplicationModelAccessEntry' }
    SpaceKind:
      type: string
      enum: [personal, family, team]
    PlatformSpaceSummary:
      type: object
      additionalProperties: false
      required: [id, kind, name, timezone, avatarUrl, version, createdByUserId, createdAt, updatedAt, memberCount, grantCount, recordCount]
      properties:
        id: { type: string, pattern: '^spc_' }
        kind: { $ref: '#/components/schemas/SpaceKind' }
        name: { type: string }
        timezone: { type: string, x-lifespace-format: iana-timezone }
        avatarUrl: { anyOf: [{ type: string, format: uri }, { type: 'null' }] }
        version: { type: integer, minimum: 1 }
        createdByUserId: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        memberCount: { type: integer, minimum: 0 }
        grantCount: { type: integer, minimum: 0 }
        recordCount: { type: integer, minimum: 0 }
    PlatformSpaceListResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/PlatformSpaceSummary' }
    PlatformSpaceMember:
      type: object
      additionalProperties: false
      required: [id, userId, personId, displayName, role, version, createdAt]
      properties:
        id: { type: string, pattern: '^mem_' }
        userId: { type: string }
        personId: { type: string, pattern: '^per_' }
        displayName: { type: string }
        role: { type: string, enum: [owner, admin, editor, viewer] }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
    PlatformDataGrant:
      type: object
      additionalProperties: false
      required: [id, granteeType, granteeId, resourceType, resourceId, permission, createdByUserId, createdAt, expiresAt, revokedAt]
      properties:
        id: { type: string, pattern: '^grt_' }
        granteeType: { type: string, enum: [user, space, service, device] }
        granteeId: { type: string }
        resourceType: { type: string }
        resourceId: { anyOf: [{ type: string }, { type: 'null' }] }
        permission: { type: string, enum: [free_busy, read, write, manage] }
        createdByUserId: { type: string }
        createdAt: { type: string, format: date-time }
        expiresAt: { anyOf: [{ type: string, format: date-time }, { type: 'null' }] }
        revokedAt: { anyOf: [{ type: string, format: date-time }, { type: 'null' }] }
    PlatformSpaceDetail:
      type: object
      additionalProperties: false
      required: [id, kind, name, timezone, avatarUrl, version, createdByUserId, createdAt, updatedAt, members, grants, recordCounts]
      properties:
        id: { type: string, pattern: '^spc_' }
        kind: { $ref: '#/components/schemas/SpaceKind' }
        name: { type: string }
        timezone: { type: string, x-lifespace-format: iana-timezone }
        avatarUrl: { anyOf: [{ type: string, format: uri }, { type: 'null' }] }
        version: { type: integer, minimum: 1 }
        createdByUserId: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        members: { type: array, items: { $ref: '#/components/schemas/PlatformSpaceMember' } }
        grants: { type: array, items: { $ref: '#/components/schemas/PlatformDataGrant' } }
        recordCounts:
          type: object
          additionalProperties: { type: integer, minimum: 0 }
    PlatformSpaceDetailResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties: { data: { $ref: '#/components/schemas/PlatformSpaceDetail' } }
    PlatformAuditEntry:
      type: object
      additionalProperties: false
      required: [id, actorUserId, actorApplicationId, executorPrincipalId, executorApplicationId, operation, targetType, targetId, requestId, result, createdAt, summary]
      properties:
        id: { type: string, pattern: '^paa_' }
        actorUserId: { type: string, pattern: '^usr_' }
        actorApplicationId: { type: string }
        executorPrincipalId: { type: string, pattern: '^svc_' }
        executorApplicationId: { type: string }
        operation: { type: string }
        targetType: { type: string }
        targetId: { type: string }
        requestId: { type: string }
        result: { type: string, enum: [pending, success, failure] }
        createdAt: { type: string, format: date-time }
        summary: { type: object, additionalProperties: true }
    PlatformAuditListResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/PlatformAuditEntry' }
