openapi: 3.1.0
info:
  title: LifeSpace Core Platform Admin API
  version: 0.5.0
  description: >-
    Privileged LifeSpace Core control-plane contract for the LifeSpace Console and approved
    platform automation. This contract is separate from both the downstream Core Kernel Contract and
    the service-automation Model Control Plane Contract: adding or changing Console administration
    must not silently change an application's pinned Kernel contract. Unless explicitly documented
    otherwise, every operation requires a verified service-principal executor plus a dedicated
    Identity-signed platform-admin actor proof from the same LifeSpace application context.
security:
  - bearerAuth: []
    platformAdminActor: []
tags:
  - name: Application Model Access
  - name: Space Inspector
  - name: Space Grant Governance
  - name: Space External Governance
  - name: Model Governance
  - name: Platform Audit
paths:
  /api/v1/platform-admin/applications/{applicationId}/model-access:
    parameters:
      - $ref: '#/components/parameters/ApplicationId'
    get:
      tags: [Application Model Access]
      operationId: getPlatformApplicationModelAccess
      description: >-
        Read the current Application × Model Access catalog for one LifeSpace application.
        Requires service executor scope applications:manage plus the platform-admin actor proof.
      responses:
        '200':
          description: Current Application × Model Access set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplicationModelAccessResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    put:
      tags: [Application Model Access]
      operationId: replacePlatformApplicationModelAccess
      description: >-
        Atomically replace the target application's model catalog. Every requested maxAccess must
        be exposed by the currently published Model Definition. The human actor is persisted as
        createdBy for newly inserted catalog rows and the control-plane mutation is audited.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplaceApplicationModelAccessRequest' }
      responses:
        '200':
          description: Replaced Application × Model Access set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplicationModelAccessResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: A requested published model was not found }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/platform-admin/spaces:
    get:
      tags: [Space Inspector]
      operationId: inspectPlatformSpaces
      description: >-
        Global Space inspector. Requires service executor scope spaces:inspect and does not create
        or imply Space membership, Data Grant authority, or ordinary record-mutation authority.
      parameters:
        - name: q
          in: query
          description: Optional case-insensitive-ish D1 LIKE match against Space id or name.
          schema: { type: string, maxLength: 100 }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Global Space summaries
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformSpaceListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/platform-admin/spaces/{spaceId}:
    parameters:
      - $ref: '#/components/parameters/SpaceId'
    get:
      tags: [Space Inspector]
      operationId: inspectPlatformSpace
      description: >-
        Read one Space with active memberships, linked Space People, Data Grants including revoked
        rows, and active record counts grouped by model. This is diagnostic control-plane access,
        not ordinary Space authorization.
      responses:
        '200':
          description: Global Space diagnostic detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformSpaceDetailResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/platform-admin/spaces/{spaceId}/grants:
    parameters:
      - $ref: '#/components/parameters/SpaceId'
    post:
      tags: [Space Grant Governance]
      operationId: createPlatformDataGrant
      description: >-
        Create a Data Grant in the target Space as a platform governance operation. Requires
        service executor scope grants:manage plus the platform-admin actor proof. This operation
        mutates the same authoritative Data Grant state used by ordinary runtime authorization; it
        does not make the Console executor or human operator a Space member or data reader.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDataGrantRequest' }
      responses:
        '201':
          description: Data Grant created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformDataGrantResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/platform-admin/spaces/{spaceId}/grants/{grantId}:
    parameters:
      - $ref: '#/components/parameters/SpaceId'
      - $ref: '#/components/parameters/GrantId'
    patch:
      tags: [Space Grant Governance]
      operationId: updatePlatformDataGrant
      description: >-
        Update the permission and/or expiry of one active Data Grant. Requires grants:manage plus
        the platform-admin actor proof. The mutation and platform-admin audit evidence are committed
        together in Core D1.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateDataGrantRequest' }
      responses:
        '200':
          description: Data Grant updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformDataGrantResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Space Grant Governance]
      operationId: revokePlatformDataGrant
      description: >-
        Soft-revoke one active Data Grant as a platform governance operation. Requires grants:manage
        plus the platform-admin actor proof. Revocation changes subsequent runtime authorization but
        does not itself grant the Console ordinary Space data authority.
      responses:
        '204': { description: Data Grant revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/platform-admin/spaces/{spaceId}/external-providers:
    parameters:
      - $ref: '#/components/parameters/SpaceId'
    get:
      tags: [Space External Governance]
      operationId: listPlatformExternalProviders
      description: >-
        List configured External Provider descriptors for platform governance of one Space.
        Requires spaces:manage plus the platform-admin actor proof; this does not grant runtime data authority.
      responses:
        '200':
          description: Provider descriptors
          content:
            application/json:
              schema: { $ref: './external-connection.openapi.yaml#/components/schemas/ProviderListEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { description: Provider Adapter unavailable }
  /api/v1/platform-admin/spaces/{spaceId}/external-model-definitions:
    parameters:
      - $ref: '#/components/parameters/SpaceId'
    get:
      tags: [Space External Governance]
      operationId: listPlatformExternalModelDefinitions
      description: >-
        List published External business Model Definitions available for Space binding under
        Platform Admin authority. Requires spaces:manage plus the platform-admin actor proof.
      responses:
        '200':
          description: Bindable External definitions
          content:
            application/json:
              schema: { $ref: './external-connection.openapi.yaml#/components/schemas/ExternalModelDefinitionListEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/platform-admin/spaces/{spaceId}/external-connections:
    parameters:
      - $ref: '#/components/parameters/SpaceId'
    get:
      tags: [Space External Governance]
      operationId: listPlatformExternalConnections
      description: >-
        List External Connections for one Space as platform configuration state. Requires
        spaces:manage plus the platform-admin actor proof.
      responses:
        '200':
          description: Connections
          content:
            application/json:
              schema: { $ref: './external-connection.openapi.yaml#/components/schemas/ConnectionListEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Space External Governance]
      operationId: createPlatformExternalConnection
      description: >-
        Create a Space-scoped External Connection as a Platform Admin governance operation. Requires
        spaces:manage plus the platform-admin actor proof. Provider credential plaintext is forwarded
        only to the private Adapter vault and is never persisted in Core or returned.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './external-connection.openapi.yaml#/components/schemas/CreateExternalConnection' }
      responses:
        '201':
          description: Created connection
          content:
            application/json:
              schema: { $ref: './external-connection.openapi.yaml#/components/schemas/ConnectionEnvelope' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { description: Provider Adapter unavailable }
  /api/v1/platform-admin/spaces/{spaceId}/external-connections/{connectionId}:
    parameters:
      - $ref: '#/components/parameters/SpaceId'
      - $ref: '#/components/parameters/ConnectionId'
    patch:
      tags: [Space External Governance]
      operationId: updatePlatformExternalConnection
      description: >-
        Rename, enable/disable, change access ceiling, or rotate the credential for a dynamic
        Connection under Platform Admin authority. Requires spaces:manage plus the actor proof.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './external-connection.openapi.yaml#/components/schemas/UpdateExternalConnection' }
      responses:
        '200':
          description: Updated connection
          content:
            application/json:
              schema: { $ref: './external-connection.openapi.yaml#/components/schemas/ConnectionEnvelope' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Connection revoked }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Space External Governance]
      operationId: revokePlatformExternalConnection
      description: >-
        Delete Provider vault credential, revoke the Connection and disable its bindings under
        Platform Admin authority. Requires spaces:manage plus the actor proof.
      responses:
        '204': { description: Revoked or already revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { description: Provider Adapter unavailable }
  /api/v1/platform-admin/spaces/{spaceId}/external-connections/{connectionId}/resources:
    parameters:
      - $ref: '#/components/parameters/SpaceId'
      - $ref: '#/components/parameters/ConnectionId'
      - name: query
        in: query
        schema: { type: string, maxLength: 200 }
      - name: cursor
        in: query
        schema: { type: string, maxLength: 2048 }
      - name: limit
        in: query
        schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    get:
      tags: [Space External Governance]
      operationId: listPlatformExternalConnectionResources
      description: >-
        Discover Provider resources visible to one active Connection as a Platform Admin setup
        operation. Requires spaces:manage plus the actor proof and does not grant runtime data access.
      responses:
        '200':
          description: Provider resources
          content:
            application/json:
              schema: { $ref: './external-connection.openapi.yaml#/components/schemas/ResourceListEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Connection disabled or revoked }
        '503': { description: Provider Adapter unavailable }
  /api/v1/platform-admin/spaces/{spaceId}/external-models:
    parameters:
      - $ref: '#/components/parameters/SpaceId'
    get:
      tags: [Space External Governance]
      operationId: listPlatformExternalModelBindings
      description: >-
        List current and disabled External Model bindings for one Space as platform configuration state.
        Requires spaces:manage plus the platform-admin actor proof.
      responses:
        '200':
          description: External Model bindings
          content:
            application/json:
              schema: { $ref: './external-connection.openapi.yaml#/components/schemas/ExternalBindingListEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Space External Governance]
      operationId: bindPlatformExternalModel
      description: >-
        Bind one published External business Model Definition to a Connection and Provider resource
        under Platform Admin authority. Requires spaces:manage plus the actor proof; Definition and
        Connection access ceilings remain authoritative.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './external-connection.openapi.yaml#/components/schemas/BindExternalModel' }
      responses:
        '201':
          description: Binding created or reactivated
          content:
            application/json:
              schema: { $ref: './external-connection.openapi.yaml#/components/schemas/ExternalBindingEnvelope' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Resource or definition conflict }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/platform-admin/spaces/{spaceId}/external-models/{modelKey}:
    parameters:
      - $ref: '#/components/parameters/SpaceId'
      - $ref: '#/components/parameters/ModelKey'
    get:
      tags: [Space External Governance]
      operationId: getPlatformExternalModelBinding
      description: >-
        Inspect the latest stored Provider schema snapshot and effective binding capabilities under
        Platform Admin authority. Requires spaces:manage plus the actor proof.
      responses:
        '200':
          description: Stored External binding detail
          content:
            application/json:
              schema: { $ref: './external-connection.openapi.yaml#/components/schemas/ExternalBindingDetailEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Space External Governance]
      operationId: updatePlatformExternalModelBinding
      description: >-
        Change declared read/write ceiling or disable an External binding under Platform Admin
        authority. Requires spaces:manage plus the actor proof.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './external-connection.openapi.yaml#/components/schemas/UpdateExternalBinding' }
      responses:
        '200':
          description: Binding configuration updated
          content:
            application/json:
              schema: { $ref: './external-connection.openapi.yaml#/components/schemas/BindingMutationEnvelope' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/platform-admin/spaces/{spaceId}/external-models/{modelKey}/refresh:
    parameters:
      - $ref: '#/components/parameters/SpaceId'
      - $ref: '#/components/parameters/ModelKey'
    post:
      tags: [Space External Governance]
      operationId: refreshPlatformExternalModelBinding
      description: >-
        Rediscover Provider schema for an active binding under Platform Admin authority. Requires
        spaces:manage plus the actor proof.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              maxProperties: 0
      responses:
        '200':
          description: Refreshed External semantic detail
          content:
            application/json:
              schema: { $ref: './external-connection.openapi.yaml#/components/schemas/ExternalBindingEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { description: Provider Adapter unavailable }
  /api/v1/platform-admin/models:
    get:
      tags: [Model Governance]
      operationId: listPlatformPublishedModels
      description: >-
        Platform-admin view of the published Native Model Registry. Requires models:manage plus the
        dedicated actor proof. Non-interactive service automation remains on the independent Model
        Control Plane /api/v1/model-admin namespace.
      responses:
        '200':
          description: Published Model Registry entries
          content:
            application/json:
              schema: { $ref: './model-control-plane.openapi.yaml#/components/schemas/PublishedModelListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Model Governance]
      operationId: publishPlatformModelDefinition
      description: >-
        Platform-admin Model Definition publication. Requires models:manage plus the dedicated actor
        proof. Core persists pending platform-admin audit evidence before Registry mutation starts,
        then records success/failure. Publication reuses the canonical Model Control Plane schema and
        Registry implementation rather than creating a second Model Definition format.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './model-control-plane.openapi.yaml#/components/schemas/PublishModelRequest' }
      responses:
        '201':
          description: Model version published
          content:
            application/json:
              schema: { $ref: './model-control-plane.openapi.yaml#/components/schemas/PublishedModelResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Registry mutation conflict }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/platform-admin/models/validate:
    post:
      tags: [Model Governance]
      operationId: validatePlatformModelDefinition
      description: >-
        Validate a Model Definition through the same canonical Core validator used by the Model
        Control Plane. Requires models:manage plus the platform-admin actor proof.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './model-control-plane.openapi.yaml#/components/schemas/ValidateModelRequest' }
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema: { $ref: './model-control-plane.openapi.yaml#/components/schemas/ModelValidationResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/platform-admin/models/{modelKey}:
    parameters:
      - $ref: '#/components/parameters/ModelKey'
    get:
      tags: [Model Governance]
      operationId: getPlatformPublishedModel
      description: >-
        Read the current published Native model under Platform Admin authority. Requires
        models:manage plus the platform-admin actor proof.
      responses:
        '200':
          description: Current published model version
          content:
            application/json:
              schema: { $ref: './model-control-plane.openapi.yaml#/components/schemas/PublishedModelResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/platform-admin/models/{modelKey}/retire:
    parameters:
      - $ref: '#/components/parameters/ModelKey'
    post:
      tags: [Model Governance]
      operationId: retirePlatformPublishedModel
      description: >-
        Platform-admin explicit Model Registry retirement. Requires models:manage plus the dedicated
        actor proof and writes pending -> success/failure human-attributed audit evidence.
      responses:
        '204': { description: Model retired and active Model Contract Revision advanced }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Registry mutation conflict }
  /api/v1/platform-admin/audit:
    get:
      tags: [Platform Audit]
      operationId: listCorePlatformAdminAudit
      description: >-
        Read Core control-plane audit evidence. Requires service executor scope audit:read and
        preserves the human LifeSpace user separately from the backend/service executor.
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Recent platform-admin audit entries
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformAuditListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: service JWT or lsp_svc_* Service API Token (legacy lsp_pat_* accepted)
    platformAdminActor:
      type: apiKey
      in: header
      name: X-LifeSpace-Actor-Token
      description: >-
        Dedicated Identity-signed <=5-minute user proof with scope=platform:admin and
        purpose=platform_admin_actor. It must use the same LifeSpace application context as the executor.
  parameters:
    ApplicationId:
      name: applicationId
      in: path
      required: true
      schema: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,119}$' }
    SpaceId:
      name: spaceId
      in: path
      required: true
      schema: { type: string, pattern: '^spc_[A-Za-z0-9_-]+$' }
    GrantId:
      name: grantId
      in: path
      required: true
      schema: { type: string, pattern: '^grt_[A-Za-z0-9_-]+$' }
    ConnectionId:
      name: connectionId
      in: path
      required: true
      schema: { type: string, pattern: '^exs_[a-f0-9]{32}$' }
    ModelKey:
      name: modelKey
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z][a-z0-9_]{1,62}$' }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
  responses:
    InvalidRequest:
      description: Invalid request shape
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    ValidationError:
      description: Validation failed
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    Unauthorized:
      description: Executor authentication or actor-proof authentication failed
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    Forbidden:
      description: Executor scope, actor authority, principal type, or same-application binding denied access
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    NotFound:
      description: Requested control-plane resource was not found
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  schemas:
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, requestId]
          properties:
            code: { type: string }
            message: { type: string }
            requestId: { type: string }
    AccessLevel:
      type: string
      enum: [read, write, manage]
    ApplicationModelAccessEntry:
      type: object
      additionalProperties: false
      required: [applicationId, modelKey, maxAccess, createdBy, createdAt, updatedAt]
      properties:
        applicationId: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,119}$' }
        modelKey: { type: string, pattern: '^[a-z][a-z0-9_]{1,62}$' }
        maxAccess: { $ref: '#/components/schemas/AccessLevel' }
        createdBy:
          type: object
          additionalProperties: false
          required: [type, id]
          properties:
            type: { const: user }
            id: { type: string, pattern: '^usr_' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ReplaceApplicationModelAccessRequest:
      type: object
      additionalProperties: false
      required: [models]
      properties:
        models:
          type: array
          uniqueItems: true
          items:
            type: object
            additionalProperties: false
            required: [modelKey, maxAccess]
            properties:
              modelKey: { type: string, pattern: '^[a-z][a-z0-9_]{1,62}$' }
