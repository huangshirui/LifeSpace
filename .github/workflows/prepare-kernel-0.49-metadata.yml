name: Prepare Kernel 0.49 metadata

on:
  push:
    branches:
      - fix/config-model-discovery
    paths:
      - apps/core/scripts/prepare-kernel-0.49-metadata.mjs
      - .github/workflows/prepare-kernel-0.49-metadata.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: fix/config-model-discovery

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          version: 10.13.1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Sync Kernel metadata
        run: node apps/core/scripts/prepare-kernel-0.49-metadata.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Full repository check
        run: pnpm check

      - name: Remove one-shot preparation files
        run: |
          rm apps/core/scripts/prepare-kernel-0.49-metadata.mjs
          rm .github/workflows/prepare-kernel-0.49-metadata.yml

      - name: Commit validated metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix(core): align Kernel 0.49 contract metadata"
          git push origin HEAD:fix/config-model-discovery
