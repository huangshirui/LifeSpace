name: One-time LifeSpace Core 0.38 production bridge

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY_CORE_038_BRIDGE to continue
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: lifespace-production-change
  cancel-in-progress: false

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      CORE_038_SHA: db710d640a8687a5455b782b662279a5d7f44950
    steps:
      - name: Validate one-time bridge intent and live source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "main" || { echo "Bridge must run from main" >&2; exit 1; }
          test "${{ inputs.confirmation }}" = "DEPLOY_CORE_038_BRIDGE" || { echo "confirmation must be DEPLOY_CORE_038_BRIDGE" >&2; exit 1; }
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN is not configured" >&2; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "CLOUDFLARE_ACCOUNT_ID is not configured" >&2; exit 1; }

          curl --fail --silent --show-error https://core.aisr.online/api/v1/status > "$RUNNER_TEMP/core-before.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const payload = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/core-before.json', 'utf8'));
          const data = payload?.data ?? payload;
          if (data?.status !== 'ok' || data?.service !== 'core' || data?.environment !== 'production') {
            throw new Error('LifeSpace Core production status is not healthy');
          }
          if (data.contractVersion !== '0.37.0' || Number(data.schemaVersion) !== 43) {
            throw new Error(`Bridge source must be Core 0.37.0/schema43, got ${String(data.contractVersion)}/schema${String(data.schemaVersion)}`);
          }
          console.log('Confirmed bridge source: Core 0.37.0 / schema43');
          NODE

      - name: Checkout pinned Core 0.38 bridge source
        uses: actions/checkout@v5
        with:
          ref: ${{ env.CORE_038_SHA }}
          fetch-depth: 1

      - name: Verify immutable bridge source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CORE_038_SHA" || { echo "Pinned Core 0.38 SHA mismatch" >&2; exit 1; }
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('apps/core/package.json', 'utf8'));
          if (pkg.version !== '0.38.0') throw new Error(`Expected Core 0.38.0 source, got ${pkg.version}`);
          if (!fs.existsSync('apps/core/migrations/0044_retire_consumer_legacy_schema.sql')) {
            throw new Error('Pinned bridge source is missing migration 0044');
          }
          if (fs.existsSync('apps/core/migrations/0045_remove_space_kind.sql')) {
            throw new Error('Pinned bridge source unexpectedly contains migration 0045');
          }
          console.log('Pinned bridge source verified: Core 0.38.0, migrations stop at 0044');
          NODE

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          version: 10.13.1
          run_install: false

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install pinned bridge dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify pinned Core 0.38 source
        run: pnpm --filter @lifespace/core check

      - name: Resolve production D1 IDs
        run: node infra/scripts/resolve-production-d1.mjs

      - name: Apply only Core migration 0044
        run: pnpm --filter @lifespace/core db:migrate:production

      - name: Deploy pinned Core 0.38 Worker only
        run: pnpm --dir apps/core exec wrangler deploy --env production

      - name: Verify bridge target convergence
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error https://core.aisr.online/api/v1/status > "$RUNNER_TEMP/core-after.json"; then
              if node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const payload = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/core-after.json', 'utf8'));
          const data = payload?.data ?? payload;
          if (
            data?.status === 'ok'
            && data?.service === 'core'
            && data?.environment === 'production'
            && data?.contractVersion === '0.38.0'
            && Number(data?.schemaVersion) === 44
          ) process.exit(0);
          process.exit(1);
          NODE
              then
                echo "Core 0.38/schema44 bridge converged"
                exit 0
              fi
            fi
            echo "Bridge has not converged yet (attempt $attempt/18)"
            sleep 5
          done
          echo "Core 0.38/schema44 bridge did not converge" >&2
          cat "$RUNNER_TEMP/core-after.json" >&2 || true
          exit 1

      - name: Verify public health after bridge
        run: curl --fail --silent --show-error --retry 3 https://core.aisr.online/health >/dev/null

      - name: Upload bridge evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: lifespace-core-038-production-bridge-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/core-before.json
            ${{ runner.temp }}/core-after.json
          if-no-files-found: warn
          retention-days: 30

      - name: Summarize successful bridge
        if: ${{ success() }}
        shell: bash
        run: |
          {
            echo "## LifeSpace Core 0.38 production bridge"
            echo
            echo "- Source: Core 0.37.0 / schema43"
            echo "- Pinned bridge SHA: `$CORE_038_SHA`"
            echo "- Target: Core 0.38.0 / schema44"
            echo "- Core migration applied: 0044 only"
            echo "- Identity deployment: not performed"
            echo "- Domain/secret provisioning: not performed"
            echo "- Next: deploy no-kind HomeMew Web production, then predeploy schema44/45-compatible Core 0.39 before migration 0045"
          } >> "$GITHUB_STEP_SUMMARY"
