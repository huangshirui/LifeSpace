name: One-time Eventing staging Custom Domain diagnostic

on:
  push:
    branches:
      - ops/eventing-staging-route-diagnostic-20260825
    paths:
      - .github/workflows/eventing-staging-custom-domain-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnose Eventing through Custom Domain
    runs-on: ubuntu-latest
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      LIFESPACE_STAGING_BOOTSTRAP_SECRET: ${{ secrets.LIFESPACE_STAGING_BOOTSTRAP_SECRET }}
      LIFESPACE_CORE_STAGING_URL: https://core-staging.aisr.online
      LIFESPACE_IDENTITY_STAGING_URL: https://auth-staging.aisr.online
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4

      - name: Guard staging-only diagnostic
        shell: bash
        run: |
          set -euo pipefail
          node --check infra/scripts/diagnose-staging-eventing-custom-domain.mjs
          ! grep -q 'core\.aisr\.online' infra/scripts/diagnose-staging-eventing-custom-domain.mjs
          ! grep -q 'auth\.aisr\.online' infra/scripts/diagnose-staging-eventing-custom-domain.mjs

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
          run_install: false

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve staging D1 IDs
        run: node infra/scripts/resolve-staging-d1.mjs

      - name: Prepare bounded staging smoke authority
        run: node infra/scripts/prepare-staging-smoke.mjs

      - name: Diagnose Eventing through ephemeral staging Custom Domain
        run: node infra/scripts/diagnose-staging-eventing-custom-domain.mjs

      - name: Cleanup staging smoke authority
        if: ${{ always() }}
        continue-on-error: true
        run: node infra/scripts/cleanup-staging-smoke.mjs
