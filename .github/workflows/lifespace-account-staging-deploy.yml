name: Deploy LifeSpace Account staging

# Routine Account-only code and static asset rollout. No cross-service mutations.
# The Account configuration must already be provisioned using the separate
# owner-confirmed lifespace-account-staging-provision.yml.
on:
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  actions: read

concurrency:
  group: lifespace-staging-deploy
  cancel-in-progress: false

jobs:
  validate:
    name: Require owner-triggered reviewed main release
    runs-on: ubuntu-latest
    steps:
      - name: Reject non-owner, non-main, or automated invocation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_ACTOR" = "huangshirui"
          test "$GITHUB_TRIGGERING_ACTOR" = "huangshirui"
          test "$GITHUB_REF_NAME" = "main"
      - uses: actions/checkout@v5
      - name: Verify release candidate checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: node infra/scripts/verify-release-candidate.mjs staging

  deploy:
    name: Deploy only Account staging Worker (no provisioning / rotation)
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4.4.0
        with:
          version: 10.13.1
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Check protected Cloudflare deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test "${#CLOUDFLARE_ACCOUNT_ID}" -eq 32
          echo "Cloudflare deployment credentials present; Bootstrap credentials not used"
      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate full repo and Account deployment matrix
        run: pnpm check
      - name: Verify Core and Identity staging compatibility (read-only)
        run: node apps/account/scripts/check-platform-convergence.mjs
      - name: Verify existing Account Access policy without mutations
        run: node apps/account/scripts/verify-staging-access.mjs
      - name: Verify existing Account/Core/Identity secret binding names (read-only)
        run: node apps/account/scripts/verify-staging-bindings.mjs
      - name: Deploy only Account staging Worker (retain existing secrets)
        run: pnpm --dir apps/account exec wrangler deploy --env staging
      - name: Verify required binding names remain configured (read-only)
        run: node apps/account/scripts/verify-staging-bindings.mjs
      - name: Staging rollout summary
        if: success()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## LifeSpace Account Staging: independent code rollout

          - Worker: `lifespace-account-staging`
          - Domain: `account-staging.aisr.online`
          - Access: existing independent owner-only application verified read-only
          - Identity Application: `app_lifespace_account_staging` (pre-provisioned, no credential rotation)
          - Data: no Account D1; OAuth → Identity D1, Space/Grant → Core D1
          - Services: `lifespace-identity-staging` / `lifespace-core-staging` (read-only preflight; no deployment)
          - Existing Account Worker Secrets retained by Wrangler deploy
          - No Core/Identity secret writes, platform migrations, or credential rotation
          - Setup/rotation: separately owner-confirmed `lifespace-account-staging-provision.yml`
          - Production changes: none
          - OAuth/MCP E2E acceptance is tracked separately under issues #499 and #514
          EOF
