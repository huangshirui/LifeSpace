name: Deploy LifeSpace Account production (code only)

# Routine code/static-assets deploy. NEVER creates/rotates credentials,
# deploys Core/Identity, updates Access policies or migrates databases.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DEPLOY_ACCOUNT_PRODUCTION"
        required: true
        type: string

permissions:
  contents: read
  checks: read
  actions: read
  pull-requests: read

concurrency:
  group: lifespace-production-change
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Require owner, main and explicit Production intent
        env:
          OPERATOR_CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_ACTOR" = huangshirui
          test "$GITHUB_TRIGGERING_ACTOR" = huangshirui
          test "$GITHUB_REF_NAME" = main
          test "$OPERATOR_CONFIRMATION" = DEPLOY_ACCOUNT_PRODUCTION
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Require exact-SHA accepted Account Staging and CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: node infra/scripts/verify-release-candidate.mjs production account

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4.4.0
        with:
          version: 10.13.1
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Validate Production deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test "${#CLOUDFLARE_ACCOUNT_ID}" -eq 32
      - name: Validate full repository and Account deployment contract
        run: |
          pnpm install --frozen-lockfile
          pnpm check
      - name: Verify existing Production Core/Identity versions
        run: node apps/account/scripts/check-platform-production-convergence.mjs
      - name: Verify existing Account Access and all OAuth/Worker bindings (read only)
        run: |
          node apps/account/scripts/verify-production-access.mjs
          node apps/account/scripts/verify-production-bindings.mjs
      - name: Deploy only Account Production Worker preserving secrets
        run: pnpm --dir apps/account exec wrangler deploy --env production
      - name: Reverify Account Production binding names without secret values
        run: node apps/account/scripts/verify-production-bindings.mjs
      - name: Summarize nonrotating isolated Account Production code update
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## LifeSpace Account Production

          - Owner-approved, exact-SHA Account Staging prerequisite passed
          - Only Account Worker code and assets deployed
          - Existing Production Access, Account credential, CSRF, OAuth pair and bindings preserved
          - No Core/Identity code deployment, secret rotation, D1 migration or Platform Admin token
          EOF
