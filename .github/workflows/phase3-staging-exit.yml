name: Phase 3 staging exit

on:
  workflow_dispatch:
    inputs:
      core_base_url:
        description: Public Core staging base URL, for example https://core-staging.example.com
        required: true
        type: string
      deploy_core:
        description: Apply Core staging migrations and deploy Core before verification
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: phase3-staging-exit
  cancel-in-progress: false

jobs:
  staging-exit:
    name: Phase 3 staging repository and infrastructure gates
    runs-on: ubuntu-24.04
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout exact ref
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Repository gate
        run: pnpm check

      - name: Require staging Cloudflare credentials
        if: ${{ inputs.deploy_core }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN staging secret is required" >&2; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "CLOUDFLARE_ACCOUNT_ID staging secret is required" >&2; exit 1; }

      - name: Apply Core D1 migrations through v21
        if: ${{ inputs.deploy_core }}
        run: pnpm --filter @lifespace/core db:migrate:staging

      - name: Deploy Core staging
        if: ${{ inputs.deploy_core }}
        working-directory: apps/core
        run: pnpm exec wrangler deploy --env staging

      - name: Verify Phase 3 D1 convergence
        run: node infra/scripts/verify-phase3-staging-db.mjs

      - name: Verify public Kernel status
        env:
          CORE_BASE_URL: ${{ inputs.core_base_url }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const base = process.env.CORE_BASE_URL.replace(/\/+$/u, "");
          const response = await fetch(`${base}/api/v1/status`);
          const payload = await response.json().catch(() => null);
          if (response.status !== 200) {
            throw new Error(`Core status expected 200, got ${response.status}: ${JSON.stringify(payload)}`);
          }
          const data = payload?.data;
          if (data?.contractVersion !== "0.12.0" || String(data?.schemaVersion) !== "21") {
            throw new Error(`Expected Kernel 0.12.0 / schema 21, got ${JSON.stringify(data)}`);
          }
          console.log(JSON.stringify({
            ok: true,
            service: data.service,
            environment: data.environment,
            contractVersion: data.contractVersion,
            schemaVersion: data.schemaVersion,
          }, null, 2));
          NODE

      - name: Next authenticated gates
        shell: bash
        run: |
          cat <<'EOF'
          Repository/D1/public-status gates passed for this exact staging ref.

          Phase 3 is NOT closed by this workflow alone.
          Using fresh staging credentials for the same deployment, run:

            LIFESPACE_CORE_STAGING_URL=<url> \
            LIFESPACE_STAGING_MODEL_ADMIN_BEARER=<service bearer> \
            LIFESPACE_STAGING_USER_BEARER=<user bearer> \
            node infra/scripts/verify-phase3-staging-http.mjs

            REQUIRE_ACTIVE_MODEL_CONTRACT=1 \
            node infra/scripts/verify-phase3-staging-db.mjs

            LIFESPACE_CORE_STAGING_URL=<url> \
            LIFESPACE_STAGING_USER_BEARER=<user bearer> \
            LIFESPACE_STAGING_SPACE_ID=<disposable space> \
            LIFESPACE_STAGING_PERSON_ID=<active person> \
            LIFESPACE_STAGING_SPACE_TIMEZONE=<timezone> \
            node infra/scripts/verify-phase3-staging-models.mjs

            LIFESPACE_CORE_STAGING_URL=<url> \
            LIFESPACE_STAGING_USER_BEARER=<user bearer> \
            LIFESPACE_STAGING_SPACE_ID=<disposable space> \
            node infra/scripts/verify-phase3-staging-creation-draft.mjs

          Do not deploy production or cut HomeMew traffic/data as part of Phase 3 staging exit.
          EOF
