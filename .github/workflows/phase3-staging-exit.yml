name: Phase 3 staging exit

on:
  workflow_dispatch:
    inputs:
      core_base_url:
        description: Public Core staging base URL, for example https://core-staging.aisr.online
        required: true
        default: https://core-staging.aisr.online
        type: string
      deploy_core:
        description: Apply Core staging migrations and deploy Core before verification
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: phase3-staging-exit
  cancel-in-progress: false

jobs:
  staging-exit:
    name: Phase 3 staging exit gates
    runs-on: ubuntu-24.04
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      LIFESPACE_STAGING_BOOTSTRAP_SECRET: ${{ secrets.LIFESPACE_STAGING_BOOTSTRAP_SECRET }}
      LIFESPACE_CORE_STAGING_URL: ${{ inputs.core_base_url }}
    steps:
      - name: Checkout exact ref
        uses: actions/checkout@v4

      - name: Report verification source
        run: |
          echo "ref=$GITHUB_REF"
          echo "sha=$GITHUB_SHA"
          echo "checkout=$(git rev-parse HEAD)"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Repository gate
        run: pnpm check

      - name: Require staging-only credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN staging secret is required" >&2; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "CLOUDFLARE_ACCOUNT_ID staging account id is required" >&2; exit 1; }
          test ${#LIFESPACE_STAGING_BOOTSTRAP_SECRET} -ge 32 || { echo "LIFESPACE_STAGING_BOOTSTRAP_SECRET must be at least 32 characters" >&2; exit 1; }
          case "${LIFESPACE_CORE_STAGING_URL}" in
            https://core-staging.aisr.online|https://core-staging.aisr.online/) ;;
            *) echo "Phase 3 staging exit refuses a non-staging Core URL: ${LIFESPACE_CORE_STAGING_URL}" >&2; exit 1 ;;
          esac

      - name: Apply Core D1 migrations through v21
        if: ${{ inputs.deploy_core }}
        run: pnpm --filter @lifespace/core db:migrate:staging

      - name: Deploy Core staging
        if: ${{ inputs.deploy_core }}
        working-directory: apps/core
        run: pnpm exec wrangler deploy --env staging

      - name: Verify Phase 3 D1 convergence
        run: node infra/scripts/verify-phase3-staging-db.mjs

      - name: Verify public Kernel status
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const base = process.env.LIFESPACE_CORE_STAGING_URL.replace(/\/+$/u, "");
          const health = await fetch(`${base}/health`);
          if (health.status !== 200) throw new Error(`Core health expected 200, got ${health.status}`);
          const response = await fetch(`${base}/api/v1/status`);
          const payload = await response.json().catch(() => null);
          if (response.status !== 200) {
            throw new Error(`Core status expected 200, got ${response.status}: ${JSON.stringify(payload)}`);
          }
          const data = payload?.data;
          if (data?.environment !== "staging" || data?.contractVersion !== "0.12.0" || String(data?.schemaVersion) !== "21") {
            throw new Error(`Expected staging Kernel 0.12.0 / schema 21, got ${JSON.stringify(data)}`);
          }
          console.log(JSON.stringify({
            ok: true,
            service: data.service,
            environment: data.environment,
            contractVersion: data.contractVersion,
            schemaVersion: data.schemaVersion,
          }, null, 2));
          NODE

      - name: Prepare ephemeral authenticated staging smoke
        run: node infra/scripts/prepare-phase3-staging-smoke.mjs

      - name: Verify authenticated Kernel and Model Contract
        run: node infra/scripts/verify-phase3-staging-http.mjs

      - name: Verify active Model Contract D1 pointer
        env:
          REQUIRE_ACTIVE_MODEL_CONTRACT: "1"
        run: node infra/scripts/verify-phase3-staging-db.mjs

      - name: Verify Task Wish Day Record Event metadata runtime
        run: node infra/scripts/verify-phase3-staging-models.mjs

      - name: Verify Registry-driven Creation Draft Queue
        run: node infra/scripts/verify-phase3-staging-creation-draft.mjs

      - name: Cleanup ephemeral staging authority
        if: ${{ always() }}
        continue-on-error: true
        run: node infra/scripts/cleanup-phase3-staging-smoke.mjs

      - name: Phase 3 staging exit summary
        if: ${{ success() }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## LifeSpace Phase 3 staging exit

          - Repository gate: passed
          - Core: schema v21 / Kernel contract 0.12.0
          - Phase 3 generic D1 convergence: passed
          - Service-only Model Admin and AI Admin boundary: passed
          - Active immutable Model Contract `mct_*`: passed
          - Task: Generic Runtime + defaults + Workflow: passed
          - Wish: Generic Runtime + Policy + Workflow: passed
          - Day Record: Generic Runtime + Temporal: passed
          - Event: Generic Runtime + Calendar: passed
          - Registry-driven Creation Draft Queue: reached a valid terminal state
          - Ephemeral smoke service PAT: 15-minute maximum lifetime; cleanup attempted
          - Production and HomeMew traffic/data: untouched

          This run is suitable as the technical staging evidence for Phase 3 closeout.
          EOF
