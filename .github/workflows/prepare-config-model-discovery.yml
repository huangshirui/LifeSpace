name: Prepare configuration model discovery contract

on:
  push:
    branches:
      - fix/config-model-discovery

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update Kernel OpenAPI contract
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'apps/core/openapi.yaml';
          const doc = JSON.parse(fs.readFileSync(path, 'utf8'));

          doc.info.version = '0.49.0';
          const releaseNote = ' Kernel 0.49.0 adds application/credential-scoped configuration model discovery so generic consumers can configure model semantics without requiring current Space Membership, Data Grant or Delegation; concrete data execution remains fully runtime-authorized.';
          if (!doc.info.description.includes('Kernel 0.49.0')) doc.info.description += releaseNote;
          doc.components.schemas.StatusResponse.properties.data.properties.contractVersion.const = '0.49.0';

          doc.paths['/api/v1/me/_discovery/models'] = {
            get: {
              tags: ['Me', 'Runtime Discovery'],
              operationId: 'getConfigurationModelInventory',
              description: 'Returns a compact configuration-time model inventory for the authenticated credential/application. Eligibility is the intersection of credential resources:* scopes, current Application × Model Access and published model declared access. Space Membership, Data Grant and Delegation are deliberately not consulted. The response contains no Space business data and grants no Space Authority; every concrete read/write/action still rechecks current runtime Authority.',
              responses: {
                200: {
                  description: 'Configuration-time model inventory independent of Space data Authority',
                  content: { 'application/json': { schema: { $ref: '#/components/schemas/ConfigurationModelInventoryResponse' } } },
                },
                401: { $ref: '#/components/responses/Unauthorized' },
              },
            },
          };

          doc.paths['/api/v1/me/_discovery/models/{modelKey}'] = {
            parameters: [{ $ref: '#/components/parameters/ModelKey' }],
            get: {
              tags: ['Me', 'Runtime Discovery'],
              operationId: 'getConfigurationModelSemanticDetail',
              description: 'Returns versioned static semantic detail for one model that the authenticated credential/application may configure. Visibility is bounded by credential scope, current Application × Model Access and published model declared access only; Space Membership, Data Grant and Delegation are not configuration prerequisites. The successful response also returns the configuration access ceiling used by adapters to decide which operations may be configured. This is never authorization proof for a concrete Space operation.',
              responses: {
                200: {
                  description: 'Configuration-time semantic detail and non-Space access ceiling',
                  content: { 'application/json': { schema: { $ref: '#/components/schemas/ConfigurationModelDetailResponse' } } },
                },
                401: { $ref: '#/components/responses/Unauthorized' },
                404: { $ref: '#/components/responses/NotFound' },
              },
            },
          };

          const accessArray = {
            type: 'array',
            minItems: 1,
            uniqueItems: true,
            items: { $ref: '#/components/schemas/RuntimeDiscoveryAccess' },
            description: 'Maximum operations configurable under the current credential scope, Application × Model Access and published model capability. This excludes Space Membership/Data Grant/Delegation and is not data Authority.',
          };

          doc.components.schemas.ConfigurationModelInventoryModel = {
            type: 'object',
            additionalProperties: false,
            required: ['key', 'version', 'schemaHash', 'display', 'capabilities', 'actions', 'access'],
            properties: {
              key: { type: 'string', pattern: '^[a-z][a-z0-9_]{1,62}$' },
              version: { type: 'integer', minimum: 1 },
              schemaHash: { type: 'string', pattern: '^[a-f0-9]{64}$' },
              display: { $ref: '#/components/schemas/RuntimeDiscoveryDisplay' },
              capabilities: { type: 'array', uniqueItems: true, items: { type: 'string' } },
              actions: { type: 'array', items: { $ref: '#/components/schemas/RuntimeDiscoveryInventoryAction' } },
              access: accessArray,
            },
          };

          doc.components.schemas.ConfigurationModelInventoryResponse = {
            type: 'object',
            additionalProperties: false,
            required: ['data'],
            properties: {
              data: {
                type: 'object',
                additionalProperties: false,
                required: ['semanticDetailPathTemplate', 'models'],
                properties: {
                  semanticDetailPathTemplate: {
                    const: '/api/v1/me/_discovery/models/{modelKey}',
                    description: 'Application/credential-scoped static semantic detail path; it is deliberately not bound to a Space.',
                  },
                  models: { type: 'array', items: { $ref: '#/components/schemas/ConfigurationModelInventoryModel' } },
                },
              },
            },
          };

          doc.components.schemas.ConfigurationModelDetailResponse = {
            type: 'object',
            additionalProperties: false,
            required: ['data'],
            properties: {
              data: {
                type: 'object',
                additionalProperties: false,
                required: ['access', 'model'],
                properties: {
                  access: accessArray,
                  model: { $ref: '#/components/schemas/RuntimeModelSemanticDetail' },
                },
              },
            },
          };

          fs.writeFileSync(path, JSON.stringify(doc));
          NODE

      - name: Update checked-in contract documentation
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const contractsPath = 'docs/contracts.md';
          let contracts = fs.readFileSync(contractsPath, 'utf8');
          const heading = '## Kernel 0.49.0 — configuration-time model semantic discovery';
          if (!contracts.includes(heading)) {
            const anchor = '## Kernel 0.43.0 — Atomic multi-Delegation issuance';
            const section = `${heading}\n\nKernel 0.49.0 adds authenticated Application/credential-scoped model inventory and semantic-detail discovery under \`/api/v1/me/_discovery/models*\`. Configuration eligibility is bounded by credential \`resources:*\` scopes, current Application × Model Access and published model capability, but deliberately does not require Space Membership, Data Grant or Delegation. This lets generic consumers bind a future \`spc_*\` target and model before data Authority exists; every concrete Runtime operation still rechecks the complete current Authority intersection.\n\n`;
            contracts = contracts.replace(anchor, section + anchor);
          }
          contracts = contracts.replace(
            'The checked-in contract is `apps/core/openapi.yaml`; Kernel `0.44.0` adds first-class opaque Agent API credential authentication',
            'The checked-in contract is `apps/core/openapi.yaml`; Kernel `0.49.0` separates configuration-time model semantic discovery from Space data Authority while preserving execution-time authorization. Kernel `0.44.0` adds first-class opaque Agent API credential authentication',
          );
          fs.writeFileSync(contractsPath, contracts);

          const agentsPath = 'apps/core/AGENTS.md';
          let agents = fs.readFileSync(agentsPath, 'utf8');
          agents = agents.replace('current Kernel version: 0.48.0', 'current Kernel version: 0.49.0');
          fs.writeFileSync(agentsPath, agents);
          NODE

      - name: Commit generated contract updates and remove helper workflow
        run: |
          rm .github/workflows/prepare-config-model-discovery.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/core/openapi.yaml apps/core/AGENTS.md docs/contracts.md .github/workflows/prepare-config-model-discovery.yml
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "docs(core): publish configuration discovery contract"
          git push
