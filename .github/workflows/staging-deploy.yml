name: Deploy staging

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lifespace-staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrate, deploy and verify staging
    runs-on: ubuntu-latest
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      LIFESPACE_STAGING_BOOTSTRAP_SECRET: ${{ secrets.LIFESPACE_STAGING_BOOTSTRAP_SECRET }}
      LIFESPACE_CORE_STAGING_URL: https://core-staging.aisr.online
      LIFESPACE_IDENTITY_STAGING_URL: https://auth-staging.aisr.online
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Report deployment source
        run: |
          echo "ref=$GITHUB_REF"
          echo "sha=$GITHUB_SHA"
          echo "checkout=$(git rev-parse HEAD)"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
          run_install: false

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Validate staging credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN is not configured" >&2; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "CLOUDFLARE_ACCOUNT_ID is not configured" >&2; exit 1; }
          test ${#LIFESPACE_STAGING_BOOTSTRAP_SECRET} -ge 32 || { echo "LIFESPACE_STAGING_BOOTSTRAP_SECRET must be at least 32 characters" >&2; exit 1; }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate repository
        run: pnpm check

      - name: Validate staging verifier syntax
        run: |
          node --check infra/scripts/verify-staging-application-admin.mjs
          node --check infra/scripts/verify-staging-homemew-integration.mjs

      - name: Resolve expected staging versions
        run: node infra/scripts/staging-expectations.mjs

      - name: Resolve staging D1 IDs
        run: node infra/scripts/resolve-staging-d1.mjs

      - name: Apply Core migrations
        run: pnpm --filter @lifespace/core db:migrate:staging

      - name: Deploy Core first
        run: pnpm --dir apps/core exec wrangler deploy --env staging

      - name: Wait for Core staging convergence
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors https://core-staging.aisr.online/health
          echo
          for attempt in $(seq 1 12); do
            STATUS="$(curl --fail --silent --show-error https://core-staging.aisr.online/api/v1/status || true)"
            if [ -n "$STATUS" ] && printf '%s' "$STATUS" | EXPECTED_CONTRACT="$LIFESPACE_EXPECTED_CORE_CONTRACT_VERSION" EXPECTED_SCHEMA="$LIFESPACE_EXPECTED_CORE_SCHEMA_VERSION" node --input-type=module -e '
              import fs from "node:fs";
              const data = JSON.parse(fs.readFileSync(0, "utf8"))?.data ?? {};
              process.exit(data.environment === "staging" && String(data.schemaVersion) === process.env.EXPECTED_SCHEMA && data.contractVersion === process.env.EXPECTED_CONTRACT ? 0 : 1);
            '; then
              echo "$STATUS"
              echo "Core staging converged to schema v${LIFESPACE_EXPECTED_CORE_SCHEMA_VERSION} / contract ${LIFESPACE_EXPECTED_CORE_CONTRACT_VERSION}"
              break
            fi
            echo "Core staging has not converged yet (attempt ${attempt}/12): ${STATUS:-<no response>}"
            if [ "$attempt" -eq 12 ]; then exit 1; fi
            sleep 5
          done

      - name: Apply Identity migrations
        run: pnpm --filter @lifespace/identity db:migrate:staging

      - name: Deploy Identity after compatible Core
        run: pnpm --dir apps/identity exec wrangler deploy --env staging

      - name: Ensure staging custom domains
        run: node infra/scripts/ensure-staging-domains.mjs

      - name: Wait for Identity staging convergence
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors https://auth-staging.aisr.online/health
          echo
          for attempt in $(seq 1 12); do
            STATUS="$(curl --fail --silent --show-error https://auth-staging.aisr.online/api/v1/status || true)"
            if [ -n "$STATUS" ] && printf '%s' "$STATUS" | EXPECTED_CONTRACT="$LIFESPACE_EXPECTED_IDENTITY_CONTRACT_VERSION" EXPECTED_SCHEMA="$LIFESPACE_EXPECTED_IDENTITY_SCHEMA_VERSION" node --input-type=module -e '
              import fs from "node:fs";
              const data = JSON.parse(fs.readFileSync(0, "utf8"))?.data ?? {};
              process.exit(data.environment === "staging" && String(data.schemaVersion) === process.env.EXPECTED_SCHEMA && data.contractVersion === process.env.EXPECTED_CONTRACT ? 0 : 1);
            '; then
              echo "$STATUS"
              echo "Identity staging converged to schema v${LIFESPACE_EXPECTED_IDENTITY_SCHEMA_VERSION} / contract ${LIFESPACE_EXPECTED_IDENTITY_CONTRACT_VERSION}"
              break
            fi
            echo "Identity staging has not converged yet (attempt ${attempt}/12): ${STATUS:-<no response>}"
            if [ "$attempt" -eq 12 ]; then exit 1; fi
            sleep 5
          done

      - name: Verify staging database convergence
        run: node infra/scripts/verify-staging-db.mjs

      - name: Prepare ephemeral authenticated staging smoke
        run: node infra/scripts/prepare-staging-smoke.mjs

      - name: Verify trusted application credential lifecycle
        run: node infra/scripts/verify-staging-application-admin.mjs

      - name: Verify HomeMew integration readiness boundary
        run: node infra/scripts/verify-staging-homemew-integration.mjs

      - name: Verify authenticated Kernel and Model Contract
        run: node infra/scripts/verify-staging-http.mjs

      - name: Verify active Model Contract D1 pointer
        env:
          REQUIRE_ACTIVE_MODEL_CONTRACT: "1"
        run: node infra/scripts/verify-staging-db.mjs

      - name: Verify proving-model platform regression
        run: node infra/scripts/verify-staging-models.mjs

      - name: Measure typed-runtime staging performance
        run: node infra/scripts/verify-staging-performance.mjs

      - name: Verify Registry-driven Creation Draft Queue
        run: node infra/scripts/verify-staging-creation-draft.mjs

      - name: Cleanup ephemeral staging authority
        if: ${{ always() }}
        continue-on-error: true
        run: node infra/scripts/cleanup-staging-smoke.mjs

      - name: Summarize staging deployment
        if: ${{ success() }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## LifeSpace staging deployment

          - Core: schema v${LIFESPACE_EXPECTED_CORE_SCHEMA_VERSION} / Kernel contract ${LIFESPACE_EXPECTED_CORE_CONTRACT_VERSION}
          - Identity: schema v${LIFESPACE_EXPECTED_IDENTITY_SCHEMA_VERSION} / contract ${LIFESPACE_EXPECTED_IDENTITY_CONTRACT_VERSION}
          - Platform D1 convergence: passed
          - Trusted application credential replacement/revocation lifecycle: passed
          - HomeMew integration profile / app-scoped user-token boundary: passed
          - HomeMew user-token platform-admin scope exclusion: passed
          - HomeMew Application x Model Access (Task/Wish/Day Record/Event): passed
          - Typed model storage / legacy JSON cleanup: passed
          - D1 hot-path budgets: passed in repository validation
          - Staging HTTP performance benchmark: recorded in workflow logs
          - Service-only Model Admin / AI Admin boundary: passed
          - Active immutable Model Contract \`mct_*\`: passed
          - Proving models (Task/Wish/Day Record/Event): passed
          - Registry-driven Creation Draft Queue: reached a valid terminal state
          - Ephemeral smoke PAT: maximum 15-minute lifetime; cleanup attempted
          - Production and HomeMew traffic/data were not touched.
          EOF
