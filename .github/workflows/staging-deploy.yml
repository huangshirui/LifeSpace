name: Deploy staging

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lifespace-staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrate and deploy staging
    runs-on: ubuntu-latest
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      LIFESPACE_STAGING_BOOTSTRAP_SECRET: ${{ secrets.LIFESPACE_STAGING_BOOTSTRAP_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Report deployment source
        run: |
          echo "ref=$GITHUB_REF"
          echo "sha=$GITHUB_SHA"
          echo "checkout=$(git rev-parse HEAD)"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
          run_install: false

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Validate staging credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "CLOUDFLARE_API_TOKEN is not configured" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "CLOUDFLARE_ACCOUNT_ID is not configured" && exit 1)
          test ${#LIFESPACE_STAGING_BOOTSTRAP_SECRET} -ge 32 || (echo "LIFESPACE_STAGING_BOOTSTRAP_SECRET must be at least 32 characters" && exit 1)

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Finalize profile/assets source and generated bindings
        run: |
          test -f infra/scripts/phase2-profile-assets-patch.mjs
          test -f infra/scripts/phase2-profile-assets-patch-addon.mjs
          node infra/scripts/phase2-profile-assets-patch.mjs
          node infra/scripts/phase2-profile-assets-patch-addon.mjs
          pnpm --dir apps/core exec wrangler types src/worker-configuration.d.ts --env-interface CloudflareBindings --include-runtime false

      - name: Validate repository
        run: pnpm check

      - name: Persist validated profile/assets finalization
        run: |
          rm infra/scripts/phase2-profile-assets-patch.mjs
          rm infra/scripts/phase2-profile-assets-patch-addon.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat: complete native user profile and avatar assets"
            git push origin HEAD:phase2-user-profile-assets
          fi

      - name: Resolve staging D1 IDs
        run: node infra/scripts/resolve-staging-d1.mjs

      - name: Apply Core migrations
        run: pnpm --filter @lifespace/core db:migrate:staging

      - name: Deploy Core first
        run: pnpm --dir apps/core exec wrangler deploy --env staging

      - name: Wait for Core 0.9 staging convergence
        run: |
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors https://core-staging.aisr.online/health
          echo
          for attempt in $(seq 1 12); do
            STATUS="$(curl --fail --silent --show-error https://core-staging.aisr.online/api/v1/status || true)"
            if [ -n "$STATUS" ] && printf '%s' "$STATUS" | node --input-type=module -e '
              import fs from "node:fs";
              const data = JSON.parse(fs.readFileSync(0, "utf8"))?.data ?? {};
              process.exit(data.environment === "staging" && data.schemaVersion === "8" && data.contractVersion === "0.9.0" ? 0 : 1);
            '; then
              echo "$STATUS"
              echo "Core staging is serving schema v8 / contract 0.9.0"
              break
            fi
            echo "Core staging has not converged to schema v8 / contract 0.9.0 yet (attempt ${attempt}/12): ${STATUS:-<no response>}"
            if [ "$attempt" -eq 12 ]; then exit 1; fi
            sleep 5
          done

      - name: Apply Identity migrations
        run: pnpm --filter @lifespace/identity db:migrate:staging

      - name: Deploy Identity after compatible Core
        run: pnpm --dir apps/identity exec wrangler deploy --env staging

      - name: Ensure staging custom domains
        run: node infra/scripts/ensure-staging-domains.mjs

      - name: Wait for Identity 0.2 staging convergence
        run: |
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors https://auth-staging.aisr.online/health
          echo
          for attempt in $(seq 1 12); do
            STATUS="$(curl --fail --silent --show-error https://auth-staging.aisr.online/api/v1/status || true)"
            if [ -n "$STATUS" ] && printf '%s' "$STATUS" | node --input-type=module -e '
              import fs from "node:fs";
              const data = JSON.parse(fs.readFileSync(0, "utf8"))?.data ?? {};
              process.exit(data.environment === "staging" && data.schemaVersion === "3" && data.contractVersion === "0.2.0" ? 0 : 1);
            '; then
              echo "$STATUS"
              echo "Identity staging is serving schema v3 / contract 0.2.0"
              break
            fi
            echo "Identity staging has not converged to schema v3 / contract 0.2.0 yet (attempt ${attempt}/12): ${STATUS:-<no response>}"
            if [ "$attempt" -eq 12 ]; then exit 1; fi
            sleep 5
          done

      - name: Initialize runtime secrets and run native staging smoke test
        run: node infra/scripts/initialize-staging-runtime.mjs
