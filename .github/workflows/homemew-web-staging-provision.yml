name: Provision HomeMew Web staging

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/homemew-web-staging-provision.yml
      - infra/scripts/prepare-staging-web-access.mjs
      - infra/scripts/prepare-staging-homemew-web-model-access.mjs
      - infra/scripts/prepare-staging-homemew-web-integrations.mjs

permissions:
  contents: read
  statuses: write

concurrency:
  group: homemew-web-staging-provision
  cancel-in-progress: false

jobs:
  provision:
    name: Provision HomeMew Web staging identity and secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      LIFESPACE_STAGING_BOOTSTRAP_SECRET: ${{ secrets.LIFESPACE_STAGING_BOOTSTRAP_SECRET }}
      LIFESPACE_IDENTITY_STAGING_URL: https://auth-staging.aisr.online
      LIFESPACE_STAGING_ACCESS_AUD: 645c12c44fa8eb1229d7a2cfc0320913df4e852ecfd9a5407accc11b589084c8
      LIFESPACE_STAGING_WEB_APPLICATION_ID: app_homemew_web_staging
      LIFESPACE_STAGING_WEB_APPLICATION_NAME: HomeMew Web staging
      LIFESPACE_STAGING_INTEGRATIONS_APPLICATION_ID: app_homemew_integrations_staging
      LIFESPACE_STAGING_INTEGRATIONS_APPLICATION_NAME: HomeMew integrations staging
      HOMEMEW_WEB_STAGING_WORKER_NAME: homemew-web-staging

    steps:
      - name: Checkout LifeSpace
        uses: actions/checkout@v4

      - name: Report provisioning started
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo "starting" > "$RUNNER_TEMP/homemew-web-provision-stage"
          node --input-type=module <<'NODE'
          const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
          const response = await fetch(`${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/statuses/${process.env.GITHUB_SHA}`, {
            method: 'POST',
            headers: {
              authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
              accept: 'application/vnd.github+json',
              'x-github-api-version': '2022-11-28',
              'content-type': 'application/json',
            },
            body: JSON.stringify({
              state: 'pending',
              target_url: runUrl,
              description: 'HomeMew Web staging provisioning started',
              context: 'homemew-web-staging/provision',
            }),
          });
          if (!response.ok) throw new Error(`Could not publish pending commit status: ${response.status}`);
          NODE

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate staging authority
        shell: bash
        run: |
          echo "validate-authority" > "$RUNNER_TEMP/homemew-web-provision-stage"
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN is not configured" >&2; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "CLOUDFLARE_ACCOUNT_ID is not configured" >&2; exit 1; }
          test ${#LIFESPACE_STAGING_BOOTSTRAP_SECRET} -ge 32 || { echo "LIFESPACE_STAGING_BOOTSTRAP_SECRET must be at least 32 characters" >&2; exit 1; }

      - name: Register LifeSpace Web application and Access audience
        run: |
          echo "identity-registration" > "$RUNNER_TEMP/homemew-web-provision-stage"
          node infra/scripts/prepare-staging-web-access.mjs

      - name: Provision HomeMew Web model authority
        run: |
          echo "web-model-access" > "$RUNNER_TEMP/homemew-web-provision-stage"
          node infra/scripts/prepare-staging-homemew-web-model-access.mjs

      - name: Ensure deployable LifeSpace application credential
        shell: bash
        run: |
          echo "credential-rotation" > "$RUNNER_TEMP/homemew-web-provision-stage"
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const base = process.env.LIFESPACE_IDENTITY_STAGING_URL.replace(/\/+$/u, '');
          const appId = process.env.LIFESPACE_STAGING_WEB_APPLICATION_ID;
          const bootstrap = process.env.LIFESPACE_STAGING_BOOTSTRAP_SECRET;
          const headers = { accept: 'application/json', 'x-bootstrap-secret': bootstrap };

          async function request(path, options = {}) {
            const response = await fetch(`${base}${path}`, {
              method: options.method ?? 'GET',
              headers: {
                ...headers,
                ...(options.body === undefined ? {} : { 'content-type': 'application/json' }),
              },
              ...(options.body === undefined ? {} : { body: JSON.stringify(options.body) }),
            });
            const text = await response.text();
            const payload = text ? JSON.parse(text) : null;
            return { response, payload };
          }

          const listPath = `/bootstrap/v1/applications/${encodeURIComponent(appId)}/credentials`;
          const listed = await request(listPath);
          if (listed.response.status !== 200 || !Array.isArray(listed.payload?.data)) {
            throw new Error(`Could not list HomeMew Web credentials: ${listed.response.status}`);
          }

          let active = listed.payload.data.filter((entry) => entry?.status === 'active' && entry?.revokedAt == null);
          let credential = process.env.LIFESPACE_STAGING_WEB_APPLICATION_CREDENTIAL?.trim() || '';
          let currentCredentialId = '';

          if (credential) {
            const suffix = credential.slice(-8);
            const matches = active.filter((entry) => entry?.secretSuffix === suffix);
            if (matches.length !== 1) {
              throw new Error('Could not identify the freshly-created HomeMew Web credential by suffix');
            }
            currentCredentialId = matches[0].id;
          } else {
            const created = await request(listPath, { method: 'POST' });
            if (created.response.status !== 201 || !created.payload?.data?.clientSecret?.startsWith('lsa_')) {
              throw new Error(`Could not rotate HomeMew Web credential: ${created.response.status}`);
            }
            credential = created.payload.data.clientSecret;
            currentCredentialId = created.payload.data.id;
            active = [...active, created.payload.data];
          }

          console.log(`::add-mask::${credential}`);
          const previousIds = active
            .filter((entry) => entry.id !== currentCredentialId)
            .map((entry) => entry.id)
            .join(',');

          fs.appendFileSync(process.env.GITHUB_ENV, `LIFESPACE_STAGING_WEB_APPLICATION_CREDENTIAL=${credential}\n`, 'utf8');
          fs.appendFileSync(process.env.GITHUB_ENV, `LIFESPACE_STAGING_WEB_CURRENT_CREDENTIAL_ID=${currentCredentialId}\n`, 'utf8');
          fs.appendFileSync(process.env.GITHUB_ENV, `LIFESPACE_STAGING_WEB_OLD_CREDENTIAL_IDS=${previousIds}\n`, 'utf8');
          NODE

      - name: Install HomeMew Web Worker base secrets
        shell: bash
        run: |
          echo "install-worker-secrets" > "$RUNNER_TEMP/homemew-web-provision-stage"
          set -euo pipefail
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';

          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const apiToken = process.env.CLOUDFLARE_API_TOKEN;
          const workerName = process.env.HOMEMEW_WEB_STAGING_WORKER_NAME;
          const applicationCredential = process.env.LIFESPACE_STAGING_WEB_APPLICATION_CREDENTIAL;
          if (!applicationCredential?.startsWith('lsa_')) {
            throw new Error('LifeSpace did not provide a deployable HomeMew Web application credential');
          }

          const sessionSecret = crypto.randomBytes(48).toString('base64url');
          console.log(`::add-mask::${applicationCredential}`);
          console.log(`::add-mask::${sessionSecret}`);

          async function putSecret(name, text) {
            const response = await fetch(
              `https://api.cloudflare.com/client/v4/accounts/${encodeURIComponent(accountId)}/workers/scripts/${encodeURIComponent(workerName)}/secrets`,
              {
                method: 'PUT',
                headers: {
                  authorization: `Bearer ${apiToken}`,
                  accept: 'application/json',
                  'content-type': 'application/json',
                },
                body: JSON.stringify({ name, text, type: 'secret_text' }),
              },
            );
            const payload = await response.json().catch(() => null);
            if (!response.ok || payload?.success !== true) {
              throw new Error(`Could not install Worker secret ${name} (HTTP ${response.status})`);
            }
          }

          await putSecret('LIFESPACE_APPLICATION_CREDENTIAL', applicationCredential);
          await putSecret('WEB_SESSION_SECRET', sessionSecret);
          NODE

      - name: Provision W4 external integrations authority
        run: |
          echo "integrations-provision" > "$RUNNER_TEMP/homemew-web-provision-stage"
          node infra/scripts/prepare-staging-homemew-web-integrations.mjs

      - name: Verify HomeMew Web Worker secrets
        shell: bash
        run: |
          echo "verify-worker-secrets" > "$RUNNER_TEMP/homemew-web-provision-stage"
          set -euo pipefail
          node --input-type=module <<'NODE'
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const apiToken = process.env.CLOUDFLARE_API_TOKEN;
          const workerName = process.env.HOMEMEW_WEB_STAGING_WORKER_NAME;
          const response = await fetch(
            `https://api.cloudflare.com/client/v4/accounts/${encodeURIComponent(accountId)}/workers/scripts/${encodeURIComponent(workerName)}/secrets`,
            { headers: { authorization: `Bearer ${apiToken}`, accept: 'application/json' } },
          );
          const payload = await response.json().catch(() => null);
          if (!response.ok || payload?.success !== true || !Array.isArray(payload?.result)) {
            throw new Error(`Could not verify HomeMew Web Worker secrets (HTTP ${response.status})`);
          }
          const names = new Set(payload.result.map((entry) => entry?.name).filter(Boolean));
          for (const required of [
            'LIFESPACE_APPLICATION_CREDENTIAL',
            'WEB_SESSION_SECRET',
            'LIFESPACE_INTEGRATIONS_APPLICATION_CREDENTIAL',
          ]) {
            if (!names.has(required)) throw new Error(`Required HomeMew Web Worker secret is missing: ${required}`);
          }
          NODE

      - name: Verify staging hostname is live
        shell: bash
        run: |
          echo "verify-domain" > "$RUNNER_TEMP/homemew-web-provision-stage"
          set -euo pipefail
          for attempt in $(seq 1 20); do
            if code="$(curl --silent --show-error --head --output /dev/null --write-out '%{http_code}' --connect-timeout 5 --max-time 10 https://homemew-web-staging.aisr.online/health)"; then
              if [ "$code" -ge 200 ] && [ "$code" -lt 500 ]; then
                echo "homemew-web-staging.aisr.online is reachable (HTTP $code; Access may redirect/deny unauthenticated CI)"
                exit 0
              fi
            fi
            echo "Waiting for HomeMew Web staging hostname (${attempt}/20)"
            sleep 3
          done
          echo "HomeMew Web staging hostname did not become reachable" >&2
          exit 1

      - name: Revoke superseded LifeSpace Web application credentials
        shell: bash
        run: |
          echo "revoke-old-credentials" > "$RUNNER_TEMP/homemew-web-provision-stage"
          set -euo pipefail
          node --input-type=module <<'NODE'
          const oldIds = (process.env.LIFESPACE_STAGING_WEB_OLD_CREDENTIAL_IDS ?? '').split(',').filter(Boolean);
          if (!oldIds.length) process.exit(0);

          const base = process.env.LIFESPACE_IDENTITY_STAGING_URL.replace(/\/+$/u, '');
          const appId = process.env.LIFESPACE_STAGING_WEB_APPLICATION_ID;
          for (const credentialId of oldIds) {
            const response = await fetch(
              `${base}/bootstrap/v1/applications/${encodeURIComponent(appId)}/credentials/${encodeURIComponent(credentialId)}`,
              { method: 'DELETE', headers: { 'x-bootstrap-secret': process.env.LIFESPACE_STAGING_BOOTSTRAP_SECRET } },
            );
            if (response.status !== 204 && response.status !== 404) {
              throw new Error(`Could not revoke superseded credential ${credentialId}: ${response.status}`);
            }
          }
          NODE

      - name: Report provisioning result
        if: ${{ always() }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const stagePath = `${process.env.RUNNER_TEMP}/homemew-web-provision-stage`;
          const stage = fs.existsSync(stagePath) ? fs.readFileSync(stagePath, 'utf8').trim() : 'unknown';
          const succeeded = process.env.JOB_STATUS === 'success';
          const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
          const description = succeeded
            ? 'HomeMew Web staging provisioning succeeded'
            : `HomeMew Web staging failed at ${stage}`;

          const response = await fetch(`${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/statuses/${process.env.GITHUB_SHA}`, {
            method: 'POST',
            headers: {
              authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
              accept: 'application/vnd.github+json',
              'x-github-api-version': '2022-11-28',
              'content-type': 'application/json',
            },
            body: JSON.stringify({
              state: succeeded ? 'success' : 'failure',
              target_url: runUrl,
              description,
              context: 'homemew-web-staging/provision',
            }),
          });
          if (!response.ok) throw new Error(`Could not publish final commit status: ${response.status}`);
          NODE

      - name: Summarize staging provisioning
        if: ${{ success() }}
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## HomeMew Web staging provisioning

          - Browser LifeSpace application: `app_homemew_web_staging`
          - Browser on-demand integration-manager scope: `grants:manage` enabled; normal ambient session remains unchanged
          - Browser Application × Model Access: `event=write`, `task=write`, `day_record=write`, `wish=write`
          - Access AUD: `645c12c44fa8eb1229d7a2cfc0320913df4e852ecfd9a5407accc11b589084c8`
          - Integrations LifeSpace application: `app_homemew_integrations_staging`
          - Integrations application scopes: `resources:read`, `resources:write`
          - Integrations Application × Model Access: `event=write`, `task=write`, `day_record=write`
          - Worker: `homemew-web-staging`
          - Web hostname: `homemew-web-staging.aisr.online`
          - Worker secrets: base LifeSpace application credential, Web session secret and dedicated integrations application credential installed
          - Superseded active application credentials: revoked only after replacement installation and verification
          - Production resources/routes: untouched
          - Next verification: authenticated HomeMew browser creates a service principal/token/Data Grants, then n8n/curl exercises read/write and deny paths
          EOF
