name: Provision HomeMew Web staging

on:
  workflow_dispatch:
  push:
    branches:
      - ops/homemew-web-staging-provision-run
    paths:
      - .github/workflows/homemew-web-staging-provision.yml

permissions:
  contents: read

concurrency:
  group: homemew-web-staging-provision
  cancel-in-progress: false

jobs:
  provision:
    name: Provision and deploy HomeMew Web staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      LIFESPACE_STAGING_BOOTSTRAP_SECRET: ${{ secrets.LIFESPACE_STAGING_BOOTSTRAP_SECRET }}
      LIFESPACE_STAGING_ACCESS_AUD: 645c12c44fa8eb1229d7a2cfc0320913df4e852ecfd9a5407accc11b589084c8
      LIFESPACE_STAGING_WEB_APPLICATION_ID: app_homemew_web_staging
      LIFESPACE_STAGING_WEB_APPLICATION_NAME: HomeMew Web staging

    steps:
      - name: Checkout LifeSpace
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate staging authority
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN is not configured" >&2; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "CLOUDFLARE_ACCOUNT_ID is not configured" >&2; exit 1; }
          test ${#LIFESPACE_STAGING_BOOTSTRAP_SECRET} -ge 32 || { echo "LIFESPACE_STAGING_BOOTSTRAP_SECRET must be at least 32 characters" >&2; exit 1; }

      - name: Register LifeSpace Web application and Access audience
        run: node infra/scripts/prepare-staging-web-access.mjs

      - name: Checkout HomeMew main
        uses: actions/checkout@v4
        with:
          repository: huangshirui/HomeMew
          ref: main
          path: homemew

      - name: Enable Corepack
        run: corepack enable

      - name: Install HomeMew dependencies
        working-directory: homemew
        run: corepack pnpm install --frozen-lockfile

      - name: Validate HomeMew workspace
        working-directory: homemew
        run: corepack pnpm check

      - name: Prepare ephemeral Worker secrets file
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          import path from 'node:path';

          const applicationCredential = process.env.LIFESPACE_STAGING_WEB_APPLICATION_CREDENTIAL;
          if (!applicationCredential?.startsWith('lsa_')) {
            throw new Error('HomeMew Web application credential was not produced by LifeSpace provisioning');
          }

          const sessionSecret = crypto.randomBytes(48).toString('base64url');
          console.log(`::add-mask::${applicationCredential}`);
          console.log(`::add-mask::${sessionSecret}`);

          const output = path.join(process.env.RUNNER_TEMP, 'homemew-web-staging-secrets.json');
          fs.writeFileSync(output, JSON.stringify({
            LIFESPACE_APPLICATION_CREDENTIAL: applicationCredential,
            WEB_SESSION_SECRET: sessionSecret,
          }), { encoding: 'utf8', mode: 0o600, flag: 'wx' });
          fs.appendFileSync(process.env.GITHUB_ENV, `HOMEMEW_WEB_STAGING_SECRETS_FILE=${output}\n`, 'utf8');
          NODE

      - name: Build HomeMew Web
        working-directory: homemew/apps/web
        run: corepack pnpm build

      - name: Deploy HomeMew Web staging with Worker secrets
        working-directory: homemew/apps/web
        run: >-
          corepack pnpm exec wrangler deploy
          --env staging
          --secrets-file "$HOMEMEW_WEB_STAGING_SECRETS_FILE"

      - name: Remove ephemeral secrets file
        if: ${{ always() }}
        shell: bash
        run: rm -f "${HOMEMEW_WEB_STAGING_SECRETS_FILE:-$RUNNER_TEMP/homemew-web-staging-secrets.json}"

      - name: Summarize staging provisioning
        if: ${{ success() }}
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## HomeMew Web staging

          - LifeSpace application: `app_homemew_web_staging`
          - Access AUD: `645c12c44fa8eb1229d7a2cfc0320913df4e852ecfd9a5407accc11b589084c8`
          - Web hostname: `homemew-web-staging.aisr.online`
          - HomeMew source: `huangshirui/HomeMew@main`
          - LifeSpace application credential: generated/verified and installed as a Worker Secret without plaintext output
          - Web session secret: generated in-run and installed as a Worker Secret without plaintext output
          - Production resources/routes: untouched
          - Next verification: real browser Cloudflare Access -> LifeSpace Identity -> HomeMew app-session E2E
          EOF
