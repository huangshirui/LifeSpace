name: Close out Phase 7 docs once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/phase7-closeout-docs-once.yml

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize Phase 7 closeout wording
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/migration-plan.md')
          text = path.read_text()
          duplicate = 'The executed sequence followed the controlled write-freeze design below. There was no normal dual-write interval.\n\nUse a controlled write freeze. There is no normal dual-write interval.\n\n'
          replacement = 'The executed sequence followed the controlled write-freeze design below. There was no normal dual-write interval.\n\n'
          if duplicate not in text:
              raise SystemExit('Phase 7 closeout wording already normalized or unexpected')
          path.write_text(text.replace(duplicate, replacement, 1))
          PY

      - name: Commit closeout documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/migration-plan.md
          git diff --cached --check
          git commit -m "docs: normalize HomeMew Phase 7 closeout"
          git push
