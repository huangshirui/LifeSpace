name: Temporary Generate Stable Baseline

on:
  push:
    branches: [cleanup/remove-space-kind-final]

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4.4.0
        with:
          version: 10.13.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Generate reviewed Stable Public baseline
        run: pnpm --filter @lifespace/core stable-contract:baseline
      - name: Commit generated baseline
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/stable-public-schema-baseline.json.gz.b64; then
            echo "Stable baseline already matches."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/stable-public-schema-baseline.json.gz.b64
          git commit -m "contract(core): regenerate Stable baseline for Kernel 0.39.0"
          git push
