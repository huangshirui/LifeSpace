name: Console UI prerequisite patch (temporary)

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'feat/lifespace-console-ui-shell'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/lifespace-console-ui-shell
          fetch-depth: 0

      - name: Patch existing application-id compatibility
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          old_runtime = '/^app_[A-Za-z0-9_-]{1,120}$/u'
          new_runtime = '/^[A-Za-z0-9][A-Za-z0-9_-]{0,119}$/u'
          for filename in [
              'apps/identity/src/platform-admin.ts',
              'apps/identity/src/platform-service-admin.ts',
              'apps/core/src/platform-admin.ts',
          ]:
              path = Path(filename)
              text = path.read_text()
              if old_runtime in text:
                  text = text.replace(old_runtime, new_runtime)
                  path.write_text(text)

          old_contract = "pattern: '^app_[A-Za-z0-9_-]{1,120}$'"
          new_contract = "pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,119}$'"
          old_property = "applicationId: { type: string, pattern: '^app_' }"
          new_property = "applicationId: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,119}$' }"
          for filename in ['apps/identity/platform-admin.openapi.yaml', 'apps/core/platform-admin.openapi.yaml']:
              path = Path(filename)
              text = path.read_text().replace(old_contract, new_contract).replace(old_property, new_property)
              path.write_text(text)

          core_test = Path('apps/core/test/platform-admin.integration.test.ts')
          text = core_test.read_text().replace(
              'const target = `app_target_${crypto.randomUUID().replaceAll("-", "")}`;',
              'const target = `legacy-target-${crypto.randomUUID().replaceAll("-", "")}`;',
          )
          core_test.write_text(text)

          service_test = Path('apps/identity/test/platform-service-admin.integration.test.ts')
          text = service_test.read_text().replace(
              'const targetId = `app_service_target_${crypto.randomUUID().replaceAll("-", "")}`;',
              'const targetId = `legacy-service-target-${crypto.randomUUID().replaceAll("-", "")}`;',
          )
          service_test.write_text(text)

          admin_test = Path('apps/identity/test/platform-admin.integration.test.ts')
          text = admin_test.read_text()
          test_name = 'reads and updates an existing semantic application id while new ids remain app_*'
          if test_name not in text:
              marker = '\n});\n'
              if not text.endswith(marker):
                  raise SystemExit('Identity platform-admin test ending changed')
              test = r'''

  it("reads and updates an existing semantic application id while new ids remain app_*", async () => {
    const pair = await keys();
    const console = await provisionConsole(pair);
    const applicationId = `legacy-web-${crypto.randomUUID().replaceAll("-", "")}`;
    const created = await request("/bootstrap/v1/applications", {
      method: "POST",
      headers: { "content-type": "application/json", "x-bootstrap-secret": "bootstrap-test" },
      body: JSON.stringify({
        id: applicationId,
        name: "Legacy Semantic Web App",
        clientType: "web",
        trustedBackend: true,
        allowedScopes: ["profile:read"],
        accessTokenTtlSeconds: 900,
      }),
    }, pair);
    expect(created.status).toBe(201);

    const read = await request(`/internal/v1/platform-admin/applications/${applicationId}`, {
      method: "GET",
      headers: adminHeaders(console.applicationSecret, console.actorToken),
    }, pair);
    expect(read.status).toBe(200);
    expect((await read.json() as any).data.id).toBe(applicationId);

    const updated = await request(`/internal/v1/platform-admin/applications/${applicationId}`, {
      method: "PATCH",
      headers: { ...adminHeaders(console.applicationSecret, console.actorToken), "content-type": "application/json" },
      body: JSON.stringify({ name: "Legacy Semantic Web App Updated" }),
    }, pair);
    expect(updated.status).toBe(200);
    expect((await updated.json() as any).data).toMatchObject({ id: applicationId, name: "Legacy Semantic Web App Updated" });
  });
'''
              text = text[:-len(marker)] + test + marker
              admin_test.write_text(text)
          PY
          git diff --check

      - name: Run targeted contract and platform-admin tests
        run: |
          corepack enable
          corepack prepare pnpm@10.13.1 --activate
          pnpm install --frozen-lockfile
          pnpm --filter @lifespace/identity contract
          pnpm --filter @lifespace/core contract
          pnpm --filter @lifespace/identity test -- platform-admin.integration.test.ts platform-service-admin.integration.test.ts
          pnpm --filter @lifespace/core test -- platform-admin.integration.test.ts

      - name: Commit prerequisite fix if needed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/identity/src/platform-admin.ts apps/identity/src/platform-service-admin.ts apps/core/src/platform-admin.ts \
            apps/identity/platform-admin.openapi.yaml apps/core/platform-admin.openapi.yaml \
            apps/identity/test/platform-admin.integration.test.ts apps/identity/test/platform-service-admin.integration.test.ts \
            apps/core/test/platform-admin.integration.test.ts
          if git diff --cached --quiet; then
            echo "Prerequisite compatibility patch already applied"
            exit 0
          fi
          git commit -m "fix(console): support existing semantic application ids"
          git push origin HEAD:feat/lifespace-console-ui-shell
