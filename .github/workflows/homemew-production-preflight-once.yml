name: HomeMew production preflight once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/homemew-production-preflight-once.yml

permissions:
  contents: write

concurrency:
  group: homemew-production-preflight-once
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      LIFESPACE_PRODUCTION_BOOTSTRAP_SECRET: ${{ secrets.LIFESPACE_PRODUCTION_BOOTSTRAP_SECRET }}
      HOMEMEW_WECHAT_IDENTITY_MAPPINGS_JSON: ${{ secrets.HOMEMEW_WECHAT_IDENTITY_MAPPINGS_JSON }}
      HOMEMEW_BACKEND_WORKER: homemew-backend-production
      HOMEMEW_LEGACY_WORKER: homemew-core
      HOMEMEW_PRODUCTION_HOSTNAME: homemew.aisr.online
      LIFESPACE_MIGRATION_TARGET: production
      HOMEMEW_PRODUCTION_MIGRATION_CONFIRMATION: MIGRATE_HOMEMEW_PRODUCTION

    steps:
      - name: Validate production preflight inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN is not configured" >&2; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "CLOUDFLARE_ACCOUNT_ID is not configured" >&2; exit 1; }
          test ${#LIFESPACE_PRODUCTION_BOOTSTRAP_SECRET} -ge 32 || { echo "LIFESPACE_PRODUCTION_BOOTSTRAP_SECRET is invalid" >&2; exit 1; }
          test -n "${HOMEMEW_WECHAT_IDENTITY_MAPPINGS_JSON:-}" || { echo "HOMEMEW_WECHAT_IDENTITY_MAPPINGS_JSON is not configured" >&2; exit 1; }

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate repository and Phase 7 tooling
        run: |
          pnpm check
          node --check infra/migration/homemew-one-shot.mjs
          node --check infra/scripts/phase7-homemew-identities.mjs
          LIFESPACE_MIGRATION_TARGET=production node infra/migration/homemew-one-shot.mjs rehearse 2>&1 | grep -q 'rehearse is staging-only'

      - name: Verify LifeSpace production is still empty
        run: node infra/scripts/verify-production-db.mjs

      - name: Verify production endpoints
        run: |
          curl --fail --silent --show-error --retry 3 https://auth.aisr.online/health >/dev/null
          curl --fail --silent --show-error --retry 3 https://core.aisr.online/health >/dev/null

      - name: Verify HomeMew production backend secret boundary
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir apps/identity exec wrangler secret list --name "$HOMEMEW_BACKEND_WORKER" --format json --env= > "$RUNNER_TEMP/homemew-backend-secrets.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const entries = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/homemew-backend-secrets.json', 'utf8'));
          const names = new Set(entries.map((item) => item.name));
          if (!names.has('WECHAT_APP_SECRET')) throw new Error('homemew-backend-production is missing WECHAT_APP_SECRET');
          for (const residual of ['LIFESPACE_APPLICATION_CREDENTIAL', 'WECHAT_IDENTITY_BOOTSTRAP_MAP']) {
            if (names.has(residual)) throw new Error(`homemew-backend-production has residual pre-cutover secret ${residual}`);
          }
          console.log(JSON.stringify({ ok: true, wechatAppSecretPresent: true, residualCutoverSecrets: false }));
          NODE

      - name: Verify current HomeMew domain still targets legacy Core
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const endpoint = `https://api.cloudflare.com/client/v4/accounts/${encodeURIComponent(process.env.CLOUDFLARE_ACCOUNT_ID)}/workers/domains`;
          const response = await fetch(endpoint, { headers: { authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}` } });
          const payload = await response.json();
          if (!response.ok || payload?.success !== true || !Array.isArray(payload.result)) throw new Error('Could not list Cloudflare Worker custom domains');
          const domain = payload.result.find((item) => item.hostname === process.env.HOMEMEW_PRODUCTION_HOSTNAME);
          if (!domain) throw new Error(`${process.env.HOMEMEW_PRODUCTION_HOSTNAME} is not a Worker custom domain`);
          if (domain.service !== process.env.HOMEMEW_LEGACY_WORKER) throw new Error(`${domain.hostname} targets ${domain.service}, expected ${process.env.HOMEMEW_LEGACY_WORKER}`);
          console.log(JSON.stringify({ ok: true, hostname: domain.hostname, service: domain.service }));
          NODE

      - name: Capture read-only source snapshot
        run: node infra/migration/homemew-one-shot.mjs snapshot --out "$RUNNER_TEMP/homemew-preflight-snapshot.json"

      - name: Validate legacy WeChat identities
        run: node infra/scripts/phase7-homemew-identities.mjs validate --snapshot "$RUNNER_TEMP/homemew-preflight-snapshot.json"

      - name: Summarize
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## HomeMew production preflight PASS
          - LifeSpace production business target is empty.
          - Legacy HomeMew source snapshot is readable.
          - Legacy WeChat identity mappings match active source users.
          - `WECHAT_APP_SECRET` is present on `homemew-backend-production`.
          - No pre-cutover LifeSpace credential/bootstrap map is present on the new backend.
          - `homemew.aisr.online` still targets legacy `homemew-core`.
          - No freeze, migration, credential issuance, domain switch, or production activation occurred.
          EOF

      - name: Record observable PASS marker
        shell: bash
        run: |
          set -euo pipefail
          printf 'HomeMew production preflight PASS\nrun_id=%s\ncommit=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > infra/migration/.homemew-production-preflight-pass
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add infra/migration/.homemew-production-preflight-pass
          git commit -m "chore: record HomeMew production preflight PASS"
          git push origin HEAD:main
