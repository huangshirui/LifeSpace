name: Converge private MCP OAuth staging resource secret

# Run only AFTER the independently private Adapter staging Worker exists.
# This job manages ONLY the OAUTH_RESOURCE_SERVER_SECRET on two staging
# Workers and never reads/exposes another Worker credential or Production.
on:
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  actions: read

concurrency:
  group: lifespace-staging-deploy
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Require owner-triggered reviewed main candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_ACTOR" = huangshirui
          test "$GITHUB_TRIGGERING_ACTOR" = huangshirui
          test "$GITHUB_REF_NAME" = main
      - uses: actions/checkout@v5
      - name: Confirm reviewed main release gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: node infra/scripts/verify-release-candidate.mjs staging
      - name: Verify no-production Staging secret convergence tests
        run: node --test infra/scripts/converge-staging-mcp-resource-secret.test.mjs

  converge:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - name: Pair Identity and private Adapter OAuth Resource Server secret
        run: node infra/scripts/converge-staging-mcp-resource-secret.mjs
      - name: Summarize Staging secret convergence (names only)
        shell: bash
        run: |
          {
            echo "## OAuth MCP Staging Resource Server credential"
            echo ""
            echo "- Same new random secret set on: lifespace-identity-staging, lifespace-mcp-adapter-staging"
            echo "- Secret value was never printed or stored in source or Actions outputs"
            echo "- Future Core MCP_ADAPTER binding requires reviewed staging release"
            echo "- OAuth/Consent/tool E2E still pending"
            echo "- Production: untouched"
          } >> "$GITHUB_STEP_SUMMARY"
