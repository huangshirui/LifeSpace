name: Deploy LifeSpace Console staging (isolated)

on:
  workflow_dispatch:
    inputs:
      run_control_plane_acceptance:
        description: "After Console deployment, exercise and clean up real staging control-plane write lifecycles"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: lifespace-console-staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Console only to staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout LifeSpace
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Report deployment source
        run: |
          echo "ref=$GITHUB_REF"
          echo "sha=$GITHUB_SHA"
          echo "checkout=$(git rev-parse HEAD)"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          version: 10.13.1
          run_install: false

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Validate staging deployment authority
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN is not configured" >&2; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "CLOUDFLARE_ACCOUNT_ID is not configured" >&2; exit 1; }

      - name: Install repository dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Console only
        run: pnpm --filter @lifespace/console check

      - name: Verify current staging platform dependencies without mutation
        run: |
          node --input-type=module <<'NODE'
          const services = [
            ["Identity", "https://auth-staging.aisr.online/api/v1/status"],
            ["Core", "https://core-staging.aisr.online/api/v1/status"],
          ];
          for (const [name, url] of services) {
            const response = await fetch(url, { headers: { accept: "application/json" } });
            const payload = await response.json().catch(() => null);
            if (response.status !== 200 || payload?.data?.environment !== "staging") {
              throw new Error(`${name} staging dependency is unavailable or not staging: ${response.status} ${JSON.stringify(payload)}`);
            }
            console.log(JSON.stringify({
              service: name,
              environment: payload.data.environment,
              schemaVersion: payload.data.schemaVersion ?? null,
              contractVersion: payload.data.contractVersion ?? null,
              registryRevision: payload.data.registryRevision ?? null,
            }));
          }
          NODE

      - name: Build and deploy LifeSpace Console staging only
        shell: bash
        run: |
          set -euo pipefail
          cd apps/console
          CLOUDFLARE_ENV=staging pnpm exec vite build
          pnpm exec wrangler deploy

      - name: Verify staging hostname is live behind Access
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            if code="$(curl --silent --show-error --head --output /dev/null --write-out '%{http_code}' --connect-timeout 5 --max-time 10 https://lifespace-staging.aisr.online/)"; then
              if [ "$code" -ge 200 ] && [ "$code" -lt 500 ]; then
                echo "lifespace-staging.aisr.online is reachable (HTTP $code; Cloudflare Access may redirect or deny unauthenticated CI)"
                exit 0
              fi
            fi
            echo "Waiting for LifeSpace Console staging hostname (${attempt}/20)"
            sleep 3
          done
          echo "LifeSpace Console staging hostname did not become reachable" >&2
          exit 1

      - name: Summarize isolated deployment
        if: ${{ success() }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## LifeSpace Console staging — isolated deploy

          - Only the LifeSpace Console staging Worker/client was built and deployed.
          - Current staging Identity/Core were read for health/compatibility context only.
          - No D1 migration ran.
          - No Core or Identity Worker was deployed.
          - No bootstrap secret was used.
          - Existing Console Worker secrets were preserved rather than rotated.
          - Required Console Application scope convergence, including `spaces:manage`, belongs to the canonical platform staging release.
          - External browser setup is fully self-service: create a Dynamic Connection, discover Provider resources and bind an External Model through the public Space-scoped API. No Source preprovision is performed here.
          - Optional acceptance below exercises bounded platform control-plane lifecycles only.
          EOF

  acceptance:
    name: Exercise staging Configuration Center writes and cleanup
    if: ${{ inputs.run_control_plane_acceptance }}
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      LIFESPACE_STAGING_BOOTSTRAP_SECRET: ${{ secrets.LIFESPACE_STAGING_BOOTSTRAP_SECRET }}
      LIFESPACE_IDENTITY_STAGING_URL: https://auth-staging.aisr.online
      LIFESPACE_CORE_STAGING_URL: https://core-staging.aisr.online
      LIFESPACE_STAGING_CONSOLE_APPLICATION_ID: app_lifespace_console_staging

    steps:
      - name: Checkout LifeSpace
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          version: 10.13.1
          run_install: false

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Validate staging-only authority
        shell: bash
        run: |
          set -euo pipefail
          test ${#LIFESPACE_STAGING_BOOTSTRAP_SECRET} -ge 32 || { echo "LIFESPACE_STAGING_BOOTSTRAP_SECRET is not configured" >&2; exit 1; }
          [[ "$LIFESPACE_IDENTITY_STAGING_URL" == "https://auth-staging.aisr.online" ]]
          [[ "$LIFESPACE_CORE_STAGING_URL" == "https://core-staging.aisr.online" ]]

      - name: Install repository dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Console before acceptance
        run: pnpm --filter @lifespace/console check

      - name: Exercise Model publishing and Model Access lifecycle
        run: node apps/console/scripts/verify-staging-control-plane.mjs

      - name: Exercise Application and service identity lifecycle
        run: node apps/console/scripts/verify-staging-configuration-center.mjs

      - name: Summarize acceptance
        if: ${{ success() }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## LifeSpace Console Configuration & Publishing Center — staging acceptance

          Slice A:
          - Used the current active staging platform administrator as human actor.
          - Validated/published an ephemeral model v1 (`initial`) and additive v2 (`compatible`).
          - Observed Model Contract revision advancement.
          - Added then restored Application × Model Access.
          - Retired the ephemeral model and verified it disappeared from the published Registry.

          Slices B/C:
          - Created and updated a generated staging Application.
          - Registered then revoked a disposable Cloudflare Access audience.
          - Created/revoked target Application credentials and verified metadata does not expose plaintext.
          - Created/disabled a disposable Service Principal.
          - Created a Service API Token, reduced its scopes, proved scope re-expansion is denied, then revoked it.
          - Verified human-attributed Identity audit and no plaintext credential leakage.
          - Left the generated acceptance Application disabled because the platform contract has no delete-Application lifecycle.

          External setup boundary:
          - No External Source or provider credential is provisioned by this workflow.
          - Normal browser acceptance uses the public Space-scoped Dynamic Connection API end to end.
          - Connection creation itself grants no Membership, Data Grant, Application × Model Access or model binding.

          Boundaries:
          - Temporary acceptance executors/credentials are revoked during cleanup.
          - This acceptance job does not deploy Console/Core/Identity or run migrations.
          - Production is not targeted.
          EOF
