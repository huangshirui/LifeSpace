name: Apply issue 307 staging acceptance coverage

on:
  push:
    branches:
      - feat/307-agent-api-credential
    paths:
      - scripts/fix_issue_307_staging_acceptance_v2.py
      - .github/workflows/issue-307-staging-acceptance-fix.yml

permissions:
  contents: write

jobs:
  apply-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/307-agent-api-credential
          fetch-depth: 0
      - uses: pnpm/action-setup@v4.4.0
        with:
          version: 10.13.1
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply staging acceptance coverage
        run: python3 scripts/fix_issue_307_staging_acceptance_v2.py
      - name: Validate repository
        run: pnpm check
      - name: Commit verified staging acceptance coverage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add infra/scripts/verify-staging-authority-v3.mjs apps/console/scripts/verify-staging-configuration-center.mjs
          git diff --cached --quiet && exit 0
          git commit -m "test(staging): cover Agent API credential lifecycle (#307)"
          git push origin HEAD:feat/307-agent-api-credential
