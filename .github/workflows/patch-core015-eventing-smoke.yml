name: Patch Core 0.15 Eventing smoke

on:
  push:
    branches: [fix/core-015-eventing-staging-smoke]
    paths:
      - infra/scripts/patch-core015-eventing-smoke.mjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/core-015-eventing-staging-smoke
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node infra/scripts/patch-core015-eventing-smoke.mjs
      - name: Commit verifier
        run: |
          if git diff --quiet -- infra/scripts/verify-staging-eventing.mjs; then
            echo "No verifier changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add infra/scripts/verify-staging-eventing.mjs
          git commit -m "fix(eventing): align staging smoke with shared Webhook Endpoint"
          git push origin HEAD:fix/core-015-eventing-staging-smoke
