name: Apply issue 311 service token prefix migration v2

on:
  push:
    branches: [feat/311-service-token-prefix]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4.4.0
        with:
          version: 10.13.1
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Apply #311 implementation
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=None):
              p = Path(path)
              text = p.read_text()
              found = text.count(old)
              if found == 0:
                  raise SystemExit(f"{path}: expected text not found: {old!r}")
              if count is not None and found != count:
                  raise SystemExit(f"{path}: expected {count} matches, found {found}: {old!r}")
              p.write_text(text.replace(old, new))

          def maybe(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old in text:
                  p.write_text(text.replace(old, new))

          # 1) Runtime issuance/classification. New issuance is lsp_svc_*; legacy lsp_pat_* stays accepted.
          replace(
              "apps/identity/src/service-auth.ts",
              'const SERVICE_TOKEN_PREFIX = "lsp_pat_";\nconst OAUTH_SECRET_PREFIX = "lsp_client_";',
              'const SERVICE_TOKEN_PREFIX = "lsp_svc_";\nconst LEGACY_SERVICE_TOKEN_PREFIX = "lsp_pat_";\nconst OAUTH_SECRET_PREFIX = "lsp_client_";\n\nexport function isOpaqueServiceApiToken(value: string): boolean {\n  return value.startsWith(SERVICE_TOKEN_PREFIX) || value.startsWith(LEGACY_SERVICE_TOKEN_PREFIX);\n}',
              1,
          )
          replace(
              "apps/identity/src/service-auth.ts",
              'if (!plaintext.startsWith(SERVICE_TOKEN_PREFIX) || plaintext.length < 40) return c.json(ok({ active: false }));',
              'if (!isOpaqueServiceApiToken(plaintext) || plaintext.length < 40) return c.json(ok({ active: false }));',
              1,
          )
          replace("apps/identity/src/platform-service-admin.ts", 'const SERVICE_TOKEN_PREFIX = "lsp_pat_";', 'const SERVICE_TOKEN_PREFIX = "lsp_svc_";', 1)
          replace(
              "apps/core/src/auth.ts",
              'const MAX_ACCESS_TOKEN_TTL_SECONDS = 3600;\nconst SERVICE_TOKEN_PREFIX = "lsp_pat_";',
              'const MAX_ACCESS_TOKEN_TTL_SECONDS = 3600;\nconst SERVICE_TOKEN_PREFIXES = ["lsp_svc_", "lsp_pat_"] as const;\n\nexport function isOpaqueServiceApiToken(value: string): boolean {\n  return SERVICE_TOKEN_PREFIXES.some((prefix) => value.startsWith(prefix));\n}',
              1,
          )
          replace("apps/core/src/auth.ts", 'if (rawToken.startsWith(SERVICE_TOKEN_PREFIX)) {', 'if (isOpaqueServiceApiToken(rawToken)) {', 1)

          # 2) Observable contracts and version convergence.
          replace("apps/identity/package.json", '"version": "0.8.0"', '"version": "0.9.0"', 1)
          replace("apps/identity/src/application-admin.ts", 'export const IDENTITY_CONTRACT_VERSION = "0.8.0";', 'export const IDENTITY_CONTRACT_VERSION = "0.9.0";', 1)
          replace("apps/identity/openapi.yaml", '  version: 0.8.0', '  version: 0.9.0', 1)
          replace("apps/identity/openapi.yaml", "pattern: '^lsp_pat_'", "pattern: '^lsp_svc_'", 1)
          replace("apps/identity/openapi.yaml", 'bearerFormat: lsp_pat_ opaque token', 'bearerFormat: lsp_svc_ opaque token', 1)
          replace("apps/identity/platform-admin.openapi.yaml", '  version: 0.2.0', '  version: 0.3.0', 1)
          replace("apps/identity/platform-admin.openapi.yaml", 'description: Create lsp_pat_* for the target principal.', 'description: Create lsp_svc_* for the target principal.', 1)
          replace("apps/identity/scripts/check-openapi.mjs", 'doc.info?.version !== "0.8.0"', 'doc.info?.version !== "0.9.0"', 1)
          replace("apps/identity/scripts/check-openapi.mjs", 'includes("lsp_pat_")', 'includes("lsp_svc_")', 1)
          replace("apps/identity/scripts/check-openapi.mjs", 'New lsp_pat plaintext must be one-time/write-only', 'New lsp_svc plaintext must be one-time/write-only', 1)
          replace("apps/identity/scripts/check-openapi.mjs", 'bearerFormat !== "lsp_pat_ opaque token"', 'bearerFormat !== "lsp_svc_ opaque token"', 1)
          replace("apps/identity/scripts/check-platform-admin-openapi.mjs", 'document.info?.version !== "0.2.0"', 'document.info?.version !== "0.3.0"', 1)
          p = Path("apps/identity/scripts/check-platform-admin-openapi.mjs")
          text = p.read_text()
          needle = 'if (!String(createdSecret?.description ?? "").includes("exactly once")) {\n  throw new Error("Platform-managed Service API Token plaintext must be one-time-only");\n}\n'
          if needle not in text: raise SystemExit("platform-admin token assertion anchor missing")
          text = text.replace(needle, needle + 'if (!String(createdSecret?.description ?? "").includes("lsp_svc_*")) {\n  throw new Error("Platform-managed Service API Token issuance must advertise canonical lsp_svc_*");\n}\n', 1)
          p.write_text(text)

          # 3) Tests: canonical issuance plus real legacy hash/introspection compatibility.
          p = Path("apps/identity/test/service-authentication.integration.test.ts")
          text = p.read_text()
          text = text.replace('expect(createdBody.data.token).toMatch(/^lsp_pat_[A-Za-z0-9_-]{40,}$/);', 'expect(createdBody.data.token).toMatch(/^lsp_svc_[A-Za-z0-9_-]{40,}$/);', 1)
          helper_anchor = 'async function waitForLastUsedAt(db: D1Database, table: "service_api_tokens" | "service_oauth_credentials", id: string): Promise<string | null> {'
          helper = '''async function sha256Hex(value: string): Promise<string> {\n  const digest = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(value));\n  return [...new Uint8Array(digest)].map((byte) => byte.toString(16).padStart(2, "0")).join("");\n}\n\n'''
          if helper_anchor not in text: raise SystemExit("identity test helper anchor missing")
          text = text.replace(helper_anchor, helper + helper_anchor, 1)
          test_anchor = '  it("enforces application/principal ceilings and disabled-principal current state", async () => {'
          legacy_test = '''  it("keeps already-issued legacy lsp_pat_* tokens introspectable until normal revocation/rotation", async () => {\n    const { app, b, clientSecret, userId, principalId } = await setup(["events:read"]);\n    const created = await app.request(`http://identity.test/api/v1/service-principals/${principalId}/tokens`, {\n      method: "POST",\n      headers: { authorization: `Bearer ${clientSecret}`, "content-type": "application/json" },\n      body: JSON.stringify({ label: "legacy migration", scopes: ["events:read"], createdByUserId: userId }),\n    }, b);\n    expect(created.status).toBe(201);\n    const tokenId = (await created.json() as { data: { id: string } }).data.id;\n    const legacyToken = `lsp_pat_${crypto.randomUUID().replaceAll("-", "")}${crypto.randomUUID().replaceAll("-", "")}`;\n    await b.DB.prepare("UPDATE service_api_tokens SET token_hash=?, display_prefix=?, last_four=? WHERE id=?")\n      .bind(await sha256Hex(legacyToken), legacyToken.slice(0, 16), legacyToken.slice(-4), tokenId)\n      .run();\n\n    const introspected = await app.request("http://identity.test/introspection/v1/service-tokens", {\n      method: "POST",\n      headers: { authorization: `Bearer ${legacyToken}`, "x-lifespace-internal-secret": b.CORE_IDENTITY_SHARED_SECRET },\n    }, b);\n    expect(introspected.status).toBe(200);\n    expect(await introspected.json()).toMatchObject({ data: { active: true, principal: { type: "service", id: principalId, scopes: ["events:read"] } } });\n  });\n\n'''
          if test_anchor not in text: raise SystemExit("identity legacy test anchor missing")
          text = text.replace(test_anchor, legacy_test + test_anchor, 1)
          p.write_text(text)

          # Core keeps existing legacy integration cases and makes the primary positive case canonical.
          replace(
              "apps/core/test/service-authentication.integration.test.ts",
              'const serviceToken = "lsp_pat_test_secret_that_is_long_enough_for_core_authentication";',
              'const serviceToken = "lsp_svc_test_secret_that_is_long_enough_for_core_authentication";',
              1,
          )
          Path("apps/identity/test/service-token-prefix.test.ts").write_text('''import { describe, expect, it } from "vitest";\nimport { isOpaqueServiceApiToken } from "../src/service-auth";\n\ndescribe("Service API Token prefix compatibility", () => {\n  it("accepts canonical and legacy opaque prefixes", () => {\n    expect(isOpaqueServiceApiToken("lsp_svc_example")).toBe(true);\n    expect(isOpaqueServiceApiToken("lsp_pat_example")).toBe(true);\n    expect(isOpaqueServiceApiToken("lsa_example")).toBe(false);\n  });\n});\n''')
          Path("apps/core/test/service-token-prefix.test.ts").write_text('''import { describe, expect, it } from "vitest";\nimport { isOpaqueServiceApiToken } from "../src/auth";\n\ndescribe("Core opaque Service API Token classification", () => {\n  it("routes canonical and legacy prefixes to Identity introspection", () => {\n    expect(isOpaqueServiceApiToken("lsp_svc_example")).toBe(true);\n    expect(isOpaqueServiceApiToken("lsp_pat_example")).toBe(true);\n    expect(isOpaqueServiceApiToken("eyJ.fake.jwt")).toBe(false);\n  });\n});\n''')

          # Other new-token expectations move to canonical prefix; do not rewrite explicit legacy compatibility tests.
          for path in [
              "apps/identity/test/platform-service-admin.integration.test.ts",
              "apps/core/scripts/service-performance-benchmark.test.mjs",
              "apps/console/scripts/verify-staging-control-plane.mjs",
              "apps/console/scripts/verify-staging-configuration-center.mjs",
              "infra/scripts/verify-production-model-admin.mjs",
              "infra/scripts/prepare-production-console-admin.mjs",
          ]:
              maybe(path, "lsp_pat_", "lsp_svc_")

          # 4) Console and operational scripts.
          for path in [
              "apps/console/worker/configuration-center.ts",
              "apps/console/scripts/check-credential-reveal-boundary.mjs",
              "apps/console/scripts/check-credential-governance-boundary.mjs",
          ]:
              maybe(path, "lsp_pat_", "lsp_svc_")
          replace("apps/console/worker/index.ts", 'const IDENTITY_PLATFORM_ADMIN_CONTRACT = "0.2.0";', 'const IDENTITY_PLATFORM_ADMIN_CONTRACT = "0.3.0";', 1)

          replace(
              "infra/scripts/prepare-staging-console-admin.mjs",
              'if (suppliedCoreBearer && !suppliedCoreBearer.startsWith("lsp_pat_") && suppliedCoreBearer.split(".").length !== 3) {\n  throw new Error("LIFESPACE_STAGING_CONSOLE_CORE_BEARER must be an lsp_pat_* token or service JWT");',
              'if (suppliedCoreBearer && !suppliedCoreBearer.startsWith("lsp_svc_") && !suppliedCoreBearer.startsWith("lsp_pat_") && suppliedCoreBearer.split(".").length !== 3) {\n  throw new Error("LIFESPACE_STAGING_CONSOLE_CORE_BEARER must be an lsp_svc_*/legacy lsp_pat_* token or service JWT");',
              1,
          )
          replace("infra/scripts/prepare-staging-console-admin.mjs", '!created.payload.data.token.startsWith("lsp_pat_")', '!created.payload.data.token.startsWith("lsp_svc_")', 1)
          replace("infra/scripts/prepare-staging-console-admin.mjs", 'if (coreBearer.startsWith("lsp_pat_")) {', 'if (coreBearer.startsWith("lsp_svc_") || coreBearer.startsWith("lsp_pat_")) {', 1)
          replace(
              "infra/scripts/verify-staging-console-admin.mjs",
              'if (!coreBearer.startsWith("lsp_pat_") && coreBearer.split(".").length !== 3)',
              'if (!coreBearer.startsWith("lsp_svc_") && !coreBearer.startsWith("lsp_pat_") && coreBearer.split(".").length !== 3)',
              1,
          )
          maybe("infra/scripts/verify-staging-console-admin.mjs", 'lsp_pat_* token or service JWT', 'lsp_svc_*/legacy lsp_pat_* token or service JWT')
          replace("infra/scripts/publish-staging-baseline-model-semantics.mjs", 'if (!bearer.startsWith("lsp_pat_")) {', 'if (!bearer.startsWith("lsp_svc_") && !bearer.startsWith("lsp_pat_")) {', 1)

          for path in [
              "infra/scripts/verify-staging-console-admin.mjs",
              "infra/scripts/prepare-production-console-admin.mjs",
              "infra/scripts/prepare-staging-console-admin.mjs",
          ]:
              maybe(path, 'identityPlatformAdmin: "0.2.0"', 'identityPlatformAdmin: "0.3.0"')

          # 5) Normative/current docs. Production snapshot docs remain untouched until production release.
          replace("AGENTS.md", '`lsp_pat_*`/service JWT authenticates a service identity/principal context to Core.', '`lsp_svc_*`/service JWT authenticates a service identity/principal context to Core. Existing `lsp_pat_*` is legacy migration input only.', 1)
          replace("README.md", 'Opaque revocable `lsp_pat_*` Service API Token', 'Opaque revocable `lsp_svc_*` Service API Token (legacy `lsp_pat_*` remains accepted until rotate/revoke)', 1)
          replace("apps/core/AGENTS.md", 'Identity-introspected opaque `lsp_pat_*` tokens', 'Identity-introspected opaque `lsp_svc_*` tokens (plus legacy `lsp_pat_*` migration tokens)', 1)
          maybe("apps/identity/AGENTS.md", '- `lsp_pat_*` plaintext;', '- `lsp_svc_*` plaintext;\n- legacy `lsp_pat_*` plaintext only during migration;')
          maybe("apps/identity/AGENTS.md", 'current version: 0.8.0', 'current version: 0.9.0')
          maybe("apps/identity/AGENTS.md", 'current version: 0.2.0', 'current version: 0.3.0')

          p = Path("docs/service-authentication.md")
          text = p.read_text()
          text = text.replace('''```text\nlsp_pat_<cryptographically-random-secret>\n```\n\nThe caller sends it directly to Core:\n\n```http\nAuthorization: Bearer lsp_pat_...\n```''', '''```text\nlsp_svc_<cryptographically-random-secret>\n```\n\nThe caller sends it directly to Core:\n\n```http\nAuthorization: Bearer lsp_svc_...\n```\n\n`lsp_svc_*` is the canonical prefix for every newly issued opaque Service API Token. Existing `lsp_pat_*` tokens remain accepted as migration credentials until each token is normally rotated or revoked. No database rewrite is required because Identity stores only the hash plus display metadata; both prefixes pass through the same current-state hash lookup, scope, expiry, principal/application status and revocation checks.''', 1)
          text = text.replace('opaque lsp_pat_*\n  -> Identity introspection', 'opaque lsp_svc_* / legacy lsp_pat_*\n  -> Identity introspection', 1)
          text = text.replace('subscriber does not present its `lsp_pat_*` or service JWT', 'subscriber does not present its `lsp_svc_*`, legacy `lsp_pat_*` or service JWT', 1)
          text = text.replace('`lsa_*`, `lsp_pat_*` and OAuth client credentials', '`lsa_*`, `lsp_svc_*`, legacy `lsp_pat_*` and OAuth client credentials', 1)
          text = text.replace('Identity Platform Admin `0.2.0` therefore', 'Identity Platform Admin `0.3.0` therefore', 1)
          text = text.replace('Identity contract 0.6.0', 'Identity contract 0.9.0')
          p.write_text(text)

          for path in ["docs/application-authentication.md", "docs/architecture.md", "docs/contracts.md", "docs/console-agent-governance.md"]:
              maybe(path, 'Identity application/user/service contract remains `0.6.0`', 'Identity application/user/service contract is `0.9.0`')
              maybe(path, 'current business-facing contract: 0.6.0', 'current business-facing contract: 0.9.0')
              maybe(path, 'Identity Application Contract:    0.6.0', 'Identity Application Contract:    0.9.0')
              maybe(path, 'Identity Platform Admin companion contract is `0.2.0`', 'Identity Platform Admin companion contract is `0.3.0`')
              maybe(path, 'Identity Platform Admin Contract: 0.2.0', 'Identity Platform Admin Contract: 0.3.0')
              maybe(path, 'Identity Platform Admin is `0.2.0`;', 'Identity Platform Admin is `0.3.0`;')
              maybe(path, 'independent companion contract: 0.2.0', 'independent companion contract: 0.3.0')

          p = Path("docs/contracts.md")
          text = p.read_text()
          heading = '# LifeSpace Contract Strategy\n\n'
          if not text.startswith(heading): raise SystemExit('contracts heading changed')
          note = '''## Identity 0.9.0 / Platform Admin 0.3.0 — canonical Service API Token prefix\n\nNew opaque Service API Tokens are represented as `lsp_svc_*`. Existing `lsp_pat_*` tokens remain compatibility inputs and continue through the identical current-state introspection/revocation path until individually rotated or revoked. Service Principal identity, token-hash storage, scope ceilings, Data Grants, Application × Model Access and Core authorization semantics are unchanged.\n\n'''
          text = heading + note + text[len(heading):]
          p.write_text(text)

          # Sanity: no new issuance surface still advertises legacy prefix.
          for path, token in {
              "apps/identity/src/platform-service-admin.ts": 'const SERVICE_TOKEN_PREFIX = "lsp_pat_"',
              "apps/identity/openapi.yaml": "pattern: '^lsp_pat_'",
              "apps/console/worker/configuration-center.ts": 'secret.startsWith("lsp_pat_")',
          }.items():
              if token in Path(path).read_text(): raise SystemExit(f"legacy issuance remains in {path}: {token}")
          PY
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate repository
        run: pnpm check
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md README.md apps docs infra
          git diff --cached --check
          git commit -m "feat(auth): align Service API Token prefix (#311)"
          git push origin HEAD:feat/311-service-token-prefix
