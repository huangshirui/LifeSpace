name: Verify Staging OAuth public negative paths

on:
  workflow_dispatch:
  pull_request:
    paths:
      - infra/scripts/verify-staging-oauth-public-negative.mjs
      - .github/workflows/verify-staging-oauth-public-negative.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Verify real Staging OAuth and MCP deny paths without credentials
        env:
          MCP_STAGING_ISSUER: https://auth-staging.aisr.online
          MCP_STAGING_RESOURCE: https://core-staging.aisr.online/mcp/mcp_654b2a7f7cf140b89268fd1056677357
        run: |
          set -euo pipefail
          node --check infra/scripts/verify-staging-oauth-public-negative.mjs
          node infra/scripts/verify-staging-oauth-public-negative.mjs
