name: One-time Eventing staging queue inspect

on:
  push:
    branches:
      - ops/eventing-staging-route-diagnostic-20260825
    paths:
      - .github/workflows/eventing-staging-queue-inspect.yml

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect staging Eventing Queue consumer
    runs-on: ubuntu-latest
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Inspect exact Queue and its consumer
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          if (!token || !accountId) throw new Error('Cloudflare staging credentials are required');
          async function cf(path) {
            const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, { headers: { authorization: `Bearer ${token}` } });
            const payload = await response.json();
            if (!response.ok || payload.success === false) throw new Error(`${path}: ${response.status} ${JSON.stringify(payload.errors ?? payload)}`);
            return payload.result;
          }
          const queues = await cf(`/accounts/${accountId}/queues`);
          const queue = queues.find((item) => item.queue_name === 'lifespace-staging-event-deliveries');
          if (!queue) throw new Error('lifespace-staging-event-deliveries not found');
          const consumers = await cf(`/accounts/${accountId}/queues/${queue.queue_id}/consumers`);
          console.log(JSON.stringify({
            queue: {
              queue_id: queue.queue_id,
              queue_name: queue.queue_name,
              consumers_total_count: queue.consumers_total_count,
              consumers: queue.consumers,
            },
            consumers,
          }, null, 2));
          NODE
