name: HomeMew staging credential handoff

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/homemew-staging-credential-handoff.yml

permissions:
  contents: read

concurrency:
  group: homemew-staging-credential-handoff
  cancel-in-progress: false

jobs:
  handoff:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      LIFESPACE_STAGING_BOOTSTRAP_SECRET: ${{ secrets.LIFESPACE_STAGING_BOOTSTRAP_SECRET }}
      LIFESPACE_IDENTITY_STAGING_URL: https://auth-staging.aisr.online
      HOMEMEW_BACKEND_STAGING_URL: https://homemew-staging.aisr.online
      HOMEMEW_BACKEND_WORKER: homemew-backend-staging
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Validate staging-only authority
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN is not configured" >&2; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "CLOUDFLARE_ACCOUNT_ID is not configured" >&2; exit 1; }
          test ${#LIFESPACE_STAGING_BOOTSTRAP_SECRET} -ge 32 || { echo "LIFESPACE_STAGING_BOOTSTRAP_SECRET must be at least 32 characters" >&2; exit 1; }
          test "$LIFESPACE_IDENTITY_STAGING_URL" = "https://auth-staging.aisr.online"
          test "$HOMEMEW_BACKEND_WORKER" = "homemew-backend-staging"

      - name: Install repository dependencies
        run: pnpm install --frozen-lockfile

      - name: Issue LifeSpace staging credential and install it in HomeMew Worker
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { spawnSync } from "node:child_process";
          import { readFileSync } from "node:fs";

          const identityBase = process.env.LIFESPACE_IDENTITY_STAGING_URL.replace(/\/+$/u, "");
          const bootstrapSecret = process.env.LIFESPACE_STAGING_BOOTSTRAP_SECRET;
          const workerName = process.env.HOMEMEW_BACKEND_WORKER;
          const profile = JSON.parse(readFileSync("infra/homemew-integration-profile.json", "utf8"));
          const applicationId = profile.application?.stagingId;

          if (applicationId !== "app_homemew_staging") {
            throw new Error(`Unexpected HomeMew staging application id: ${applicationId}`);
          }

          async function identityRequest(path, { method = "GET" } = {}) {
            const response = await fetch(`${identityBase}${path}`, {
              method,
              headers: { "x-bootstrap-secret": bootstrapSecret },
            });
            const raw = await response.text();
            let payload = null;
            if (raw) {
              try { payload = JSON.parse(raw); }
              catch { payload = raw; }
            }
            return { response, payload };
          }

          const appPath = `/bootstrap/v1/applications/${encodeURIComponent(applicationId)}`;
          const metadata = await identityRequest(appPath);
          if (metadata.response.status !== 200 || metadata.payload?.data?.id !== applicationId) {
            throw new Error(`HomeMew staging application lookup failed: ${metadata.response.status}`);
          }
          if (metadata.payload?.data?.trustedBackend !== true || metadata.payload?.data?.status !== "active") {
            throw new Error("HomeMew staging application is not an active trusted backend");
          }

          const issued = await identityRequest(`${appPath}/credentials`, { method: "POST" });
          const credentialId = issued.payload?.data?.id ?? "";
          const credential = issued.payload?.data?.clientSecret ?? "";
          if (issued.response.status !== 201 || !credentialId.startsWith("apc_") || !credential.startsWith("lsa_")) {
            throw new Error(`HomeMew staging credential issuance failed: ${issued.response.status}`);
          }

          let installed = false;
          try {
            const put = spawnSync(
              "pnpm",
              ["--dir", "apps/identity", "exec", "wrangler", "secret", "put", "LIFESPACE_APPLICATION_CREDENTIAL", "--name", workerName],
              { input: `${credential}\n`, encoding: "utf8", env: process.env },
            );
            if (put.status !== 0) {
              process.stderr.write(put.stderr || "wrangler secret put failed\n");
              throw new Error("Could not install LifeSpace application credential into HomeMew staging Worker");
            }
            installed = true;

            const list = spawnSync(
              "pnpm",
              ["--dir", "apps/identity", "exec", "wrangler", "secret", "list", "--name", workerName, "--format", "json"],
              { encoding: "utf8", env: process.env },
            );
            if (list.status !== 0) {
              process.stderr.write(list.stderr || "wrangler secret list failed\n");
              throw new Error("Could not verify HomeMew staging Worker secrets");
            }
            const secrets = JSON.parse(list.stdout || "[]");
            const names = new Set(secrets.map((item) => item.name));
            for (const required of ["WECHAT_APP_SECRET", "LIFESPACE_APPLICATION_CREDENTIAL"]) {
              if (!names.has(required)) throw new Error(`HomeMew staging Worker is missing required secret ${required}`);
            }
          } catch (error) {
            if (!installed) {
              await identityRequest(`${appPath}/credentials/${encodeURIComponent(credentialId)}`, { method: "DELETE" });
            }
            throw error;
          }

          console.log(JSON.stringify({
            ok: true,
            environment: "staging",
            applicationId,
            credentialId,
            targetWorker: workerName,
            requiredWorkerSecretsPresent: true,
            productionUntouched: true,
          }, null, 2));
          NODE

      - name: Verify HomeMew staging login readiness
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 10); do
            HEALTH="$(curl --fail --silent --show-error "$HOMEMEW_BACKEND_STAGING_URL/health" || true)"
            if [ -n "$HEALTH" ] && printf '%s' "$HEALTH" | node --input-type=module -e '
              import fs from "node:fs";
              const data = JSON.parse(fs.readFileSync(0, "utf8"));
              process.exit(data.ok === true && data.environment === "staging" && data.loginReady === true ? 0 : 1);
            '; then
              echo "$HEALTH"
              exit 0
            fi
            sleep 2
          done
          echo "HomeMew staging backend did not become login-ready" >&2
          exit 1

      - name: Summarize handoff
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## HomeMew staging credential handoff

          - LifeSpace application: `app_homemew_staging`
          - Target Worker: `homemew-backend-staging`
          - `LIFESPACE_APPLICATION_CREDENTIAL`: issued and stored only as a Cloudflare Worker Secret
          - `WECHAT_APP_SECRET`: present in the target Worker
          - HomeMew `/health`: `loginReady=true`
          - Production: untouched
          EOF
