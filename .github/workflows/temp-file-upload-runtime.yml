name: temp-file-upload-runtime

on:
  push:
    branches: [feat/file-upload-capability]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/file-upload-capability
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Apply File upload runtime patch
        run: python scripts/apply-file-upload-runtime-v2.py
      - name: Add SigV4 dependency
        run: pnpm --filter @lifespace/core add aws4fetch@1.0.20
      - name: Verify Core
        run: pnpm --filter @lifespace/core check
      - name: Commit verified runtime changes
        run: |
          rm -f scripts/apply-file-upload-runtime.py scripts/apply-file-upload-runtime-v2.py .github/workflows/temp-file-upload-runtime.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(core): add unified File upload capability"
          git push origin HEAD:feat/file-upload-capability
