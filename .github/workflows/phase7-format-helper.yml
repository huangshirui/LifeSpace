name: Format Phase 7 migration guards

on:
  push:
    branches:
      - phase7-homemew-production-cutover
    paths:
      - .github/workflows/phase7-format-helper.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase7-homemew-production-cutover

      - name: Format guard blocks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('infra/migration/homemew-one-shot.mjs')
          text = path.read_text()

          target = re.compile(
              r'  if \(identity\.environment !== TARGET_ENVIRONMENT \|\| core\.environment !== TARGET_ENVIRONMENT\) \{\s*'
              r'throw new MigrationError\(`Migration target environment mismatch; expected \$\{TARGET_ENVIRONMENT\}, got Identity=\$\{identity\.environment\}, Core=\$\{core\.environment\}`\);\s*'
              r'\}\s*if \(TARGET_ENVIRONMENT === "production"\) \{\s*'
              r'const confirmation = process\.env\.HOMEMEW_PRODUCTION_MIGRATION_CONFIRMATION \?\? "";\s*'
              r'if \(confirmation !== "MIGRATE_HOMEMEW_PRODUCTION"\) \{\s*'
              r'throw new MigrationError\("Production migration requires HOMEMEW_PRODUCTION_MIGRATION_CONFIRMATION=MIGRATE_HOMEMEW_PRODUCTION"\);\s*'
              r'\}\s*\}'
          )
          replacement = (
              '  if (identity.environment !== TARGET_ENVIRONMENT || core.environment !== TARGET_ENVIRONMENT) {\n'
              '    throw new MigrationError(`Migration target environment mismatch; expected ${TARGET_ENVIRONMENT}, got Identity=${identity.environment}, Core=${core.environment}`);\n'
              '  }\n'
              '  if (TARGET_ENVIRONMENT === "production") {\n'
              '    const confirmation = process.env.HOMEMEW_PRODUCTION_MIGRATION_CONFIRMATION ?? "";\n'
              '    if (confirmation !== "MIGRATE_HOMEMEW_PRODUCTION") {\n'
              '      throw new MigrationError("Production migration requires HOMEMEW_PRODUCTION_MIGRATION_CONFIRMATION=MIGRATE_HOMEMEW_PRODUCTION");\n'
              '    }\n'
              '  }'
          )
          text, count = target.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('target guard not found')

          rehearse = re.compile(
              r'  if \(command === "rehearse"\) \{\s*'
              r'if \(TARGET_ENVIRONMENT === "production"\) throw new MigrationError\("rehearse is staging-only; production requires an explicit final snapshot followed by migrate"\);'
          )
          replacement = (
              '  if (command === "rehearse") {\n'
              '    if (TARGET_ENVIRONMENT === "production") throw new MigrationError("rehearse is staging-only; production requires an explicit final snapshot followed by migrate");'
          )
          text, count = rehearse.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('rehearse guard not found')

          path.write_text(text)
          PY
          node --check infra/migration/homemew-one-shot.mjs

      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add infra/migration/homemew-one-shot.mjs
          git diff --cached --quiet && { echo "No formatting change"; exit 0; }
          git commit -m "chore: format Phase 7 migration guards"
          git push origin HEAD:phase7-homemew-production-cutover
