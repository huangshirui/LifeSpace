name: Fix Console staging acceptance summary

on:
  push:
    branches:
      - fix/console-staging-acceptance-summary
    paths:
      - scripts/fix_console_staging_acceptance_summary.py
      - .github/workflows/fix-console-staging-acceptance-summary.yml

permissions:
  contents: write

jobs:
  apply-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/console-staging-acceptance-summary
          fetch-depth: 0
      - uses: pnpm/action-setup@v4.4.0
        with:
          version: 10.13.1
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply acceptance summary fix
        run: python3 scripts/fix_console_staging_acceptance_summary.py
      - name: Validate repository
        run: pnpm check
      - name: Commit verified acceptance summary fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/console/scripts/verify-staging-control-plane.mjs
          git diff --cached --quiet && exit 0
          git commit -m "fix(console): remove stale route from staging acceptance summary"
          git push origin HEAD:fix/console-staging-acceptance-summary
