name: Ops 307 Console staging acceptance v3

on:
  push:
    branches:
      - ops/307-console-acceptance-v3
    paths:
      - .github/workflows/ops-307-console-acceptance-v3.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Console staging deployment and acceptance
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run lifespace-console-staging-deploy.yml --ref ops/307-console-acceptance-v3 --repo "$GITHUB_REPOSITORY" -f run_control_plane_acceptance=true
