name: Temporary 153 contract sync

on:
  push:
    branches:
      - feature/153-relation-target-lookup

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/153-relation-target-lookup
          fetch-depth: 0
      - name: Sync Kernel contract
        run: python3 apps/core/scripts/tmp-153-contract-sync.py
      - name: Verify diff hygiene
        run: git diff --check
      - name: Commit generated contract changes
        run: |
          if git diff --quiet -- apps/core/openapi.yaml apps/core/scripts/check-openapi.mjs; then
            echo "Contract already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/core/openapi.yaml apps/core/scripts/check-openapi.mjs
          git commit -m "docs(core): align Kernel 0.23 relation lookup contract"
          git push origin HEAD:feature/153-relation-target-lookup
