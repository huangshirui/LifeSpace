name: Provision LifeSpace platform staging resources

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type PROVISION_STAGING"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: lifespace-staging-deploy
  cancel-in-progress: false

jobs:
  provision:
    name: Reconcile declared staging resources
    runs-on: ubuntu-latest
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Validate staging provisioning intent
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.confirmation }}" = "PROVISION_STAGING" || { echo "confirmation must be PROVISION_STAGING" >&2; exit 1; }

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Report provisioning source
        run: |
          echo "ref=$GITHUB_REF"
          echo "sha=$GITHUB_SHA"
          echo "checkout=$(git rev-parse HEAD)"

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Validate staging credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN is not configured" >&2; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "CLOUDFLARE_ACCOUNT_ID is not configured" >&2; exit 1; }

      - name: Validate provisioner syntax
        run: node --check infra/scripts/provision-staging.mjs

      - name: Provision missing declared staging resources
        run: node infra/scripts/provision-staging.mjs
