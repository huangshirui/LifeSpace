name: Temporary external runtime envelope fix

on:
  push:
    branches: [fix/external-runtime-envelope-bulk-id]

permissions:
  contents: write

jobs:
  patch-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4.4.0
        with:
          version: 10.13.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Apply focused patch
        run: node scripts/tmp-fix-external-runtime-envelope.mjs
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Full repository check
        run: pnpm check
      - name: Commit verified patch and remove temporary helper
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/tmp-fix-external-runtime-envelope.mjs .github/workflows/tmp-fix-external-runtime-envelope.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(core): align External runtime record and Bulk contract"
          git push origin HEAD:fix/external-runtime-envelope-bulk-id
