name: Dispatch #311 exact-head staging acceptance

on:
  push:
    branches:
      - ops/dispatch-311-staging

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch #311 PR-head staging acceptance
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run staging-deploy.yml --repo huangshirui/LifeSpace --ref feat/311-service-token-prefix
