name: Redeploy LifeSpace Console staging (temporary)

on:
  push:
    branches:
      - feat/lifespace-console-admin-foundation
    paths:
      - .github/workflows/lifespace-console-staging-redeploy-temp.yml

permissions:
  contents: read
  statuses: write

concurrency:
  group: lifespace-console-staging-redeploy-temp
  cancel-in-progress: false

jobs:
  redeploy:
    name: Validate and redeploy Console staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/lifespace-console-admin-foundation

      - name: Report redeploy started
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo "starting" > "$RUNNER_TEMP/lifespace-console-redeploy-stage"
          node --input-type=module <<'NODE'
          const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
          const response = await fetch(`${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/statuses/${process.env.GITHUB_SHA}`, {
            method: 'POST',
            headers: {
              authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
              accept: 'application/vnd.github+json',
              'x-github-api-version': '2022-11-28',
              'content-type': 'application/json',
            },
            body: JSON.stringify({
              state: 'pending',
              target_url: runUrl,
              description: 'Console staging code-only redeploy started',
              context: 'lifespace-console-staging/redeploy',
            }),
          });
          if (!response.ok) throw new Error(`Could not publish pending status: ${response.status}`);
          NODE

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
          run_install: false

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Validate Cloudflare staging authority
        shell: bash
        run: |
          echo "validate-authority" > "$RUNNER_TEMP/lifespace-console-redeploy-stage"
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN is not configured" >&2; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "CLOUDFLARE_ACCOUNT_ID is not configured" >&2; exit 1; }

      - name: Install dependencies
        run: |
          echo "install" > "$RUNNER_TEMP/lifespace-console-redeploy-stage"
          pnpm install --frozen-lockfile

      - name: Validate repository
        run: |
          echo "check" > "$RUNNER_TEMP/lifespace-console-redeploy-stage"
          pnpm check

      - name: Redeploy Console staging only
        run: |
          echo "deploy" > "$RUNNER_TEMP/lifespace-console-redeploy-stage"
          pnpm --dir apps/console exec wrangler deploy --env staging --keep-vars

      - name: Verify Access-protected hostname is reachable
        shell: bash
        run: |
          echo "verify-host" > "$RUNNER_TEMP/lifespace-console-redeploy-stage"
          set -euo pipefail
          for attempt in $(seq 1 20); do
            code="$(curl --silent --show-error --head --output /dev/null --write-out '%{http_code}' --connect-timeout 5 --max-time 10 https://lifespace-staging.aisr.online/ || true)"
            if [ -n "$code" ] && [ "$code" -ge 200 ] && [ "$code" -lt 500 ]; then
              echo "lifespace-staging.aisr.online reachable behind Access (HTTP $code)"
              exit 0
            fi
            echo "Waiting for Console staging (${attempt}/20): ${code:-no-response}"
            sleep 3
          done
          echo "Console staging hostname did not become reachable" >&2
          exit 1

      - name: Report redeploy result
        if: ${{ always() }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const stagePath = `${process.env.RUNNER_TEMP}/lifespace-console-redeploy-stage`;
          const stage = fs.existsSync(stagePath) ? fs.readFileSync(stagePath, 'utf8').trim() : 'unknown';
          const succeeded = process.env.JOB_STATUS === 'success';
          const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
          const response = await fetch(`${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/statuses/${process.env.GITHUB_SHA}`, {
            method: 'POST',
            headers: {
              authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
              accept: 'application/vnd.github+json',
              'x-github-api-version': '2022-11-28',
              'content-type': 'application/json',
            },
            body: JSON.stringify({
              state: succeeded ? 'success' : 'failure',
              target_url: runUrl,
              description: succeeded ? 'Console staging code-only redeploy succeeded' : `Console staging redeploy failed at ${stage}`,
              context: 'lifespace-console-staging/redeploy',
            }),
          });
          if (!response.ok) throw new Error(`Could not publish final status: ${response.status}`);
          NODE

      - name: Summarize
        if: ${{ success() }}
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## LifeSpace Console staging code-only redeploy

          - Console proving shell: 0.0.2
          - New staging-only explicit Access registration flow deployed
          - Exact-origin + custom-intent browser mutation guard enabled
          - Existing Worker secrets preserved; no bootstrap secret used
          - Core/Identity databases and production resources untouched
          EOF
