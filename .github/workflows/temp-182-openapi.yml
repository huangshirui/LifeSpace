name: Temp 182 finalization

on:
  push:
    branches: [feat/182-compact-runtime-inventory]
    paths:
      - .github/workflows/temp-182-openapi.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/182-compact-runtime-inventory
      - name: Normalize embedded regex literals
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('infra/scripts/temp-182-openapi.mjs')
          s = p.read_text()
          s = s.replace('\\\\\\\\', '\\\\')
          p.write_text(s)
          PY
      - name: Finalize contract, gates and docs
        run: node infra/scripts/temp-182-openapi.mjs
      - name: Commit final feature branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs(core): finalize Kernel 0.27 Runtime inventory contract"
          git push origin HEAD:feat/182-compact-runtime-inventory
