name: Temporary 153 docs sync

on:
  push:
    branches:
      - feature/153-relation-target-lookup

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/153-relation-target-lookup
          fetch-depth: 0
      - name: Sync architecture and stability docs
        run: python3 apps/core/scripts/tmp-153-doc-sync.py
      - name: Verify stability classification
        run: node infra/scripts/check-contract-stability.mjs
      - name: Verify diff hygiene
        run: git diff --check
      - name: Commit documentation changes
        run: |
          if git diff --quiet -- README.md docs/contracts.md docs/architecture.md docs/model-definition-spec.md docs/contract-stability-baseline.json apps/core/AGENTS.md; then
            echo "Documentation already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/contracts.md docs/architecture.md docs/model-definition-spec.md docs/contract-stability-baseline.json apps/core/AGENTS.md
          git commit -m "docs(core): define relation target lookup boundary"
          git push origin HEAD:feature/153-relation-target-lookup
