name: Apply issue 309 non-atomic Bulk

on:
  push:
    branches:
      - feat/issue-309-non-atomic-bulk

permissions:
  contents: write

jobs:
  apply-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/issue-309-non-atomic-bulk
          fetch-depth: 0
      - uses: pnpm/action-setup@v4.4.0
        with:
          version: 10.13.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Normalize compact Kernel OpenAPI marker
        run: |
          sed -i 's/"version":"0.45.0"/"version": "0.45.0"/' apps/core/openapi.yaml
      - name: Apply issue 309 implementation
        run: python3 scripts/apply_issue_309.py
      - name: Converge issue 309 contract invariants
        run: python3 scripts/fix_issue_309_iteration1.py
      - name: Remove temporary transformers
        run: rm scripts/apply_issue_309.py scripts/fix_issue_309_iteration1.py .github/workflows/issue-309-apply.yml
      - name: Verify repository
        run: pnpm check
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/core docs/contracts.md docs/runtime-storage-performance.md .github/workflows/issue-309-apply.yml scripts/apply_issue_309.py scripts/fix_issue_309_iteration1.py
          git diff --cached --quiet && exit 0
          git commit -m "feat(core): add first-class non-atomic Bulk CRUD"
          git push origin HEAD:feat/issue-309-non-atomic-bulk
