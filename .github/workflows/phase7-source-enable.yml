name: Enable Phase 7 migration source

on:
  push:
    branches:
      - phase7-homemew-production-cutover
    paths:
      - .github/workflows/phase7-source-enable.yml

permissions:
  contents: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase7-homemew-production-cutover

      - name: Normalize committed Phase 7 migration guard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('infra/migration/homemew-one-shot.mjs')
          text = path.read_text()

          old = '''  if (identity.environment !== TARGET_ENVIRONMENT || core.environment !== TARGET_ENVIRONMENT) {
          throw new MigrationError(`Migration target environment mismatch; expected ${TARGET_ENVIRONMENT}, got Identity=${identity.environment}, Core=${core.environment}`);
          }
          if (TARGET_ENVIRONMENT === "production") {
          const confirmation = process.env.HOMEMEW_PRODUCTION_MIGRATION_CONFIRMATION ?? "";
          if (confirmation !== "MIGRATE_HOMEMEW_PRODUCTION") {
          throw new MigrationError("Production migration requires HOMEMEW_PRODUCTION_MIGRATION_CONFIRMATION=MIGRATE_HOMEMEW_PRODUCTION");
          }
          }'''
          new = '''  if (identity.environment !== TARGET_ENVIRONMENT || core.environment !== TARGET_ENVIRONMENT) {
            throw new MigrationError(`Migration target environment mismatch; expected ${TARGET_ENVIRONMENT}, got Identity=${identity.environment}, Core=${core.environment}`);
          }
          if (TARGET_ENVIRONMENT === "production") {
            const confirmation = process.env.HOMEMEW_PRODUCTION_MIGRATION_CONFIRMATION ?? "";
            if (confirmation !== "MIGRATE_HOMEMEW_PRODUCTION") {
              throw new MigrationError("Production migration requires HOMEMEW_PRODUCTION_MIGRATION_CONFIRMATION=MIGRATE_HOMEMEW_PRODUCTION");
            }
          }'''
          if text.count(old) != 1:
              raise SystemExit('could not find committed production target guard')
          text = text.replace(old, new, 1)

          old = '''  if (command === "rehearse") {
          if (TARGET_ENVIRONMENT === "production") throw new MigrationError("rehearse is staging-only; production requires an explicit final snapshot followed by migrate");'''
          new = '''  if (command === "rehearse") {
            if (TARGET_ENVIRONMENT === "production") throw new MigrationError("rehearse is staging-only; production requires an explicit final snapshot followed by migrate");'''
          if text.count(old) != 1:
              raise SystemExit('could not find committed production rehearse guard')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Validate migration source
        run: |
          node --check infra/migration/homemew-one-shot.mjs
          LIFESPACE_MIGRATION_TARGET=production node infra/migration/homemew-one-shot.mjs rehearse 2>&1 | grep -q 'rehearse is staging-only'

      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add infra/migration/homemew-one-shot.mjs
          git diff --cached --quiet && exit 0
          git commit -m "chore: normalize Phase 7 migration guards"
          git push origin HEAD:phase7-homemew-production-cutover
