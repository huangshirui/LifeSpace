name: One-shot Time Ranges Contract Migration

on:
  push:
    branches: ['feat/time-ranges-217']

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/time-ranges-217
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply guarded contract migration
        run: node infra/scripts/one-shot-time-ranges-contract.mjs
      - name: Remove one-shot migration machinery
        run: |
          rm infra/scripts/one-shot-time-ranges-contract.mjs
          rm .github/workflows/one-shot-time-ranges-contract.yml
      - name: Commit generated contract changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 1
          fi
          git commit -m "feat(core): publish time range semantic contract"
          git push origin HEAD:feat/time-ranges-217
