name: HomeMew production cutover

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run read-only preflight or execute the production cutover"
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - cutover
      confirmation:
        description: "preflight: PREFLIGHT_HOMEMEW_PRODUCTION; cutover: CUTOVER_HOMEMEW_PRODUCTION"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: homemew-production-cutover
  cancel-in-progress: false

jobs:
  cutover:
    name: Preflight or cut over HomeMew production
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      LIFESPACE_PRODUCTION_BOOTSTRAP_SECRET: ${{ secrets.LIFESPACE_PRODUCTION_BOOTSTRAP_SECRET }}
      HOMEMEW_WECHAT_IDENTITY_MAPPINGS_JSON: ${{ secrets.HOMEMEW_WECHAT_IDENTITY_MAPPINGS_JSON }}
      HOMEMEW_BACKEND_WORKER: homemew-backend-production
      HOMEMEW_LEGACY_WORKER: homemew-core
      HOMEMEW_PRODUCTION_HOSTNAME: homemew.aisr.online
      LIFESPACE_IDENTITY_PRODUCTION_URL: https://auth.aisr.online
      LIFESPACE_CORE_PRODUCTION_URL: https://core.aisr.online
      LIFESPACE_MIGRATION_TARGET: production
      HOMEMEW_PRODUCTION_MIGRATION_CONFIRMATION: MIGRATE_HOMEMEW_PRODUCTION

    steps:
      - name: Validate explicit production intent
        shell: bash
        run: |
          set -euo pipefail
          case "${{ inputs.mode }}" in
            preflight)
              test "${{ inputs.confirmation }}" = "PREFLIGHT_HOMEMEW_PRODUCTION" || {
                echo "preflight confirmation must be PREFLIGHT_HOMEMEW_PRODUCTION" >&2
                exit 1
              }
              ;;
            cutover)
              test "${{ inputs.confirmation }}" = "CUTOVER_HOMEMEW_PRODUCTION" || {
                echo "cutover confirmation must be CUTOVER_HOMEMEW_PRODUCTION" >&2
                exit 1
              }
              ;;
            *) echo "unsupported mode" >&2; exit 1 ;;
          esac
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN is not configured" >&2; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "CLOUDFLARE_ACCOUNT_ID is not configured" >&2; exit 1; }
          test ${#LIFESPACE_PRODUCTION_BOOTSTRAP_SECRET} -ge 32 || { echo "LIFESPACE_PRODUCTION_BOOTSTRAP_SECRET is invalid" >&2; exit 1; }
          test -n "${HOMEMEW_WECHAT_IDENTITY_MAPPINGS_JSON:-}" || {
            echo "HOMEMEW_WECHAT_IDENTITY_MAPPINGS_JSON is not configured in the production environment" >&2
            exit 1
          }

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
          run_install: false

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate repository and Phase 7 tooling
        run: |
          pnpm check
          node --check infra/migration/homemew-one-shot.mjs
          node --check infra/scripts/phase7-homemew-identities.mjs
          LIFESPACE_MIGRATION_TARGET=production node infra/migration/homemew-one-shot.mjs rehearse 2>&1 | grep -q 'rehearse is staging-only'

      - name: Verify LifeSpace production is still the empty Phase 6 target
        run: node infra/scripts/verify-production-db.mjs

      - name: Verify production endpoints
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 https://auth.aisr.online/health >/dev/null
          curl --fail --silent --show-error --retry 3 https://core.aisr.online/health >/dev/null

      - name: Verify HomeMew production backend secret boundary
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir apps/identity exec wrangler secret list \
            --name "$HOMEMEW_BACKEND_WORKER" --format json --env= \
            > "$RUNNER_TEMP/homemew-backend-secrets.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const entries = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/homemew-backend-secrets.json', 'utf8'));
          const names = new Set(entries.map((item) => item.name));
          if (!names.has('WECHAT_APP_SECRET')) throw new Error('homemew-backend-production is missing WECHAT_APP_SECRET');
          for (const residual of ['LIFESPACE_APPLICATION_CREDENTIAL', 'WECHAT_IDENTITY_BOOTSTRAP_MAP']) {
            if (names.has(residual)) throw new Error(`homemew-backend-production has residual pre-cutover secret ${residual}`);
          }
          console.log(JSON.stringify({ ok: true, wechatAppSecretPresent: true, residualCutoverSecrets: false }));
          NODE

      - name: Verify current HomeMew domain still targets legacy Core
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const endpoint = `https://api.cloudflare.com/client/v4/accounts/${encodeURIComponent(process.env.CLOUDFLARE_ACCOUNT_ID)}/workers/domains`;
          const response = await fetch(endpoint, { headers: { authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}` } });
          const payload = await response.json();
          if (!response.ok || payload?.success !== true || !Array.isArray(payload.result)) throw new Error('Could not list Cloudflare Worker custom domains');
          const domain = payload.result.find((item) => item.hostname === process.env.HOMEMEW_PRODUCTION_HOSTNAME);
          if (!domain) throw new Error(`${process.env.HOMEMEW_PRODUCTION_HOSTNAME} is not a Worker custom domain`);
          if (domain.service !== process.env.HOMEMEW_LEGACY_WORKER) {
            throw new Error(`${process.env.HOMEMEW_PRODUCTION_HOSTNAME} currently targets ${domain.service}, expected ${process.env.HOMEMEW_LEGACY_WORKER}`);
          }
          console.log(JSON.stringify({ ok: true, hostname: domain.hostname, service: domain.service }));
          NODE

      - name: Capture read-only preflight source snapshot
        run: >-
          node infra/migration/homemew-one-shot.mjs snapshot
          --out "$RUNNER_TEMP/homemew-preflight-snapshot.json"

      - name: Validate legacy WeChat identity export against source users
        run: >-
          node infra/scripts/phase7-homemew-identities.mjs validate
          --snapshot "$RUNNER_TEMP/homemew-preflight-snapshot.json"

      - name: Summarize read-only preflight
        if: ${{ inputs.mode == 'preflight' }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## HomeMew production cutover preflight

          - LifeSpace production target: Phase 6 business-empty gate passed
          - HomeMew source: read-only snapshot validated
          - Legacy WeChat `identity_mappings`: validated against active source users
          - HomeMew production backend: `WECHAT_APP_SECRET` present; no residual cutover credential/map
          - `homemew.aisr.online`: still targets legacy `homemew-core`
          - No source write freeze, data migration, credential issuance, Worker domain switch, or production write activation was performed.
          EOF

      - name: Deploy reversible write-freeze version to legacy HomeMew Core
        if: ${{ inputs.mode == 'cutover' }}
        shell: bash
        run: |
          set -euo pipefail
          FREEZE_DIR="$RUNNER_TEMP/homemew-freeze"
          mkdir -p "$FREEZE_DIR"
          cat > "$FREEZE_DIR/worker.mjs" <<'EOF'
          const maintenance = () => new Response(JSON.stringify({
            error: { code: 'MIGRATION_WRITE_FREEZE', message: 'HomeMew production migration is in progress' }
          }), {
            status: 503,
            headers: { 'content-type': 'application/json; charset=utf-8', 'cache-control': 'no-store' },
          });
          export default {
            fetch() { return maintenance(); },
            async queue() {},
            async scheduled() {},
          };
          EOF
          cat > "$FREEZE_DIR/wrangler.jsonc" <<EOF
          {
            "name": "homemew-core",
            "main": "./worker.mjs",
            "compatibility_date": "2026-07-02",
            "keep_vars": true,
            "triggers": { "crons": ["0 * * * *"] },
            "d1_databases": [{
              "binding": "DB",
              "database_name": "homemew-core",
              "database_id": "3921d02d-8158-4706-a979-c18ff9f05ff8"
            }],
            "r2_buckets": [{ "binding": "AVATARS", "bucket_name": "homemew-assets" }],
            "queues": {
              "producers": [{ "binding": "CREATION_DRAFT_QUEUE", "queue": "homemew-creation-drafts" }],
              "consumers": [{
                "queue": "homemew-creation-drafts",
                "max_batch_size": 1,
                "max_batch_timeout": 1,
                "max_retries": 2
              }]
            },
            "ratelimits": [{
              "name": "AI_RATE_LIMITER",
              "namespace_id": "24001",
              "simple": { "limit": 10, "period": 60 }
            }]
          }
          EOF
          pnpm --dir apps/identity exec wrangler deploy \
            --config "$FREEZE_DIR/wrangler.jsonc" \
            --message "Phase 7 HomeMew production write freeze"
          touch "$RUNNER_TEMP/homemew-freeze-active"

      - name: Verify legacy HomeMew write freeze
        if: ${{ inputs.mode == 'cutover' }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 15); do
            BODY="$(curl --silent --show-error -w '\n%{http_code}' "https://${HOMEMEW_PRODUCTION_HOSTNAME}/health" || true)"
            STATUS="${BODY##*$'\n'}"
            JSON="${BODY%$'\n'*}"
            if [ "$STATUS" = "503" ] && printf '%s' "$JSON" | node --input-type=module -e '
              import fs from "node:fs";
              const value = JSON.parse(fs.readFileSync(0, "utf8"));
              process.exit(value?.error?.code === "MIGRATION_WRITE_FREEZE" ? 0 : 1);
            '; then
              exit 0
            fi
            if [ "$attempt" -eq 15 ]; then
              echo "Legacy HomeMew write freeze did not converge" >&2
              exit 1
            fi
            sleep 2
          done

      - name: Capture final frozen HomeMew source snapshot
        if: ${{ inputs.mode == 'cutover' }}
        run: >-
          node infra/migration/homemew-one-shot.mjs snapshot
          --out "$RUNNER_TEMP/homemew-final-snapshot.json"

      - name: Revalidate WeChat identities against final snapshot
        if: ${{ inputs.mode == 'cutover' }}
        run: >-
          node infra/scripts/phase7-homemew-identities.mjs validate
          --snapshot "$RUNNER_TEMP/homemew-final-snapshot.json"

      - name: Reconfirm empty LifeSpace production target after source freeze
        if: ${{ inputs.mode == 'cutover' }}
        run: node infra/scripts/verify-production-db.mjs

      - name: Issue temporary HomeMew migration credential
        if: ${{ inputs.mode == 'cutover' }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const base = process.env.LIFESPACE_IDENTITY_PRODUCTION_URL.replace(/\/+$/u, '');
          const appId = 'homemew-miniprogram';
          const response = await fetch(`${base}/bootstrap/v1/applications/${appId}/credentials`, {
            method: 'POST',
            headers: { 'x-bootstrap-secret': process.env.LIFESPACE_PRODUCTION_BOOTSTRAP_SECRET },
          });
          const payload = await response.json().catch(() => null);
          const id = payload?.data?.id ?? '';
          const secret = payload?.data?.clientSecret ?? '';
          if (response.status !== 201 || !id.startsWith('apc_') || !secret.startsWith('lsa_')) {
            throw new Error(`Could not issue temporary migration credential: HTTP ${response.status}`);
          }
          console.log(`::add-mask::${secret}`);
          fs.writeFileSync(process.env.RUNNER_TEMP + '/migration-credential-id', id, { mode: 0o600 });
          fs.writeFileSync(process.env.RUNNER_TEMP + '/migration-credential-secret', secret, { mode: 0o600 });
          console.log(JSON.stringify({ ok: true, temporaryCredentialIssued: true }));
          NODE

      - name: Migrate final snapshot to LifeSpace production
        if: ${{ inputs.mode == 'cutover' }}
        shell: bash
        run: |
          set -euo pipefail
          export LIFESPACE_APPLICATION_SECRET="$(cat "$RUNNER_TEMP/migration-credential-secret")"
          node infra/migration/homemew-one-shot.mjs migrate \
            --source "$RUNNER_TEMP/homemew-final-snapshot.json" \
            --report "$RUNNER_TEMP/migration-report.json"

      - name: Revoke temporary migration credential
        if: ${{ always() && inputs.mode == 'cutover' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          ID_FILE="$RUNNER_TEMP/migration-credential-id"
          [ -s "$ID_FILE" ] || exit 0
          CREDENTIAL_ID="$(cat "$ID_FILE")"
          STATUS="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request DELETE \
            --header "x-bootstrap-secret: $LIFESPACE_PRODUCTION_BOOTSTRAP_SECRET" \
            "$LIFESPACE_IDENTITY_PRODUCTION_URL/bootstrap/v1/applications/homemew-miniprogram/credentials/$CREDENTIAL_ID")"
          test "$STATUS" = "204" || test "$STATUS" = "404"
          rm -f "$RUNNER_TEMP/migration-credential-secret"

      - name: Require production migration PASS
        if: ${{ inputs.mode == 'cutover' }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/migration-report.json', 'utf8'));
          if (report.result !== 'PASS' || report?.verification?.result !== 'PASS') throw new Error('Production migration report is not PASS');
          if (report?.target?.identityStatus?.environment !== 'production' || report?.target?.coreStatus?.environment !== 'production') {
            throw new Error('Migration report did not verify LifeSpace production endpoints');
          }
          console.log(JSON.stringify({
            ok: true,
            result: report.result,
            users: report.migrated?.users,
            spaces: report.migrated?.spaces,
            events: report.migrated?.events,
            tasks: report.migrated?.tasks,
            dayRecords: report.migrated?.dayRecords,
            wishes: report.migrated?.wishes,
            objects: report.migrated?.objects,
          }));
          NODE

      - name: Build production WeChat provider bootstrap map
        if: ${{ inputs.mode == 'cutover' }}
        run: >-
          node infra/scripts/phase7-homemew-identities.mjs build
          --snapshot "$RUNNER_TEMP/homemew-final-snapshot.json"
          --report "$RUNNER_TEMP/migration-report.json"
          --out "$RUNNER_TEMP/wechat-bootstrap-map.json"

      - name: Issue final HomeMew production application credential
        if: ${{ inputs.mode == 'cutover' }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const base = process.env.LIFESPACE_IDENTITY_PRODUCTION_URL.replace(/\/+$/u, '');
          const appId = 'homemew-miniprogram';
          const existing = await fetch(`${base}/bootstrap/v1/applications/${appId}/credentials`, {
            headers: { 'x-bootstrap-secret': process.env.LIFESPACE_PRODUCTION_BOOTSTRAP_SECRET },
          });
          const existingPayload = await existing.json().catch(() => null);
          const active = existingPayload?.data?.filter((item) => item.status === 'active' && item.revokedAt === null) ?? [];
          if (existing.status !== 200 || active.length !== 0) throw new Error('Expected zero active HomeMew credentials before final issuance');
          const response = await fetch(`${base}/bootstrap/v1/applications/${appId}/credentials`, {
            method: 'POST',
            headers: { 'x-bootstrap-secret': process.env.LIFESPACE_PRODUCTION_BOOTSTRAP_SECRET },
          });
          const payload = await response.json().catch(() => null);
          const id = payload?.data?.id ?? '';
          const secret = payload?.data?.clientSecret ?? '';
          if (response.status !== 201 || !id.startsWith('apc_') || !secret.startsWith('lsa_')) {
            throw new Error(`Could not issue final HomeMew credential: HTTP ${response.status}`);
          }
          console.log(`::add-mask::${secret}`);
          fs.writeFileSync(process.env.RUNNER_TEMP + '/final-credential-id', id, { mode: 0o600 });
          fs.writeFileSync(process.env.RUNNER_TEMP + '/final-credential-secret', secret, { mode: 0o600 });
          console.log(JSON.stringify({ ok: true, finalCredentialIssued: true, credentialId: id }));
          NODE

      - name: Install final LifeSpace credential and provider map in HomeMew Worker
        if: ${{ inputs.mode == 'cutover' }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const credential = fs.readFileSync(process.env.RUNNER_TEMP + '/final-credential-secret', 'utf8').trim();
          const bootstrapMap = fs.readFileSync(process.env.RUNNER_TEMP + '/wechat-bootstrap-map.json', 'utf8').trim();
          fs.writeFileSync(process.env.RUNNER_TEMP + '/homemew-production-secrets.json', JSON.stringify({
            LIFESPACE_APPLICATION_CREDENTIAL: credential,
            WECHAT_IDENTITY_BOOTSTRAP_MAP: bootstrapMap,
          }), { mode: 0o600 });
          NODE
          VERSION_TAG="homemew-production-cutover-${GITHUB_RUN_ID}"
          pnpm --dir apps/identity exec wrangler versions secret bulk \
            "$RUNNER_TEMP/homemew-production-secrets.json" \
            --name "$HOMEMEW_BACKEND_WORKER" \
            --tag "$VERSION_TAG" \
            --message "HomeMew Phase 7 production credential and identity handoff" \
            --env=
          pnpm --dir apps/identity exec wrangler versions deploy \
            --version-tag "$VERSION_TAG" \
            --name "$HOMEMEW_BACKEND_WORKER" \
            --yes \
            --env=
          pnpm --dir apps/identity exec wrangler secret list \
            --name "$HOMEMEW_BACKEND_WORKER" --format json --env= \
            > "$RUNNER_TEMP/homemew-backend-secrets-after.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const entries = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/homemew-backend-secrets-after.json', 'utf8'));
          const names = new Set(entries.map((item) => item.name));
          for (const required of ['WECHAT_APP_SECRET', 'LIFESPACE_APPLICATION_CREDENTIAL', 'WECHAT_IDENTITY_BOOTSTRAP_MAP']) {
            if (!names.has(required)) throw new Error(`HomeMew production Worker is missing ${required}`);
          }
          console.log(JSON.stringify({ ok: true, requiredSecretsPresent: true }));
          NODE
          touch "$RUNNER_TEMP/final-worker-secrets-deployed"
          rm -f "$RUNNER_TEMP/homemew-production-secrets.json" "$RUNNER_TEMP/final-credential-secret"

      - name: Switch homemew.aisr.online to new production backend
        if: ${{ inputs.mode == 'cutover' }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const endpoint = `https://api.cloudflare.com/client/v4/accounts/${encodeURIComponent(process.env.CLOUDFLARE_ACCOUNT_ID)}/workers/domains`;
          const response = await fetch(endpoint, {
            method: 'PUT',
            headers: {
              authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,
              'content-type': 'application/json',
            },
            body: JSON.stringify({
              hostname: process.env.HOMEMEW_PRODUCTION_HOSTNAME,
              service: process.env.HOMEMEW_BACKEND_WORKER,
            }),
          });
          const payload = await response.json().catch(() => null);
          if (!response.ok || payload?.success !== true || payload?.result?.service !== process.env.HOMEMEW_BACKEND_WORKER) {
            throw new Error(`Could not attach production domain to new HomeMew backend: HTTP ${response.status}`);
          }
          console.log(JSON.stringify({ ok: true, hostname: payload.result.hostname, service: payload.result.service }));
          NODE
          touch "$RUNNER_TEMP/domain-switched"

      - name: Verify new production backend through public domain
        if: ${{ inputs.mode == 'cutover' }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            HEALTH="$(curl --fail --silent --show-error "https://${HOMEMEW_PRODUCTION_HOSTNAME}/health" || true)"
            if [ -n "$HEALTH" ] && printf '%s' "$HEALTH" | node --input-type=module -e '
              import fs from "node:fs";
              const data = JSON.parse(fs.readFileSync(0, "utf8"));
              process.exit(
                data.ok === true
                && data.environment === "production"
                && data.loginReady === true
                && data.identityBootstrapConfigured === true
                ? 0 : 1
              );
            '; then
              echo "$HEALTH"
              exit 0
            fi
            if [ "$attempt" -eq 20 ]; then
              echo "New HomeMew production backend did not converge" >&2
              exit 1
            fi
            sleep 3
          done

      - name: Verify production domain ownership after cutover
        if: ${{ inputs.mode == 'cutover' }}
        run: |
          node --input-type=module <<'NODE'
          const endpoint = `https://api.cloudflare.com/client/v4/accounts/${encodeURIComponent(process.env.CLOUDFLARE_ACCOUNT_ID)}/workers/domains`;
          const response = await fetch(endpoint, { headers: { authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}` } });
          const payload = await response.json();
          const domain = payload?.result?.find((item) => item.hostname === process.env.HOMEMEW_PRODUCTION_HOSTNAME);
          if (!response.ok || payload?.success !== true || domain?.service !== process.env.HOMEMEW_BACKEND_WORKER) {
            throw new Error('HomeMew production custom domain did not converge to the new backend');
          }
          console.log(JSON.stringify({ ok: true, hostname: domain.hostname, service: domain.service }));
          NODE

      - name: Upload production migration report
        if: ${{ always() && inputs.mode == 'cutover' }}
        uses: actions/upload-artifact@v4
        with:
          name: homemew-production-migration-report-${{ github.run_id }}
          path: ${{ runner.temp }}/migration-report.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Revoke final credential on failed cutover
        if: ${{ failure() && inputs.mode == 'cutover' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          ID_FILE="$RUNNER_TEMP/final-credential-id"
          [ -s "$ID_FILE" ] || exit 0
          CREDENTIAL_ID="$(cat "$ID_FILE")"
          STATUS="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request DELETE \
            --header "x-bootstrap-secret: $LIFESPACE_PRODUCTION_BOOTSTRAP_SECRET" \
            "$LIFESPACE_IDENTITY_PRODUCTION_URL/bootstrap/v1/applications/homemew-miniprogram/credentials/$CREDENTIAL_ID")"
          test "$STATUS" = "204" || test "$STATUS" = "404"

      - name: Restore legacy domain on failed cutover
        if: ${{ failure() && inputs.mode == 'cutover' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          [ -f "$RUNNER_TEMP/domain-switched" ] || exit 0
          node --input-type=module <<'NODE'
          const endpoint = `https://api.cloudflare.com/client/v4/accounts/${encodeURIComponent(process.env.CLOUDFLARE_ACCOUNT_ID)}/workers/domains`;
          const response = await fetch(endpoint, {
            method: 'PUT',
            headers: {
              authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,
              'content-type': 'application/json',
            },
            body: JSON.stringify({ hostname: process.env.HOMEMEW_PRODUCTION_HOSTNAME, service: process.env.HOMEMEW_LEGACY_WORKER }),
          });
          const payload = await response.json().catch(() => null);
          if (!response.ok || payload?.success !== true) throw new Error('Could not restore legacy HomeMew domain');
          NODE

      - name: Roll back legacy Core write freeze on failed cutover
        if: ${{ failure() && inputs.mode == 'cutover' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          [ -f "$RUNNER_TEMP/homemew-freeze-active" ] || exit 0
          pnpm --dir apps/identity exec wrangler rollback \
            --name "$HOMEMEW_LEGACY_WORKER" \
            --message "Rollback HomeMew Phase 7 cutover before new production writes" \
            --env=

      - name: Summarize successful production migration
        if: ${{ success() && inputs.mode == 'cutover' }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## HomeMew Phase 7 production migration

          - Legacy HomeMew source writes: frozen before final snapshot
          - Final HomeMew snapshot: captured read-only on the ephemeral runner; not uploaded
          - LifeSpace production migration: `PASS`
          - Temporary migration credential: revoked
          - Final HomeMew production `lsa_*`: stored only as a Cloudflare Worker Secret
          - Legacy WeChat `openid -> LifeSpace usr_*` continuity map: derived from the frozen snapshot/report and stored only as a Worker Secret
          - `homemew.aisr.online`: switched to `homemew-backend-production`
          - New backend health: `loginReady=true`, provider bootstrap configured
