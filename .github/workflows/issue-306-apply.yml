name: Apply issue 306 Authorization Request

on:
  push:
    branches:
      - feat/issue-306-authorization-request
    paths:
      - scripts/apply_issue_306.py
      - .github/workflows/issue-306-apply.yml

permissions:
  contents: write

jobs:
  apply-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/issue-306-authorization-request
          fetch-depth: 0
      - name: Reconcile latest main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
      - uses: pnpm/action-setup@v4.4.0
        with:
          version: 10.13.1
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply #306 implementation wiring
        run: python3 scripts/apply_issue_306.py
      - name: Validate repository
        run: pnpm check
      - name: Commit verified implementation
        run: |
          git add apps/core README.md docs/agent-ready.md docs/permissions.md docs/contracts.md docs/contract-stability-baseline.json
          git diff --cached --quiet || git commit -m "feat(core): add first-class Authorization Request protocol"
          git push origin HEAD:feat/issue-306-authorization-request
