name: Dependency remediation candidate (temporary)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/dependency-remediation-candidate.yml'
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4.4.0
        with:
          version: 10.13.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Audit current dependency graph and inspect upstream packages
        run: |
          set -euo pipefail
          pnpm audit --json > /tmp/audit-before.json || true
          node -e 'const a=require("/tmp/audit-before.json"); console.log(JSON.stringify({metadata:a.metadata,advisories:Object.values(a.advisories||{}).map(x=>({id:x.github_advisory_id,title:x.title,module:x.module_name,patched:x.patched_versions,vulnerable:x.vulnerable_versions,severity:x.severity,findings:x.findings}))}))'
          for p in wrangler @cloudflare/vitest-pool-workers @cloudflare/vitest-plugin @cloudflare/vite-plugin miniflare undici sharp source-map-js zod vitest vite; do
            echo "REGISTRY $p"
            pnpm view "$p" version dependencies peerDependencies --json
          done
      - name: Generate parent-upgrade candidate with pinned pnpm
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          for (const app of ['core','identity','console','account']) {
            const path = `apps/${app}/package.json`;
            const pkg = JSON.parse(fs.readFileSync(path,'utf8'));
            const dev = pkg.devDependencies;
            dev.wrangler = '4.161.0';
            if (app === 'core' || app === 'identity') {
              delete dev['@cloudflare/vitest-pool-workers'];
              dev['@cloudflare/vitest-plugin'] = '1.8.1';
              dev.vitest = '4.1.12';
              dev['@cloudflare/workers-types'] = '5.20261110.1';
            }
            if (app === 'console') {
              dev['@cloudflare/vite-plugin'] = '1.69.1';
              dev.vite = '8.3.8';
              dev['@cloudflare/workers-types'] = '5.20261110.1';
            }
            fs.writeFileSync(path,JSON.stringify(pkg,null,2)+'\n');
          }
          NODE
          git grep -l -F '@cloudflare/vitest-pool-workers' -- apps/core apps/identity | while IFS= read -r file; do
            sed -i 's|@cloudflare/vitest-pool-workers|@cloudflare/vitest-plugin|g' "$file"
          done
          pnpm install --lockfile-only
          pnpm audit --json > /tmp/audit-after.json || true
          node -e 'const a=require("/tmp/audit-after.json"); console.log("AUDIT_AFTER "+JSON.stringify({metadata:a.metadata,advisories:Object.values(a.advisories||{}).map(x=>({id:x.github_advisory_id,title:x.title,module:x.module_name,patched:x.patched_versions,vulnerable:x.vulnerable_versions,severity:x.severity,findings:x.findings}))}))'
          pnpm install --frozen-lockfile
          pnpm --dir apps/core exec wrangler types src/worker-configuration.d.ts --env-interface CloudflareBindings --include-runtime false
          git diff --stat
          git diff --binary > /tmp/candidate.diff
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          for (const path of execFileSync('git',['diff','--name-only'],{encoding:'utf8'}).trim().split('\n').filter(Boolean)) {
            const contents = fs.readFileSync(path,'utf8');
            for (let i=0;i<contents.length;i+=1400) console.log('CANDIDATE_FILE '+JSON.stringify({path,offset:i,content:contents.slice(i,i+1400),length:contents.length}));
          }
          NODE
      - name: Validate candidate (no deploy)
        run: |
          pnpm install --frozen-lockfile
          pnpm check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-remediation-evidence
          path: |
            /tmp/audit-before.json
            /tmp/audit-after.json
            /tmp/candidate.diff
          if-no-files-found: warn
          retention-days: 3
