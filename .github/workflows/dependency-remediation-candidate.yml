name: Dependency remediation candidate (temporary)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/dependency-remediation-candidate.yml'
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4.4.0
        with:
          version: 10.13.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Audit current dependency graph and inspect upstream packages
        run: |
          set -euo pipefail
          pnpm audit --json > /tmp/audit-before.json || true
          node -e 'const a=require("/tmp/audit-before.json"); console.log(JSON.stringify({metadata:a.metadata,advisories:Object.values(a.advisories||{}).map(x=>({id:x.github_advisory_id,title:x.title,module:x.module_name,patched:x.patched_versions,vulnerable:x.vulnerable_versions,severity:x.severity,findings:x.findings}))}))'
          for p in wrangler @cloudflare/vitest-pool-workers @cloudflare/vitest-plugin @cloudflare/vite-plugin miniflare undici sharp source-map-js zod vitest vite; do
            echo "REGISTRY $p"
            pnpm view "$p" version dependencies peerDependencies --json
          done
      - name: Generate parent-upgrade candidate with pinned pnpm
        run: |
          set -euo pipefail
          pnpm --filter @lifespace/core --filter @lifespace/identity update wrangler@4.160.1 vitest@4.1.12 @cloudflare/vitest-pool-workers@latest --lockfile-only
          pnpm --filter @lifespace/console update wrangler@4.160.1 @cloudflare/vite-plugin@1.69.1 vite@8.2.5 --lockfile-only
          pnpm --filter @lifespace/account update wrangler@4.160.1 --lockfile-only
          pnpm audit --json > /tmp/audit-after.json || true
          node -e 'const a=require("/tmp/audit-after.json"); console.log(JSON.stringify({metadata:a.metadata,advisories:Object.values(a.advisories||{}).map(x=>({id:x.github_advisory_id,title:x.title,module:x.module_name,patched:x.patched_versions,vulnerable:x.vulnerable_versions,severity:x.severity,findings:x.findings}))}))'
          git diff --stat
          git diff -- package.json pnpm-workspace.yaml apps/core/package.json apps/identity/package.json apps/console/package.json apps/account/package.json pnpm-lock.yaml > /tmp/candidate.diff
          echo '===CANDIDATE_DIFF_BEGIN==='
          cat /tmp/candidate.diff
          echo '===CANDIDATE_DIFF_END==='
      - name: Validate candidate (no deploy)
        run: |
          pnpm install --frozen-lockfile
          pnpm check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-remediation-evidence
          path: |
            /tmp/audit-before.json
            /tmp/audit-after.json
            /tmp/candidate.diff
          if-no-files-found: warn
          retention-days: 3
