name: Apply issue 307 Agent API credential

on:
  push:
    branches:
      - feat/307-agent-api-credential
    paths:
      - scripts/fix_issue_307_v3.py
      - .github/workflows/issue-307-apply.yml

permissions:
  contents: write

jobs:
  apply-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/307-agent-api-credential
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Apply issue 307 closeout
        run: python3 scripts/fix_issue_307_v3.py
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate repository
        run: pnpm check
      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat(identity): complete Agent API credential lifecycle (#307)"
          git push origin HEAD:feat/307-agent-api-credential
