name: Temporary production readiness guard sync

on:
  push:
    branches:
      - feature/resolve-100-101-query-schema

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[skip-release-guard-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/resolve-100-101-query-schema
      - name: Wire pre-mutation release readiness guard
        shell: bash
        run: |
          set -euo pipefail
          node <<'EOF'
          const fs = require('node:fs');

          function replaceOnce(path, oldText, newText) {
            let value = fs.readFileSync(path, 'utf8');
            if (!value.includes(oldText)) throw new Error(`${path}: anchor not found`);
            value = value.replace(oldText, newText);
            fs.writeFileSync(path, value);
          }

          replaceOnce(
            '.github/workflows/production-deploy.yml',
            '      - name: Validate production scripts\n        run: node infra/scripts/check-production-infra.mjs\n\n      - name: Resolve expected production versions',
            '      - name: Validate production scripts\n        run: node infra/scripts/check-production-infra.mjs\n\n      - name: Validate production release readiness\n        run: node infra/scripts/check-production-release-readiness.mjs\n\n      - name: Resolve expected production versions'
          );

          replaceOnce(
            'infra/scripts/check-production-infra.mjs',
            '  "infra/scripts/production-expectations.mjs",\n  "infra/scripts/resolve-production-d1.mjs",',
            '  "infra/scripts/production-expectations.mjs",\n  "infra/scripts/check-production-release-readiness.mjs",\n  "infra/scripts/resolve-production-d1.mjs",'
          );
          replaceOnce(
            'infra/scripts/check-production-infra.mjs',
            '  "node infra/scripts/verify-production-model-admin.mjs",\n  "node infra/scripts/verify-production-homemew-contract.mjs",',
            '  "node infra/scripts/check-production-release-readiness.mjs",\n  "node infra/scripts/verify-production-model-admin.mjs",\n  "node infra/scripts/verify-production-homemew-contract.mjs",'
          );

          const testPath = 'infra/scripts/production-model-contract.test.mjs';
          let test = fs.readFileSync(testPath, 'utf8');
          test = test.replace(
            'const homemewReleaseVerifier = new URL("./verify-production-homemew-contract.mjs", import.meta.url);',
            'const homemewReleaseVerifier = new URL("./verify-production-homemew-contract.mjs", import.meta.url);\nconst releaseReadiness = new URL("./check-production-release-readiness.mjs", import.meta.url);\nconst productionWorkflow = new URL("../../.github/workflows/production-deploy.yml", import.meta.url);'
          );
          test = test.replace(
            '  assert.equal(wish.minimumVersion, 5, "Wish clean-release version remains the production Registry floor");\n  assert.equal(\n    wish.hash,\n    "ec4f99f238e44c756905d30a97f6bb5c063b783eca159dfe39f518ea58ff64b6",\n    "production must pin the authoritative Mutation Authority Wish schema hash",\n  );',
            '  assert.equal(wish.minimumVersion, 6, "Wish clean-release version remains the production Registry floor");\n  assert.equal(\n    wish.hash,\n    "4d34e89df332b9b2c34549699e4210a3166db6eaddabe0ac59de5d4770c206c3",\n    "production proving semantics must pin the authoritative field-title Wish schema hash",\n  );'
          );
          const oldTest = `test("HomeMew semantic release identity matches production proving route and schema hashes", () => {\n  const accepted = acceptedHomeMewModelSemantics(profile);\n  assert.equal(accepted.fingerprint, "msf_498674114e2e312c926f733ba939b49d85020a1ee14a4729b27be62bf1f774dc");\n\n  const proving = new Map(PRODUCTION_PROVING_MODELS.map((model) => [model.key, model]));\n  for (const model of accepted.models) {\n    assert.equal(proving.get(model.key)?.route, model.route, \`${'${model.key}'} route identity must stay aligned\`);\n    assert.equal(proving.get(model.key)?.hash, model.schemaHash, \`${'${model.key}'} schema identity must stay aligned\`);\n  }\n});`;
          const newTest = `test("production release readiness blocks mutation until accepted application semantics are promoted", () => {\n  const source = readFileSync(fileURLToPath(releaseReadiness), "utf8");\n  assert.match(source, /profile\\.contracts\\?\\.coreKernel !== PRODUCTION_EXPECTATIONS\\.core\\.contractVersion/u, "release readiness must compare the accepted HomeMew Kernel pin to the production release");\n  assert.match(source, /profile\\.contracts\\?\\.identity !== PRODUCTION_EXPECTATIONS\\.identity\\.contractVersion/u, "release readiness must compare the accepted Identity pin to the production release");\n  assert.match(source, /assertHomeMewModelSemanticCompatibility/u, "release readiness must compare accepted model semantics to production proving semantics");\n\n  const workflow = readFileSync(fileURLToPath(productionWorkflow), "utf8");\n  const readinessIndex = workflow.indexOf("node infra/scripts/check-production-release-readiness.mjs");\n  const migrationIndex = workflow.indexOf("pnpm --filter @lifespace/core db:migrate:production");\n  assert.notEqual(readinessIndex, -1, "production deploy must run the release-readiness guard");\n  assert.notEqual(migrationIndex, -1, "production deploy must retain the Core migration step");\n  assert.ok(readinessIndex < migrationIndex, "release readiness must fail closed before any production Core migration");\n});`;
          if (!test.includes(oldTest)) throw new Error('production semantic equality test anchor not found');
          test = test.replace(oldTest, newTest);
          const environmentTestAnchor = '  const accepted = acceptedHomeMewModelSemantics(profile);\n  const stagingManifest = accepted.models.map';
          if (!test.includes(environmentTestAnchor)) throw new Error('environment-local fingerprint test anchor not found');
          test = test.replace(
            environmentTestAnchor,
            '  const accepted = acceptedHomeMewModelSemantics(profile);\n  assert.equal(accepted.fingerprint, "msf_498674114e2e312c926f733ba939b49d85020a1ee14a4729b27be62bf1f774dc");\n  const stagingManifest = accepted.models.map'
          );
          fs.writeFileSync(testPath, test);
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/production-deploy.yml infra/scripts/check-production-infra.mjs infra/scripts/production-model-contract.test.mjs
          git commit -m "fix(infra): gate production promotion before mutation [skip-release-guard-sync]"
          git push origin HEAD:feature/resolve-100-101-query-schema
