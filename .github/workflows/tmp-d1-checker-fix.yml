name: Temporary D1 Checker Alignment

on:
  push:
    branches:
      - feat/191-batch-reference-resolution

permissions:
  contents: write

jobs:
  fix:
    if: github.ref == 'refs/heads/feat/191-batch-reference-resolution'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/191-batch-reference-resolution
      - name: Align static relation checker
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'apps/core/scripts/check-openapi.mjs';
          let text = fs.readFileSync(path, 'utf8');
          const before = `if (schemas.RuntimeModelSemanticField?.properties?.relation?.$ref !== "#/components/schemas/RuntimeModelSemanticRelation"\n    || Object.keys(schemas.RuntimeModelSemanticRelation?.properties ?? {}).sort().join(",") !== "cardinality,targetModel") {\n  throw new Error("Single-model semantic detail relation facts must remain static target/cardinality semantics");\n}`;
          const after = `if (schemas.RuntimeModelSemanticField?.properties?.relation?.$ref !== "#/components/schemas/RuntimeModelSemanticRelation"\n    || Object.keys(schemas.RuntimeModelSemanticRelation?.properties ?? {}).sort().join(",") !== "cardinality,resolution,targetModel"\n    || schemas.RuntimeModelSemanticRelation?.properties?.lookup) {\n  throw new Error("Single-model semantic detail relation facts must remain static target/cardinality/resolution semantics without dynamic lookup state");\n}`;
          if (!text.includes(before)) throw new Error('old static relation checker not found');
          text = text.replace(before, after);
          fs.writeFileSync(path, text);
          NODE
          rm .github/workflows/tmp-d1-checker-fix.yml
          git config user.name "LifeSpace contract sync"
          git config user.email "actions@users.noreply.github.com"
          git add apps/core/scripts/check-openapi.mjs .github/workflows/tmp-d1-checker-fix.yml
          git diff --cached --check
          git commit -m "test(core): align static relation contract check with resolution"
          git push origin HEAD:feat/191-batch-reference-resolution
