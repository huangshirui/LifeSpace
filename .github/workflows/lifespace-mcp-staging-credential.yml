name: Provision LifeSpace MCP staging credential

# Explicit owner-only infrastructure mutation. This is intentionally separate
# from canonical LifeSpace staging deployment and never dispatches that workflow.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type PROVISION_MCP_STAGING to create/register a minimal Staging MCP Application credential"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: lifespace-staging-deploy
  cancel-in-progress: false

jobs:
  provision:
    name: Provision isolated MCP staging application and sealed Worker credential
    runs-on: ubuntu-latest
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      LIFESPACE_STAGING_BOOTSTRAP_SECRET: ${{ secrets.LIFESPACE_STAGING_BOOTSTRAP_SECRET }}
    steps:
      - name: Require owner, main and explicit confirmation
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_ACTOR" = "huangshirui"
          test "$GITHUB_TRIGGERING_ACTOR" = "huangshirui"
          test "$GITHUB_REF_NAME" = "main"
          test "$CONFIRMATION" = "PROVISION_MCP_STAGING"

      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Check Staging provisioning script
        run: node --check infra/scripts/provision-mcp-staging-credential.mjs

      - name: Provision read-only MCP Application and credential
        run: node infra/scripts/provision-mcp-staging-credential.mjs
