name: Install LifeSpace MCP staging credential

# This workflow transports an already authorized lsa_* created by a human
# Platform Admin in LifeSpace Console. It must never create/expand authority.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type INSTALL_MCP_STAGING for first install, ROTATE_MCP_STAGING for explicit replacement"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: lifespace-staging-deploy
  cancel-in-progress: false

jobs:
  install:
    name: Validate and seal human-approved MCP staging Application credential
    runs-on: ubuntu-latest
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      LIFESPACE_STAGING_MCP_APPLICATION_ID: ${{ vars.LIFESPACE_STAGING_MCP_APPLICATION_ID || secrets.LIFESPACE_STAGING_MCP_APPLICATION_ID }}
      LIFESPACE_STAGING_MCP_APPLICATION_CREDENTIAL: ${{ secrets.LIFESPACE_STAGING_MCP_APPLICATION_CREDENTIAL }}
      MCP_CREDENTIAL_INSTALL_ACTION: ${{ inputs.confirmation }}
    steps:
      - name: Require owner, main and explicit confirmation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_ACTOR" = "huangshirui"
          test "$GITHUB_TRIGGERING_ACTOR" = "huangshirui"
          test "$GITHUB_REF_NAME" = "main"
          case "$MCP_CREDENTIAL_INSTALL_ACTION" in
            INSTALL_MCP_STAGING|ROTATE_MCP_STAGING) ;;
            *) echo "Explicit install or rotation confirmation required" >&2; exit 1 ;;
          esac

      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Check MCP staging installer syntax
        run: node --check infra/scripts/install-mcp-staging-credential.mjs

      - name: Install validated read-only Application credential
        run: node infra/scripts/install-mcp-staging-credential.mjs
