name: One-time Eventing staging rollout bridge

on:
  push:
    branches:
      - ops/eventing-staging-rollout-20260825
    paths:
      - .github/workflows/eventing-staging-rollout-bridge.yml

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    name: Dispatch canonical staging verification
    if: github.repository == 'huangshirui/LifeSpace' && github.ref == 'refs/heads/ops/eventing-staging-rollout-20260825'
    runs-on: ubuntu-latest
    environment: staging
    env:
      EXPECTED_MAIN_SHA: 642f38b0af40b80cc384eb7cd83c0545f46a2f1e
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Guard exact rollout source
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_MAIN_SHA="$(git rev-parse HEAD)"
          echo "main=$ACTUAL_MAIN_SHA"
          test "$ACTUAL_MAIN_SHA" = "$EXPECTED_MAIN_SHA" || {
            echo "main moved after Core 0.15 Eventing verifier fix merge; refusing one-time dispatch" >&2
            exit 1
          }

      - name: Dispatch canonical Deploy staging workflow on main
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(curl --silent --show-error --output "$RUNNER_TEMP/dispatch-response.txt" --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/staging-deploy.yml/dispatches" \
            --data '{"ref":"main"}')"
          if [ "$STATUS" != "204" ]; then
            echo "workflow dispatch failed with HTTP $STATUS" >&2
            cat "$RUNNER_TEMP/dispatch-response.txt" >&2
            exit 1
          fi
          echo "Deploy staging dispatched for main at $EXPECTED_MAIN_SHA"
