name: One-time Eventing staging rollout bridge

on:
  push:
    branches:
      - ops/eventing-staging-rollout-20260825
    paths:
      - .github/workflows/eventing-staging-rollout-bridge.yml

permissions:
  contents: read
  actions: write

jobs:
  provision-and-dispatch:
    name: Provision Eventing staging resources and dispatch canonical deploy
    if: github.repository == 'huangshirui/LifeSpace' && github.ref == 'refs/heads/ops/eventing-staging-rollout-20260825'
    runs-on: ubuntu-latest
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      EXPECTED_MAIN_SHA: a8b822feb2f037540fd431a50c46f3ccc47849da
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Guard exact rollout source
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_MAIN_SHA="$(git rev-parse HEAD)"
          echo "main=$ACTUAL_MAIN_SHA"
          test "$ACTUAL_MAIN_SHA" = "$EXPECTED_MAIN_SHA" || {
            echo "main moved after Eventing PR merge; refusing one-time staging rollout" >&2
            exit 1
          }

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate staging Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN is not configured" >&2; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "CLOUDFLARE_ACCOUNT_ID is not configured" >&2; exit 1; }

      - name: Provision manifest-declared staging resources idempotently
        run: node infra/scripts/provision-staging.mjs

      - name: Dispatch canonical Deploy staging workflow on main
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(curl --silent --show-error --output "$RUNNER_TEMP/dispatch-response.txt" --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/staging-deploy.yml/dispatches" \
            --data '{"ref":"main"}')"
          if [ "$STATUS" != "204" ]; then
            echo "workflow dispatch failed with HTTP $STATUS" >&2
            cat "$RUNNER_TEMP/dispatch-response.txt" >&2
            exit 1
          fi
          echo "Deploy staging dispatched for main at $EXPECTED_MAIN_SHA"
