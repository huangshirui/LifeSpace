name: Dispatch HomeMew production cutover once
# rerun after idempotent production D1 resolution fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/homemew-production-cutover-dispatch-once.yml

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dispatch the approved Phase 7 cutover
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          STARTED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "started_at=$STARTED_AT" >> "$GITHUB_OUTPUT"
          BODY='{"ref":"main","inputs":{"mode":"cutover","confirmation":"CUTOVER_HOMEMEW_PRODUCTION"}}'
          STATUS="$(curl --silent --show-error --output "$RUNNER_TEMP/dispatch-body" --write-out '%{http_code}' \
            --request POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/homemew-production-cutover.yml/dispatches" \
            --data "$BODY")"
          if [ "$STATUS" != "204" ]; then
            cat "$RUNNER_TEMP/dispatch-body" >&2
            echo "Workflow dispatch failed with HTTP $STATUS" >&2
            exit 1
          fi
          echo "Formal HomeMew production cutover dispatched"

      - name: Resolve dispatched cutover run id
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STARTED_AT: ${{ steps.dispatch.outputs.started_at }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 15); do
            curl --fail --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/homemew-production-cutover.yml/runs?event=workflow_dispatch&branch=main&per_page=20" \
              > "$RUNNER_TEMP/runs.json"
            RUN_ID="$(STARTED_AT="$STARTED_AT" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const body = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/runs.json', 'utf8'));
          const start = Date.parse(process.env.STARTED_AT) - 5000;
          const run = (body.workflow_runs ?? [])
            .filter((item) => item.event === 'workflow_dispatch' && item.head_branch === 'main' && Date.parse(item.created_at) >= start)
            .sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at))[0];
          if (run?.id) process.stdout.write(String(run.id));
          NODE
            )"
            if [ -n "$RUN_ID" ]; then
              printf 'run_id=%s\n' "$RUN_ID" > infra/migration/.homemew-production-cutover-run
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add infra/migration/.homemew-production-cutover-run
              git commit -m "chore: record HomeMew production cutover run"
              git push origin HEAD:main
              echo "Cutover run id recorded"
              exit 0
            fi
            sleep 2
          done
          echo "Could not resolve dispatched cutover run id" >&2
          exit 1
