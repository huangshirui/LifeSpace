name: One-shot Generic Time Query Contract Migration

on:
  push:
    branches: ['feat/time-query-operators-218']

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/time-query-operators-218
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Apply guarded contract migration
        run: node infra/scripts/one-shot-time-query-contract.mjs
      - name: Validate transformed repository
        run: pnpm check
      - name: Remove one-shot migration machinery
        run: |
          rm infra/scripts/one-shot-time-query-contract.mjs
          rm .github/workflows/one-shot-time-query-contract.yml
      - name: Commit contract changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(core): publish generic time query semantics"
          git push origin HEAD:feat/time-query-operators-218
