name: Temporary D1 Contract Sync

on:
  push:
    branches:
      - feat/191-batch-reference-resolution

permissions:
  contents: write

jobs:
  sync:
    if: github.ref == 'refs/heads/feat/191-batch-reference-resolution'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/191-batch-reference-resolution
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Synchronize Kernel 0.28 contract
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');

          const openapiPath = 'apps/core/openapi.yaml';
          const doc = JSON.parse(fs.readFileSync(openapiPath, 'utf8'));
          doc.info.version = '0.28.0';
          doc.info.description = doc.info.description.replace(
            'authorized Runtime Discovery with bounded Capability field-role bindings,',
            'authorized Runtime Discovery with bounded Capability field-role bindings and source-field-aware Reference Resolution,'
          );

          const resolutionPath = '/api/v1/spaces/{spaceId}/_reference-resolutions/{modelKey}/{fieldKey}';
          doc.paths[resolutionPath] = {
            parameters: [
              { $ref: '#/components/parameters/SpaceId' },
              { $ref: '#/components/parameters/ModelKey' },
              {
                name: 'fieldKey',
                in: 'path',
                required: true,
                schema: { type: 'string', pattern: '^[a-z][A-Za-z0-9]{0,62}$' },
              },
            ],
            post: {
              tags: ['Runtime Discovery'],
              operationId: 'resolveRelationReferences',
              description: 'Resolves a bounded set of existing relation IDs for one source model field under the caller\'s current source-model read authority. Results preserve input order and duplicates. Each valid input ID returns either resolved with the minimal current label or opaque unavailable; unavailable intentionally does not distinguish missing, deleted, hidden, forbidden, wrong-Space or otherwise non-resolvable references. Resolution is a Context Projection and never proves mutation authority: create/update Policy, relation integrity and all current authorization are rechecked when a mutation executes. Person and person_list are supported in v1 through active same-Space Space Person displayName labels. record and record_list return 409 until canonical ordinary-record reference-label semantics are defined.',
              requestBody: {
                required: true,
                content: {
                  'application/json': {
                    schema: { $ref: '#/components/schemas/ReferenceResolutionRequest' },
                  },
                },
              },
              responses: {
                200: {
                  description: 'Bounded source-field-aware reference resolution results',
                  content: {
                    'application/json': {
                      schema: { $ref: '#/components/schemas/ReferenceResolutionResponse' },
                    },
                  },
                },
                400: { $ref: '#/components/responses/InvalidRequest' },
                401: { $ref: '#/components/responses/Unauthorized' },
                403: { $ref: '#/components/responses/Forbidden' },
                404: { $ref: '#/components/responses/NotFound' },
                409: { $ref: '#/components/responses/Conflict' },
              },
            },
          };

          const schemas = doc.components.schemas;
          schemas.RuntimeRelationResolutionSupported = {
            type: 'object',
            additionalProperties: false,
            required: ['supported', 'method', 'pathTemplate', 'maxIds'],
            properties: {
              supported: { const: true },
              method: { const: 'POST' },
              pathTemplate: { const: resolutionPath },
              maxIds: { const: 50 },
            },
          };
          schemas.RuntimeRelationResolutionUnsupported = {
            type: 'object',
            additionalProperties: false,
            required: ['supported', 'reason'],
            properties: {
              supported: { const: false },
              reason: { const: 'reference-label-unavailable' },
            },
          };
          const resolutionRef = {
            oneOf: [
              { $ref: '#/components/schemas/RuntimeRelationResolutionSupported' },
              { $ref: '#/components/schemas/RuntimeRelationResolutionUnsupported' },
            ],
          };
          schemas.RuntimeDiscoveryRelation.required = ['targetModel', 'cardinality', 'lookup', 'resolution'];
          schemas.RuntimeDiscoveryRelation.properties.resolution = structuredClone(resolutionRef);
          schemas.RuntimeModelSemanticRelation.required = ['targetModel', 'cardinality', 'resolution'];
          schemas.RuntimeModelSemanticRelation.properties.resolution = structuredClone(resolutionRef);

          schemas.ReferenceResolutionRequest = {
            type: 'object',
            additionalProperties: false,
            required: ['ids'],
            properties: {
              ids: {
                type: 'array',
                minItems: 1,
                maxItems: 50,
                items: { type: 'string', minLength: 1, maxLength: 200, pattern: '^per_[A-Za-z0-9_-]+$' },
              },
            },
          };
          schemas.ReferenceResolutionResolved = {
            type: 'object',
            additionalProperties: false,
            required: ['id', 'status', 'label'],
            properties: {
              id: { type: 'string', minLength: 1 },
              status: { const: 'resolved' },
              label: { type: 'string', minLength: 1 },
            },
          };
          schemas.ReferenceResolutionUnavailable = {
            type: 'object',
            additionalProperties: false,
            required: ['id', 'status'],
            properties: {
              id: { type: 'string', minLength: 1 },
              status: { const: 'unavailable' },
            },
          };
          schemas.ReferenceResolutionItem = {
            oneOf: [
              { $ref: '#/components/schemas/ReferenceResolutionResolved' },
              { $ref: '#/components/schemas/ReferenceResolutionUnavailable' },
            ],
          };
          schemas.ReferenceResolutionResponse = {
            type: 'object',
            additionalProperties: false,
            required: ['data'],
            properties: {
              data: {
                type: 'object',
                additionalProperties: false,
                required: ['items'],
                properties: {
                  items: { type: 'array', items: { $ref: '#/components/schemas/ReferenceResolutionItem' } },
                },
              },
            },
          };
          schemas.StatusResponse.properties.data.properties.contractVersion.const = '0.28.0';
          fs.writeFileSync(openapiPath, JSON.stringify(doc));

          function replace(path, from, to) {
            const before = fs.readFileSync(path, 'utf8');
            if (!before.includes(from)) throw new Error(`Expected text not found in ${path}: ${from}`);
            fs.writeFileSync(path, before.replace(from, to));
          }
          function replaceAll(path, from, to) {
            const before = fs.readFileSync(path, 'utf8');
            if (!before.includes(from)) throw new Error(`Expected text not found in ${path}: ${from}`);
            fs.writeFileSync(path, before.split(from).join(to));
          }

          replaceAll('apps/core/src/app.ts', 'contractVersion: "0.27.0"', 'contractVersion: "0.28.0"');
          replace('apps/core/package.json', '"version": "0.27.0"', '"version": "0.28.0"');
          replace('apps/core/AGENTS.md', 'current Kernel version: 0.27.0', 'current Kernel version: 0.28.0');
          replace('apps/core/README.md', 'The current business-facing Core Kernel contract is **0.27.0**.', 'The current business-facing Core Kernel contract is **0.28.0**.');
          replace(
            'apps/core/README.md',
            '- `GET /api/v1/spaces/{spaceId}/_discovery/models/{modelKey}` — progressive static semantic detail for one currently visible model.\n',
            '- `GET /api/v1/spaces/{spaceId}/_discovery/models/{modelKey}` — progressive static semantic detail for one currently visible model;\n- `POST /api/v1/spaces/{spaceId}/_reference-resolutions/{modelKey}/{fieldKey}` — bounded source-field-aware hydration of existing relation IDs into minimal current labels with opaque per-item unavailable results.\n',
          );
          replace('docs/architecture.md', 'current Kernel contract: 0.27.0', 'current Kernel contract: 0.28.0');
          replace(
            'docs/contracts.md',
            'As of Core Kernel `0.27.0`, ordinary model paths/schemas remain deliberately absent',
            'As of Core Kernel `0.28.0`, ordinary model paths/schemas remain deliberately absent',
          );
          replace(
            'docs/contracts.md',
            'Kernel `0.27.0` adds a compact current-principal capability inventory that de-duplicates coarse static model facts from per-Space visibility/access edges and links deterministically to the 0.26 detail surface; full Discovery remains compatible and optional.',
            'Kernel `0.27.0` adds a compact current-principal capability inventory that de-duplicates coarse static model facts from per-Space visibility/access edges and links deterministically to the 0.26 detail surface; full Discovery remains compatible and optional. Kernel `0.28.0` adds bounded source-field-aware batch Reference Resolution for existing relation IDs: Person references resolve to minimal same-Space active Space Person labels, each valid input ID returns only `resolved` or opaque `unavailable`, input order/duplicates are preserved, and record/reference hydration remains explicitly unsupported until canonical ordinary-record label semantics exist.',
          );
          replace(
            'docs/contracts.md',
            '- authorized source-field-aware Relation Target Lookup for generated clients;\n',
            '- authorized source-field-aware Relation Target Lookup for generated clients;\n- bounded source-field-aware Reference Resolution/Hydration for existing relation IDs;\n',
          );
          replace(
            'docs/contracts.md',
            'GET /api/v1/me/_discovery/inventory\n  -> return compact request-current Space/model visibility edges plus de-duplicated coarse model facts\n```',
            'GET /api/v1/me/_discovery/inventory\n  -> return compact request-current Space/model visibility edges plus de-duplicated coarse model facts\n\nPOST /api/v1/spaces/{spaceId}/_reference-resolutions/{modelKey}/{fieldKey}\n  -> under current source-model read authority, hydrate a bounded existing-ID list into minimal labels or opaque unavailable results\n```',
          );

          const checkerPath = 'apps/core/scripts/check-openapi.mjs';
          let checker = fs.readFileSync(checkerPath, 'utf8');
          checker = checker.replaceAll('"0.27.0"', '"0.28.0"');
          checker = checker.replace(
            '  "/api/v1/spaces/{spaceId}/_relation-targets/{modelKey}/{fieldKey}",\n',
            '  "/api/v1/spaces/{spaceId}/_relation-targets/{modelKey}/{fieldKey}",\n  "/api/v1/spaces/{spaceId}/_reference-resolutions/{modelKey}/{fieldKey}",\n',
          );
          const marker = 'const relationLookup = document.paths?.["/api/v1/spaces/{spaceId}/_relation-targets/{modelKey}/{fieldKey}"]?.get;';
          const insert = `const referenceResolution = document.paths?.["/api/v1/spaces/{spaceId}/_reference-resolutions/{modelKey}/{fieldKey}"]?.post;\nif (referenceResolution?.requestBody?.content?.["application/json"]?.schema?.$ref !== "#/components/schemas/ReferenceResolutionRequest"\n    || referenceResolution?.responses?.["200"]?.content?.["application/json"]?.schema?.$ref !== "#/components/schemas/ReferenceResolutionResponse"\n    || !referenceResolution?.description?.includes("opaque unavailable")\n    || !referenceResolution?.description?.includes("never proves mutation authority")) {\n  throw new Error("Reference Resolution must remain bounded, opaque and non-authoritative");\n}\nif (schemas.ReferenceResolutionRequest?.additionalProperties !== false\n    || schemas.ReferenceResolutionRequest?.properties?.ids?.minItems !== 1\n    || schemas.ReferenceResolutionRequest?.properties?.ids?.maxItems !== 50\n    || schemas.RuntimeRelationResolutionSupported?.properties?.method?.const !== "POST"\n    || schemas.RuntimeRelationResolutionSupported?.properties?.pathTemplate?.const !== "/api/v1/spaces/{spaceId}/_reference-resolutions/{modelKey}/{fieldKey}"\n    || schemas.RuntimeRelationResolutionSupported?.properties?.maxIds?.const !== 50\n    || schemas.RuntimeRelationResolutionUnsupported?.properties?.reason?.const !== "reference-label-unavailable") {\n  throw new Error("Reference Resolution request/descriptor bounds drifted");\n}\nif (!schemas.RuntimeDiscoveryRelation?.required?.includes("resolution")\n    || schemas.RuntimeDiscoveryRelation?.properties?.resolution?.oneOf?.length !== 2\n    || !schemas.RuntimeModelSemanticRelation?.required?.includes("resolution")\n    || schemas.RuntimeModelSemanticRelation?.properties?.resolution?.oneOf?.length !== 2) {\n  throw new Error("Discovery and static semantic detail must expose Reference Resolution capability structurally");\n}\nif (schemas.ReferenceResolutionResolved?.properties?.status?.const !== "resolved"\n    || schemas.ReferenceResolutionUnavailable?.properties?.status?.const !== "unavailable"\n    || schemas.ReferenceResolutionUnavailable?.properties?.label) {\n  throw new Error("Reference Resolution per-item opacity contract drifted");\n}\n\n${marker}`;
          if (!checker.includes(marker)) throw new Error('relation lookup checker marker not found');
          checker = checker.replace(marker, insert);
          fs.writeFileSync(checkerPath, checker);

          const baselinePath = 'docs/contract-stability-baseline.json';
          const baseline = JSON.parse(fs.readFileSync(baselinePath, 'utf8'));
          const core = baseline.contractSources.find((entry) => entry.id === 'core-kernel');
          if (!core) throw new Error('core-kernel contract stability source missing');
          const lookupIndex = core.groups.findIndex((group) => group.id === 'core-relation-target-lookup');
          if (lookupIndex < 0) throw new Error('core relation lookup classification group missing');
          if (!core.groups.some((group) => group.id === 'core-reference-resolution')) {
            core.groups.splice(lookupIndex + 1, 0, {
              id: 'core-reference-resolution',
              maturity: 'candidate',
              visibility: 'public',
              operationPattern: '^POST /api/v1/spaces/\\{spaceId\\}/_reference-resolutions/\\{modelKey\\}/\\{fieldKey\\}$',
            });
          }
          const methods = new Set(['get', 'post', 'put', 'patch', 'delete', 'options', 'head', 'trace']);
          const operations = [];
          for (const [path, item] of Object.entries(doc.paths || {})) {
            if (!item || typeof item !== 'object' || Array.isArray(item)) continue;
            for (const method of Object.keys(item)) {
              if (methods.has(method.toLowerCase())) operations.push(`${method.toUpperCase()} ${path}`);
            }
          }
          const digest = 'sha256:' + crypto.createHash('sha256').update([...new Set(operations)].sort().join('\n')).digest('hex');
          core.operationSetSha256 = digest;
          fs.writeFileSync(baselinePath, JSON.stringify(baseline, null, 2) + '\n');
          console.log('Core Kernel 0.28 operation digest', digest);
          NODE

          rm .github/workflows/tmp-d1-contract-sync.yml
          git config user.name "LifeSpace contract sync"
          git config user.email "actions@users.noreply.github.com"
          git add apps/core/openapi.yaml apps/core/src/app.ts apps/core/package.json apps/core/AGENTS.md apps/core/README.md apps/core/scripts/check-openapi.mjs docs/architecture.md docs/contracts.md docs/contract-stability-baseline.json .github/workflows/tmp-d1-contract-sync.yml
          git diff --cached --check
          git commit -m "feat(core): publish Kernel 0.28 reference resolution contract"
          git push origin HEAD:feat/191-batch-reference-resolution
