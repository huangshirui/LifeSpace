name: Verify LifeSpace CIMD public-network security

# Real Cloudflare remote runtime network tests. No persistent Worker deployment,
# DNS changes or LifeSpace Identity/Core config changes. Only the repository
# owner may explicitly start this acceptance on main.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lifespace-staging-cimd-network-probe
  cancel-in-progress: false

jobs:
  network:
    name: Temporary Cloudflare public fetch and SSRF reachability
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Require direct Owner workflow dispatch from main
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_ACTOR" = "huangshirui"
          test "$GITHUB_TRIGGERING_ACTOR" = "huangshirui"
          test "$GITHUB_REF_NAME" = "main"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test "${#CLOUDFLARE_ACCOUNT_ID}" -eq 32

      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - uses: pnpm/action-setup@v4.4.0
        with:
          version: 10.13.1

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile

      - name: Check remote probe syntax and build offline
        shell: bash
        run: |
          node --check infra/scripts/verify-cimd-remote-network.mjs
          pnpm --dir apps/identity exec wrangler deploy --dry-run --config ../../infra/cimd-network-probe/wrangler.jsonc

      - name: Real bounded SSRF reachability checks on Cloudflare edge
        run: node infra/scripts/verify-cimd-remote-network.mjs

      - name: Scope of the evidence
        if: ${{ always() }}
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          **This is a remote preview network test, not a Staging CIMD activation.**
          - No persistent deployment; no data migrations or OAuth grants
          - Does not authorize opening CIMD in Staging or Production
          - Controlled authoritative in-flight DNS rebinding is a separate test gate
          EOF
