name: Agent Contract Sync

on:
  push:
    branches: [feature/agent-delegation-foundation]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/agent-delegation-foundation
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Finalize Agent contracts
        working-directory: apps/core
        run: node scripts/fix-agent-contract-sync.mjs
      - name: Commit finalized contracts
        run: |
          if git diff --quiet; then
            echo "No contract finalization changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md apps/core/AGENTS.md apps/identity/AGENTS.md apps/core/scripts/check-openapi.mjs packages/contracts/scripts/export-homemew-handoff.mjs
          git commit -m "chore: finalize Agent-ready contract boundaries"
          git push origin HEAD:feature/agent-delegation-foundation
