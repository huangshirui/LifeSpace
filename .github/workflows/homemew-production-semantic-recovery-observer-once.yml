name: Observe HomeMew semantic activation recovery once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/homemew-production-semantic-recovery-observer-once.yml

permissions:
  actions: read
  contents: write

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record semantic recovery result
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID=""
          for attempt in $(seq 1 60); do
            curl --fail --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/homemew-production-semantic-recovery-once.yml/runs?event=push&branch=main&per_page=5" \
              > "$RUNNER_TEMP/runs.json"
            RUN_ID="$(node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const body = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/runs.json', 'utf8'));
          const run = (body.workflow_runs ?? []).sort((a,b) => Date.parse(b.created_at) - Date.parse(a.created_at))[0];
          if (run?.id) process.stdout.write(String(run.id));
          NODE
            )"
            [ -n "$RUN_ID" ] && break
            sleep 2
          done
          [ -n "$RUN_ID" ] || exit 1

          for attempt in $(seq 1 240); do
            curl --fail --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" \
              > "$RUNNER_TEMP/run.json"
            STATUS="$(node --input-type=module -e "import fs from 'node:fs'; const x=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/run.json','utf8')); process.stdout.write(x.status ?? '')")"
            [ "$STATUS" = "completed" ] && break
            sleep 5
          done

          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100" \
            > "$RUNNER_TEMP/jobs.json"

          RUN_ID="$RUN_ID" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const run = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/run.json', 'utf8'));
          const jobs = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/jobs.json', 'utf8'));
          const job = jobs.jobs?.[0];
          const wanted = [
            'Verify activation recovery preconditions',
            'Download prior PASS migration report',
            'Capture legacy custom domain metadata',
            'Freeze legacy HomeMew writes',
            'Verify legacy freeze',
            'Capture current frozen legacy snapshot',
            'Issue temporary semantic verification credential',
            'Verify current source equals migrated LifeSpace semantics',
            'Revoke temporary semantic verification credential',
            'Issue replacement final HomeMew credential',
            'Install replacement Worker credential',
            'Detach legacy custom domain and attach new backend',
            'Verify new production backend and domain ownership',
            'Restore legacy domain on failure',
            'Revoke replacement final credential on failure',
            'Roll back legacy Core freeze on failure',
            'Summarize successful production activation',
          ];
          const lines = [`run_id=${process.env.RUN_ID}`, `status=${run.status ?? ''}`, `conclusion=${run.conclusion ?? ''}`];
          for (const name of wanted) {
            const step = job?.steps?.find((item) => item.name === name);
            const key = name.replace(/[^a-zA-Z0-9]+/g, '_').replace(/^_|_$/g, '').toLowerCase();
            lines.push(`${key}=${step?.conclusion ?? step?.status ?? 'missing'}`);
          }
          fs.writeFileSync('infra/migration/.homemew-production-semantic-recovery-result', lines.join('\n') + '\n');
          NODE

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add infra/migration/.homemew-production-semantic-recovery-result
          git commit -m "chore: record HomeMew semantic recovery result"
          git push origin HEAD:main
