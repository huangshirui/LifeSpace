name: Apply Phase 2 profile assets patch

on:
  push:
    branches: [phase2-user-profile-assets]
    paths:
      - .github/workflows/phase2-profile-assets-apply.yml
      - infra/scripts/phase2-profile-assets-patch.mjs

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase2-user-profile-assets
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply source patches
        run: node infra/scripts/phase2-profile-assets-patch.mjs
      - name: Regenerate Core Wrangler bindings
        run: pnpm --dir apps/core exec wrangler types src/worker-configuration.d.ts --env-interface CloudflareBindings --include-runtime false
      - name: Validate repository
        run: pnpm check
      - name: Commit validated generated changes
        run: |
          rm infra/scripts/phase2-profile-assets-patch.mjs
          rm .github/workflows/phase2-profile-assets-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: complete native user profile and avatar assets"
          git push origin HEAD:phase2-user-profile-assets
