name: Authority v3 generic surface cleanup

on:
  push:
    branches:
      - feature/authority-role-capability-redelegation
    paths:
      - .github/workflows/authority-v3-generic-surface-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/authority-role-capability-redelegation
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Apply generic surface migration
        run: node scripts/authority-v3-generic-surface-cleanup.mjs
      - name: Commit generated cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No cleanup changes"
            exit 0
          fi
          git commit -m "refactor(authority): converge generic delegation surface"
          git push origin HEAD:feature/authority-role-capability-redelegation
