name: Authority v3 generic surface cleanup

on:
  push:
    branches:
      - feature/authority-role-capability-redelegation
    paths:
      - .github/workflows/authority-v3-generic-surface-cleanup.yml
      - scripts/authority-v3-generic-surface-cleanup.mjs
      - scripts/authority-v3-generic-surface-fix.mjs

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/authority-role-capability-redelegation
      - uses: pnpm/action-setup@v4.4.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply generic surface migration
        run: |
          node scripts/authority-v3-generic-surface-cleanup.mjs
          node scripts/authority-v3-generic-surface-fix.mjs
      - name: Verify repository
        run: pnpm check
      - name: Commit generated cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No cleanup changes"
            exit 0
          fi
          git commit -m "refactor(authority): finish generic delegation surface"
          git push origin HEAD:feature/authority-role-capability-redelegation
