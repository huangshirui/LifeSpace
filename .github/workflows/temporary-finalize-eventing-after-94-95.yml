name: Temporary finalize Eventing after 94 95

on:
  push:
    branches:
      - codex/109-eventing-rebase

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rebased branch
        uses: actions/checkout@v4
        with:
          ref: codex/109-eventing-rebase
          fetch-depth: 1

      - name: Fetch verified pre-rebase Eventing branch
        run: git fetch origin fix/109-eventing-contract-lifecycle:refs/remotes/origin/fix/109-eventing-contract-lifecycle --depth=1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
          run_install: false

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate finalizer syntax
        run: node --check infra/scripts/finalize-eventing-after-94-95.mjs

      - name: Rebase Eventing contract split onto current main
        run: node infra/scripts/finalize-eventing-after-94-95.mjs

      - name: Validate finalized repository
        run: pnpm check

      - name: Persist exactly the tested tree and remove temporary finalizer
        shell: bash
        run: |
          set -euo pipefail
          rm infra/scripts/finalize-eventing-after-94-95.mjs
          rm .github/workflows/temporary-finalize-eventing-after-94-95.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No finalized changes to persist" >&2
            exit 1
          fi
          git commit -m "refactor(core): rebase Eventing contract split after #94 #95"
          git push origin HEAD:codex/109-eventing-rebase
