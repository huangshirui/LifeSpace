name: Dispatch production acceptance

on:
  push:
    branches:
      - ops/dispatch-production-acceptance

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch exact main production workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run production-deploy.yml --repo huangshirui/LifeSpace --ref main -f confirmation=DEPLOY_PRODUCTION
