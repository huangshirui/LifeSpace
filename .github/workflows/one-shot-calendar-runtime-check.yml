name: One-shot Calendar Viewing Window Runtime Check

on:
  push:
    branches: ['feat/calendar-viewing-window-219']

permissions:
  contents: write

jobs:
  check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/calendar-viewing-window-219
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Remove one-shot workflow
        run: rm .github/workflows/one-shot-calendar-runtime-check.yml
      - name: Commit validated runtime tree
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove Calendar runtime check workflow"
          git push origin HEAD:feat/calendar-viewing-window-219
