name: Phase4 dispatch staging

on:
  push:
    branches:
      - phase4/event-temporal-range-prep-2026-09-17

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch existing staging deployment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_REF: ${{ github.ref_name }}
        run: gh workflow run staging-deploy.yml --repo "$GH_REPO" --ref "$TARGET_REF"
