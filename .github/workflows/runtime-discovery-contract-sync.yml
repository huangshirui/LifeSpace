name: Runtime discovery contract sync

on:
  push:
    branches:
      - feat/runtime-discovery

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/runtime-discovery
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Update Kernel contract and docs
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const contractPath = 'apps/core/openapi.yaml';
          const document = JSON.parse(fs.readFileSync(contractPath, 'utf8'));
          document.info.version = '0.15.0';
          document.info.description = 'Stable LifeSpace Core Kernel contract for Space, membership, invitations, Data Grants, authorized runtime discovery, event subscriptions, model administration, assets and Registry-driven Creation Draft orchestration. Ordinary business-model routes are intentionally not declared here; each published Model Registry state produces an immutable Model Contract Revision (mct_<sha256>) containing its concrete CRUD/query/action/Capability OpenAPI and JSON Schema.';
          if (!(document.tags ?? []).some((tag) => tag.name === 'Discovery')) {
            document.tags.push({ name: 'Discovery' });
          }

          document.paths['/api/v1/spaces/{spaceId}/_discovery'] = {
            parameters: [{ $ref: '#/components/parameters/SpaceId' }],
            get: {
              tags: ['Discovery'],
              operationId: 'discoverSpaceRuntime',
              description: 'Returns only published model metadata currently usable by the authenticated principal in this Space after intersecting credential resources:* scopes, Application × Model Access, current Space membership/Data Grants and model access. This is an ordinary integration/runtime surface and does not expose Model Admin authority.',
              responses: {
                '200': {
                  description: 'Effective model/query/action discovery for the current principal and Space',
                  content: { 'application/json': { schema: { $ref: '#/components/schemas/RuntimeDiscoveryResponse' } } },
                },
                '401': { $ref: '#/components/responses/Unauthorized' },
                '404': { $ref: '#/components/responses/NotFound' },
              },
            },
          };

          const schemas = document.components.schemas;
          schemas.RuntimeDiscoveryAccess = { type: 'string', enum: ['read', 'write', 'manage'] };
          schemas.RuntimeDiscoveryField = {
            type: 'object', additionalProperties: false, required: ['key', 'type'],
            properties: {
              key: { type: 'string' },
              type: { type: 'string', enum: ['string','text','integer','number','boolean','date','datetime','timezone','enum','person','person_list','record','record_list'] },
              description: { type: 'string' }, required: { type: 'boolean' }, nullable: { type: 'boolean' },
              immutable: { type: 'boolean' }, readOnly: { type: 'boolean' }, minLength: { type: 'integer' },
              maxLength: { type: 'integer' }, minimum: { type: 'number' }, maximum: { type: 'number' },
              values: { type: 'array', items: { type: 'string' } }, targetModel: { type: 'string' },
            },
          };
          schemas.RuntimeDiscoveryAction = {
            type: 'object', additionalProperties: false, required: ['key','access','kind'],
            properties: {
              key: { type: 'string' }, access: { $ref: '#/components/schemas/RuntimeDiscoveryAccess' },
              kind: { type: 'string', enum: ['workflow','capability'] },
            },
          };
          schemas.RuntimeDiscoveryModel = {
            type: 'object', additionalProperties: false,
            required: ['key','route','version','schemaHash','display','description','access','fields','query','actions','capabilities'],
            properties: {
              key: { type: 'string' }, route: { type: 'string' }, version: { type: 'integer', minimum: 1 },
              schemaHash: { type: 'string' },
              display: { type: 'object', additionalProperties: false, required: ['singular','plural'], properties: { singular: { type: 'string' }, plural: { type: 'string' } } },
              description: { oneOf: [{ type: 'string' }, { type: 'null' }] },
              access: { type: 'array', items: { $ref: '#/components/schemas/RuntimeDiscoveryAccess' } },
              fields: { type: 'array', items: { $ref: '#/components/schemas/RuntimeDiscoveryField' } },
              query: { type: 'object', additionalProperties: false, required: ['searchable','filterable','sortable'], properties: {
                searchable: { type: 'array', items: { type: 'string' } }, filterable: { type: 'array', items: { type: 'string' } }, sortable: { type: 'array', items: { type: 'string' } },
              } },
              actions: { type: 'array', items: { $ref: '#/components/schemas/RuntimeDiscoveryAction' } },
              capabilities: { type: 'array', items: { type: 'string' } },
            },
          };
          schemas.RuntimeDiscoveryResponse = {
            type: 'object', additionalProperties: false, required: ['data'], properties: {
              data: { type: 'object', additionalProperties: false, required: ['spaceId','models'], properties: {
                spaceId: { type: 'string' }, models: { type: 'array', items: { $ref: '#/components/schemas/RuntimeDiscoveryModel' } },
              } },
            },
          };
          schemas.StatusResponse.properties.data.properties.contractVersion.const = '0.15.0';
          fs.writeFileSync(contractPath, JSON.stringify(document));

          const checkerPath = 'apps/core/scripts/check-openapi.mjs';
          let checker = fs.readFileSync(checkerPath, 'utf8');
          checker = checker.replaceAll('0.14.0', '0.15.0');
          checker = checker.replace('  "/api/v1/spaces/{spaceId}/grants/{grantId}",', '  "/api/v1/spaces/{spaceId}/grants/{grantId}",\n  "/api/v1/spaces/{spaceId}/_discovery",');
          checker = checker.replace('const subscriptions = document.paths?.["/api/v1/event-subscriptions"];', `const discovery = document.paths?.["/api/v1/spaces/{spaceId}/_discovery"]?.get;
          if (!discovery || discovery.operationId !== "discoverSpaceRuntime") throw new Error("Runtime discovery path is missing");
          if (!schemas.RuntimeDiscoveryModel?.required?.includes("access") || !schemas.RuntimeDiscoveryModel?.required?.includes("actions")) {
            throw new Error("Runtime discovery must expose effective access and actions");
          }
          if (schemas.RuntimeDiscoveryAccess?.enum?.join(",") !== "read,write,manage") throw new Error("Runtime discovery access levels drifted");

          const subscriptions = document.paths?.["/api/v1/event-subscriptions"];`);
          fs.writeFileSync(checkerPath, checker);

          const coreAgentsPath = 'apps/core/AGENTS.md';
          let coreAgents = fs.readFileSync(coreAgentsPath, 'utf8');
          coreAgents = coreAgents.replace('current Kernel version: 0.14.0', 'current Kernel version: 0.15.0');
          fs.writeFileSync(coreAgentsPath, coreAgents);

          const contractsPath = 'docs/contracts.md';
          let contracts = fs.readFileSync(contractsPath, 'utf8');
          contracts = contracts.replace('As of Core Kernel `0.14.0`,', 'As of Core Kernel `0.15.0`,');
          contracts = contracts.replace('Kernel `0.14.0` adds the model-agnostic Event Subscription/Webhook control surface without duplicating ordinary-model CRUD schemas into the Kernel contract.', 'Kernel `0.14.0` added the model-agnostic Event Subscription/Webhook control surface without duplicating ordinary-model CRUD schemas into the Kernel contract. Kernel `0.15.0` adds Space-scoped, effective-authority Runtime Discovery so integrations can discover only the models, query metadata and actions they are currently authorized to use without receiving Model Admin authority.');
          contracts = contracts.replace('Kernel `0.14.0` adds Event Subscription management as model-agnostic Kernel syntax.', 'Kernel `0.14.0` adds Event Subscription management as model-agnostic Kernel syntax. Kernel `0.15.0` adds `GET /api/v1/spaces/{spaceId}/_discovery` as model-agnostic integration metadata: the result is filtered by the caller\'s current credential scopes, Application × Model Access and Space membership/Data Grants and contains no business records.');
          contracts = contracts.replace('Kernel `0.14.0` adds the generic Eventing subscription and Webhook-delivery management surface.', 'Kernel `0.14.0` added the generic Eventing subscription and Webhook-delivery management surface; Kernel `0.15.0` adds effective-authority Runtime Discovery for integration clients.');
          fs.writeFileSync(contractsPath, contracts);

          const architecturePath = 'docs/architecture.md';
          let architecture = fs.readFileSync(architecturePath, 'utf8');
          architecture = architecture.replace('current Kernel contract: 0.13.0', 'current Kernel contract: 0.15.0');
          const kernelNeedle = '- Registry-driven Creation Draft orchestration;\n- platform administration and audit;';
          architecture = architecture.replace(kernelNeedle, '- Registry-driven Creation Draft orchestration;\n- Space-scoped effective-authority Runtime Discovery for integration clients;\n- platform administration and audit;');
          fs.writeFileSync(architecturePath, architecture);
          NODE
      - name: Commit generated contract alignment
        run: |
          if git diff --quiet; then
            echo "No contract changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/core/openapi.yaml apps/core/scripts/check-openapi.mjs apps/core/AGENTS.md docs/contracts.md docs/architecture.md
          git commit -m "docs(core): publish runtime discovery contract"
          git push origin HEAD:feat/runtime-discovery
