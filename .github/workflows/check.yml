name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Decide validation depth
        id: validation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          run_full=true
          reason=pull-request

          if [[ "${{ github.event_name }}" == "push" ]]; then
            reason=direct-or-unassociated-push
            api_url="https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls"
            if associated_prs="$(
              curl --fail-with-body --silent --show-error \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "${api_url}"
            )"; then
              if jq -e --arg sha "${GITHUB_SHA}" \
                '[.[] | select(.merged_at != null and .base.ref == "main" and .merge_commit_sha == $sha)] | length > 0' \
                <<<"${associated_prs}" >/dev/null; then
                run_full=false
                reason=merged-pr
              fi
            else
              reason=pr-association-lookup-failed
              echo "::warning::Could not verify merged-PR association; running the full repository check."
            fi
          fi

          echo "run_full=${run_full}" >> "${GITHUB_OUTPUT}"
          echo "reason=${reason}" >> "${GITHUB_OUTPUT}"
          echo "Validation mode: run_full=${run_full} reason=${reason}"

      - uses: actions/checkout@v5
        if: steps.validation.outputs.run_full == 'true'
      - uses: pnpm/action-setup@v4.4.0
        if: steps.validation.outputs.run_full == 'true'
        with:
          version: 10.13.1
      - uses: actions/setup-node@v6
        if: steps.validation.outputs.run_full == 'true'
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
        if: steps.validation.outputs.run_full == 'true'
      - run: pnpm check
        if: steps.validation.outputs.run_full == 'true'
      - name: Persist finalized Person contract
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- apps/core/openapi.yaml apps/core/scripts/check-openapi.mjs docs/contract-stability-baseline.json; then
            echo "Finalized Person contract is already checked in."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/core/openapi.yaml apps/core/scripts/check-openapi.mjs docs/contract-stability-baseline.json
          git commit -m "chore(core): persist Kernel 0.47 contract"
          git push origin "HEAD:${{ github.head_ref }}"
      - name: Export finalized Person contract
        if: steps.validation.outputs.run_full == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: person-directory-finalized-contract
          path: |
            apps/core/openapi.yaml
            apps/core/scripts/check-openapi.mjs
            docs/contract-stability-baseline.json
          if-no-files-found: error
          retention-days: 1
