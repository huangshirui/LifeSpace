name: Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --no-frozen-lockfile
      - name: Capture generated lockfile
        run: |
          printf 'LIFESPACE_LOCKFILE_BASE64_BEGIN\n'
          base64 -w0 pnpm-lock.yaml
          printf '\nLIFESPACE_LOCKFILE_BASE64_END\n'
      - run: pnpm check
