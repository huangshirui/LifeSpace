name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Regenerate draft Core artifacts
        run: |
          pnpm --filter @lifespace/core exec wrangler types src/worker-configuration.d.ts --env-interface CloudflareBindings --include-runtime false
          node apps/core/scripts/patch-eventing-openapi.mjs
          echo '---BEGIN CORE BINDINGS---'
          cat apps/core/src/worker-configuration.d.ts
          echo '---END CORE BINDINGS---'
          echo '---BEGIN CORE OPENAPI---'
          cat apps/core/openapi.yaml
          echo '---END CORE OPENAPI---'
      - run: pnpm check
