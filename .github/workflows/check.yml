name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sync-175-contract:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'feat/175-progressive-model-detail' &&
      github.actor == 'huangshirui'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Synchronize 0.26 contract checks and baseline
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const checkerPath = 'apps/core/scripts/check-openapi.mjs';
          let checker = fs.readFileSync(checkerPath, 'utf8');
          checker = checker.replace('document.info?.version !== "0.25.0"', 'document.info?.version !== "0.26.0"');
          checker = checker.replace('schemas.StatusResponse?.properties?.data?.properties?.contractVersion?.const !== "0.25.0"', 'schemas.StatusResponse?.properties?.data?.properties?.contractVersion?.const !== "0.26.0"');
          const requiredMarker = '  "/api/v1/spaces/{spaceId}/_discovery",\n';
          const requiredDetail = '  "/api/v1/spaces/{spaceId}/_discovery/models/{modelKey}",\n';
          if (!checker.includes(requiredDetail)) checker = checker.replace(requiredMarker, requiredMarker + requiredDetail);
          const assertionMarker = 'if (schemas.StatusResponse?.properties?.data?.properties?.contractVersion?.const !== "0.26.0") {';
          if (!checker.includes('Single-model semantic detail must expose only static model semantics')) {
            const assertions = `const semanticDetailRoute = document.paths?.["/api/v1/spaces/{spaceId}/_discovery/models/{modelKey}"]?.get;
const semanticDetailResponseRef = semanticDetailRoute?.responses?.["200"]?.content?.["application/json"]?.schema?.$ref;
if (semanticDetailResponseRef !== "#/components/schemas/RuntimeModelSemanticDetailResponse"
    || !semanticDetailRoute?.description?.includes("static semantic detail")
    || !semanticDetailRoute?.description?.includes("current visibility gate")
    || !semanticDetailRoute?.description?.includes("opaque 404")
    || !semanticDetailRoute?.description?.includes("execution")) {
  throw new Error("Single-model semantic detail must document progressive static projection and current authority gating");
}
if (JSON.stringify(Object.keys(semanticDetailRoute?.responses ?? {}).sort()) !== JSON.stringify(["200", "401", "404"])) {
  throw new Error("Single-model semantic detail must use one opaque 404 for missing and currently invisible models");
}
const semanticDetail = schemas.RuntimeModelSemanticDetail;
const semanticDetailProperties = Object.keys(semanticDetail?.properties ?? {}).sort();
const expectedSemanticDetailProperties = [
  "actions", "capabilities", "capabilityBindings", "declaredAccess", "defaults", "description", "display",
  "fields", "key", "query", "route", "schemaHash", "version",
].sort();
if (semanticDetail?.additionalProperties !== false
    || JSON.stringify(semanticDetailProperties) !== JSON.stringify(expectedSemanticDetailProperties)
    || !semanticDetail?.required?.includes("declaredAccess")
    || semanticDetail?.properties?.access
    || semanticDetail?.properties?.spaceId
    || semanticDetail?.properties?.spaceName) {
  throw new Error("Single-model semantic detail must expose only static model semantics without effective Space authority state");
}
if (schemas.RuntimeModelSemanticField?.properties?.relation?.$ref !== "#/components/schemas/RuntimeModelSemanticRelation"
    || Object.keys(schemas.RuntimeModelSemanticRelation?.properties ?? {}).sort().join(",") !== "cardinality,targetModel") {
  throw new Error("Single-model semantic detail relation facts must remain static target/cardinality semantics");
}
if (!schemas.RuntimeModelSemanticQuery?.required?.includes("filters")
    || !schemas.RuntimeModelSemanticQuery?.required?.includes("pagination")
    || !schemas.RuntimeModelSemanticQuery?.required?.includes("capabilityParameters")
    || schemas.RuntimeModelSemanticQuery?.properties?.sort?.properties?.nullPlacement?.const !== "last") {
  throw new Error("Single-model semantic detail must expose complete shared query facts");
}
if (!schemas.RuntimeModelSemanticAction?.required?.includes("invocation")
    || schemas.RuntimeModelSemanticAction?.properties?.concurrency?.$ref !== "#/components/schemas/RuntimeModelSemanticActionConcurrency") {
  throw new Error("Single-model semantic detail actions must expose shared invocation and concurrency facts");
}
if (schemas.RuntimeModelSemanticCapabilityBindings?.additionalProperties !== false
    || !schemas.RuntimeModelSemanticCapabilityBindings?.properties?.calendar
    || !schemas.RuntimeModelSemanticCapabilityBindings?.properties?.temporal) {
  throw new Error("Single-model semantic detail must expose registered Calendar and Temporal semantic bindings");
}

`;
            checker = checker.replace(assertionMarker, assertions + assertionMarker);
          }
          fs.writeFileSync(checkerPath, checker);

          const baselinePath = 'docs/contract-stability-baseline.json';
          const baseline = JSON.parse(fs.readFileSync(baselinePath, 'utf8'));
          const core = baseline.contractSources.find((entry) => entry.id === 'core-kernel');
          if (!core) throw new Error('core-kernel baseline missing');
          core.operationSetSha256 = 'sha256:5d09bb29685e269da92e8cee70b9f79b3fabed70c187f4abedfe0f5d6f89d2ec';
          const discovery = core.groups.find((entry) => entry.id === 'core-runtime-discovery');
          if (!discovery) throw new Error('core-runtime-discovery group missing');
          discovery.operationPattern = '^GET /api/v1/(me|spaces/\\{spaceId\\})/_discovery$|^GET /api/v1/spaces/\\{spaceId\\}/_discovery/models/\\{modelKey\\}$';
          fs.writeFileSync(baselinePath, JSON.stringify(baseline, null, 2) + '\n');

          const agentsPath = 'apps/core/AGENTS.md';
          let agents = fs.readFileSync(agentsPath, 'utf8');
          agents = agents.replace('current Kernel version: 0.25.0', 'current Kernel version: 0.26.0');
          fs.writeFileSync(agentsPath, agents);

          const readmePath = 'README.md';
          let readme = fs.readFileSync(readmePath, 'utf8');
          readme = readme.replace('current repository Core Kernel contract is **0.25.0**', 'current repository Core Kernel contract is **0.26.0**');
          fs.writeFileSync(readmePath, readme);
          NODE
      - name: Commit synchronized contract metadata
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/core/scripts/check-openapi.mjs docs/contract-stability-baseline.json apps/core/AGENTS.md README.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "contract(core): synchronize 0.26.0 checks"
          git push origin "HEAD:${{ github.head_ref }}"

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
