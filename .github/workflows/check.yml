name: Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --no-frozen-lockfile
      - name: Finalize service-auth slice in validation workspace
        run: |
          if [ -f infra/scripts/phase2-service-auth-finalize.mjs ]; then
            node infra/scripts/phase2-service-auth-finalize.mjs
            pnpm --dir apps/core exec wrangler types src/worker-configuration.d.ts --env-interface CloudflareBindings --include-runtime false
          fi
      - run: pnpm check
