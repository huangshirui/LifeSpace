name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

# A newer commit supersedes an older check of the same PR. Main branch runs
# are never cancelled; they preserve the existing direct-push safety gate.
concurrency:
  group: lifespace-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Decide validation depth
        id: validation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          run_full=true
          reason=pull-request

          if [[ "${{ github.event_name }}" == "push" ]]; then
            reason=direct-or-unassociated-push
            api_url="https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls"
            if associated_prs="$(
              curl --fail-with-body --silent --show-error \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "${api_url}"
            )"; then
              if jq -e --arg sha "${GITHUB_SHA}" \
                '[.[] | select(.merged_at != null and .base.ref == "main" and .merge_commit_sha == $sha)] | length > 0' \
                <<<"${associated_prs}" >/dev/null; then
                run_full=false
                reason=merged-pr
              fi
            else
              reason=pr-association-lookup-failed
              echo "::warning::Could not verify merged-PR association; running the full repository check."
            fi
          fi

          echo "run_full=${run_full}" >> "${GITHUB_OUTPUT}"
          echo "reason=${reason}" >> "${GITHUB_OUTPUT}"
          echo "Validation mode: run_full=${run_full} reason=${reason}"

      - uses: actions/checkout@v5
        if: steps.validation.outputs.run_full == 'true'
      - uses: pnpm/action-setup@v4.4.0
        if: steps.validation.outputs.run_full == 'true'
        with:
          version: 10.13.1
      - uses: actions/setup-node@v6
        if: steps.validation.outputs.run_full == 'true'
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        if: steps.validation.outputs.run_full == 'true'
      - run: pnpm check
        if: steps.validation.outputs.run_full == 'true'
      - name: Validate MCP staging credential provisioning script syntax
        if: steps.validation.outputs.run_full == 'true'
        run: node --check infra/scripts/install-mcp-staging-credential.mjs
      - name: Resolve pinned provider revision from manifest
        if: steps.validation.outputs.run_full == 'true'
        id: external_provider
        shell: bash
        run: |
          set -euo pipefail
          revision="$(node -p "JSON.parse(require('fs').readFileSync('infra/external-provider.json','utf8')).revision")"
          [[ "$revision" =~ ^[a-f0-9]{40}$ ]] || { echo "invalid External provider revision" >&2; exit 1; }
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - name: Checkout pinned provider packaging for offline validation
        if: steps.validation.outputs.run_full == 'true'
        uses: actions/checkout@v5
        with:
          repository: huangshirui/lifespace-adapters
          ref: ${{ steps.external_provider.outputs.revision }}
          path: .external-provider
          persist-credentials: false
      - name: Validate private provider Worker packaging
        if: steps.validation.outputs.run_full == 'true'
        run: |
          pnpm --dir apps/core exec wrangler deploy --dry-run --config ../../.external-provider/adapters/notion/wrangler.jsonc --env staging
          pnpm --dir apps/core exec wrangler deploy --dry-run --config ../../.external-provider/adapters/notion/wrangler.jsonc --env production
      - name: Export Kernel contract snapshot
        if: steps.validation.outputs.run_full == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kernel-contract-snapshot
          path: |
            apps/core/openapi.yaml
            apps/core/scripts/check-openapi.mjs
            docs/contract-stability-baseline.json
          if-no-files-found: error
          retention-days: 1
