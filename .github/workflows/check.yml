name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Decide validation depth
        id: validation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          run_full=true
          reason=pull-request

          if [[ "${{ github.event_name }}" == "push" ]]; then
            reason=direct-or-unassociated-push
            api_url="https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls"
            if associated_prs="$(
              curl --fail-with-body --silent --show-error \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "${api_url}"
            )"; then
              if jq -e --arg sha "${GITHUB_SHA}" \
                '[.[] | select(.merged_at != null and .base.ref == "main" and .merge_commit_sha == $sha)] | length > 0' \
                <<<"${associated_prs}" >/dev/null; then
                run_full=false
                reason=merged-pr
              fi
            else
              reason=pr-association-lookup-failed
              echo "::warning::Could not verify merged-PR association; running the full repository check."
            fi
          fi

          echo "run_full=${run_full}" >> "${GITHUB_OUTPUT}"
          echo "reason=${reason}" >> "${GITHUB_OUTPUT}"
          echo "Validation mode: run_full=${run_full} reason=${reason}"

      - uses: actions/checkout@v4
        if: steps.validation.outputs.run_full == 'true'
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@v4
        if: steps.validation.outputs.run_full == 'true'
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        if: steps.validation.outputs.run_full == 'true'
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
        if: steps.validation.outputs.run_full == 'true'
      - name: Finalize Core Kernel 0.29 candidate in checkout
        if: steps.validation.outputs.run_full == 'true'
        run: node apps/core/scripts/finalize-kernel-029.mjs /tmp/lifespace-kernel-029-final
      - run: pnpm check
        if: steps.validation.outputs.run_full == 'true'
      - name: Persist tested Kernel 0.29 and remove temporary finalizers
        if: steps.validation.outputs.run_full == 'true' && github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main --depth=1
          git show origin/main:.github/workflows/check.yml > .github/workflows/check.yml
          rm -f apps/core/scripts/finalize-kernel-029.mjs apps/core/scripts/materialize-kernel-029.mjs
          git add .github/workflows/check.yml apps/core docs
          if git diff --cached --quiet; then
            echo "No finalization changes to persist."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(core): finalize Kernel 0.29 contract"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
