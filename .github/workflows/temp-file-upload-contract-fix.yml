name: temp-file-upload-contract-fix

on:
  push:
    branches: [feat/file-upload-capability]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/file-upload-capability
          fetch-depth: 0
      - uses: pnpm/action-setup@v4.4.0
        with:
          version: 10.13.1
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Fix file upload contract drift
        run: node scripts/fix-file-upload-contract-drift.mjs
      - name: Verify Core
        run: pnpm --filter @lifespace/core check
      - name: Commit verified contract fixes
        run: |
          rm -f scripts/fix-file-upload-contract-drift.mjs .github/workflows/temp-file-upload-contract-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(core): align File upload public contracts"
          git push origin HEAD:feat/file-upload-capability
