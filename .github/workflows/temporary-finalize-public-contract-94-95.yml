name: Temporary finalize public contracts 94 95

on:
  push:
    branches:
      - codex/public-contract-completeness-94-95

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/public-contract-completeness-94-95
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
          run_install: false

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate finalizer syntax
        run: node --check infra/scripts/finalize-public-contract-completeness-94-95.mjs

      - name: Materialize final contracts and docs
        run: node infra/scripts/finalize-public-contract-completeness-94-95.mjs

      - name: Validate finalized repository
        run: pnpm check

      - name: Persist exactly the tested tree and remove temporary finalizer
        shell: bash
        run: |
          set -euo pipefail
          rm infra/scripts/finalize-public-contract-completeness-94-95.mjs
          rm .github/workflows/temporary-finalize-public-contract-94-95.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No finalized changes to persist" >&2
            exit 1
          fi
          git commit -m "feat(core): finalize public contract completeness for #94 #95"
          git push origin HEAD:codex/public-contract-completeness-94-95
