name: Materialize Core OpenAPI 0.26 Candidate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Materialize candidate
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'apps/core/openapi.yaml';
          const doc = JSON.parse(fs.readFileSync(path, 'utf8'));
          const schemas = doc.components.schemas;
          const fieldKey = { type: 'string', pattern: '^[a-z][A-Za-z0-9]{0,62}$' };
          const modelKey = { type: 'string', pattern: '^[a-z][a-z0-9_]{1,62}$' };
          const accessRef = { $ref: '#/components/schemas/RuntimeDiscoveryAccess' };
          const fieldTypeRef = { $ref: '#/components/schemas/RuntimeDiscoveryFieldType' };
          const stringArray = { type: 'array', uniqueItems: true, items: { type: 'string' } };
          doc.info.version = '0.26.0';
          schemas.StatusResponse.properties.data.properties.contractVersion.const = '0.26.0';

          doc.paths['/api/v1/spaces/{spaceId}/_discovery/models/{modelKey}'] = {
            parameters: [
              { $ref: '#/components/parameters/SpaceId' },
              { $ref: '#/components/parameters/ModelKey' },
            ],
            get: {
              tags: ['Runtime Discovery'],
              operationId: 'getRuntimeModelSemanticDetail',
              description: 'Returns one currently discoverable published model as static semantic detail. The Space is used only as a current visibility gate across credential scope, Application × Model Access, Space membership/Data Grant and Agent Delegation. The successful body contains no membership, Grant, Delegation or effective-access state and is stable for the returned (key, version, schemaHash), so an authorized client may cache that semantic body independently of the Space. This response is not authorization proof; every execution still rechecks current authority. Missing and currently non-discoverable models use the same opaque 404 response so this route does not become a model-existence side channel.',
              responses: {
                '200': { description: 'Static semantic detail for one currently discoverable model', content: { 'application/json': { schema: { $ref: '#/components/schemas/RuntimeModelSemanticDetailResponse' } } } },
                '401': { $ref: '#/components/responses/Unauthorized' },
                '404': { $ref: '#/components/responses/NotFound' },
              },
            },
          };

          schemas.RuntimeModelSemanticRelation = {
            type: 'object', additionalProperties: false, required: ['targetModel','cardinality'],
            properties: { targetModel: modelKey, cardinality: { type: 'string', enum: ['one','many'] } },
          };
          schemas.RuntimeModelSemanticField = {
            type: 'object', additionalProperties: false, required: ['key','type'],
            properties: {
              key: fieldKey, type: fieldTypeRef, description: { type: 'string' }, required: { type: 'boolean' }, nullable: { type: 'boolean' },
              immutable: { type: 'boolean' }, readOnly: { type: 'boolean' }, minLength: { type: 'integer', minimum: 0 }, maxLength: { type: 'integer', minimum: 0 },
              minimum: { type: 'number' }, maximum: { type: 'number' }, values: stringArray, targetModel: modelKey,
              title: { type: 'string', minLength: 1, maxLength: 80 }, relation: { $ref: '#/components/schemas/RuntimeModelSemanticRelation' },
            },
          };
          schemas.RuntimeModelSemanticFilter = {
            type: 'object', additionalProperties: false, required: ['field','parameter','mode'],
            properties: {
              field: fieldKey, parameter: { type: 'string', minLength: 1 }, mode: { type: 'string', enum: ['exact','enum-set'] },
              range: { type: 'object', additionalProperties: false, required: ['fromParameter','toParameter'], properties: { fromParameter: { type: 'string', minLength: 1 }, toParameter: { type: 'string', minLength: 1 } } },
              acceptsCurrentActorPersonAlias: { const: 'me' },
            },
          };
          schemas.RuntimeModelSemanticQueryParameter = {
            type: 'object', additionalProperties: false, required: ['parameter','type'],
            properties: { parameter: { type: 'string', minLength: 1 }, type: { type: 'string', enum: ['boolean','date','datetime'] }, default: { type: 'boolean' }, pairedWith: { type: 'string', minLength: 1 } },
          };
          schemas.RuntimeModelSemanticQuery = {
            type: 'object', additionalProperties: false,
            required: ['searchable','filterable','sortable','search','filters','sort','pagination','capabilityParameters'],
            properties: {
              searchable: stringArray, filterable: stringArray, sortable: stringArray,
              search: { anyOf: [{ type: 'object', additionalProperties: false, required: ['parameter','minLength','maxLength'], properties: { parameter: { const: 'q' }, minLength: { const: 1 }, maxLength: { const: 100 } } }, { type: 'null' }] },
              filters: { type: 'array', items: { $ref: '#/components/schemas/RuntimeModelSemanticFilter' } },
              sort: {
                type: 'object', additionalProperties: false,
                required: ['parameter','syntax','repeatable','ordered','maxCriteria','genericDefault','envelopeFields','nullPlacement','genericValues','semantic'],
                properties: {
                  parameter: { const: 'sort' }, syntax: { const: 'field:direction' }, repeatable: { const: true }, ordered: { const: true }, maxCriteria: { const: 8 },
                  genericDefault: { const: ['createdAt:desc'] }, envelopeFields: { const: ['createdAt','updatedAt'] }, nullPlacement: { const: 'last' }, genericValues: stringArray,
                  semantic: { type: 'object', additionalProperties: false, required: ['standalone','values','defaults'], properties: {
                    standalone: { const: true }, values: stringArray,
                    defaults: { type: 'object', additionalProperties: false, properties: { temporal: { const: 'effectiveDate:asc' }, calendar: { const: 'calendarStart:asc' } } },
                  } },
                },
              },
              pagination: { type: 'object', additionalProperties: false, required: ['limit','cursor'], properties: {
                limit: { type: 'object', additionalProperties: false, required: ['parameter','minimum','maximum','default'], properties: { parameter: { const: 'limit' }, minimum: { const: 1 }, maximum: { const: 200 }, default: { const: 100 } } },
                cursor: { type: 'object', additionalProperties: false, required: ['parameter','type'], properties: { parameter: { const: 'cursor' }, type: { const: 'string' } } },
              } },
              capabilityParameters: { type: 'array', items: { $ref: '#/components/schemas/RuntimeModelSemanticQueryParameter' } },
            },
          };
          schemas.RuntimeModelSemanticActionConcurrency = schemas.RuntimeDiscoveryAction.properties.concurrency;
          schemas.RuntimeModelSemanticAction = {
            type: 'object', additionalProperties: false, required: ['key','access','kind','input','concurrency','invocation'],
            properties: {
              key: { type: 'string', minLength: 1 }, access: accessRef, kind: { $ref: '#/components/schemas/RuntimeDiscoveryActionKind' },
              input: { type: 'object', additionalProperties: false, required: ['fields'], properties: { fields: { type: 'array', items: { $ref: '#/components/schemas/RuntimeModelSemanticField' } } } },
              concurrency: { $ref: '#/components/schemas/RuntimeModelSemanticActionConcurrency' },
              invocation: { type: 'object', additionalProperties: false, required: ['method','pathTemplate'], properties: { method: { const: 'POST' }, pathTemplate: { type: 'string', pattern: '^/api/v1/spaces/\\{spaceId\\}/' } } },
            },
          };
          schemas.RuntimeModelSemanticCalendarBinding = structuredClone(schemas.RuntimeDiscoveryCalendarCapabilityBinding);
          schemas.RuntimeModelSemanticTemporalBinding = {
            type: 'object', additionalProperties: false,
            required: ['kindField','anchorDateField','cycleDaysField','attentionBeforeDaysField','attentionAfterDaysField','statusField'],
            properties: {
              kindField: fieldKey, anchorDateField: fieldKey, cycleDaysField: fieldKey, attentionBeforeDaysField: fieldKey,
              attentionAfterDaysField: fieldKey, statusField: fieldKey, subjectPersonField: fieldKey, occurrences: { type: 'boolean' },
            },
          };
          schemas.RuntimeModelSemanticCapabilityBindings = {
            type: 'object', additionalProperties: false,
            properties: { calendar: { $ref: '#/components/schemas/RuntimeModelSemanticCalendarBinding' }, temporal: { $ref: '#/components/schemas/RuntimeModelSemanticTemporalBinding' } },
          };
          schemas.RuntimeModelSemanticDetail = {
            type: 'object', additionalProperties: false,
            required: ['key','route','version','schemaHash','display','description','declaredAccess','fields','defaults','query','actions','capabilities','capabilityBindings'],
            properties: {
              key: modelKey, route: { type: 'string', pattern: '^[a-z][a-z0-9-]{1,62}$' }, version: { type: 'integer', minimum: 1 }, schemaHash: { type: 'string', pattern: '^[a-f0-9]{64}$' },
              display: { $ref: '#/components/schemas/RuntimeDiscoveryDisplay' }, description: { type: ['string','null'] },
              declaredAccess: { type: 'array', minItems: 1, uniqueItems: true, items: accessRef },
              fields: { type: 'array', items: { $ref: '#/components/schemas/RuntimeModelSemanticField' } },
              defaults: structuredClone(schemas.RuntimeDiscoveryModel.properties.defaults), query: { $ref: '#/components/schemas/RuntimeModelSemanticQuery' },
              actions: { type: 'array', items: { $ref: '#/components/schemas/RuntimeModelSemanticAction' } }, capabilities: stringArray,
              capabilityBindings: { $ref: '#/components/schemas/RuntimeModelSemanticCapabilityBindings' },
            },
          };
          schemas.RuntimeModelSemanticDetailResponse = {
            type: 'object', additionalProperties: false, required: ['data'], properties: { data: { $ref: '#/components/schemas/RuntimeModelSemanticDetail' } },
          };

          fs.writeFileSync('/tmp/openapi.yaml', JSON.stringify(doc));
          console.log(JSON.stringify({ version: doc.info.version, path: Boolean(doc.paths['/api/v1/spaces/{spaceId}/_discovery/models/{modelKey}']), schemas: Object.keys(schemas).filter((name) => name.startsWith('RuntimeModelSemantic')).length }));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: core-openapi-026-candidate
          path: /tmp/openapi.yaml
          if-no-files-found: error
          retention-days: 1
