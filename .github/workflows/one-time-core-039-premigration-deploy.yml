name: One-time LifeSpace Core 0.39 pre-migration deploy

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type PREDEPLOY_CORE_039 to continue
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: lifespace-production-change
  cancel-in-progress: false

jobs:
  predeploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Validate pre-migration deploy intent and live source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "main" || { echo "Predeploy must run from main" >&2; exit 1; }
          test "${{ inputs.confirmation }}" = "PREDEPLOY_CORE_039" || { echo "confirmation must be PREDEPLOY_CORE_039" >&2; exit 1; }
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN is not configured" >&2; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "CLOUDFLARE_ACCOUNT_ID is not configured" >&2; exit 1; }

          curl --fail --silent --show-error https://core.aisr.online/api/v1/status > "$RUNNER_TEMP/core-before.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const payload = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/core-before.json', 'utf8'));
          const data = payload?.data ?? payload;
          if (data?.status !== 'ok' || data?.service !== 'core' || data?.environment !== 'production') {
            throw new Error('LifeSpace Core production status is not healthy');
          }
          if (data.contractVersion !== '0.38.0' || Number(data.schemaVersion) !== 44) {
            throw new Error(`Predeploy source must be Core 0.38.0/schema44, got ${String(data.contractVersion)}/schema${String(data.schemaVersion)}`);
          }
          console.log('Confirmed predeploy source: Core 0.38.0 / schema44');
          NODE

      - name: Checkout exact main candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Verify pre-migration-compatible Core source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || { echo "checkout does not match workflow candidate SHA" >&2; exit 1; }
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('apps/core/package.json', 'utf8'));
          if (pkg.version !== '0.39.0') throw new Error(`Expected Core 0.39.0 source, got ${pkg.version}`);
          const source = fs.readFileSync('apps/core/src/spaces.ts', 'utf8');
          if (!source.includes('retiredSpaceKindStorageRequired')) {
            throw new Error('Core source does not contain the schema44/45 Space create bridge');
          }
          if (!fs.existsSync('apps/core/migrations/0045_remove_space_kind.sql')) {
            throw new Error('Core 0.39 migration 0045 is missing');
          }
          console.log('Core 0.39 dual-schema Runtime source verified');
          NODE

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          version: 10.13.1
          run_install: false

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Core candidate
        run: pnpm --filter @lifespace/core check

      - name: Resolve production D1 IDs
        run: node infra/scripts/resolve-production-d1.mjs

      - name: Deploy Core 0.39 Runtime without migrations
        run: pnpm --dir apps/core exec wrangler deploy --env production

      - name: Verify intentional transition state
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error https://core.aisr.online/api/v1/status > "$RUNNER_TEMP/core-after.json"; then
              if node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const payload = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/core-after.json', 'utf8'));
          const data = payload?.data ?? payload;
          if (
            data?.status === 'ok'
            && data?.service === 'core'
            && data?.environment === 'production'
            && data?.contractVersion === '0.39.0'
            && Number(data?.schemaVersion) === 44
          ) process.exit(0);
          process.exit(1);
          NODE
              then
                echo "Core 0.39 Runtime is live on schema44 transition state"
                exit 0
              fi
            fi
            echo "Predeploy has not converged yet (attempt $attempt/18)"
            sleep 5
          done
          echo "Core 0.39/schema44 transition state did not converge" >&2
          cat "$RUNNER_TEMP/core-after.json" >&2 || true
          exit 1

      - name: Verify public health after predeploy
        run: curl --fail --silent --show-error --retry 3 https://core.aisr.online/health >/dev/null

      - name: Upload predeploy evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: lifespace-core-039-premigration-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/core-before.json
            ${{ runner.temp }}/core-after.json
          if-no-files-found: warn
          retention-days: 30

      - name: Summarize successful predeploy
        if: ${{ success() }}
        shell: bash
        run: |
          {
            echo "## LifeSpace Core 0.39 pre-migration deploy"
            echo
            echo "- Source state: Core 0.38.0 / schema44"
            echo "- Runtime state: Core 0.39.0 / schema44"
            echo "- Core migrations: intentionally not run"
            echo "- Space create: schema44/45 dual-storage bridge active"
            echo "- Identity deployment: not performed"
            echo "- Next: run the normal LifeSpace production workflow to apply schema45/schema46 and converge final 0.39"
          } >> "$GITHUB_STEP_SUMMARY"
