name: Deploy LifeSpace platform production

# Safety invariant: this canonical environment-changing workflow must be started
# explicitly by the repository owner. Never dispatch it from another workflow.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DEPLOY_PRODUCTION"
        required: true
        type: string
      repair_core_identity_shared_secret:
        description: "Recovery only: re-synchronize the Core↔Identity shared runtime secret"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read
  checks: read
  actions: read

concurrency:
  group: lifespace-production-change
  cancel-in-progress: false

jobs:
  validate:
    name: Validate production release intent
    runs-on: ubuntu-latest
    steps:
      - name: Validate production intent
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch" || { echo "production deployment must use workflow_dispatch" >&2; exit 1; }
          test "$GITHUB_ACTOR" = "huangshirui" || { echo "production deployment must be initiated directly by repository owner huangshirui; actor=$GITHUB_ACTOR" >&2; exit 1; }
          test "$GITHUB_TRIGGERING_ACTOR" = "huangshirui" || { echo "production deployment must be triggered directly by repository owner huangshirui; triggering_actor=$GITHUB_TRIGGERING_ACTOR" >&2; exit 1; }
          test "${{ inputs.confirmation }}" = "DEPLOY_PRODUCTION" || { echo "confirmation must be DEPLOY_PRODUCTION" >&2; exit 1; }
          test "$GITHUB_REF_NAME" = "main" || { echo "production deployment must run from main" >&2; exit 1; }

      - name: Checkout immutable release candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Verify merged PR and exact candidate provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: node infra/scripts/verify-release-candidate.mjs production


  apac_performance:
    needs: validate
    concurrency:
      group: lifespace-staging-apac-performance
      cancel-in-progress: false
    name: Verify staging from APAC
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      LIFESPACE_STAGING_BOOTSTRAP_SECRET: ${{ secrets.LIFESPACE_STAGING_BOOTSTRAP_SECRET }}
      LIFESPACE_CORE_STAGING_URL: https://core-staging.aisr.online
      LIFESPACE_IDENTITY_STAGING_URL: https://auth-staging.aisr.online
      LIFESPACE_APAC_PROBE_NAME: lifespace-staging-apac-performance-probe

    steps:
      - name: Checkout exact gate candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Require main and exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "main" || { echo "APAC performance acceptance must run from main" >&2; exit 1; }
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || { echo "APAC checkout does not match workflow candidate SHA" >&2; exit 1; }
          echo "APAC candidate SHA: $GITHUB_SHA"
          echo "LIFESPACE_APAC_PROBE_NAME=${LIFESPACE_APAC_PROBE_NAME}-${GITHUB_RUN_ID}" >> "$GITHUB_ENV"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          version: 10.13.1
          run_install: false

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Validate staging credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN is not configured" >&2; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "CLOUDFLARE_ACCOUNT_ID is not configured" >&2; exit 1; }
          test ${#LIFESPACE_STAGING_BOOTSTRAP_SECRET} -ge 32 || { echo "LIFESPACE_STAGING_BOOTSTRAP_SECRET must be at least 32 characters" >&2; exit 1; }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve expected staging versions
        run: node infra/scripts/staging-expectations.mjs

      - name: Resolve staging D1 IDs
        run: node infra/scripts/resolve-staging-d1.mjs

      - name: Validate APAC gate sources
        shell: bash
        run: |
          set -euo pipefail
          node --check infra/scripts/verify-staging-candidate-identity.mjs
          node --check infra/scripts/staging-canonical-performance-benchmark.mjs
          node --check infra/scripts/staging-service-performance-benchmark.mjs
          node --check infra/scripts/apac-release-acceptance.mjs
          node --check infra/scripts/verify-staging-apac-performance.mjs
          node --check infra/scripts/wait-staging-apac-probe.mjs
          node --check infra/performance-probe/worker.mjs
          pnpm --dir apps/core exec wrangler deploy --dry-run --config ../../infra/performance-probe/wrangler.jsonc --name "$LIFESPACE_APAC_PROBE_NAME"

      - name: Verify live staging service identity matches candidate
        run: node infra/scripts/verify-staging-candidate-identity.mjs

      - name: Verify live staging database and active Model Contract match candidate
        env:
          REQUIRE_ACTIVE_MODEL_CONTRACT: "1"
        run: node infra/scripts/verify-staging-db.mjs

      - name: Prepare ephemeral authenticated staging smoke
        run: node infra/scripts/prepare-staging-smoke.mjs

      - name: Verify authenticated staging Model Contract matches candidate
        run: node infra/scripts/verify-staging-http.mjs

      - name: Generate ephemeral probe credential
        shell: bash
        run: |
          set -euo pipefail
          PROBE_TOKEN="$(node --input-type=module -e 'import { randomBytes } from "node:crypto"; process.stdout.write(randomBytes(32).toString("hex"))')"
          echo "::add-mask::$PROBE_TOKEN"
          echo "LIFESPACE_APAC_PROBE_TOKEN=$PROBE_TOKEN" >> "$GITHUB_ENV"

      - name: Deploy temporary APAC probe
        run: pnpm --dir apps/core exec wrangler deploy --config ../../infra/performance-probe/wrangler.jsonc --name "$LIFESPACE_APAC_PROBE_NAME"

      - name: Configure ephemeral probe secrets
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module -e '
            process.stdout.write(JSON.stringify({
              PROBE_TOKEN: process.env.LIFESPACE_APAC_PROBE_TOKEN,
              CORE_URL: process.env.LIFESPACE_CORE_STAGING_URL,
              USER_BEARER: process.env.LIFESPACE_STAGING_USER_BEARER,
              SERVICE_BEARER: process.env.LIFESPACE_STAGING_SERVICE_BEARER,
              SPACE_ID: process.env.LIFESPACE_STAGING_SPACE_ID,
            }));
          ' | pnpm --dir apps/core exec wrangler secret bulk --config ../../infra/performance-probe/wrangler.jsonc --name "$LIFESPACE_APAC_PROBE_NAME"

      - name: Resolve APAC probe URL
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl --fail --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")"
          SUBDOMAIN="$(printf '%s' "$RESPONSE" | node --input-type=module -e '
            import fs from "node:fs";
            const body = JSON.parse(fs.readFileSync(0, "utf8"));
            if (!body.success || !body.result?.subdomain) process.exit(1);
            process.stdout.write(body.result.subdomain);
          ')"
          PROBE_URL="https://${LIFESPACE_APAC_PROBE_NAME}.${SUBDOMAIN}.workers.dev"
          echo "LIFESPACE_APAC_PROBE_URL=$PROBE_URL" >> "$GITHUB_ENV"
          echo "APAC probe URL resolved"

      - name: Wait for APAC probe benchmark route
        run: node infra/scripts/wait-staging-apac-probe.mjs

      - name: Enforce representative APAC performance targets
        run: node infra/scripts/verify-staging-apac-performance.mjs

      - name: Delete temporary APAC probe
        if: ${{ always() }}
        continue-on-error: true
        run: pnpm --dir apps/core exec wrangler delete --config ../../infra/performance-probe/wrangler.jsonc --name "$LIFESPACE_APAC_PROBE_NAME"

      - name: Cleanup ephemeral staging authority
        if: ${{ always() }}
        continue-on-error: true
        run: node infra/scripts/cleanup-staging-smoke.mjs

      - name: Summarize APAC performance acceptance
        if: ${{ success() }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## LifeSpace APAC performance gate

          - Candidate SHA: \`${GITHUB_SHA}\`; checkout pinned to the same immutable SHA.
          - Live staging Core/Identity schema and contract identity: matched candidate.
          - Live staging proving-model schema hashes and active \`mct_*\` Model Contract: matched candidate.
          - Probe placement: explicitly targeted near \`aws:ap-southeast-1\`.
          - Probe access: ephemeral random credential; staging user JWT and opaque Service API Token are stored only as temporary Worker secrets.
          - Readiness: both \`/health\` and the real \`POST /run -> Core\` read path must converge before timed samples start.
          - Benchmark profile: \`apac\`, acceptance eligible.
          - Narrow P90 gray zone (P50 passes; P90 <= 110% of limit): only the failed credential/scenario receives two independent 45-sample batches; combined 135-sample P50/P90 and 2/3 rounds must meet unchanged targets. Every sample counts.
          - User JWT ordinary-read target: P50 <= 150 ms and P90 <= 250 ms.
          - User JWT Day Record / Temporal read target: P50 <= 220 ms and P90 <= 300 ms.
          - User JWT mutation/action target: P50 <= 160 ms and P90 <= 250 ms, measured with 45 samples per mutation scenario (45 for reads too).
          - Canonical \`lsp_svc_*\` Service API Token Task GET/list target: P50 <= 180 ms and P90 <= 250 ms.
          - Canonical \`lsp_svc_*\` Service API Token Task create/PATCH/Action target: P50 <= 220 ms and P90 <= 300 ms, measured with 45 samples per mutation scenario (45 for reads too).
          - D1 round-trip budgets: independently enforced by repository integration tests.
          - Temporary probe Worker: deletion attempted on every outcome.
          - Production traffic/data were not touched.
          EOF

  deploy:
    needs: apac_performance
    name: Migrate, deploy and verify production
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      LIFESPACE_PRODUCTION_BOOTSTRAP_SECRET: ${{ secrets.LIFESPACE_PRODUCTION_BOOTSTRAP_SECRET }}
      R2_S3_ACCESS_KEY_ID: ${{ secrets.R2_S3_ACCESS_KEY_ID }}
      R2_S3_SECRET_ACCESS_KEY: ${{ secrets.R2_S3_SECRET_ACCESS_KEY }}
      LIFESPACE_EXTERNAL_PROVIDER_ENABLED: ${{ vars.LIFESPACE_EXTERNAL_PROVIDER_ENABLED || '0' }}
      EXTERNAL_CURSOR_SECRET: ${{ secrets.EXTERNAL_CURSOR_SECRET }}
      LIFESPACE_NOTION_ADAPTER_WORKER: ${{ vars.LIFESPACE_NOTION_ADAPTER_WORKER }}
      NOTION_ADAPTER_SHARED_SECRET: ${{ secrets.NOTION_ADAPTER_SHARED_SECRET }}
      NOTION_CONNECTION_VAULT_MASTER_KEY: ${{ secrets.NOTION_CONNECTION_VAULT_MASTER_KEY }}
      LIFESPACE_CORE_PRODUCTION_URL: https://core.aisr.online
      LIFESPACE_IDENTITY_PRODUCTION_URL: https://auth.aisr.online

    steps:
      - name: Checkout exact production candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Report and verify deployment source
        shell: bash
        run: |
          set -euo pipefail
          CHECKOUT_SHA="$(git rev-parse HEAD)"
          echo "ref=$GITHUB_REF"
          echo "sha=$GITHUB_SHA"
          echo "checkout=$CHECKOUT_SHA"
          test "$CHECKOUT_SHA" = "$GITHUB_SHA" || { echo "production checkout does not match workflow candidate SHA" >&2; exit 1; }

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          version: 10.13.1
          run_install: false

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Validate production credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN is not configured" >&2; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "CLOUDFLARE_ACCOUNT_ID is not configured" >&2; exit 1; }
          test ${#LIFESPACE_PRODUCTION_BOOTSTRAP_SECRET} -ge 32 || { echo "LIFESPACE_PRODUCTION_BOOTSTRAP_SECRET must be at least 32 characters" >&2; exit 1; }
          test -n "${R2_S3_ACCESS_KEY_ID:-}" || { echo "Production R2_S3_ACCESS_KEY_ID is missing" >&2; exit 1; }
          test -n "${R2_S3_SECRET_ACCESS_KEY:-}" || { echo "Production R2_S3_SECRET_ACCESS_KEY is missing" >&2; exit 1; }
          case "$CLOUDFLARE_ACCOUNT_ID" in *[!0-9a-f]*|"") echo "Cloudflare account ID must be lowercase hex" >&2; exit 1 ;; esac

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate repository
        run: pnpm check

      - name: Validate production scripts
        run: node infra/scripts/check-production-infra.mjs

      - name: Validate External provider routing prerequisites before mutation
        run: node infra/scripts/external-provider-deployment.mjs prepare production

      - name: Checkout pinned External provider
        if: env.LIFESPACE_EXTERNAL_PROVIDER_ACTIVE == '1'
        uses: actions/checkout@v5
        with:
          repository: huangshirui/lifespace-adapters
          ref: ${{ env.LIFESPACE_EXTERNAL_PROVIDER_REVISION }}
          path: .external-provider
          persist-credentials: false

      - name: Resolve expected production versions
        run: node infra/scripts/production-expectations.mjs

      - name: Resolve production D1 IDs
        run: node infra/scripts/resolve-production-d1.mjs

      - name: Preflight production custom domains
        env:
          PRODUCTION_DOMAIN_PREFLIGHT_ONLY: "1"
        run: node infra/scripts/ensure-production-domains.mjs

      - name: Deploy and configure private External providers before Core
        if: env.LIFESPACE_EXTERNAL_PROVIDER_ACTIVE == '1'
        run: node infra/scripts/external-provider-deployment.mjs deploy-adapter production

      - name: Apply Core migrations
        run: pnpm --filter @lifespace/core db:migrate:production

      - name: Deploy Core first
        run: pnpm --dir apps/core exec wrangler deploy --env production

      - name: Synchronize scoped production Core R2 S3 signing credentials
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | pnpm --dir apps/core exec wrangler secret put R2_S3_ACCOUNT_ID --env production >/dev/null
          printf '%s' "$R2_S3_ACCESS_KEY_ID" | pnpm --dir apps/core exec wrangler secret put R2_S3_ACCESS_KEY_ID --env production >/dev/null
          printf '%s' "$R2_S3_SECRET_ACCESS_KEY" | pnpm --dir apps/core exec wrangler secret put R2_S3_SECRET_ACCESS_KEY --env production >/dev/null
          echo "Core production R2 S3 secrets synchronized (values not logged)"

      - name: Synchronize independent Core External provider routing secrets
        if: env.LIFESPACE_EXTERNAL_PROVIDER_ACTIVE == '1'
        run: node infra/scripts/external-provider-deployment.mjs sync-core production

      - name: Verify live private External provider routing
        if: env.LIFESPACE_EXTERNAL_PROVIDER_ACTIVE == '1'
        run: node infra/scripts/external-provider-deployment.mjs verify production

      - name: Apply Identity migrations
        run: pnpm --filter @lifespace/identity db:migrate:production

      - name: Deploy Identity after compatible Core
        run: pnpm --dir apps/identity exec wrangler deploy --env production

      - name: Ensure production custom domains
        run: node infra/scripts/ensure-production-domains.mjs

      - name: Initialize, preserve or explicitly repair production runtime secrets
        env:
          LIFESPACE_REPAIR_CORE_IDENTITY_SHARED_SECRET: ${{ inputs.repair_core_identity_shared_secret && '1' || '0' }}
        run: node infra/scripts/initialize-production-runtime.mjs

      - name: Wait for production HTTP convergence
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            if node infra/scripts/verify-production-http.mjs; then
              exit 0
            fi
            echo "Production endpoints have not converged yet (attempt ${attempt}/18)"
            if [ "$attempt" -eq 18 ]; then exit 1; fi
            sleep 5
          done

      - name: Verify production Cloudflare isolation and bindings
        run: node infra/scripts/verify-production-cloudflare.mjs

      - name: Initialize and verify Model Contract through service authentication
        run: node infra/scripts/verify-production-model-admin.mjs

      - name: Summarize production deployment
        if: ${{ success() }}
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## LifeSpace production deployment

          - Ref: \`${GITHUB_REF}\`
          - SHA: \`${GITHUB_SHA}\`
          - APAC performance gate: passed automatically for this exact candidate SHA before production mutation
          - Core: schema v${LIFESPACE_EXPECTED_CORE_SCHEMA_VERSION} / Kernel contract ${LIFESPACE_EXPECTED_CORE_CONTRACT_VERSION}
          - Identity: schema v${LIFESPACE_EXPECTED_IDENTITY_SCHEMA_VERSION} / contract ${LIFESPACE_EXPECTED_IDENTITY_CONTRACT_VERSION}
          - External Providers enabled: ${LIFESPACE_EXTERNAL_PROVIDER_ACTIVE}; provider-specific private routing, Core cursor secret and encrypted dynamic Connection vault verified when enabled; production Provider data not used for destructive smoke
          - Production active Model Contract consistency: passed
          - Custom domains: \`core.aisr.online\`, \`auth.aisr.online\`
          - Production D1/R2/Queue/Worker isolation: passed
          - Production runtime signing/shared-secret presence: passed
          - Core↔Identity shared-secret repair requested: \`${{ inputs.repair_core_identity_shared_secret }}\`
          - Infrastructure provisioning: **not performed by this workflow**
          EOF