name: Apply Issue 92 Migration

on:
  push:
    branches:
      - fix/92-invite-token-transport
    paths:
      - .github/workflows/apply-92.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/92-invite-token-transport
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node .github/scripts/apply-92.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Commit verified migration
        run: |
          rm .github/scripts/apply-92.mjs .github/workflows/apply-92.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix invite token URL exposure (#92)"
          git push origin HEAD:fix/92-invite-token-transport
