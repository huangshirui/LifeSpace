name: Repair issue 311 transform

on:
  push:
    branches: [feat/311-service-token-prefix]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Repair temporary transform
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/issue-311-apply.yml')
          text = p.read_text()

          old = '''          replace("apps/identity/scripts/check-openapi.mjs", 'document.info?.version !== "0.8.0"', 'document.info?.version !== "0.9.0"', count=1)'''
          new = '''          replace("apps/identity/scripts/check-openapi.mjs", 'doc.info?.version !== "0.8.0"', 'doc.info?.version !== "0.9.0"', count=1)\n          replace_if_present("apps/identity/scripts/check-openapi.mjs", "lsp_pat_", "lsp_svc_")'''
          if old not in text: raise SystemExit('Identity check-openapi repair target missing')
          text = text.replace(old, new, 1)

          old = '''          replace_if_present("infra/scripts/prepare-staging-console-admin.mjs", '.startsWith("lsp_pat_")', '.startsWith("lsp_svc_")')'''
          new = '''          replace(\n              "infra/scripts/prepare-staging-console-admin.mjs",\n              '!created.payload.data.token.startsWith("lsp_pat_")',\n              '!created.payload.data.token.startsWith("lsp_svc_")',\n              count=1,\n          )\n          replace(\n              "infra/scripts/prepare-staging-console-admin.mjs",\n              'if (coreBearer.startsWith("lsp_pat_")) {',\n              'if (coreBearer.startsWith("lsp_svc_") || coreBearer.startsWith("lsp_pat_")) {',\n              count=1,\n          )'''
          if old not in text: raise SystemExit('staging Console compatibility repair target missing')
          text = text.replace(old, new, 1)

          old = '''          rm .github/workflows/issue-311-apply.yml'''
          new = '''          rm .github/workflows/issue-311-apply.yml\n          rm -f .issue311-trigger'''
          if old not in text: raise SystemExit('cleanup target missing')
          text = text.replace(old, new, 1)

          p.write_text(text)
          PY
          rm .github/workflows/issue-311-fix-transform.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore(#311): repair service token migration transform"
          git push origin HEAD:feat/311-service-token-prefix
