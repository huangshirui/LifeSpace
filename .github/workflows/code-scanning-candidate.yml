name: Code scanning remediation candidate (temporary)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/code-scanning-candidate.yml'
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4.4.0
        with:
          version: 10.13.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Generate official toolkit dependency lockfile
        run: |
          set -euo pipefail
          pnpm add -Dw @actions/core@3.0.1 --lockfile-only
          pnpm install --frozen-lockfile
          pnpm audit --json > /tmp/audit.json || true
          node -e 'const a=require("/tmp/audit.json"); console.log("AUDIT "+JSON.stringify(a.metadata)); if (!a.metadata || Object.values(a.metadata.vulnerabilities).some(Boolean)) process.exitCode=1'
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          for (const path of ['package.json','pnpm-lock.yaml']) {
            const contents = fs.readFileSync(path,'utf8');
            for (let i=0;i<contents.length;i+=1400) console.log('CANDIDATE_FILE '+JSON.stringify({path,offset:i,content:contents.slice(i,i+1400),length:contents.length}));
          }
          NODE
      - name: Verify targeted security regressions
        run: node --test infra/scripts/runner-secret.test.mjs infra/scripts/performance-probe-worker.test.mjs
      - name: Validate full repository (no deployment)
        run: pnpm check
