name: Apply issue 311 service token prefix migration

on:
  push:
    branches: [feat/311-service-token-prefix]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4.4.0
        with:
          version: 10.13.1
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Apply exact #311 changes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace(path, old, new, *, count=None):
              p = Path(path)
              text = p.read_text()
              found = text.count(old)
              if found == 0:
                  raise SystemExit(f"{path}: expected text not found: {old!r}")
              if count is not None and found != count:
                  raise SystemExit(f"{path}: expected {count} matches, found {found}: {old!r}")
              p.write_text(text.replace(old, new))

          def replace_if_present(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old in text:
                  p.write_text(text.replace(old, new))

          # Runtime: new issuance is lsp_svc_ while legacy lsp_pat_ remains accepted.
          replace(
              "apps/identity/src/service-auth.ts",
              'const SERVICE_TOKEN_PREFIX = "lsp_pat_";\nconst OAUTH_SECRET_PREFIX = "lsp_client_";',
              'const SERVICE_TOKEN_PREFIX = "lsp_svc_";\nconst LEGACY_SERVICE_TOKEN_PREFIX = "lsp_pat_";\nconst OAUTH_SECRET_PREFIX = "lsp_client_";\n\nexport function isOpaqueServiceApiToken(value: string): boolean {\n  return value.startsWith(SERVICE_TOKEN_PREFIX) || value.startsWith(LEGACY_SERVICE_TOKEN_PREFIX);\n}',
              count=1,
          )
          replace(
              "apps/identity/src/service-auth.ts",
              'if (!plaintext.startsWith(SERVICE_TOKEN_PREFIX) || plaintext.length < 40) return c.json(ok({ active: false }));',
              'if (!isOpaqueServiceApiToken(plaintext) || plaintext.length < 40) return c.json(ok({ active: false }));',
              count=1,
          )
          replace(
              "apps/identity/src/platform-service-admin.ts",
              'const SERVICE_TOKEN_PREFIX = "lsp_pat_";',
              'const SERVICE_TOKEN_PREFIX = "lsp_svc_";',
              count=1,
          )
          replace(
              "apps/core/src/auth.ts",
              'const MAX_ACCESS_TOKEN_TTL_SECONDS = 3600;\nconst SERVICE_TOKEN_PREFIX = "lsp_pat_";',
              'const MAX_ACCESS_TOKEN_TTL_SECONDS = 3600;\nconst SERVICE_TOKEN_PREFIXES = ["lsp_svc_", "lsp_pat_"] as const;\n\nexport function isOpaqueServiceApiToken(value: string): boolean {\n  return SERVICE_TOKEN_PREFIXES.some((prefix) => value.startsWith(prefix));\n}',
              count=1,
          )
          replace(
              "apps/core/src/auth.ts",
              'if (rawToken.startsWith(SERVICE_TOKEN_PREFIX)) {',
              'if (isOpaqueServiceApiToken(rawToken)) {',
              count=1,
          )

          # Identity contract versions and canonical response prefix.
          replace("apps/identity/package.json", '"version": "0.8.0"', '"version": "0.9.0"', count=1)
          replace("apps/identity/src/application-admin.ts", 'export const IDENTITY_CONTRACT_VERSION = "0.8.0";', 'export const IDENTITY_CONTRACT_VERSION = "0.9.0";', count=1)
          replace("apps/identity/openapi.yaml", '  version: 0.8.0', '  version: 0.9.0', count=1)
          replace("apps/identity/openapi.yaml", "pattern: '^lsp_pat_'", "pattern: '^lsp_svc_'", count=1)
          replace("apps/identity/platform-admin.openapi.yaml", '  version: 0.2.0', '  version: 0.3.0', count=1)
          replace("apps/identity/platform-admin.openapi.yaml", 'description: Create lsp_pat_* for the target principal.', 'description: Create lsp_svc_* for the target principal.', count=1)
          replace("apps/identity/scripts/check-openapi.mjs", 'document.info?.version !== "0.8.0"', 'document.info?.version !== "0.9.0"', count=1)
          replace("apps/identity/scripts/check-platform-admin-openapi.mjs", 'document.info?.version !== "0.2.0"', 'document.info?.version !== "0.3.0"', count=1)

          # Contract checks explicitly lock the new one-time secret representation.
          p = Path("apps/identity/scripts/check-openapi.mjs")
          text = p.read_text()
          marker = 'const serviceToken = doc.components?.schemas?.ServiceToken;\n'
          if marker not in text:
              raise SystemExit("check-openapi marker missing")
          addition = '''const createServiceTokenResponse = doc.components?.schemas?.CreateServiceTokenResponse;\nconst oneTimeServiceToken = createServiceTokenResponse?.properties?.data?.allOf?.[1]?.properties?.token;\nif (oneTimeServiceToken?.pattern !== "^lsp_svc_" || oneTimeServiceToken?.writeOnly !== true) {\n  throw new Error("New Service API Token plaintext must use canonical lsp_svc_* and remain write-only");\n}\n'''
          text = text.replace(marker, addition + marker, 1)
          p.write_text(text)

          p = Path("apps/identity/scripts/check-platform-admin-openapi.mjs")
          text = p.read_text()
          marker = 'const createdSecret = document.paths?.["/internal/v1/platform-admin/applications/{applicationId}/service-principals/{principalId}/tokens"]?.post;\n'
          if marker not in text:
              raise SystemExit("platform-admin OpenAPI marker missing")
          text = text.replace(marker, marker + 'if (!String(createdSecret?.description ?? "").includes("lsp_svc_*")) {\n  throw new Error("Platform-managed Service API Token issuance must advertise canonical lsp_svc_*");\n}\n', 1)
          p.write_text(text)

          # Existing integration tests now prove canonical issuance/use.
          for path in [
              "apps/identity/test/service-authentication.integration.test.ts",
              "apps/identity/test/platform-service-admin.integration.test.ts",
              "apps/core/test/service-authentication.integration.test.ts",
              "apps/core/scripts/service-performance-benchmark.test.mjs",
              "apps/console/scripts/verify-staging-control-plane.mjs",
              "apps/console/scripts/verify-staging-configuration-center.mjs",
              "infra/scripts/verify-production-model-admin.mjs",
              "infra/scripts/prepare-production-console-admin.mjs",
          ]:
              replace_if_present(path, "lsp_pat_", "lsp_svc_")

          # Focused compatibility unit tests lock legacy classification without changing issuance.
          Path("apps/identity/test/service-token-prefix.test.ts").write_text('''import { describe, expect, it } from "vitest";\nimport { isOpaqueServiceApiToken } from "../src/service-auth";\n\ndescribe("Service API Token prefix compatibility", () => {\n  it("accepts canonical and legacy opaque service token prefixes", () => {\n    expect(isOpaqueServiceApiToken("lsp_svc_example")).toBe(true);\n    expect(isOpaqueServiceApiToken("lsp_pat_example")).toBe(true);\n    expect(isOpaqueServiceApiToken("lsa_example")).toBe(false);\n  });\n});\n''')
          Path("apps/core/test/service-token-prefix.test.ts").write_text('''import { describe, expect, it } from "vitest";\nimport { isOpaqueServiceApiToken } from "../src/auth";\n\ndescribe("Core opaque Service API Token classification", () => {\n  it("routes canonical and legacy prefixes to Identity introspection", () => {\n    expect(isOpaqueServiceApiToken("lsp_svc_example")).toBe(true);\n    expect(isOpaqueServiceApiToken("lsp_pat_example")).toBe(true);\n    expect(isOpaqueServiceApiToken("eyJ.fake.jwt")).toBe(false);\n  });\n});\n''')

          # Console: newly issued/revealed target tokens are canonical.
          for path in [
              "apps/console/worker/configuration-center.ts",
              "apps/console/scripts/check-credential-reveal-boundary.mjs",
              "apps/console/scripts/check-credential-governance-boundary.mjs",
          ]:
              replace_if_present(path, "lsp_pat_", "lsp_svc_")
          replace("apps/console/worker/index.ts", 'const IDENTITY_PLATFORM_ADMIN_CONTRACT = "0.2.0";', 'const IDENTITY_PLATFORM_ADMIN_CONTRACT = "0.3.0";', count=1)

          # Existing executor/model-admin bearer inputs remain migration-compatible.
          replace(
              "infra/scripts/prepare-staging-console-admin.mjs",
              'if (suppliedCoreBearer && !suppliedCoreBearer.startsWith("lsp_pat_") && suppliedCoreBearer.split(".").length !== 3) {\n  throw new Error("LIFESPACE_STAGING_CONSOLE_CORE_BEARER must be an lsp_pat_* token or service JWT");',
              'if (suppliedCoreBearer && !suppliedCoreBearer.startsWith("lsp_svc_") && !suppliedCoreBearer.startsWith("lsp_pat_") && suppliedCoreBearer.split(".").length !== 3) {\n  throw new Error("LIFESPACE_STAGING_CONSOLE_CORE_BEARER must be an lsp_svc_*/legacy lsp_pat_* token or service JWT");',
              count=1,
          )
          replace_if_present("infra/scripts/prepare-staging-console-admin.mjs", '.startsWith("lsp_pat_")', '.startsWith("lsp_svc_")')
          replace(
              "infra/scripts/verify-staging-console-admin.mjs",
              'if (!coreBearer.startsWith("lsp_pat_") && coreBearer.split(".").length !== 3)',
              'if (!coreBearer.startsWith("lsp_svc_") && !coreBearer.startsWith("lsp_pat_") && coreBearer.split(".").length !== 3)',
              count=1,
          )
          replace_if_present("infra/scripts/verify-staging-console-admin.mjs", 'lsp_pat_* token or service JWT', 'lsp_svc_*/legacy lsp_pat_* token or service JWT')
          replace(
              "infra/scripts/publish-staging-baseline-model-semantics.mjs",
              'if (!bearer.startsWith("lsp_pat_")) {',
              'if (!bearer.startsWith("lsp_svc_") && !bearer.startsWith("lsp_pat_")) {',
              count=1,
          )

          # Hard-coded Identity Platform Admin contract pins follow 0.3.0.
          for path in [
              "infra/scripts/verify-staging-console-admin.mjs",
              "infra/scripts/prepare-production-console-admin.mjs",
              "infra/scripts/prepare-staging-console-admin.mjs",
          ]:
              replace_if_present(path, 'identityPlatformAdmin: "0.2.0"', 'identityPlatformAdmin: "0.3.0"')

          # Normative/current documentation. Production snapshots are intentionally untouched until production deploy succeeds.
          current_docs = [
              "AGENTS.md",
              "README.md",
              "apps/identity/AGENTS.md",
              "apps/core/AGENTS.md",
              "apps/console/AGENTS.md",
              "apps/console/README.md",
              "infra/README.md",
              "docs/architecture.md",
              "docs/permissions.md",
              "docs/application-authentication.md",
              "docs/service-authentication.md",
              "docs/contracts.md",
              "docs/lifespace-console-mvp.md",
              "docs/lifespace-console-configuration-center.md",
              "docs/lifespace-console-production-rollout.md",
              "docs/console-target-credential-reveal.md",
              "docs/console-agent-governance.md",
          ]
          for path in current_docs:
              replace_if_present(path, "lsp_pat_*", "lsp_svc_*")
              replace_if_present(path, "lsp_pat_", "lsp_svc_")

          # Restore explicit compatibility statements where they are normative.
          p = Path("docs/service-authentication.md")
          text = p.read_text()
          marker = 'The caller sends it directly to Core:\n\n```http\nAuthorization: Bearer lsp_svc_...\n```\n'
          if marker not in text:
              raise SystemExit("service-authentication canonical bearer marker missing")
          migration = '''The caller sends it directly to Core:\n\n```http\nAuthorization: Bearer lsp_svc_...\n```\n\n#### Prefix migration compatibility\n\n`lsp_svc_*` is the canonical prefix for every newly issued opaque Service API Token. Tokens issued before this contract change may still use the legacy `lsp_pat_*` prefix. Identity introspection and Core authentication accept both prefixes during the migration window, while issuance never creates new `lsp_pat_*` tokens. Legacy tokens remain valid only under their existing hash, scope, expiry, principal/application status and revocation checks and are removed naturally through normal rotation/revocation; there is no in-place prefix rewrite or database migration.\n'''
          text = text.replace(marker, migration, 1)
          p.write_text(text)

          p = Path("AGENTS.md")
          text = p.read_text()
          needle = '- `lsa_*` authenticates a trusted application backend to Identity; `lsp_svc_*`/service JWT authenticates a service identity/principal context to Core. Do not conflate them.\n'
          if needle not in text:
              raise SystemExit("root AGENTS service credential rule missing")
          text = text.replace(needle, needle + '- `lsp_svc_*` is the canonical opaque Service API Token prefix. Existing legacy `lsp_pat_*` tokens remain accepted only for migration compatibility until individually rotated/revoked; do not issue new `lsp_pat_*` credentials.\n', 1)
          p.write_text(text)

          for path in ["apps/identity/AGENTS.md", "apps/core/AGENTS.md"]:
              p = Path(path)
              text = p.read_text()
              anchor = '## Service credentials\n' if path.endswith("identity/AGENTS.md") else '## Platform administration\n'
              if path.endswith("identity/AGENTS.md"):
                  insertion = '## Service credentials\n\n`lsp_svc_*` is the canonical opaque Service API Token prefix for new issuance. Existing `lsp_pat_*` tokens remain accepted as legacy migration credentials until individually rotated/revoked; they must never be newly issued.\n\n'
                  text = text.replace('## Service credentials\n\n', insertion, 1)
              else:
                  ordinary = '- Core normalizes verified RS256 JWTs and Identity-introspected opaque `lsp_svc_*` tokens into one principal context;\n'
                  text = text.replace(ordinary, ordinary + '- during the prefix migration window Core also recognizes existing legacy `lsp_pat_*` opaque tokens and sends them through the same current-state Identity introspection path;\n', 1)
              p.write_text(text)

          # Bring stale current contract references forward without rewriting historical production docs.
          version_files = [
              "apps/identity/AGENTS.md",
              "docs/application-authentication.md",
              "docs/service-authentication.md",
              "docs/contracts.md",
              "docs/architecture.md",
              "docs/console-agent-governance.md",
          ]
          for path in version_files:
              replace_if_present(path, "Identity application/user/service contract remains `0.6.0`", "Identity application/user/service contract is `0.9.0`")
              replace_if_present(path, "Identity contract 0.6.0", "Identity contract 0.9.0")
              replace_if_present(path, "current business-facing contract: 0.6.0", "current business-facing contract: 0.9.0")
              replace_if_present(path, "Its current version is `0.6.0`; 0.6.0 adds", "Its current version is `0.9.0`; 0.8.0 added")
              replace_if_present(path, "Identity Application Contract:    0.6.0", "Identity Application Contract:    0.9.0")
              replace_if_present(path, "Identity Platform Admin companion contract is `0.2.0`", "Identity Platform Admin companion contract is `0.3.0`")
              replace_if_present(path, "Identity Platform Admin `0.2.0` therefore", "Identity Platform Admin `0.3.0` therefore")
              replace_if_present(path, "Identity Platform Admin Contract: 0.2.0", "Identity Platform Admin Contract: 0.3.0")
              replace_if_present(path, "Identity Platform Admin is `0.2.0`;", "Identity Platform Admin is `0.3.0`;")
              replace_if_present(path, "independent companion contract: 0.2.0", "independent companion contract: 0.3.0")
              replace_if_present(path, "current version: 0.8.0", "current version: 0.9.0")
              replace_if_present(path, "current version: 0.2.0", "current version: 0.3.0")

          p = Path("docs/contracts.md")
          text = p.read_text()
          release_note = '''# LifeSpace Contract Strategy\n\n## Identity 0.9.0 / Platform Admin 0.3.0 — canonical Service API Token prefix\n\nIdentity now issues opaque Service API Tokens only as `lsp_svc_*`. Existing `lsp_pat_*` tokens remain valid compatibility inputs and continue through the identical current-state introspection/revocation path until individually rotated or revoked. This is a credential representation migration: Service Principal identity, token hash storage, scope ceilings, Data Grants, Application × Model Access and Core authorization semantics do not change. The one-time token response contract now advertises `^lsp_svc_`; the Platform Admin companion contract advances because its token-creation operation returns that same changed representation.\n\n'''
          if text.startswith("# LifeSpace Contract Strategy\n\n"):
              text = release_note + text[len("# LifeSpace Contract Strategy\n\n"):]
          else:
              raise SystemExit("contracts.md heading changed")
          p.write_text(text)

          # Production docs are factual snapshots and must still describe the deployed 2026-10-05 release until rollout.
          for path in Path("docs/production").glob("*.md"):
              # Intentionally no mutation here.
              pass

          # Sanity: no new-issuance source may still use the legacy constant.
          forbidden = {
              "apps/identity/src/platform-service-admin.ts": '"lsp_pat_"',
              "apps/identity/openapi.yaml": "^lsp_pat_",
              "apps/console/worker/configuration-center.ts": 'startsWith("lsp_pat_")',
          }
          for path, token in forbidden.items():
              if token in Path(path).read_text():
                  raise SystemExit(f"{path}: legacy issuance token remains: {token}")
          PY
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate repository
        run: pnpm check
      - name: Commit implementation and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/issue-311-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(auth): align Service API Token prefix (#311)"
          git push origin HEAD:feat/311-service-token-prefix
