name: Deploy LifeSpace Account UI-only staging

# Owner-only UI patch: preserve current Account/Core/Identity secrets and bindings.
# This release path MUST NOT deploy Worker code, configuration or migrations.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: read

concurrency:
  group: lifespace-staging-deploy
  cancel-in-progress: false

jobs:
  validate:
    name: Require owner and reviewed UI-only main commit
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit owner, main and manual trigger
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_ACTOR" = "huangshirui"
          test "$GITHUB_TRIGGERING_ACTOR" = "huangshirui"
          test "$GITHUB_REF_NAME" = "main"
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Allow only Account static UI and regression tests in release commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-list --count HEAD)" -gt 1
          git diff --name-only HEAD^ HEAD > /tmp/account-ui-paths.txt
          test -s /tmp/account-ui-paths.txt
          while IFS= read -r path; do
            case "$path" in
              apps/account/public/*|apps/account/test/*|.github/workflows/lifespace-account-ui-staging-deploy.yml)
                ;;
              *)
                echo "::error::Non-Account-UI change blocks UI-only release"
                exit 1
                ;;
            esac
          done < /tmp/account-ui-paths.txt
      - name: Verify current main release candidate checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: node infra/scripts/verify-release-candidate.mjs staging

  deploy:
    name: Deploy Account static UI without rotating secrets
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4.4.0
        with:
          version: 10.13.1
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Require existing Cloudflare deployment credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate Account package and static UI behavior
        run: pnpm --filter @lifespace/account check
      - name: Deploy only the Account Staging Worker assets
        run: pnpm --dir apps/account exec wrangler deploy --env staging
      - name: Summarize scoped Staging update
        if: success()
        run: |
          {
            echo "## LifeSpace Account UI-only Staging"
            echo ""
            echo "- Target: Account Staging only"
            echo "- Source: reviewed main / $GITHUB_SHA"
            echo "- Scope: static Account UI; Worker code and bindings unchanged"
            echo "- Secrets: no rotation or mutation"
            echo "- Core/Identity/Production: no deployment"
          } >> "$GITHUB_STEP_SUMMARY"
