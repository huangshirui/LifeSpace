name: Finalize issue 298 status version

on:
  push:
    branches:
      - feature/atomic-multi-delegation-issuance

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[status-version-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Align runtime and OpenAPI version evidence
        run: python3 infra/scripts/fix-issue-298-status-version.py
      - name: Verify Core
        run: pnpm --filter @lifespace/core check
      - name: Verify repository
        run: pnpm check
      - name: Remove temporary tooling and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-issue-298-status-version.yml infra/scripts/fix-issue-298-status-version.py
          git add apps/core/openapi.yaml apps/core/scripts/check-openapi.mjs apps/core/src/app.ts apps/core/src/kernel-contract.ts
          git diff --cached --check
          git commit -m "fix(core): align Kernel runtime status with 0.43.0 [status-version-fixed]"
          git push
