name: Finalize HomeMew production activation once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/homemew-production-final-activation-once.yml

permissions:
  actions: read
  contents: read

concurrency:
  group: homemew-production-cutover
  cancel-in-progress: false

jobs:
  activate:
    name: Revalidate migrated state and switch HomeMew production
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      LIFESPACE_PRODUCTION_BOOTSTRAP_SECRET: ${{ secrets.LIFESPACE_PRODUCTION_BOOTSTRAP_SECRET }}
      HOMEMEW_BACKEND_WORKER: homemew-backend-production
      HOMEMEW_LEGACY_WORKER: homemew-core
      HOMEMEW_PRODUCTION_HOSTNAME: homemew.aisr.online
      LIFESPACE_IDENTITY_PRODUCTION_URL: https://auth.aisr.online
      PRIOR_MIGRATION_ARTIFACT_ID: "9437613506"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate final activation preconditions
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test ${#LIFESPACE_PRODUCTION_BOOTSTRAP_SECRET} -ge 32
          node --check infra/migration/homemew-one-shot.mjs
          node --check infra/migration/verify-current-source-against-pass.mjs

          pnpm --dir apps/identity exec wrangler secret list \
            --name "$HOMEMEW_BACKEND_WORKER" --format json --env= \
            > "$RUNNER_TEMP/backend-secrets.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const entries = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/backend-secrets.json','utf8'));
          const names = new Set(entries.map((item) => item.name));
          for (const required of ['WECHAT_APP_SECRET','LIFESPACE_APPLICATION_CREDENTIAL','WECHAT_IDENTITY_BOOTSTRAP_MAP']) {
            if (!names.has(required)) throw new Error(`HomeMew production Worker is missing ${required}`);
          }
          const base = process.env.LIFESPACE_IDENTITY_PRODUCTION_URL.replace(/\/+$/u,'');
          const response = await fetch(`${base}/bootstrap/v1/applications/homemew-miniprogram/credentials`, {
            headers: { 'x-bootstrap-secret': process.env.LIFESPACE_PRODUCTION_BOOTSTRAP_SECRET },
          });
          const payload = await response.json().catch(() => null);
          const active = payload?.data?.filter((item) => item.status === 'active' && item.revokedAt === null) ?? [];
          if (response.status !== 200 || active.length !== 0) throw new Error(`Expected zero active HomeMew credentials before final activation; found ${active.length}`);
          console.log(JSON.stringify({ok:true,activeHomeMewCredentials:0}));
          NODE

      - name: Download prior PASS migration report
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/prior-report"
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PRIOR_MIGRATION_ARTIFACT_ID}/zip" \
            --output "$RUNNER_TEMP/prior-report.zip"
          unzip -q "$RUNNER_TEMP/prior-report.zip" -d "$RUNNER_TEMP/prior-report"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/prior-report/migration-report.json','utf8'));
          if (report.result !== 'PASS' || report?.verification?.result !== 'PASS') throw new Error('Prior migration report is not PASS');
          console.log(JSON.stringify({ok:true,migrated:report.migrated}));
          NODE

      - name: Read current legacy custom domain
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const endpoint = `https://api.cloudflare.com/client/v4/accounts/${encodeURIComponent(process.env.CLOUDFLARE_ACCOUNT_ID)}/workers/domains`;
          const response = await fetch(endpoint,{headers:{authorization:`Bearer ${process.env.CLOUDFLARE_API_TOKEN}`}});
          const payload = await response.json();
          const domain = payload?.result?.find?.((item) => item.hostname === process.env.HOMEMEW_PRODUCTION_HOSTNAME);
          if (!response.ok || payload?.success !== true || !domain) throw new Error('Could not resolve current HomeMew custom domain');
          if (domain.service !== process.env.HOMEMEW_LEGACY_WORKER) throw new Error(`Expected ${process.env.HOMEMEW_LEGACY_WORKER}, found ${domain.service}`);
          if (!domain.id || !domain.zone_id || !domain.zone_name) throw new Error('Custom-domain metadata is incomplete');
          fs.writeFileSync(process.env.RUNNER_TEMP + '/legacy-domain.json',JSON.stringify({id:domain.id,hostname:domain.hostname,zone_id:domain.zone_id,zone_name:domain.zone_name}),{mode:0o600});
          console.log(JSON.stringify({ok:true,hostname:domain.hostname,service:domain.service}));
          NODE

      - name: Freeze legacy HomeMew writes
        shell: bash
        run: |
          set -euo pipefail
          FREEZE_DIR="$RUNNER_TEMP/homemew-freeze"
          mkdir -p "$FREEZE_DIR"
          cat > "$FREEZE_DIR/worker.mjs" <<'EOF'
          const maintenance = () => new Response(JSON.stringify({error:{code:'MIGRATION_WRITE_FREEZE',message:'HomeMew production migration is in progress'}}),{status:503,headers:{'content-type':'application/json; charset=utf-8','cache-control':'no-store'}});
          export default { fetch(){return maintenance();}, async queue(){}, async scheduled(){} };
          EOF
          cat > "$FREEZE_DIR/wrangler.jsonc" <<'EOF'
          {
            "name":"homemew-core",
            "main":"./worker.mjs",
            "compatibility_date":"2026-07-02",
            "keep_vars":true,
            "triggers":{"crons":["0 * * * *"]},
            "d1_databases":[{"binding":"DB","database_name":"homemew-core","database_id":"3921d02d-8158-4706-a979-c18ff9f05ff8"}],
            "r2_buckets":[{"binding":"AVATARS","bucket_name":"homemew-assets"}],
            "queues":{"producers":[{"binding":"CREATION_DRAFT_QUEUE","queue":"homemew-creation-drafts"}],"consumers":[{"queue":"homemew-creation-drafts","max_batch_size":1,"max_batch_timeout":1,"max_retries":2}]},
            "ratelimits":[{"name":"AI_RATE_LIMITER","namespace_id":"24001","simple":{"limit":10,"period":60}}]
          }
          EOF
          pnpm --dir apps/identity exec wrangler deploy --config "$FREEZE_DIR/wrangler.jsonc" --message "Phase 7 final activation write freeze"
          touch "$RUNNER_TEMP/freeze-active"

      - name: Verify legacy freeze
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 15); do
            BODY="$(curl --silent --show-error -w '\n%{http_code}' "https://${HOMEMEW_PRODUCTION_HOSTNAME}/health" || true)"
            STATUS="${BODY##*$'\n'}"; JSON="${BODY%$'\n'*}"
            if [ "$STATUS" = "503" ] && printf '%s' "$JSON" | node --input-type=module -e 'import fs from "node:fs"; const x=JSON.parse(fs.readFileSync(0,"utf8")); process.exit(x?.error?.code === "MIGRATION_WRITE_FREEZE" ? 0 : 1);'; then exit 0; fi
            [ "$attempt" -lt 15 ] || { echo "Legacy freeze did not converge" >&2; exit 1; }
            sleep 2
          done

      - name: Capture current frozen source
        run: >-
          node infra/migration/homemew-one-shot.mjs snapshot
          --out "$RUNNER_TEMP/current-source.json"

      - name: Issue temporary semantic verification credential
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const base=process.env.LIFESPACE_IDENTITY_PRODUCTION_URL.replace(/\/+$/u,'');
          const response=await fetch(`${base}/bootstrap/v1/applications/homemew-miniprogram/credentials`,{method:'POST',headers:{'x-bootstrap-secret':process.env.LIFESPACE_PRODUCTION_BOOTSTRAP_SECRET}});
          const payload=await response.json().catch(()=>null); const id=payload?.data?.id??''; const secret=payload?.data?.clientSecret??'';
          if(response.status!==201||!id.startsWith('apc_')||!secret.startsWith('lsa_')) throw new Error(`Could not issue verification credential: HTTP ${response.status}`);
          console.log(`::add-mask::${secret}`); fs.writeFileSync(process.env.RUNNER_TEMP+'/verify-id',id,{mode:0o600}); fs.writeFileSync(process.env.RUNNER_TEMP+'/verify-secret',secret,{mode:0o600});
          NODE

      - name: Revalidate current source against migrated LifeSpace state
        shell: bash
        run: |
          set -euo pipefail
          export LIFESPACE_APPLICATION_SECRET="$(cat "$RUNNER_TEMP/verify-secret")"
          node infra/migration/verify-current-source-against-pass.mjs --snapshot "$RUNNER_TEMP/current-source.json" --report "$RUNNER_TEMP/prior-report/migration-report.json"

      - name: Revoke temporary verification credential
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          [ -s "$RUNNER_TEMP/verify-id" ] || exit 0
          ID="$(cat "$RUNNER_TEMP/verify-id")"
          STATUS="$(curl --silent --output /dev/null --write-out '%{http_code}' --request DELETE --header "x-bootstrap-secret: $LIFESPACE_PRODUCTION_BOOTSTRAP_SECRET" "$LIFESPACE_IDENTITY_PRODUCTION_URL/bootstrap/v1/applications/homemew-miniprogram/credentials/$ID")"
          test "$STATUS" = "204" || test "$STATUS" = "404"
          rm -f "$RUNNER_TEMP/verify-secret"

      - name: Issue final production HomeMew credential
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const base=process.env.LIFESPACE_IDENTITY_PRODUCTION_URL.replace(/\/+$/u,'');
          const response=await fetch(`${base}/bootstrap/v1/applications/homemew-miniprogram/credentials`,{method:'POST',headers:{'x-bootstrap-secret':process.env.LIFESPACE_PRODUCTION_BOOTSTRAP_SECRET}});
          const payload=await response.json().catch(()=>null); const id=payload?.data?.id??''; const secret=payload?.data?.clientSecret??'';
          if(response.status!==201||!id.startsWith('apc_')||!secret.startsWith('lsa_')) throw new Error(`Could not issue final credential: HTTP ${response.status}`);
          console.log(`::add-mask::${secret}`); fs.writeFileSync(process.env.RUNNER_TEMP+'/final-id',id,{mode:0o600}); fs.writeFileSync(process.env.RUNNER_TEMP+'/final-secret',secret,{mode:0o600});
          console.log(JSON.stringify({ok:true,credentialId:id}));
          NODE

      - name: Install final Worker credential
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const secret=fs.readFileSync(process.env.RUNNER_TEMP+'/final-secret','utf8').trim();
          fs.writeFileSync(process.env.RUNNER_TEMP+'/secret.json',JSON.stringify({LIFESPACE_APPLICATION_CREDENTIAL:secret}),{mode:0o600});
          NODE
          TAG="homemew-production-final-activation-${GITHUB_RUN_ID}"
          pnpm --dir apps/identity exec wrangler versions secret bulk "$RUNNER_TEMP/secret.json" --name "$HOMEMEW_BACKEND_WORKER" --tag "$TAG" --message "HomeMew Phase 7 final production credential" --env=
          pnpm --dir apps/identity exec wrangler versions deploy --version-tag "$TAG" --name "$HOMEMEW_BACKEND_WORKER" --yes --env=
          rm -f "$RUNNER_TEMP/secret.json" "$RUNNER_TEMP/final-secret"

      - name: Detach legacy domain and wait until absent
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const domain=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/legacy-domain.json','utf8'));
          const endpoint=`https://api.cloudflare.com/client/v4/accounts/${encodeURIComponent(process.env.CLOUDFLARE_ACCOUNT_ID)}/workers/domains`;
          const headers={authorization:`Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,'content-type':'application/json'};
          const detach=await fetch(`${endpoint}/${encodeURIComponent(domain.id)}`,{method:'DELETE',headers});
          if(!detach.ok) throw new Error(`Could not detach legacy domain: HTTP ${detach.status}`);
          fs.writeFileSync(process.env.RUNNER_TEMP+'/domain-detached','1');
          for(let attempt=1;attempt<=20;attempt+=1){
            const listed=await fetch(endpoint,{headers}); const payload=await listed.json().catch(()=>null);
            if(!listed.ok||payload?.success!==true) throw new Error('Could not verify custom-domain detach');
            const current=payload.result?.find?.((item)=>item.hostname===domain.hostname);
            if(!current){ console.log(JSON.stringify({ok:true,detached:true})); process.exit(0); }
            if(current.service!==process.env.HOMEMEW_LEGACY_WORKER) throw new Error(`Custom domain unexpectedly belongs to ${current.service}`);
            await new Promise((resolve)=>setTimeout(resolve,1500));
          }
          throw new Error('Legacy custom domain remained attached after DELETE');
          NODE

      - name: Attach domain to new backend with propagation retry
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const domain=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/legacy-domain.json','utf8'));
          const endpoint=`https://api.cloudflare.com/client/v4/accounts/${encodeURIComponent(process.env.CLOUDFLARE_ACCOUNT_ID)}/workers/domains`;
          const headers={authorization:`Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,'content-type':'application/json'};
          let lastStatus=0; let lastErrors=[];
          for(let attempt=1;attempt<=20;attempt+=1){
            const response=await fetch(endpoint,{method:'PUT',headers,body:JSON.stringify({hostname:domain.hostname,service:process.env.HOMEMEW_BACKEND_WORKER,zone_id:domain.zone_id,zone_name:domain.zone_name})});
            const payload=await response.json().catch(()=>null); lastStatus=response.status; lastErrors=payload?.errors??[];
            if(response.ok&&payload?.success===true&&payload?.result?.service===process.env.HOMEMEW_BACKEND_WORKER){
              fs.writeFileSync(process.env.RUNNER_TEMP+'/domain-switched','1');
              console.log(JSON.stringify({ok:true,hostname:payload.result.hostname,service:payload.result.service}));
              process.exit(0);
            }
            if(response.status!==409) break;
            await new Promise((resolve)=>setTimeout(resolve,1500));
          }
          console.error(JSON.stringify({status:lastStatus,errors:lastErrors}));
          throw new Error(`Could not attach custom domain to new HomeMew backend: HTTP ${lastStatus}`);
          NODE

      - name: Verify new HomeMew production backend
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            BODY="$(curl --silent --show-error "https://${HOMEMEW_PRODUCTION_HOSTNAME}/health" || true)"
            if printf '%s' "$BODY" | node --input-type=module -e 'import fs from "node:fs"; const x=JSON.parse(fs.readFileSync(0,"utf8")); process.exit(x?.ok===true&&x?.service==="homemew-backend"&&x?.environment==="production"&&x?.loginReady===true?0:1);' 2>/dev/null; then break; fi
            [ "$attempt" -lt 20 ] || { echo "New HomeMew production health did not converge" >&2; exit 1; }
            sleep 2
          done
          node --input-type=module <<'NODE'
          const endpoint=`https://api.cloudflare.com/client/v4/accounts/${encodeURIComponent(process.env.CLOUDFLARE_ACCOUNT_ID)}/workers/domains`;
          const response=await fetch(endpoint,{headers:{authorization:`Bearer ${process.env.CLOUDFLARE_API_TOKEN}`}}); const payload=await response.json();
          const domain=payload?.result?.find?.((item)=>item.hostname===process.env.HOMEMEW_PRODUCTION_HOSTNAME);
          if(!response.ok||payload?.success!==true||domain?.service!==process.env.HOMEMEW_BACKEND_WORKER) throw new Error('Production custom-domain ownership verification failed');
          console.log(JSON.stringify({ok:true,hostname:domain.hostname,service:domain.service}));
          NODE

      - name: Restore legacy domain on failure
        if: ${{ failure() }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          [ -f "$RUNNER_TEMP/freeze-active" ] || exit 0
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          if(!fs.existsSync(process.env.RUNNER_TEMP+'/legacy-domain.json')) process.exit(0);
          const legacy=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/legacy-domain.json','utf8'));
          const endpoint=`https://api.cloudflare.com/client/v4/accounts/${encodeURIComponent(process.env.CLOUDFLARE_ACCOUNT_ID)}/workers/domains`;
          const headers={authorization:`Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,'content-type':'application/json'};
          const listed=await fetch(endpoint,{headers}); const payload=await listed.json().catch(()=>null);
          let current=payload?.result?.find?.((item)=>item.hostname===legacy.hostname);
          if(current?.service===process.env.HOMEMEW_LEGACY_WORKER) process.exit(0);
          if(current?.id){ const d=await fetch(`${endpoint}/${encodeURIComponent(current.id)}`,{method:'DELETE',headers}); if(!d.ok) throw new Error(`Could not detach failed owner: HTTP ${d.status}`); }
          for(let attempt=1;attempt<=20;attempt+=1){
            const again=await fetch(endpoint,{headers}); const body=await again.json().catch(()=>null); current=body?.result?.find?.((item)=>item.hostname===legacy.hostname);
            if(!current) break;
            await new Promise((resolve)=>setTimeout(resolve,1500));
          }
          for(let attempt=1;attempt<=20;attempt+=1){
            const restored=await fetch(endpoint,{method:'PUT',headers,body:JSON.stringify({hostname:legacy.hostname,service:process.env.HOMEMEW_LEGACY_WORKER,zone_id:legacy.zone_id,zone_name:legacy.zone_name})});
            const body=await restored.json().catch(()=>null);
            if(restored.ok&&body?.success===true) process.exit(0);
            if(restored.status!==409) throw new Error(`Could not restore legacy domain: HTTP ${restored.status}`);
            await new Promise((resolve)=>setTimeout(resolve,1500));
          }
          throw new Error('Could not restore legacy HomeMew custom domain');
          NODE

      - name: Revoke final credential on failure
        if: ${{ failure() }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          [ -s "$RUNNER_TEMP/final-id" ] || exit 0
          ID="$(cat "$RUNNER_TEMP/final-id")"
          STATUS="$(curl --silent --output /dev/null --write-out '%{http_code}' --request DELETE --header "x-bootstrap-secret: $LIFESPACE_PRODUCTION_BOOTSTRAP_SECRET" "$LIFESPACE_IDENTITY_PRODUCTION_URL/bootstrap/v1/applications/homemew-miniprogram/credentials/$ID")"
          test "$STATUS" = "204" || test "$STATUS" = "404"

      - name: Roll back legacy freeze on failure
        if: ${{ failure() }}
        continue-on-error: true
        run: >-
          pnpm --dir apps/identity exec wrangler rollback
          --name "$HOMEMEW_LEGACY_WORKER"
          --message "Rollback HomeMew final activation"
          --env=

      - name: Summarize successful activation
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## HomeMew production is live on LifeSpace

          - Current frozen HomeMew source semantically matched the PASS LifeSpace production migration.
          - No second migration, incremental catch-up, CDC, or dual-write was used.
          - A fresh final HomeMew production credential is active in `homemew-backend-production`.
          - `homemew.aisr.online` was detached from legacy `homemew-core` and attached to `homemew-backend-production`.
          - Public production health and Cloudflare domain ownership both passed.
          - Legacy `homemew-core` remains frozen pending real-client production smoke validation and Phase 8 retirement.
          EOF
