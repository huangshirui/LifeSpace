name: One-shot Calendar M2 Finalization

on:
  push:
    branches:
      - feat/calendar-viewing-window-219

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply final Calendar M2 transform
        run: node .github/scripts/one-shot-calendar-m2-finalize.mjs
      - name: Repair Calendar descriptor imports
        run: node .github/scripts/one-shot-calendar-m2-runtime-import-fix.mjs
      - name: Apply status-version check migration
        run: node .github/scripts/one-shot-calendar-m2-status-fix.mjs
      - name: Run full repository check
        run: pnpm check
      - name: Remove one-shot files
        run: rm .github/workflows/one-shot-calendar-m2-finalize.yml .github/scripts/one-shot-calendar-m2-finalize.mjs .github/scripts/one-shot-calendar-m2-runtime-import-fix.mjs .github/scripts/one-shot-calendar-m2-status-fix.mjs
      - name: Commit validated Calendar M2 tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(core): publish Calendar viewing-window semantics"
          git push origin HEAD:feat/calendar-viewing-window-219
