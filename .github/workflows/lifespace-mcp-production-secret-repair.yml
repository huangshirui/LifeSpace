name: Repair private MCP Production resource secret

# Explicit owner recovery only; never dispatch another deployment workflow.
# This changes at most one existing Adapter credential, not code, Identity,
# business data, scopes or grants.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type REPAIR_MCP_RESOURCE_SECRET"
        required: true
        type: string
      resource_uri:
        description: "Exact enabled Production MCP Server resource URL"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  checks: read
  actions: read

concurrency:
  group: lifespace-production-change
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Require owner and explicit recovery confirmation
        env:
          OPERATOR_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_ACTOR" = huangshirui
          test "$GITHUB_TRIGGERING_ACTOR" = huangshirui
          test "$GITHUB_REF_NAME" = main
          test "$OPERATOR_CONFIRMATION" = REPAIR_MCP_RESOURCE_SECRET
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require reviewed main and successful CI (recovery script, not platform rollout)
        env:
          GH_TOKEN: ${{ github.token }}
        run: node infra/scripts/verify-release-candidate.mjs staging
      - name: Verify fail-closed recovery tests
        run: node --test infra/scripts/repair-production-mcp-resource-secret.test.mjs

  repair:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      LIFESPACE_PRODUCTION_OAUTH_RESOURCE_SERVER_SECRET: ${{ secrets.LIFESPACE_PRODUCTION_OAUTH_RESOURCE_SERVER_SECRET }}
      LIFESPACE_PRODUCTION_MCP_RESOURCE_URI: ${{ inputs.resource_uri }}
      OPERATOR_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Prove canonical Identity credential and repair private Adapter only
        run: node infra/scripts/repair-production-mcp-resource-secret.mjs
      - name: Record remaining positive acceptance
        run: echo "Synthetic invalid-token path verified; actual user OAuth consent, discovery, read and revoke remain required." >> "$GITHUB_STEP_SUMMARY"
