name: Align Console docs with Kernel 0.13 once

on:
  push:
    branches:
      - feat/lifespace-console-ui-shell
    paths:
      - .github/workflows/tmp-console-kernel13-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/lifespace-console-ui-shell
      - name: Align current Kernel references
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('docs/architecture.md'): [
                  ('current Kernel contract: 0.12.0', 'current Kernel contract: 0.13.0'),
              ],
              Path('docs/lifespace-console-mvp.md'): [
                  ('Core Kernel `0.12.0` 与 Identity Application Contract `0.5.0` 不因为 Console 控制面变化而升级。',
                   'Core Kernel 与 Identity Application Contract 不因 Console 控制面变化而升级；当前 Kernel 已由独立的 Data Grant 变更推进到 `0.13.0`，Identity Application Contract 仍为 `0.5.0`。'),
                  ('Core Kernel Contract:             0.12.0', 'Core Kernel Contract:             0.13.0'),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text()
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'Expected text not found in {path}: {old}')
                  text = text.replace(old, new)
              path.write_text(text)
          PY
          git diff --check
          git diff -- docs/architecture.md docs/lifespace-console-mvp.md
      - name: Commit deterministic doc alignment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture.md docs/lifespace-console-mvp.md
          git commit -m "docs(console): align current Kernel contract to 0.13"
          git push origin HEAD:feat/lifespace-console-ui-shell
