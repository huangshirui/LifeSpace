name: Phase4 sync Calendar contract

on:
  push:
    branches:
      - phase4/event-temporal-range-prep-2026-09-17

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase4/event-temporal-range-prep-2026-09-17
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Synchronize Calendar contract and docs
        run: node apps/core/scripts/phase4-sync-calendar-contract.mjs

      - name: Validate generated diff
        run: git diff --check

      - name: Commit synchronized artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/core/openapi.yaml \
            apps/core/scripts/check-openapi.mjs \
            apps/core/src/app.ts \
            apps/core/package.json \
            apps/core/AGENTS.md \
            apps/core/src/model-admin-ai-provider.ts \
            README.md \
            docs/architecture.md \
            docs/contracts.md \
            docs/model-definition-spec.md \
            docs/generic-consumer-readiness-v1.md \
            infra/homemew-integration-profile.json
          if git diff --cached --quiet; then
            echo "No synchronization changes were required."
            exit 0
          fi
          git commit -m "phase4: synchronize Calendar canonical contract"
          git push origin HEAD:phase4/event-temporal-range-prep-2026-09-17
