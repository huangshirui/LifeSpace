name: Temporary 0.22 staging smoke fixture sync

on:
  push:
    branches:
      - feature/resolve-100-101-query-schema

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[skip-staging-smoke-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/resolve-100-101-query-schema
      - name: Update Wish proving-model fixture
        shell: bash
        run: |
          set -euo pipefail
          node <<'EOF'
          const fs = require('node:fs');
          const path = 'apps/core/scripts/staging-smoke.test.mjs';
          let source = fs.readFileSync(path, 'utf8');
          const oldBlock = `  assert.equal(wish.minimumVersion, 5, "Wish clean-release version remains the minimum accepted Registry version");\n  assert.equal(wish.hash, "ec4f99f238e44c756905d30a97f6bb5c063b783eca159dfe39f518ea58ff64b6", "Wish staging expectation must pin the authoritative mutation-authority schema hash");`;
          const newBlock = `  assert.equal(wish.minimumVersion, 6, "Wish clean-release version remains the minimum accepted Registry version");\n  assert.equal(wish.hash, "4d34e89df332b9b2c34549699e4210a3166db6eaddabe0ac59de5d4770c206c3", "Wish staging expectation must pin the authoritative field-title schema hash");`;
          if (!source.includes(oldBlock)) throw new Error('staging smoke Wish fixture anchor not found');
          source = source.replace(oldBlock, newBlock);
          fs.writeFileSync(path, source);
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/core/scripts/staging-smoke.test.mjs
          git commit -m "test(core): align 0.22 staging proving-model fixture [skip-staging-smoke-sync]"
          git push origin HEAD:feature/resolve-100-101-query-schema
