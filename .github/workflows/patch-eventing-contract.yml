name: Patch eventing contract

on:
  push:
    branches: [feat/webhook-endpoints]
    paths:
      - apps/core/scripts/patch-openapi-v015.mjs
      - apps/core/scripts/patch-eventing-docs.mjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/webhook-endpoints
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Patch canonical Core surfaces
        run: |
          node apps/core/scripts/patch-openapi-v015.mjs
          if [ -f apps/core/scripts/patch-eventing-docs.mjs ]; then
            node apps/core/scripts/patch-eventing-docs.mjs
          fi
      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/core/openapi.yaml apps/core/AGENTS.md docs/architecture.md docs/contracts.md
          git commit -m "docs(core): align eventing endpoint architecture"
          git push origin HEAD:feat/webhook-endpoints
