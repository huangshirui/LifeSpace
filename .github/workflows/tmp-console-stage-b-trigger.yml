name: Trigger LifeSpace Console Stage B once

on:
  push:
    branches:
      - feat/lifespace-console-ui-shell
    paths:
      - .github/workflows/tmp-console-stage-b-trigger.yml

permissions:
  contents: read
  actions: write

env:
  TARGET_REF: feat/lifespace-console-ui-shell

jobs:
  dispatch:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Dispatch canonical Console staging workflow
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ADMIN_USER_ID: ${{ vars.LIFESPACE_STAGING_PLATFORM_ADMIN_USER_ID }}
        run: |
          set -euo pipefail
          test -n "${ADMIN_USER_ID:-}" || { echo "LIFESPACE_STAGING_PLATFORM_ADMIN_USER_ID is not configured in staging Environment" >&2; exit 1; }
          [[ "$ADMIN_USER_ID" =~ ^usr_[0-9A-Za-z_-]+$ ]] || { echo "Configured staging platform-admin user ID is invalid" >&2; exit 1; }
          echo "::add-mask::$ADMIN_USER_ID"
          node --input-type=module <<'NODE'
          const response = await fetch(`${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/actions/workflows/lifespace-console-staging-provision.yml/dispatches`, {
            method: 'POST',
            headers: {
              authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
              accept: 'application/vnd.github+json',
              'x-github-api-version': '2022-11-28',
              'content-type': 'application/json',
            },
            body: JSON.stringify({
              ref: process.env.TARGET_REF,
              inputs: { platform_admin_user_id: process.env.ADMIN_USER_ID },
            }),
          });
          if (response.status !== 204) {
            const text = await response.text();
            throw new Error(`Could not dispatch canonical Console staging workflow: ${response.status} ${text}`);
          }
          console.log('Canonical Console staging Stage B workflow dispatched.');
          NODE
