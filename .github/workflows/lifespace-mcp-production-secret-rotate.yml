name: Rotate Production MCP Resource Secret pair (Owner recovery)

# Scoped recovery of a LOST live OAuth Resource Secret: Identity -> private
# Adapter only. A brief MCP interruption is explicitly Owner-approved.
# Does NOT run the canonical deploy workflow, provision Account, rotate JWT
# signing keys, change OAuth grants or create/activate MCP Servers.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type ROTATE_MCP_RESOURCE_SECRET"
        required: true
        type: string
      resource_uri:
        description: "Exact existing Production MCP Resource URL (https://core.aisr.online/mcp/mcp_...)"
        required: true
        type: string

permissions:
  contents: read
  checks: read
  actions: read
  pull-requests: read

concurrency:
  group: lifespace-production-change
  cancel-in-progress: false

jobs:
  validate:
    name: Verify explicit Owner intent and reviewed main
    runs-on: ubuntu-latest
    steps:
      - name: Require direct Owner action from main
        env:
          OPERATOR_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_ACTOR" = huangshirui
          test "$GITHUB_TRIGGERING_ACTOR" = huangshirui
          test "$GITHUB_REF_NAME" = main
          test "$OPERATOR_CONFIRMATION" = ROTATE_MCP_RESOURCE_SECRET
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Require merged reviewed candidate with successful exact-head CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: node infra/scripts/verify-release-candidate.mjs staging
      - name: Validate synthetic fail-closed recovery tests
        run: node --test infra/scripts/rotate-production-mcp-resource-secret.test.mjs

  rotate:
    name: Rotate ONLY private OAuth Resource Secret on Identity then Adapter
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      LIFESPACE_PRODUCTION_OAUTH_RESOURCE_SERVER_SECRET: ${{ secrets.LIFESPACE_PRODUCTION_OAUTH_RESOURCE_SERVER_SECRET }}
      LIFESPACE_PRODUCTION_MCP_RESOURCE_URI: ${{ inputs.resource_uri }}
      OPERATOR_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Rotate with exact Production topology and synthetic authentication proof
        run: node infra/scripts/rotate-production-mcp-resource-secret.mjs
      - name: Record remaining E2E acceptance
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Production MCP credential pair rotation
          - Scope: only OAuth Resource Server Secret on live Identity + private Adapter.
          - No OAuth tokens, consent grants, Core authorization or Account configuration changed.
          - A synthetic unissued token was rejected after the new Identity proof and MCP wire convergence.
          - Actual user OAuth/Delegation positive E2E must be verified separately.
          - Keep both GitHub Environment Production secrets synchronized for future Adapter deployments.
          - Do not rerun first-use Account provision or use the old single-worker secret repair.
          EOF
